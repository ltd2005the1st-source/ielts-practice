<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Favicon options</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:"Bricolage Grotesque";font-weight:200 800;src:url(../fonts/bricolage-grotesque-latin-opsz-normal.woff2) format("woff2")}
:root{--bg:#f4f1ea;--surface:#fffdf8;--ink:#1b2130;--ink-2:#4a5163;--rule:#e1dacb;--sun:#f6dd62}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 16px 48px}
h1{font-weight:800;font-size:1.6rem;margin:0 0 4px}
p.lede{margin:0 0 24px;color:var(--ink-2)}
.opt{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:20px;margin-bottom:20px}
.opt h2{margin:0 0 14px;font-size:1.15rem;font-weight:800}
.row{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap}
.sz{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.8rem;color:var(--ink-2)}
.pix{image-rendering:pixelated;border:1px dashed var(--rule)}
.tabs{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.strip{display:flex;align-items:flex-end;height:42px;padding:0 8px;border-radius:10px 10px 0 0;font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.strip.light{background:#dfe3e8;color:#1f1f1f}
.strip.dark{background:#1f2023;color:#e3e3e3}
.tab{display:flex;align-items:center;gap:8px;height:34px;width:230px;flex:none;padding:0 12px;border-radius:9px 9px 0 0;white-space:nowrap;overflow:hidden}
.light .tab.on{background:#fff}.dark .tab.on{background:#35363a}
.tab img{width:16px;height:16px;flex:none}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab .x{margin-left:auto;opacity:.6}
.dot{width:16px;height:16px;border-radius:50%;background:#9aa0a6;flex:none}
</style></head><body><main>
<h1>Favicon options</h1>
<p class="lede">Both use the app's own colours (ink #1b2130, paper #f4f1ea, highlighter #f6dd62) and Bricolage Grotesque ExtraBold. The 16 and 32 pixel versions are fitted to the pixel grid so they stay sharp in a browser tab.</p>
<div id="opts"></div>
</main>
<script>
const OPTS=[["ie","Option 1: IE"],["i-marker","Option 2: I with highlighter"]];
const tab=(o,t)=>`<div class="tab on"><img src="${o}/favicon-16x16.png" srcset="${o}/favicon-16x16.png 1x, ${o}/favicon-32x32.png 2x" alt=""><span>${t}</span><span class="x">&times;</span></div>`;
const other=t=>`<div class="tab"><span class="dot"></span><span>${t}</span></div>`;
document.getElementById('opts').innerHTML=OPTS.map(([o,name])=>`
<section class="opt"><h2>${name}</h2>
<div class="row">
 <div class="sz"><img src="${o}/apple-touch-icon.png" width="180" height="180" style="border-radius:40px" alt="">Home screen, 180</div>
 <div class="sz"><img src="${o}/favicon.svg" width="64" height="64" alt="">SVG, 64</div>
 <div class="sz"><img src="${o}/favicon-32x32.png" width="32" height="32" alt="">32</div>
 <div class="sz"><img src="${o}/favicon-16x16.png" width="16" height="16" alt="">16</div>
 <div class="sz"><img class="pix" src="${o}/favicon-16x16.png" width="128" height="128" alt="">16 px, zoomed x8</div>
</div>
<div class="tabs">
 <div class="strip light">${tab(o,"Writing · IELTS practice")}${other("Gmail")}${other("Google Docs")}</div>
 <div class="strip dark">${tab(o,"Writing · IELTS practice")}${other("Gmail")}${other("Google Docs")}</div>
</div></section>`).join('');
</script></body></html>
