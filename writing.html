ation, while others argue that money and appearance are more decisive. In my opinion, wealth and looks can provide certain advantages, but effort and perseverance remain the most important factors because they are within everyone’s control.","Those who believe money and appearance matter more make some valid points. Firstly, wealth provides access to opportunities that many people cannot afford. Children from rich families can attend expensive schools, receive private tuition and build connections with influential people, which gives them a considerable head start in their careers. Secondly, physical attractiveness can influence how others treat people. Good-looking individuals may make a strong first impression in interviews or social situations, and in industries such as fashion and entertainment, appearance can be essential. For example, a model or actor may be chosen for a role partly because of looks rather than talent alone. For these reasons, it would be naive to deny that money and appearance can make success easier.","Nevertheless, I believe hard work and determination are far more important in the long run. To begin with, effort is what turns opportunities into achievements. Wealth may open doors, but without consistent work, people rarely develop the skills and knowledge needed to succeed, and many children of rich families fail to match their parents’ achievements. In addition, determination allows people to overcome obstacles that money and looks cannot remove. Most successful individuals face repeated failures, and those who persist are the ones who eventually reach their goals. Unlike wealth or looks, which may be inherited or lost, persistence is a quality anyone can develop through practice. To illustrate, J. K. Rowling’s first Harry Potter novel was rejected by numerous publishers before it was accepted, yet her persistence led to one of the most successful book series ever written. Therefore, effort and perseverance are the true foundations of success.","In conclusion, money and appearance can create advantages, but hard work and determination are the most important factors because they build skills and help people overcome setbacks. Young people should therefore focus on developing persistence and expertise, while governments ensure that talented students from poorer backgrounds have fair access to education."],["Success is a complex and multifaceted concept, shaped by a wide range of personal and social factors. Some argue that it is determined chiefly by dedication and sustained effort, while others suggest that wealth and appearance are even more decisive. In my view, effort and determination remain the foundation of success, although money and good looks can undeniably accelerate it.","Advocates of hard work and determination argue that these qualities allow individuals to develop their abilities and overcome adversity. Firstly, effort is the engine of learning. Whether someone is mastering a language, a musical instrument or a professional skill, sustained practice gradually builds the knowledge and experience that increase their value. Talent alone is rarely enough, since even gifted individuals must practise for years to reach a high level. Secondly, determination enables people to persist through setbacks, which is often what distinguishes those who ultimately succeed from those who give up. Long-term achievements rarely come quickly, so the ability to keep going after failure is crucial. For example, many successful entrepreneurs launched several unsuccessful businesses before one finally succeeded, drawing on lessons learned from each failure. From this perspective, effort and perseverance are essential ingredients of any meaningful achievement.","Those who emphasise wealth and appearance, however, point out that these factors can provide significant advantages. To begin with, money opens access to resources such as high-quality education, information and influential networks. Students at prestigious and expensive institutions often benefit from connections and opportunities that help them obtain well-paid positions after graduating, regardless of their individual effort. Wealthy families can also fund unpaid internships and business ventures that poorer young people cannot afford to risk. In addition, an attractive appearance can help people make a favourable impression and gain opportunities in social and professional settings. In fields such as fashion, entertainment and sales, physical appeal can offer a clear competitive advantage. To illustrate, companies often choose good-looking celebrities to promote their products, recognising the power of appearance to influence consumers. Therefore, wealth and looks can undoubtedly smooth the path to success.","In conclusion, while wealth and appearance can accelerate success by opening doors, consistent effort and determination remain its most reliable foundations. Individuals should therefore concentrate on developing their skills and resilience, rather than relying on advantages that they cannot control and that may not last."]]},{"id":"W2-DS-13","task":2,"type":"Discussion","prompt":["Some people prefer to provide help and support directly to those in need. Others however prefer to give money to national and international charitable organizations.","Discuss both these views and give your own opinion."],"imgs":[],"models":[["When people want to help those in need, they face a choice between offering support personally and donating to charitable organisations. Some prefer direct help because it reaches recipients immediately and builds human connections, while others trust large charities because of their expertise and reach. In my opinion, both methods are valuable, but giving through established charities usually achieves more on a large scale.","Those who favour helping people directly make a convincing case. Firstly, direct help reaches the person in need immediately and in full. When someone gives food, clothing or money straight to a struggling family, all of it arrives where it is intended, rather than part of it being spent on administration. Givers can also see exactly how their help is used, which builds trust and satisfaction. For example, handing out warm meals to homeless people in one’s own neighbourhood brings instant relief that a distant charity could not deliver as quickly. Secondly, direct giving creates a genuine connection between the giver and the receiver. Seeing the impact of their help face to face builds compassion and encourages others in the community to follow their example, which strengthens the bonds between neighbours. For these reasons, personal help has real value.","Those who prefer to donate to charities, however, point to advantages that individuals cannot match. To begin with, large organisations have the expertise, staff and reach to help far more people than any individual could. A well-run charity can deliver aid to thousands of people after a disaster, often in distant countries that ordinary donors could never reach themselves. To illustrate, after the earthquakes in Turkey and Syria in 2023, international organisations such as the Red Cross were able to provide medical care, shelter and clean water to large numbers of survivors within days. In addition, charities know how to use donations efficiently and address the root causes of hardship. Instead of offering only temporary relief, they can fund long-term projects such as schools, wells and health clinics. Therefore, charitable donations often produce a greater and more lasting impact.","In conclusion, helping people directly brings immediate relief and a valuable human touch, but charitable organisations can reach far more people and tackle problems at their source. Individuals should therefore support trustworthy charities for large-scale needs while still helping those they meet in their own communities whenever possible."]]},{"id":"W2-DS-14","task":2,"type":"Discussion","prompt":["Some people think that the best way to reduce crime is to give longer prison sentences. Others, however, believe there are better alternative ways of reducing crime.","Discuss both views and give your opinion."],"imgs":[],"models":[["Reducing crime is one of the main responsibilities of any government, yet there is little agreement on how best to achieve it. Some argue that longer prison sentences are the most effective method, as they deter offenders and protect the public, while others believe that education and better policing produce stronger results. In my opinion, longer sentences have a role for serious crimes, but prevention measures should take priority in most cases.","Supporters of longer prison sentences put forward two main arguments. Firstly, harsher punishment can discourage potential offenders. When people know that a crime could cost them many years of freedom, the risk may seem too great, making them think twice before breaking the law. This deterrent effect may be strongest for crimes that are planned in advance, such as fraud or organised theft. Secondly, keeping dangerous criminals in prison for longer protects society. While serious offenders are behind bars, they cannot commit further crimes, which allows people to go about their daily lives without fear. For example, a violent repeat offender who receives a long sentence is prevented from harming anyone else for that entire period. For these reasons, it is reasonable to argue that longer sentences help keep communities safe.","Others, however, believe that alternative methods are more effective, and I share this view. To begin with, education can stop young people from turning to crime in the first place. When families and schools teach children about the law, moral values and the consequences of offending, they are less likely to drift into crime because of ignorance or peer pressure. In addition, visible policing and modern surveillance can deter criminals more effectively than distant punishment. Offenders often believe they will not be caught, so the threat of a long sentence matters little to them, whereas a high chance of being caught immediately has a stronger effect. To illustrate, installing cameras and increasing police patrols in a busy shopping district can quickly reduce pickpocketing and shoplifting. Therefore, prevention tends to reduce crime more reliably and cheaply than punishment alone.","In conclusion, although longer prison sentences can deter some offenders and protect the public, education and effective policing prevent crime before it happens. Governments should therefore reserve long sentences for serious and violent crimes while investing more in schools, community programmes and police resources."],["Concern about rising crime regularly leads politicians to promise tougher punishments. While some believe extending prison sentences is the best way to tackle crime, others argue that there are more effective alternatives. In my view, longer sentences can act as a deterrent in the short term, but rehabilitation and efforts to improve living conditions offer better long-term results.","Those who favour longer prison sentences highlight their benefits for public safety. Firstly, extended imprisonment keeps offenders away from society for longer, preventing them from committing further crimes during that time. This is particularly important for those convicted of serious violent offences, whose release could endanger the public. Victims and their families may also feel that justice has been done. Secondly, the prospect of long-term imprisonment may deter people from breaking the law. Knowing that a serious crime could lead to a decade or more behind bars might discourage some individuals from offending at all. For example, California’s \"three strikes\" law, introduced in 1994, imposed very long sentences on repeat offenders with the aim of discouraging habitual crime. For these reasons, longer sentences may appear an effective way to curb crime and reassure the public.","Others argue that better options exist, and I find their case more convincing. To begin with, rehabilitation can reduce the chance that prisoners will reoffend after release. Education, counselling and job training during a sentence give offenders the skills and sense of purpose needed to live honestly once they return to society. Without such support, many released prisoners struggle to find work and quickly return to crime. A case in point is Norway, whose prisons focus strongly on education and rehabilitation and whose reoffending rate is among the lowest in Europe. In addition, tackling the social causes of crime prevents offending in the first place. Poverty, unemployment and a lack of opportunities often push people towards crime, so financial support for struggling families, affordable housing and access to healthcare can address the problem at its root. Therefore, rehabilitation and social investment promise more lasting reductions in crime than longer sentences.","In conclusion, while longer prison sentences can isolate dangerous offenders and may deter some crimes, rehabilitation and improvements in living conditions tackle the causes of offending more effectively. Governments should therefore invest in prison education and social programmes rather than simply extending sentences."],["In the pursuit of social stability, every nation must decide how best to reduce crime, a question that inevitably divides opinion. One school of thought holds that lengthier incarceration is the most effective strategy, while another maintains that education, community programmes and restorative justice offer superior results. In my view, long sentences should be reserved for the most serious offences, whereas most crime is better addressed through preventive and rehabilitative measures.","Proponents of longer prison sentences advance several cogent arguments. Firstly, lengthier imprisonment creates a stronger fear of punishment among potential offenders. Those contemplating offences ranging from fraud and bribery to premeditated violence may hesitate when confronted with the prospect of losing their freedom for many years. Secondly, extended sentences offer a longer period of incapacitation. By removing individuals convicted of grave crimes such as murder or sexual violence from society, the justice system directly reduces the immediate risk of further harm. For example, offenders convicted of repeated violent crimes are often given long sentences specifically to protect potential future victims. From this perspective, longer incarceration appears to serve both deterrent and protective purposes.","Notwithstanding these arguments, a heavy reliance on punishment has significant limitations, which makes alternative approaches more viable. To begin with, long sentences impose a substantial financial burden on the state. Maintaining prisons requires spending on infrastructure, staff and inmates’ daily needs, money that could instead fund schools or job creation, while prisoners themselves are prevented from contributing to the economy. Long periods in prison can also weaken family ties and make it harder for offenders to find work after release. In addition, alternative measures address the causes of crime more directly. Since offending often stems from poverty, limited education and family breakdown, expanding educational and employment opportunities can prevent crime before it occurs, and restorative justice programmes encourage offenders to take responsibility for their actions. To illustrate, New Zealand’s youth justice system uses family group conferences, in which young offenders meet victims and relatives to agree how to repair the harm caused. Consequently, prevention and rehabilitation are generally more effective and economical.","In conclusion, while longer sentences may deter and incapacitate serious offenders, their high costs and failure to address underlying causes limit their effectiveness. Governments should therefore reserve lengthy imprisonment for grave offences while channelling resources into education, employment and restorative justice."]]},{"id":"W2-DS-15","task":2,"type":"Discussion","prompt":["The increasing availability of low-cost travel and transportation services such as railway, airlines or others allows more and more people to travel around the world. Some feel this is a positive development while others think it is negative overall.","Discuss both sides and give your own opinion."],"imgs":[],"models":[["Competition in the transport sector and the rise of budget airlines have made travel affordable to far more people than ever before. Some regard this as a positive development because it broadens horizons and boosts economies, while others see it as harmful because of its environmental impact. In my view, cheap travel brings undeniable benefits, but its environmental costs must be managed through stronger regulation.","Supporters of low-cost travel argue that it promotes personal development and brings substantial economic gains. Firstly, affordable transport allows people from diverse backgrounds to travel for leisure, study or business, opportunities once limited largely to the wealthy. Experiencing other cultures broadens people’s understanding, reduces prejudice and helps bring different nations closer together. Secondly, cheaper travel boosts economic development by increasing spending on tourism-related services such as hotels, restaurants and tour operators. This creates jobs in popular destinations and encourages investment in infrastructure, sometimes transforming regions that would otherwise have remained underdeveloped. For example, budget airlines such as AirAsia have opened up many smaller destinations in South-East Asia to international visitors, bringing new income to local communities. For these reasons, low-cost travel offers considerable advantages.","Critics, however, point out that the rapid growth of cheap travel carries a heavy environmental price. To begin with, more flights, trains and cruises mean higher fuel consumption and carbon emissions. Aviation in particular produces large amounts of greenhouse gases per passenger, so the growing number of short, cheap flights accelerates climate change and worsens air quality. Because tickets are so cheap, many people now take several short flights a year for trips that would once have been unthinkable. In addition, unregulated mass tourism can damage the destinations that attract visitors. New hotels and resorts may destroy natural habitats, while large crowds consume scarce resources such as water and generate waste that local services cannot handle. To illustrate, Venice introduced an entry fee for day visitors in 2024 in an attempt to manage the overcrowding that threatens the city. Consequently, cheap travel cannot be considered entirely positive.","In conclusion, while low-cost travel broadens horizons and supports local economies, its environmental costs cannot be ignored. Governments should therefore tax the most polluting forms of travel, invest in cleaner transport and help popular destinations manage visitor numbers, so that the benefits of affordable travel can be enjoyed sustainably."],["In recent decades, the expansion of budget airlines, high-speed railways and cheap coach services has made international travel accessible to millions of ordinary people. While some argue that this offers significant benefits to countries and individuals, others believe its environmental consequences make it an undesirable trend. In my opinion, the advantages are real, but they can be sustained only if governments address the damage that mass travel causes.","Those who welcome low-cost travel highlight its benefits for host countries and individual travellers. Firstly, affordable transport brings more tourists, who spend money on accommodation, food, transport and souvenirs, strengthening local economies and creating employment. A rising number of visitors also allows a country to showcase its traditions and culture to the world, enhancing its international image and encouraging pride in its heritage. Local craftspeople, guides and small family businesses often gain the most from this steady flow of visitors. Secondly, individuals benefit from the chance to experience other cultures first-hand. When travel no longer costs a fortune, more people can visit foreign countries, gain insight into different customs and develop a greater appreciation of cultural diversity. For example, a university student today can often fly to a neighbouring country for a weekend for little more than the cost of a train ticket at home. Therefore, low-cost travel brings clear economic and cultural benefits.","Critics, however, argue that the growth of these services creates serious environmental problems. To begin with, increased travel consumes large amounts of fossil fuels. As more people fly and drive long distances, emissions of carbon dioxide and other pollutants rise, contributing to climate change and air pollution. In addition, mass tourism can damage ecosystems and local communities. Hotels, roads and resorts built to serve tourists often destroy wildlife habitats, while careless visitors leave litter that pollutes beaches and countryside. To illustrate, Thailand’s Maya Bay had to be closed to tourists in 2018 to allow its coral reefs to recover from years of overcrowding. Consequently, the expansion of cheap travel can cause lasting and sometimes irreversible harm to the natural environment.","In conclusion, while low-cost travel supports economies and broadens cultural understanding, it also increases pollution and damages fragile ecosystems. Governments should therefore implement strict environmental regulations and promote sustainable tourism practices, so that affordable travel benefits both communities and the environment."]]},{"id":"W2-DS-16","task":2,"type":"Discussion","prompt":["Some people believe that reading is always a good habit. Others feel that whether it is beneficial depends on which books a person is reading.","Discuss both sides and give your own opinion."],"imgs":[],"models":[["Reading is widely regarded as one of the most beneficial habits a person can develop, yet opinions differ on whether this applies to every kind of book. Some believe that reading is valuable regardless of content, while others argue that its benefits depend on the quality and purpose of the material. In my view, the act of reading has general benefits, but its overall value depends largely on what people choose to read.","Those who believe reading is always a good habit emphasise its ability to stimulate the mind. Firstly, reading of any kind can improve vocabulary, concentration and imagination. Even light fiction requires readers to follow a plot, picture scenes and remember characters, which exercises mental abilities more than passive entertainment does. Secondly, reading broadens people’s understanding of the world. Novels and non-fiction books introduce readers to other cultures, historical periods and points of view, helping them develop empathy and knowledge. For example, a teenager who reads adventure novels set in other countries may become curious about those places and their history. Moreover, reading is generally a more productive use of time than watching television for hours. For these reasons, reading is often seen as worthwhile whatever the content.","Those who believe its value depends on the material, however, make an important point, and I agree with them. To begin with, not all books are equally valuable. Poorly researched or deliberately misleading books can spread misinformation and reinforce harmful stereotypes, while a diet of superficial or sensationalist material offers little intellectual stimulation. Time spent on such material may even replace reading that could genuinely expand a person’s knowledge. In addition, some books are written with the intention of spreading hatred or encouraging violence. Such works may present biased, distorted views of reality, which can influence readers, especially young people, who lack the experience to recognise manipulation. To illustrate, books promoting false health claims have persuaded some readers to avoid proven medical treatments. Therefore, the content of a book determines whether reading contributes positively to a person’s development.","In conclusion, reading in general can improve mental abilities and broaden horizons, but its benefits are greatest when people choose accurate and meaningful material. Parents and teachers should therefore encourage children to read widely while teaching them how to evaluate the reliability and purpose of what they read."],["In an age dominated by screens, many parents and teachers worry that young people read less than previous generations. Some believe that reading is always a beneficial habit, while others argue that its value depends on the content of the material. In my view, although reading in itself has clear advantages, the content of a book is the main factor that determines its worth.","Those who see reading as always beneficial highlight its cognitive and educational advantages. Firstly, reading improves concentration and memory. Following a story or an argument across many pages requires sustained attention, and this mental effort strengthens the ability to focus, whether the book is a children’s story, a novel or a scientific text. This habit of concentration can then carry over to studying and working, where sustained attention is increasingly rare. Secondly, reading improves vocabulary and language skills. Regular readers encounter a wide range of words and sentence structures, which helps them express themselves more clearly in both academic and everyday situations. For example, students who read regularly for pleasure often write more fluent and varied essays than those who rarely read. In short, the act of reading brings intellectual benefits regardless of what is being read.","However, others argue that the impact of reading depends greatly on the content, and I find this view more convincing. To begin with, books with meaningful content can support mental well-being and personal growth. Well-written novels can help readers relax and see situations from new perspectives, while practical non-fiction can teach useful skills such as communication or financial management. Biographies of inspiring figures can also motivate readers to pursue their own goals with greater determination. In addition, harmful material can have the opposite effect. Some books spread extremist ideologies, misinformation or discriminatory attitudes, and these can shape the thinking of readers, particularly young people who may accept what they read without question. To illustrate, a teenager who reads conspiracy theories online or in print may come to distrust reliable sources of information such as scientists and doctors. Therefore, reading is truly valuable only when the material is accurate, informative and ethical.","In conclusion, while reading generally improves concentration and language skills, its real impact depends on the content of what is read. People should therefore read regularly but selectively, choosing books that support their knowledge and personal growth."],["The role of reading in personal development has long been a subject of debate. Some assert that reading is inherently beneficial, while others argue that the value of the habit is contingent upon the nature of the material. In my view, reading is always worth encouraging, but the varied nature of books means that its benefits depend significantly on readers’ choices.","Supporters of the idea that reading is always a good habit emphasise its numerous intellectual and emotional advantages. Firstly, reading enhances vocabulary, comprehension and critical thinking. Regular readers learn to process complex information, evaluate arguments and draw conclusions, abilities that support better decision-making in daily life. These abilities are valuable at school and work, where people constantly need to understand and assess written information. Secondly, reading fosters empathy and a deeper understanding of the world. Fiction allows readers to experience the lives of characters from different backgrounds, cultures and periods, while non-fiction on society, economics or history widens their perspective and challenges their prejudices. For example, reading a novel narrated by a refugee can help readers understand the fears and hopes of people whose lives are very different from their own. In other words, books can be both a tool for cognitive development and a source of valuable insight.","Critics, however, argue that these benefits depend on the quality and nature of the material. To begin with, consuming misleading or inappropriate content can distort a reader’s worldview. Sensationalist publications, unfounded conspiracy theories or poorly researched books may lead readers to form mistaken beliefs, which can affect important decisions about health, money or politics. In addition, what people read shapes not only their knowledge but also their moral values. Literature has a powerful ability to influence how readers judge right and wrong, so writers with a distorted view of society can pass these attitudes on to their audience. To illustrate, propaganda published by extremist groups has been used to recruit young readers by presenting violence as heroic. Therefore, the content of what is read plays a crucial role in determining its overall impact on the reader.","In conclusion, while reading generally contributes to cognitive development and broader perspectives, its benefits depend on the quality of the material. Schools and families should therefore encourage reading from an early age while guiding young people towards reliable and thoughtful books."]]},{"id":"W2-DS-17","task":2,"type":"Discussion","prompt":["Some feel that individuals should try to assimilate completely to the country where they live while others feel it is more important to preserve their native culture no matter where they live.","Discuss both sides and give your opinion."],"imgs":[],"models":[["As international migration becomes increasingly common, millions of people must decide how far to adapt to the culture of their new home. Some believe immigrants should assimilate completely to integrate successfully, while others argue that preserving their native culture is more important. In my view, people should adapt to their new society without abandoning their original customs and identity.","Those who support complete assimilation argue that it helps immigrants integrate into their host society. Firstly, adopting the local language, customs and social norms allows newcomers to build relationships and find employment more easily. Employers often prefer candidates who communicate fluently and understand workplace culture, so those who adapt quickly tend to have better career prospects. For example, immigrants who speak the national language fluently are generally more likely to be hired and to feel socially included. This also helps their children settle more easily at school. Secondly, assimilation helps prevent misunderstandings. When people understand local expectations about behaviour, politeness and social interaction, they are less likely to cause unintended offence, which reduces tension between communities. Therefore, full assimilation is often seen as a practical route to social harmony and personal success.","Those who emphasise preserving native culture, however, argue that it benefits both individuals and society, and I largely agree with them. To begin with, people’s native culture is a central part of their identity. Speaking their mother tongue, celebrating traditional festivals and passing customs on to their children give immigrants a sense of belonging and emotional stability in an unfamiliar environment. Abandoning these traditions entirely can leave people feeling disconnected from their families and their past. In addition, the presence of different cultures enriches the host society. Immigrant communities introduce new foods, festivals and art, which promote cultural exchange and can even boost tourism and the local economy. To illustrate, Chinatowns in cities such as San Francisco and London preserve Chinese traditions while attracting large numbers of visitors and contributing to the vibrancy of these cities. Therefore, preserving one’s native culture honours personal heritage and contributes to cultural diversity.","In conclusion, while adapting to the host culture helps immigrants integrate and avoid misunderstandings, preserving native traditions strengthens identity and enriches society. Immigrants should therefore learn the local language and customs while continuing to celebrate their own heritage, and host societies should welcome both forms of participation."],["In the contemporary world, the question of whether migrants should fully assimilate into their new communities or preserve their native culture has sparked extensive debate. While some argue that complete assimilation is essential for social cohesion, others stress the importance of protecting cultural heritage. In my view, both perspectives have merit, and a combination of the two is vital for the long-term well-being of individuals and societies.","Proponents of full assimilation argue that it fosters communication and economic success. Firstly, a shared language and cultural understanding minimise misunderstandings and allow social interactions to flourish. This not only improves relationships between newcomers and long-standing residents but also reduces the isolation that many immigrants feel, strengthening social cohesion. For example, the United States, often described as a \"melting pot\", has historically integrated immigrants from many backgrounds into a shared national identity. Secondly, assimilation brings substantial economic advantages. Individuals who embrace the culture and language of their host country are better able to enter the workforce and progress in their careers, whereas those who remain isolated within their own communities may struggle to find suitable employment. Language skills in particular allow immigrants to obtain locally recognised qualifications and access public services such as healthcare. Thus, assimilation can facilitate both economic mobility and social integration.","Nevertheless, advocates of cultural preservation highlight its considerable value. To begin with, maintaining cultural traditions supports immigrants’ emotional well-being. Moving to a new country often causes stress and homesickness, and familiar customs, food and celebrations provide comfort and a sense of continuity. This emotional security can help immigrants cope with the many challenges of adapting to a new country. In addition, preserving diverse traditions creates a richer and more dynamic society. Native cultures carry knowledge of history and the values of earlier generations, and sharing them allows the wider population to learn from different ways of life. To illustrate, the city of Leicester in England hosts one of the largest Diwali celebrations outside India, an event enjoyed by residents of many different backgrounds. For these reasons, the motivation for immigrants to uphold their native culture is clear.","In conclusion, assimilation helps immigrants communicate and succeed economically, while cultural preservation protects their well-being and enriches society. Governments should therefore provide language and integration support for newcomers while celebrating the cultural diversity that immigrant communities bring."]]},{"id":"W2-DS-18","task":2,"type":"Discussion","prompt":["Some people believe that professionals, such as doctors and engineers, should be required to work in the same country where they receive their training. Others believe they should be free to work in any other country if they wish.","Discuss these views and give your own opinion."],"imgs":[],"models":[["The migration of skilled workers from poorer to richer countries, often described as a brain drain, has become a growing concern in many parts of the world. Some argue that doctors, engineers and other professionals should be required to work in the country that trained them, while others believe they should be free to work wherever they wish. In my opinion, although countries have a legitimate interest in retaining talent, professionals should ultimately be free to choose where they work.","Advocates of restriction argue that professionals have a responsibility towards the country that educated them. Firstly, many governments invest heavily in training doctors and engineers, often through subsidised university places, and they reasonably expect a return on this investment. Requiring graduates to work at home for a period allows them to repay the public money spent on their education. For example, several states in India require medical graduates from government colleges to serve in public hospitals, often in rural areas, for a set number of years. Secondly, many developing countries face serious shortages of skilled professionals. If newly qualified doctors and engineers emigrate, local populations, particularly in poor and rural areas, are left without adequate healthcare or infrastructure. For these reasons, there is some justification for mandatory work requirements.","On the other hand, others argue that professionals should be free to work anywhere, and I agree with this view. To begin with, freedom of movement allows individuals to pursue better career opportunities and living conditions. Professionals who can choose where to work are more likely to find roles that match their skills and ambitions, which leads to greater job satisfaction and better results. In addition, international mobility encourages the exchange of knowledge between countries. Doctors and engineers who gain experience abroad often learn new techniques and form international networks, and many later return home or support their home countries in other ways. To illustrate, the Philippines receives substantial remittances from nurses working overseas, money that supports families and the national economy. Therefore, restricting professionals would limit their growth and the wider benefits of mobility.","In conclusion, although countries understandably want to retain the professionals they train, compulsory work requirements can be counterproductive. Governments should therefore keep talent at home by improving salaries and working conditions, rather than restricting the freedom of skilled workers to move."]]},{"id":"W2-DS-19","task":2,"type":"Discussion","prompt":["Space exploration and research costs countries and governments enormous amounts of money each year. It is said that such money is wasted and would be better spent tackling pressing social issues.","Discuss the statement and give your opinion."],"imgs":[],"models":[["Since the beginning of the space age in the 1950s, governments have spent vast sums on rockets, satellites and research missions. Critics argue that this money is wasted and should instead be used to tackle urgent social problems, while supporters point to the scientific and practical benefits of space research. In my view, space exploration deserves continued funding, but a larger share of public money should be directed towards pressing social needs.","Those who defend space exploration point to its scientific and practical benefits. Firstly, space research leads to discoveries and technologies that improve life on Earth. Satellites, originally developed through space programmes, now provide communication networks, weather forecasts and navigation systems that billions of people rely on every day. For example, GPS, which began as a United States military satellite system, is now used by farmers, delivery drivers and emergency services around the world. Secondly, space exploration encourages international collaboration. Scientists and engineers from many countries work together on major projects, sharing knowledge and building trust between nations. A case in point is the International Space Station, which has been operated jointly by the United States, Russia, Europe, Japan and Canada for more than two decades. For these reasons, space programmes are far from a complete waste of money.","Critics, however, argue that urgent social problems deserve priority, and I partly agree with them. To begin with, many people around the world still face hunger, poverty, inadequate healthcare and the effects of natural disasters. Money spent on a single space mission could fund hospitals, schools or clean water projects that would improve millions of lives immediately. In addition, the benefits of space exploration are often slow and uncertain. Discoveries about distant planets may be scientifically fascinating, yet they offer little help to families struggling to afford food or housing today. To illustrate, while space agencies plan missions to Mars, many communities on Earth still lack reliable access to electricity and clean drinking water. Therefore, governments have a duty to ensure that pressing social needs are addressed first.","In conclusion, space exploration brings valuable technologies and international cooperation, but urgent social problems require more immediate attention. Governments should therefore continue to fund space research at a modest level, while directing a greater share of public spending towards poverty reduction, healthcare and education."]]},{"id":"W2-DS-20","task":2,"type":"Discussion","prompt":["It is believed by some that students should be able to pick their own sets of subjects to study at school. Those who disagree argue that all students had better study the full curriculum.","Discuss both options and give your opinion."],"imgs":[],"models":[["Education systems around the world differ in how much freedom they give students to choose what they study. Some believe students should pick their own subjects because this increases motivation, while others argue that everyone should follow the full curriculum to gain a broad education. In my view, the best approach combines a full curriculum in the early years with more choice as students mature.","Supporters of subject choice argue that it increases engagement and prepares students for their future careers. Firstly, students who study topics that match their interests and abilities are more motivated and tend to perform better. Being forced to study subjects they dislike can lead to boredom and poor results. Secondly, choosing subjects allows students to specialise early and build a strong foundation for their intended careers. A student who wants to become an engineer, for instance, can spend more time on mathematics and physics. For example, students in England usually choose only three or four subjects to study at A-level from the age of sixteen. However, specialising too early may leave students with gaps in essential knowledge. Therefore, subject choice has clear benefits but also certain risks.","Those who favour a full curriculum, on the other hand, believe it ensures that all students receive a well-rounded education. To begin with, studying a wide range of subjects develops general knowledge and skills that everyone needs. A student who studies only science and mathematics might miss out on history, literature and social issues, which help people understand society and participate as informed citizens. In addition, a common curriculum promotes equality, because every student receives the same opportunities regardless of family background or access to advice. However, a rigid curriculum can limit students’ ability to explore their strengths and may cause disengagement among those with clear goals. To illustrate, a talented young artist forced to spend most of the week on advanced chemistry may lose motivation at school. Therefore, a broad curriculum is valuable but should not be applied too rigidly.","In conclusion, both personalised and standardised learning have value, and a flexible system that combines them offers the most benefit. Schools should therefore teach a full curriculum in the early years and gradually allow older students to choose more of their subjects, while keeping core subjects such as mathematics and the native language compulsory."],["Whether school curricula should be entirely prescribed or allow students to choose their own subjects is an increasingly important question in modern education. Supporters of subject choice argue that personalised learning nurtures motivation and expertise, while advocates of a full curriculum stress the importance of a broad and equal foundation. In my view, a hybrid model that begins with core subjects and gradually introduces choice is the most effective way to prepare young people for the future.","Those in favour of allowing students to choose their subjects believe that this freedom nurtures motivation and academic excellence. Firstly, learners who study areas aligned with their interests are more likely to invest effort in their education and achieve higher levels of performance. Genuine curiosity encourages students to read beyond the syllabus and engage more deeply with the material. Secondly, early specialisation gives students a head start in their intended careers, allowing them to build expertise and confidence in their chosen fields. For example, under Vietnam’s 2018 general education curriculum, upper secondary students select combinations of elective subjects alongside compulsory ones, allowing them to focus on areas related to their future studies. From this perspective, choice appears to serve both students’ motivation and their long-term goals.","Conversely, proponents of a uniform curriculum argue that it ensures every student develops a well-rounded education. To begin with, studying a broad range of disciplines, including science, humanities, languages and the arts, gives students the general knowledge and cognitive flexibility needed to adapt to changing circumstances. A student who abandons history or literature too early may grow up with a limited understanding of society and civic responsibility. Broad knowledge also keeps future options open for students who change their career plans later. In addition, a shared curriculum promotes fairness. It prevents gaps between students who receive good advice about subject choices and those who lack such guidance or resources. To illustrate, a student whose parents did not attend university may choose subjects poorly and unknowingly close off certain degree options. Therefore, a common curriculum protects both breadth and equality of opportunity.","In conclusion, both subject choice and a standardised curriculum offer distinct advantages, but neither is sufficient on its own. Schools should therefore provide a fixed core curriculum in the early years and gradually allow older students to shape their own academic paths, supported by professional guidance."]]},{"id":"W2-DS-21","task":2,"type":"Discussion","prompt":["Some people believe that since people can now see movies at home, there is no need to visit cinemas. Others argue that in order to be enjoyed, movies must be seen in cinemas.","Discuss both views and give your opinion."],"imgs":[],"models":[["In recent years, streaming services and affordable home entertainment systems have transformed the way audiences watch films. Some argue that this makes cinemas unnecessary, as home viewing is cheaper and increasingly comparable in quality, while others insist that films can only be fully appreciated on the big screen, where scale and a shared audience heighten their impact. In my view, home viewing is perfectly adequate for many films, but cinemas remain essential for those designed to be seen on a large screen.","Those who see no need for cinemas point to the convenience and low cost of watching at home, as well as the improving quality of home technology. To begin with, a single streaming subscription gives a household access to thousands of titles for roughly the price of one or two cinema tickets. A family can therefore watch a new release together without paying for travel and expensive snacks. In addition, large televisions and compact sound systems have narrowed the gap between the living room and the auditorium. As a result, viewers can enjoy sharp images and clear sound in comfort, making a trip to the cinema seem less worthwhile. For instance, during the COVID-19 pandemic, several major studios released new films directly to streaming platforms, and audiences adapted to watching premieres at home. For these reasons, many people regard cinemas as an optional luxury rather than a necessity.","Supporters of cinemas, however, contend that the size of the screen and the presence of an audience are integral to the experience of many films. Firstly, filmmakers often design their work specifically for cinema projection and sound. Sweeping landscapes, detailed visual effects and carefully mixed soundtracks lose much of their impact on a television screen. A case in point is Christopher Nolan’s Oppenheimer, which was shot partly on IMAX film for the largest screens available. Secondly, watching a film among strangers turns it into a collective event. Shared laughter during a comedy or mounting tension during a thriller intensifies emotional reactions in a way that solitary viewing rarely does. Taken together, these qualities suggest that, for certain films at least, the cinema offers something home viewing cannot replace.","To conclude, home viewing offers clear advantages in cost, convenience and comfort, whereas cinemas provide a scale and shared atmosphere that can greatly enhance a film’s impact. Cinemas should therefore concentrate on spectacular and communal films that benefit most from the big screen, leaving everyday viewing to the home."]]},{"id":"W2-DS-22","task":2,"type":"Discussion","prompt":["Some people believe that modern technological developments are contributing to bridging the gap between the rich and poor. Others say that they are actually widening this gap.","Discuss both opinions and give your own opinion."],"imgs":[],"models":[["Rapid technological change has transformed how people learn, work and earn a living in almost every part of the world. Some argue that technology is reducing the gap between rich and poor by opening up education and economic opportunities, while others contend that unequal access and the demand for advanced skills are widening it. In my view, technology has the potential to reduce inequality, but without deliberate action it tends to increase it.","Proponents of the optimistic view argue that digital technology has made opportunities far more accessible. Firstly, online education platforms allow people from disadvantaged backgrounds to acquire knowledge and skills that were once available only to those who could afford expensive courses. Free lectures, tutorials and language apps enable learners to improve their employability and social standing. Secondly, technology has created new ways to earn money. Freelancing websites and online marketplaces allow individuals in poorer regions to compete for clients around the world. For example, mobile banking services such as M-Pesa in Kenya have given millions of people without bank accounts a secure way to save, send and receive money, helping small traders expand their businesses. For these reasons, technology can help narrow socioeconomic divides.","Detractors of this view, however, argue that technological progress is widening the gap, and I find their case more persuasive. To begin with, access to technology remains highly unequal. High-quality devices, reliable Internet connections and advanced software are easily affordable for wealthy families but a considerable burden for poor ones, so the digital divide reinforces existing disadvantages. In addition, the modern job market increasingly rewards specialised technological skills that are costly and time-consuming to acquire. Individuals from privileged backgrounds are more likely to receive the education needed to thrive in a digital economy, while low-skilled workers face growing competition from automation. To illustrate, during the COVID-19 pandemic, many students from poor households in developing countries were unable to attend online classes because they lacked computers or Internet access. Therefore, technology tends to benefit those who are already advantaged far more than those who are not.","In conclusion, while technology offers tools that could reduce inequality, unequal access and rising skill demands mean it is currently widening the gap between rich and poor. Governments should therefore invest in affordable Internet access, digital skills training and support for workers affected by automation."],["Technology has transformed almost every aspect of economic life, from how people find work to how businesses compete. Some believe that it helps narrow the gap between rich and poor by providing free education and new business opportunities, while others think it makes this gap wider. In my opinion, despite its potential to help poorer people, technology in practice increases inequality.","Those who believe technology reduces inequality point to the opportunities it creates for people with limited resources. Firstly, the Internet provides free access to education and information. In the past, only wealthy people could afford expensive books and university courses, whereas today anyone with a smartphone can learn skills such as a foreign language or computer programming at no cost. This gives individuals from low-income backgrounds a genuine chance to obtain better jobs and higher salaries. Secondly, online platforms allow small business owners to sell products to customers worldwide without paying to rent a physical shop. For example, a craftsperson in a rural village can now sell handmade goods to buyers in other countries through an online marketplace. As a result, technology creates new routes out of poverty.","On the other hand, I believe that technology ultimately makes the rich richer and the poor poorer. To begin with, wealthy individuals and large corporations can afford to invest in the latest technologies, such as artificial intelligence and automated systems. These tools allow them to increase productivity, cut costs and maximise profits far faster than smaller businesses or individuals who cannot afford them, making it increasingly difficult for poorer competitors to keep up. In addition, automation is rapidly replacing many low-skilled jobs. Machines and software now perform work once done by factory workers, supermarket cashiers and call-centre staff, and these jobs are a major source of income for lower-income families. To illustrate, self-service checkouts in supermarkets have reduced the number of cashiers needed, while the companies that produce such systems become more profitable. Consequently, the benefits of technology flow mainly to those who already own capital and skills.","In conclusion, although technology provides useful tools for learning and earning, it ultimately widens the wealth gap because the rich gain far more from it than the poor. Governments should therefore tax the profits of automation fairly and use the revenue to retrain workers whose jobs are lost to technology."]]},{"id":"W2-DS-23","task":2,"type":"Discussion","prompt":["Some people think that competition at work, and at school is useful and much needed. Others believe that people should try to cooperate, rather than compete against each other.","Discuss both these views and give your own opinion."],"imgs":[],"models":[["In both classrooms and workplaces, people are constantly encouraged either to outperform one another or to work together towards shared goals. Some argue that competition is essential because it motivates people and drives innovation, while others believe cooperation leads to more meaningful progress and healthier relationships. In my view, competition has a useful role, but cooperation produces more lasting benefits.","Those who champion competition highlight its ability to motivate people and drive excellence. Firstly, striving to outperform others encourages individuals to work harder. Students may study more diligently when they compete for top marks or scholarships, and employees often raise their productivity when promotions and bonuses are awarded to the best performers. Clear targets and visible rankings give people a strong reason to push beyond their usual limits. Secondly, competition between companies and researchers encourages innovation. Rival firms constantly develop better and cheaper products to win customers, which benefits consumers and the wider economy. For example, the space race between the United States and the Soviet Union in the 1960s accelerated progress in rocket and satellite technology at a remarkable pace. Without competition, individuals and organisations may become complacent. For these reasons, competition can clearly spur achievement and growth.","Supporters of cooperation, however, argue that working together brings deeper and longer-lasting benefits, and I agree with them. To begin with, cooperation develops essential social skills. In group projects, students learn to listen, negotiate and respect different viewpoints, while workplace teams combine diverse talents to produce more creative solutions than individuals could achieve alone. In addition, excessive competition can create stress, resentment and even dishonest behaviour, which damages relationships and morale. Students who see every classmate as a rival may refuse to share notes or help others, weakening the whole class. Cooperative environments, by contrast, encourage trust and mutual support, which make people more willing to share ideas and help one another. To illustrate, the Linux operating system and the online encyclopedia Wikipedia were built by thousands of volunteers cooperating freely, and both are now used by millions of people around the world. Therefore, cooperation sustains progress and strengthens communities.","In conclusion, while competition can motivate individuals and drive innovation, cooperation develops social skills and creates healthier environments that support lasting success. Schools and employers should therefore reward teamwork and shared achievements, while using competition in moderation to encourage individual effort."]]},{"id":"W2-DS-24","task":2,"type":"Discussion","prompt":["Innovation is often driven by the pursuit of profit and economic growth. However, some argue that it should prioritize addressing social and environmental issues.","Discuss both sides and give your own opinion."],"imgs":[],"models":[["Innovation has long been regarded as a powerful engine of economic development, frequently propelled by the prospect of financial gain. However, some argue that it should be guided less by profit and more by the need to address social and environmental problems. In my view, while economic incentives have undeniably fuelled progress, directing innovation towards the public good is both ethically sound and increasingly essential for long-term sustainability.","Proponents of profit-driven innovation argue that financial incentives are a crucial motivator for progress. Firstly, businesses invest heavily in research and development because they expect to earn returns from new products, more efficient processes or a competitive advantage. This expectation has led to remarkable breakthroughs in technology, medicine and industry. Private investment of this kind often exceeds what governments alone could provide. Secondly, competition for profit encourages companies to bring new solutions to market quickly. Firms that fail to innovate lose customers to their rivals, so they have every reason to improve their products constantly. For example, the smartphone revolution was largely driven by companies competing for market share, producing devices that have transformed global communication. In this sense, financial incentives play a pivotal role in accelerating innovation.","Critics, however, argue that when profit becomes the dominant motive, innovation neglects society’s most pressing needs, and I agree with them. To begin with, many urgent problems, such as climate change, public health crises and poverty, do not promise immediate financial returns, so they remain underfunded by private companies. To illustrate, very few new classes of antibiotics have been developed in recent decades, partly because drug companies expect limited profits from medicines that patients take only for short periods. In addition, neglecting these areas could eventually undermine economic growth itself. Rising inequality, environmental degradation and global instability all threaten the stable conditions that businesses need to thrive. Socially oriented innovations, such as renewable energy and affordable medical treatments, therefore benefit both people and the planet, even if their financial rewards are not immediate. Consequently, innovation must serve broader social and environmental goals than profit alone.","In conclusion, while the pursuit of profit has driven many valuable innovations, it often ignores social and environmental needs that are vital for long-term prosperity. Governments, universities and businesses should therefore work together to create funding and policies that reward socially responsible innovation."],["New technologies and products appear at a remarkable pace, and the motives behind them shape the kind of world they create. Some believe innovation is best driven by profit and economic growth, while others argue that it should focus on solving social and environmental problems. In my opinion, both goals matter, and the most valuable innovations are those that combine commercial success with genuine social and environmental benefit.","Supporters of profit-driven innovation argue that it delivers significant benefits to society. Firstly, the prospect of financial reward encourages organisations to invest heavily in research and development. When companies expect to profit from new technologies, they are willing to spend large sums on improving products such as microchips, medical devices and electric batteries. These investments often produce knowledge that later benefits entire industries. Secondly, competition for market share motivates firms to improve the quality, price and efficiency of their products. For example, the rapid improvements in smartphones and laptops over the past two decades have largely resulted from companies competing to attract customers. Therefore, focusing on profit can indirectly deliver innovations that make daily life easier and more productive.","Others, however, believe that innovation addressing social and environmental needs is equally important, and I share this view. To begin with, the world faces urgent challenges such as climate change, pollution and rapid population growth, which require solutions even when they generate profits slowly. Technologies such as water purification systems, solar panels and electric vehicles involve high development costs, yet they are essential for a sustainable future. Because private companies may hesitate to fund them, public support is often needed in the early stages. In addition, social innovation can improve the lives of people whom the market often overlooks. To illustrate, the Grameen Bank in Bangladesh pioneered small loans for poor entrepreneurs, especially women, helping many to start businesses and escape poverty. Moreover, such innovations can become profitable in the long run, as the falling cost of solar power has shown. Therefore, social and environmental goals deserve a central place in innovation.","In conclusion, profit-driven innovation improves products and encourages investment, while innovation focused on social and environmental needs addresses urgent global problems. Organisations should therefore pursue projects that are both profitable and beneficial to society, and governments should support them through grants and tax incentives."]]},{"id":"W2-DS-25","task":2,"type":"Discussion","prompt":["Some people think that the best way to be successful in life is to get a university education. Others disagree and say this is no longer true.","Discuss both views and give your own opinion."],"imgs":[],"models":[["In a rapidly changing economy, the role of a university degree in achieving success is coming under increasing scrutiny. While many believe that higher education remains the most reliable path to a prosperous life, others argue that skills, experience and initiative now matter more. In my view, university education is still valuable, but it is no longer the only or the best route to success for everyone.","Supporters of university education argue that it provides a solid foundation for a stable and respected career. Firstly, a degree opens doors to high-paying professions such as medicine, law and engineering, where rigorous academic training is legally required. Without it, these careers remain entirely out of reach. Secondly, universities help students develop valuable skills and networks. Critical thinking, research and communication skills are practised throughout a degree, while internships, alumni groups and academic events create connections that can later lead to job opportunities. For example, many graduates obtain their first job through a university careers fair or an internship arranged during their studies. For these reasons, university education continues to be seen as a dependable gateway to success, particularly in knowledge-based industries.","Those who disagree, however, argue that success today depends on much more than formal qualifications, and I largely agree. To begin with, practical skills, creativity and entrepreneurial spirit are increasingly valued in the digital economy. Some of the most successful business figures of recent decades, including Steve Jobs and Mark Zuckerberg, left university without completing their degrees, showing that innovation and risk-taking can matter more than academic credentials. In addition, the rising cost of higher education has made it a risky investment for many students. Graduates may leave university with heavy debts and no guarantee of suitable employment, while those who pursue vocational training or learn marketable skills such as coding or digital marketing can start earning sooner. To illustrate, Germany’s apprenticeship system allows young people to train as skilled technicians while being paid, leading to secure careers without a degree. Therefore, the path to success has clearly become more diverse.","In conclusion, while a university education remains essential for certain professions and offers valuable skills and networks, it is not a universal route to success. Governments should therefore promote high-quality vocational training and apprenticeships alongside universities, so that young people can choose the path that best suits their abilities."]]},{"id":"W2-DS-26","task":2,"type":"Discussion","prompt":["Some people think that schools should select students according to their academic abilities, while others believe that it is better to have students with different abilities studying together.","Discuss both views and state your own opinion."],"imgs":[],"models":[["How schools organise their students has a significant effect on both academic results and social development. Some people support selecting students by academic ability, as this allows teaching to be pitched at the right level, while others believe that mixing students of different abilities benefits everyone. In my opinion, mixed-ability teaching is the wiser choice for most schools, as it is fairer and develops important social skills.","Those who favour selecting students by ability put forward some convincing arguments. Firstly, teaching can be aimed precisely at the right level. When a class consists of students with similar abilities, the teacher can adjust the pace and difficulty of lessons, so that talented students are challenged while slower learners are not left behind. For example, a class of high achievers can move quickly through advanced mathematics instead of waiting for others to catch up. Secondly, able students are pushed to reach their full potential. Being surrounded by equally capable classmates creates healthy competition and ambition, which often leads to excellent results in demanding subjects. A case in point is England’s grammar schools, which select pupils through an entrance examination and often achieve outstanding exam results. Therefore, selection by ability can raise standards for the strongest students.","Supporters of mixed-ability classes, however, believe that students learn best together, and I agree with them. To begin with, weaker students benefit from studying alongside stronger classmates. They are motivated by their peers’ example and can learn from them directly, while stronger students deepen their own understanding by explaining ideas to others. In addition, separating children by ability from a young age raises concerns about fairness and social development. Students placed in lower groups may be labelled as failures, which can damage their confidence and limit their ambitions, whereas mixed classrooms teach students to respect and cooperate with people who are different from themselves. To illustrate, Finland’s comprehensive schools teach students of all abilities together, yet the country has long been regarded as having one of the most successful education systems in the world. Therefore, mixed-ability teaching supports the growth of the whole person, not merely exam performance.","To sum up, while selection by ability can help the most able students achieve higher results, mixed-ability classes are better for the majority because they are fairer and develop social skills. Schools should therefore keep mixed classes in general, while offering extra support or advanced lessons in particular subjects."]]},{"id":"W2-DS-27","task":2,"type":"Problems and solutions","prompt":["In many countries, crime rates amongst younger people has been rising.","Discuss the causes and solutions for this problem."],"imgs":[],"models":[["In many parts of the world, the number of young people committing offences has been climbing steadily, causing growing concern among parents and authorities. This problem stems largely from weak parental supervision and heavy exposure to violent media, and it can be tackled by supporting working parents, regulating young people’s media consumption and offering teenagers constructive alternatives to crime.","Youth crime can largely be attributed to a lack of parental supervision and exposure to violent media. Firstly, when both parents work long hours, children often spend their afternoons and evenings unsupervised, which leaves them more susceptible to pressure from older peers. For instance, a teenager who drifts into a group already involved in shoplifting or vandalism may join simply to be accepted, with no adult at home to notice the warning signs. Secondly, many young people consume violent content without any guidance. Films, games and online videos that glamorise aggression can gradually normalise it, so that settling a dispute with force or stealing a desired item begins to seem ordinary rather than shocking. Taken together, an absence of guidance at home and constant exposure to violent media make offending seem both possible and acceptable to many adolescents.","Addressing the problem therefore requires closer supervision, more responsible media use and meaningful activities for young people. To begin with, governments could encourage employers to offer flexible working arrangements and fund after-school clubs, leaving fewer children alone for long periods of the day. At the same time, age ratings on films and games should be enforced more strictly, and schools could introduce media literacy lessons that teach students to question the violence they see on screen rather than imitate it. In addition, young people need positive outlets for their energy. Sports leagues, volunteering schemes and supervised part-time work fill idle hours and give teenagers a sense of purpose and belonging in their community. To illustrate, a free evening football programme in a deprived neighbourhood can keep teenagers occupied, build their confidence and connect them with positive adult role models. By combining these measures, societies can steer young people away from crime before it takes hold.","In conclusion, rising youth crime is driven mainly by inadequate supervision at home and the normalisation of violence in the media. Governments, schools and families should therefore work together to keep young people supervised, critically aware and constructively occupied, rather than relying on punishment once the damage has been done."]]},{"id":"W2-TQ-01","task":2,"type":"Two-part question","prompt":["In recent years, many small local shops have closed because customers seem to prefer travelling to large shopping centres or malls to do their shopping. What are the reasons for this and is it a positive or negative development?"],"imgs":[],"models":[["As cities modernise and household routines become busier, the way people shop has changed considerably. Many customers now favour large shopping centres because they offer everything under one roof and can undercut independent retailers on price, and as a result numerous small local shops have been forced to close. In my view, this is a largely negative development, as it erodes the character of neighbourhoods and weakens local economies.","The shift towards malls can be explained mainly by their convenience and their commercial strength. To begin with, shopping centres allow customers to complete a wide range of errands in a single trip. Under one roof, a shopper can buy groceries, collect a prescription and have lunch, often late into the evening, which suits people with demanding work schedules who have little time to visit several separate stores. In addition, large chains enjoy economies of scale that independent shops cannot match. Because they purchase stock in enormous quantities and spend heavily on advertising, they can offer lower prices and frequent promotions, drawing price-conscious families away from local traders. For example, a family-run bookshop may struggle to compete with a mall chain that sells new bestsellers at a discount in their first week. For these reasons, the appeal of malls rests on a combination of time-saving and affordability that small businesses find difficult to rival.","However, the decline of local shops carries significant costs for communities. Firstly, these businesses give neighbourhoods their distinctive identity and act as informal social hubs. Shopkeepers often know their regular customers by name, and a short conversation at the corner store can be an important source of contact for elderly residents who live alone. When such shops are replaced by identical chain outlets, streets lose both their individuality and their sense of community. Secondly, the closures damage the local economy. Profits earned by small shops tend to circulate within the area, as owners hire local staff and use nearby suppliers, whereas the revenue of national chains largely flows to distant head offices. Consequently, the trend leaves neighbourhoods poorer as well as less vibrant.","In conclusion, customers are turning to shopping centres because of their convenience and competitive prices, but the resulting loss of local shops undermines community life and drains wealth from neighbourhoods. Local authorities should therefore support independent retailers, for instance through reduced business taxes, so that both forms of shopping can coexist."],["In many rapidly developing economies, shopping has become a leisure activity as much as a necessity. The growing preference for large shopping centres stems mainly from the wider choice they offer and the comfortable, entertainment-oriented environment they provide, and this has led to the closure of many small local shops. From my perspective, despite the loss of some traditional businesses, this trend is a positive development overall, as it raises standards for consumers and stimulates economic growth.","The popularity of shopping malls can be attributed chiefly to their variety and the experience they create. Firstly, malls bring together dozens of retailers, so customers can compare brands, styles and prices before making a purchase. Small shops, by contrast, usually carry limited stock, which means shoppers may have to visit several of them and still fail to find what they need. Secondly, modern shopping centres have evolved into destinations for the whole family rather than places simply to buy goods. With cinemas, restaurants and play areas under one air-conditioned roof, they offer a pleasant escape from heat, rain and traffic. For instance, in tropical cities such as Hanoi or Bangkok, families often spend entire weekend afternoons in malls, combining shopping with a meal and a film. Taken together, greater choice and a more enjoyable environment explain why customers are abandoning local stores.","This shift, in my view, brings considerable benefits to both consumers and the wider economy. To begin with, large retailers are generally subject to stricter quality controls than small independent traders. Products sold by established chains are usually traceable, clearly labelled and covered by return policies, which protects customers from counterfeit or expired goods that are occasionally found in unregulated shops. Moreover, shopping centres create employment and attract investment on a scale that small shops cannot. A single large mall may employ hundreds of staff in retail, security, cleaning and maintenance, while also drawing tourists and encouraging the development of surrounding infrastructure such as roads and public transport. Therefore, although some small businesses inevitably suffer, the overall gains for consumers and local economies are substantial.","In conclusion, shoppers are drawn to malls by their wide selection and their appeal as leisure destinations, and this trend benefits society by improving product standards and generating jobs and investment. Governments should nonetheless help displaced shop owners retrain or relocate into shopping centres, so that the benefits of modern retail are more widely shared."]]},{"id":"W2-TQ-02","task":2,"type":"Two-part question","prompt":["Today, it is more common for young people to enjoy foreign entertainment products, such as films, music or video games than to opt for locally produced ones.","Why is this? Should governments provide more financial support to local entertainment firms to improve their productions?"],"imgs":[],"models":[["In an age of global streaming platforms, young audiences can watch, listen to and play content from almost anywhere. Many of them now favour foreign films, music and games over local ones, largely because overseas productions have larger budgets and are far easier to discover through international platforms. I firmly believe that governments should provide greater financial support to domestic entertainment companies, as this would protect cultural identity and strengthen the national economy.","The preference for foreign entertainment stems mainly from differences in quality and accessibility. The first reason is that major international s
