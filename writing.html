llocated for sleeping decreased to 25%, and going out saw a considerable drop to just 6%. Meanwhile, relaxing at home increased to 13%, and travelling to work also rose to 8%. The proportion of time spent on other activities remained constant at 6%."],["The two pie charts compare how working adults in a particular country divided their day among six activities in 1958 and 2008.","Overall, working took up the largest share of the day in both years, and its share increased considerably over the fifty years. Meanwhile, adults spent proportionally less time sleeping and going out, but more time relaxing at home and travelling to work.","In 1958, working and sleeping occupied almost equal portions of the day, at 33% and 32% respectively, together accounting for nearly two thirds of the total. By 2008, however, the two had moved apart, as the share of time spent working rose to 42% while sleeping fell to 25%. Going out with friends or family saw the most dramatic decline of any activity, falling from 19% of the day, the third largest share, to just 6%.","The remaining activities changed in different ways. The proportion of the day spent relaxing at home rose from 8% to 13%, making it the third most time-consuming activity in 2008. Travelling to work increased fourfold, from only 2% to 8%, so it was no longer the smallest category. Other activities, such as hobbies and sport, were the only category that did not change, accounting for 6% of the day in both years."]]},{"id":"W1-PC-12","task":1,"type":"Pie chart","prompt":["The pie charts give information about the world’s forests in five different regions.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-PC-12-1.jpg","w":1024,"h":590}],"models":[["The two pie charts compare five regions in terms of their share of the world’s forested area and their share of global timber.","Overall, Africa and North America have the largest shares of the world’s forest, and North America also supplies the most timber. Africa presents the most striking contrast, holding over a quarter of the world’s forest but supplying less than a tenth of its timber. With that single exception, every region’s timber share is larger than its forest share.","Looking first at forest cover, Africa has the greatest proportion at 27%, followed closely by North America at 25%. Europe and South America account for 18% and 16% respectively, while Asia has the smallest share of the five, at just 14%.","The picture for timber is considerably different. North America takes first position with 30%, five percentage points above its forest figure, and South America shows an even wider gap, accounting for 23% of timber against 16% of forest. Asia likewise supplies a larger proportion of timber than of forest, at 18%, while Europe’s two figures are the closest of any region, at 18% of forest and 20% of timber. Africa reverses this pattern entirely, holding just 9% of global timber despite having the most forest, a gap of 18 percentage points and the widest discrepancy anywhere in the data."]]},{"id":"W1-PC-13","task":1,"type":"Pie chart","prompt":["The pie charts compare the highest level of education achieved by women in Someland across two years, 1945 and 1995.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-PC-13-1.jpg","w":765,"h":1024}],"models":[["The two pie charts compare the highest level of education achieved by women in Someland in 1945 and 1995.","Overall, women in Someland were far better educated in 1995 than fifty years earlier. In 1945, the large majority had either no schooling or education only up to the third grade, whereas by 1995, half of all women held a first degree and none had left school before Year 9.","In 1945, 35% of women had received no schooling at all, and the same proportion had studied only to the third grade, so these two groups together made up 70% of the female population. A further 15% had completed Year 6 and 10% Year 9, while only 4% had stayed at school until Year 12. Higher education was almost non-existent, with just 1% of women having a first degree and none holding a postgraduate qualification.","By 1995, the situation had changed dramatically. The three lowest categories had disappeared entirely, and the smallest group, at 10%, consisted of women whose education had ended at Year 9, the same proportion as in 1945. The share of women who had completed Year 12 had risen fivefold to 20%. However, the most striking change was in higher education. Half of all women now held a first degree, compared with just 1% in 1945, and a further 20% had gained a postgraduate qualification, meaning that seven in ten women had studied at university level."]]},{"id":"W1-PC-14","task":1,"type":"Pie chart","prompt":["The pie charts below illustrate the number of journal articles read per week by all students, PhD students, and junior lecturers at an Australian university.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-PC-14-1.jpg","w":1400,"h":546}],"models":[["The three pie charts show how many journal articles are read each week by all students, PhD students and junior lecturers at an Australian university, divided into three categories: 1 to 5, 6 to 11, and 12 or more.","Overall, each group is dominated by a different reading category. Most students in general read only 1 to 5 articles a week, whereas the large majority of PhD students read 12 or more, and most junior lecturers read between 6 and 11.","Among all students, two thirds (67%) read between 1 and 5 articles per week, while 21% read 6 to 11 and only 12% read 12 or more. PhD students show almost the reverse pattern. As many as 80% of them read at least 12 articles a week, and just 5% read 1 to 5, the smallest proportion in this group. The remaining 15% of PhD students fall into the middle category.","Junior lecturers differ from both groups of students. Three quarters of them read 6 to 11 articles each week, more than three times the proportion of all students in this category. A further 24% read 12 or more, which is twice the figure for all students but less than a third of that for PhD students. Hardly any junior lecturers read fewer than 6 articles, with only 1% falling into the lowest category, the smallest figure in any of the three charts."]]},{"id":"W1-PC-15","task":1,"type":"Pie chart","prompt":["The pie charts show the average consumption of food in the world in 2008 compared to two countries; China and India.","Summarise the information by selecting and reporting the main features and make comparisons wherever relevant."],"imgs":[{"src":"wimg/W1-PC-15-1.jpg","w":1024,"h":768}],"models":[["The three pie charts compare the average consumption of four types of food in the world as a whole, China and India in 2008.","Overall, processed food made up the largest share of the diet in all three cases, while nuts and seeds formed the smallest. However, China and India differed noticeably from the world average in their consumption of animal food and nuts and seeds.","Worldwide, processed food accounted for 41% of average food consumption, followed by vegetables and fruits at 29% and animal food at 26%. Nuts and seeds made up only 4%. India’s pattern was closest to this global average. Processed food represented 39% of the Indian diet, and animal food 27%, almost the same as the world figures. However, Indians ate a smaller proportion of vegetables and fruits, at 23%, and nearly three times the world share of nuts and seeds, at 11%.","China’s diet differed more clearly from the global pattern. Processed food accounted for a smaller share than in the other two charts, at 34%, while vegetables and fruits made up 32%, slightly above the world average. The most striking differences concerned the two remaining categories. Animal food formed just 15% of the Chinese diet, little more than half of the world and Indian figures, whereas nuts and seeds accounted for 19%, almost five times the global average and the highest share of this food type in any of the three charts."]]},{"id":"W1-PC-16","task":1,"type":"Pie chart","prompt":["The pie charts below show how an average household in one country divided its spending in 1990, 2005 and 2020.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-PC-16-1.jpg","w":1400,"h":485}],"models":[["The three pie charts show how an average household in one country divided its spending across five categories in 1990, 2005 and 2020.","Overall, housing replaced food as the largest area of household expenditure over the period. It is also clear that the share devoted to leisure rose steadily, whereas food and other spending both took a shrinking proportion of the budget.","Food and housing moved in opposite directions throughout. In 1990, food was the single largest category, accounting for just over a third of all spending, while housing took 22 percent. Food’s share then fell at both intervals, dropping to 24 percent in 2005 and to just 16 percent by 2020, less than half its original level. Housing followed the reverse path, rising to 30 percent to take the lead in 2005 and reaching 41 percent by the end of the period, by which point it absorbed more than twice as much of the budget as food.","The three remaining categories were smaller but showed distinct patterns. Leisure grew consistently, more than doubling from 9 to 20 percent, and had become the second largest category by 2020 despite being the smallest in 1990. The share spent on other items halved over the same period, from a fifth of the total to a tenth. Transport was the only category to change direction, climbing to 18 percent in 2005 before falling back to 13 percent, marginally below its 1990 figure."]]},{"id":"W1-PC-17","task":1,"type":"Pie chart","prompt":["The pie charts below compare the proportion of energy capacity in gigawatts (GW) in 2015 with the predictions for 2040.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-PC-17-1.jpg","w":1400,"h":926}],"models":[["The two pie charts compare the proportions of energy capacity provided by five sources in 2015 with projections for 2040, while also showing that total capacity is expected to rise from 6.688 GW to 11.678 GW.","Overall, fossil fuels accounted for the majority of energy capacity in 2015 and are expected to remain the largest source in 2040, although their share is set to fall considerably. Solar and wind power, by contrast, are predicted to grow substantially, while the shares of nuclear power and other renewables are expected to change very little.","In 2015, almost two thirds of energy capacity (64%) came from fossil fuels. Other renewables made up the second largest share, at 23%, whereas nuclear power, wind power and solar power each accounted for only a small fraction of the total, at 6%, 5% and 2% respectively.","By 2040, the share of fossil fuels is projected to drop by twenty percentage points to 44%. However, because total capacity is expected to increase by about three quarters, this still represents a rise in actual fossil fuel capacity. The most dramatic change is predicted for solar power, whose share is set to rise ninefold to 18%, making it the third largest source. Wind power is also expected to more than double its share, to 12%. Meanwhile, other renewables are predicted to fall slightly to 21%, and nuclear power to 5%, the smallest share in 2040."],["The pie charts illustrate how energy capacity, measured in gigawatts, was divided among different sources in 2015, together with predictions for 2040.","Overall, total capacity is expected to increase significantly, from 6.688 GW to 11.678 GW, and the energy mix is predicted to become much more balanced. Although fossil fuels will probably still provide the largest share, solar and wind power are projected to account for a far greater proportion of capacity than in 2015.","In 2015, fossil fuels clearly dominated, with 64% of total capacity, almost three times the figure for other renewables, at 23%. The remaining three sources made up just 13% between them, with nuclear power contributing 6%, wind power 5% and solar power only 2%, the smallest share of all.","The picture is expected to be quite different in 2040. Fossil fuels are predicted to fall to 44% of total capacity, which means that, for the first time, they will no longer represent the majority. The decline is likely to be offset mainly by solar and wind power. Solar power is forecast to grow from 2% to 18%, overtaking both nuclear and wind power, and wind power is expected to rise from 5% to 12%. Other renewables are predicted to remain the second largest source, although their share will probably slip to 21%. Nuclear power is set to change least, falling by one percentage point to 5%."]]},{"id":"W1-PC-18","task":1,"type":"Pie chart","prompt":["The charts below give information on the ages of the populations of Yemen and Italy in 2000 and projections for 2050.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-PC-18-1.jpg","w":600,"h":627}],"models":[["The pie charts compare the proportions of the populations of Yemen and Italy in three age groups in 2000, with projections for 2050.","Overall, Yemen had a much younger population than Italy in 2000, and this is expected to remain the case in 2050. However, the populations of both countries are predicted to age over the period, with the share of people aged 60 and over rising in both, particularly in Italy.","In 2000, children aged 0 to 14 made up just over half of Yemen’s population (50.1%), and people aged 15 to 59 accounted for most of the remainder, at 46.3%. Only 3.6% of Yemenis were aged 60 or over. By 2050, the proportion of children is projected to fall to 37%, whereas the share of people aged 15 to 59 is expected to rise to 57.3%, making this the largest group. The proportion of older people is predicted to increase only slightly, to 5.7%.","Italy’s population had a very different structure. In 2000, people aged 15 to 59 formed the majority, at 61.6%, while almost a quarter of the population (24.1%) was aged 60 or over and only 14.3% was under 15. By 2050, the share of older people is expected to rise dramatically to 42.3%, almost the same as that of the 15 to 59 age group, which is predicted to fall to 46.2%. The proportion of children is also expected to decline, to 11.5%."],["The four pie charts illustrate the age structure of the populations of Yemen and Italy in 2000 and the projected structure in 2050, divided into three groups: 0 to 14 years, 15 to 59 years and 60 years and over.","Overall, the proportion of people aged 15 to 59 is expected to change in opposite directions in the two countries, rising in Yemen but falling in Italy. It is also clear that Italy’s population is far older than Yemen’s, and the gap between them in the share of elderly people is predicted to widen considerably.","The youngest age group was much larger in Yemen than in Italy in 2000, accounting for 50.1% of the population compared with only 14.3%. In both countries, this share is expected to decline by 2050, although the fall is projected to be much sharper in Yemen, to 37%, than in Italy, to 11.5%. The working-age group of 15 to 59 accounted for 46.3% of Yemen’s population and 61.6% of Italy’s in 2000. By 2050, however, the Yemeni figure is predicted to rise to 57.3%, while the Italian figure is set to drop to 46.2%.","The most striking difference concerns the oldest age group. Just 3.6% of Yemenis were aged 60 or over in 2000, and this proportion is expected to reach only 5.7% in 2050. In Italy, by contrast, people aged 60 and over already made up 24.1% of the population in 2000, and their share is forecast to increase to 42.3%, more than seven times the Yemeni figure."]]},{"id":"W1-PC-19","task":1,"type":"Pie chart","prompt":["The pie charts below show the percentage of water used for different purposes in six areas of the world.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-PC-19-1.jpg","w":1066,"h":838}],"models":[["The six pie charts compare the proportions of water used for industrial, agricultural and domestic purposes in six regions of the world.","Overall, agriculture accounted for the vast majority of water use in South America, Africa and the two Asian regions, whereas industry was the largest user in North America and Europe. Domestic use made up a relatively small share everywhere, never exceeding a fifth of the total.","In four regions, agriculture used more than 70% of all water. The figure was highest in Central Asia, at 88%, followed by Africa at 84%, South East Asia at 81% and South America at 71%. In these regions, industry and domestic use each accounted for a small share. Industrial use ranged from just 5% in Central Asia to 12% in South East Asia, while domestic use varied between 7% and 19%, the latter figure in South America. In fact, domestic consumption exceeded industrial consumption in three of these four regions, the exception being South East Asia.","North America and Europe followed a very different pattern. Industry was the main user of water in both regions, accounting for 48% in North America and slightly over half (53%) in Europe. Agriculture was the second largest user, at 39% and 32% respectively, the two lowest figures for this purpose among the six regions. Domestic use, meanwhile, made up 13% of water consumption in North America and 15% in Europe."],["The pie charts show what percentage of water was used for industry, agriculture and domestic purposes in North America, South America, Europe, Africa, Central Asia and South East Asia.","Overall, the six regions can be divided into two groups. In North America and Europe, industry was the largest consumer of water, while in the other four regions, agriculture used by far the greatest share.","Agricultural water use varied enormously from region to region. It accounted for 88% of total consumption in Central Asia, the highest figure in any chart, and over 80% in Africa and South East Asia, at 84% and 81%. South America’s figure was slightly lower, at 71%. In Europe, by contrast, agriculture used only 32% of water, and in North America 39%.","Industry showed almost the opposite pattern. It was responsible for 53% of water use in Europe and 48% in North America, but for no more than 12% in any of the other regions, falling to only 5% in Central Asia. Domestic use was the smallest category in North America, Europe and South East Asia, at 13%, 15% and 7% respectively. However, it accounted for more water than industry in the remaining three regions, especially in South America, where 19% of water was used domestically, almost twice the industrial figure of 10%, and the highest domestic share in the six charts."]]},{"id":"W1-PC-20","task":1,"type":"Pie chart","prompt":["The pie charts below show electricity generation by source in New Zealand and Germany in 1980 and 2010.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-PC-20-1.jpg","w":1112,"h":1400}],"models":[["The pie charts show how many units of electricity were generated from five sources in New Zealand and Germany in 1980 and 2010.","Overall, electricity production rose substantially in both countries, and each became heavily dependent on a single source by 2010, coal in New Zealand and nuclear power in Germany. It is also clear that natural gas declined to a very small share in both countries, while New Zealand did not use nuclear power at all.","In 1980, New Zealand generated 127 units of electricity. Coal was the main source, providing 56 units, followed by hydropower and natural gas with 30 units each, and petroleum with 11. By 2010, total production had increased to 200 units, and coal’s output had almost trebled to 150 units, three quarters of the total. Hydropower also grew, to 46 units, but natural gas and petroleum fell to only 2 units each.","Germany produced slightly less electricity than New Zealand in 1980, at 107 units, and its supply was much more evenly spread. Coal and natural gas each generated 28 units, petroleum 22 and nuclear power 20, while hydropower contributed only 7. In 2010, Germany’s total had doubled to 214 units, largely because nuclear output increased almost eightfold to 155 units, more than 70% of the total. Coal and petroleum remained at similar levels, at 28 and 27 units respectively, whereas natural gas and hydropower dropped to just 2 units each."],["The four pie charts compare the amount of electricity, in units, that New Zealand and Germany produced from coal, petroleum, natural gas, nuclear power and hydropower in 1980 and 2010.","Overall, both countries generated considerably more electricity in 2010 than in 1980, with Germany’s total doubling. Over the same period, the two countries moved towards very different main sources, as New Zealand came to rely heavily on coal and Germany on nuclear power.","In 1980, the two countries had fairly similar levels of production, at 127 units in New Zealand and 107 in Germany. Coal was the largest single source in both, but it was far more important in New Zealand, where it generated 56 units, twice the German figure of 28. New Zealand also produced more electricity from natural gas and hydropower, at 30 units each, whereas Germany relied more on petroleum, at 22 units, and was the only country to use nuclear power, which supplied 20 units.","By 2010, the contrast between the two countries had become much sharper. In New Zealand, coal generated 150 units out of a total of 200, and the only other significant source was hydropower, at 46 units. In Germany, nuclear power produced 155 of the 214 units generated, with most of the rest coming from coal and petroleum, at 28 and 27 units respectively. Natural gas, meanwhile, had become almost insignificant in both countries, supplying just 2 units each."]]},{"id":"W1-PC-21","task":1,"type":"Pie chart","prompt":["The pie charts below show responses by teachers of foreign languages in Britain to a survey concerning why their students are learning a foreign language.","The first chart shows the main reason for learning a foreign language. The second chart shows how many teachers felt that there has been a recent change in the reason.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-PC-21-1.jpg","w":825,"h":1024}],"models":[["The pie charts present the results of a survey of foreign language teachers in Britain. The first shows the main reasons their students learn a language, and the second shows which reasons teachers believe have recently become more common.","Overall, travel is the most common reason for learning a language, yet very few teachers see it as growing. Buying property overseas is only the third most popular reason, but it is by far the most frequently reported as rising.","Practical goals dominate the first chart. A third of teachers name travel as their students’ main reason, ahead of business or work at 26% and buying property abroad at 19%. Together, these three make up over three quarters of all responses. The other reasons are all small: social contact and personal development stand at 7% each, general interest at 5%, and having a foreign partner at just 3%.","The second chart shows a very different ranking. Buying property overseas is named by 34% of teachers, almost twice the figure for business or work (19%), which keeps its second place. Social contact also stands out. Its share of 15% is more than double its share in the first chart, and it equals the proportion of teachers who report no change at all. Travel, by contrast, falls to last place at only 3%, while the remaining reasons stay in single figures."]]},{"id":"W1-TB-01","task":1,"type":"Table","prompt":["The table shows the change in the number of cinemas in different regions in a European country between 2004 and 2009.","Summarize the information by selecting and reporting the main features and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-01-1.jpg","w":1024,"h":495}],"models":[["The table compares the number of cinemas in four types of area in a European country in 2004 and 2009, together with the percentage change in each.","Overall, the total number of cinemas rose over the period, with all of the growth taking place in and around the city centre, whereas the suburbs and the countryside lost cinemas. It is also clear that the city centre dominated throughout, accounting for roughly three quarters of the national total in both years.","The two central areas expanded. The city centre had by far the most cinemas, at 1,512 in 2004, rising to 1,620 by 2009. Although this was a modest increase of just 7.1%, the 108 cinemas added represented the largest absolute gain of any area, matching the entire countryside total in 2004. The area near the city centre grew much faster, by a third from 300 to 400, the highest growth rate in the table.","The outlying areas, by contrast, moved in the opposite direction. The suburbs had the fewest cinemas in both years, and their number fell from 40 to 30, a loss of a quarter and the sharpest decline recorded. Countryside cinemas also decreased, from 108 to 90, a drop of 16.7%. Nevertheless, the gains elsewhere more than offset these losses, lifting the overall figure by 9.2%, from 1,960 to 2,140."]]},{"id":"W1-TB-02","task":1,"type":"Table","prompt":["The table below shows information about spending on health in five different countries in 2002, as a percentage of each country’s total expenditure in that year.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-02-1.jpg","w":1024,"h":511}],"models":[["The table compares the proportion of total national expenditure dedicated to health in five countries, namely Japan, Italy, Germany, France, and the USA, in the year 2002, further broken down into public and private spending.","Overall, public health spending constituted a significantly larger percentage of total expenditure than private spending in all five countries. It is also noticeable that France recorded the highest proportions across all three categories, whereas Japan accounted for the lowest total share.","Looking at the largest spenders, France allocated the highest proportion of its national budget to health at 11.4%. This total was driven by a public spending share of 8.6% and a private spending share of 2.8%, both of which were the highest figures in their respective columns. Germany ranked second with a total of 9.3%, consisting of 7% in public spending and 2.3% in private spending.","Turning to the three remaining nations, the USA recorded a total health expenditure of 8.6%, comprising 6% from the public sector and 2.6% from the private sector. Italy and Japan allocated the smallest overall shares to health, at 7.7% and 7.2%, respectively. Although Japan’s total was the lowest in the table, its public spending proportion of 5.8% was marginally higher than Italy’s 5.3%. However, Japan’s private spending stood at just 1.4%, the lowest figure recorded and exactly half the proportion seen in France."]]},{"id":"W1-TB-03","task":1,"type":"Table","prompt":["The table details the international tourist arrivals in millions in 9 countries in 2009 and 2010 and the changes (in percentages).","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-03-1.jpg","w":1400,"h":756}],"models":[["The table shows international tourist arrivals, measured in millions, for nine countries in 2009 and 2010, along with the percentage change between the two years.","Overall, most of the listed countries experienced growth in tourist numbers over the period, with the most striking increases occurring in Germany, China and Turkey. France, the USA, Spain and the UK remained the most visited destinations throughout, although their growth rates were comparatively modest, while Hong Kong was the only country to see a decline.","France was the most popular destination, with exactly 76 million visitors in both years. The USA, Spain, the UK and Italy followed a similar pattern of stability, with arrivals rising by just 1 or 2 million each, from 66 to 67 million, 55 to 56 million, 55 to 57 million and 44 to 45 million respectively, increases of under 4% in every case.","By contrast, several countries recorded much sharper rises. Germany saw the most dramatic growth of all nine countries, with arrivals more than doubling from 10 million to 24 million, a change of 140%. China also performed strongly, with visitor numbers climbing from 22 million to 34 million, an increase of 54.5%, while Turkey’s arrivals rose from 32 million to 46 million, up by 43.8%. Hong Kong stood out as the sole exception to this upward trend, with arrivals falling slightly from 10 million to 9 million, a decrease of 10%."],["The table compares the number of international tourist arrivals, in millions, in nine countries in 2009 and 2010, together with the percentage change for each.","In general, tourist arrivals increased in eight of the nine countries, with Hong Kong the only one to record a fall. It is also clear that the countries with the most visitors grew very little, whereas some smaller destinations expanded rapidly enough to change the rankings.","The five largest destinations in 2009 recorded minimal growth. France remained the most visited country, with exactly 76 million arrivals in both years, while the USA, Spain, the UK and Italy gained only 1 or 2 million visitors each, increases of between 1.5% and 3.6%.","The remaining countries showed much greater change. Turkey and Germany recorded the largest absolute gains in the table, each attracting 14 million more visitors. For Turkey, this represented a rise of 43.8% to 46 million, enough to overtake Italy and become the fifth most visited country. For Germany, which started from just 10 million, the same increase meant a rise of 140%, by far the highest growth rate in the table. China also grew strongly, from 22 million to 34 million, or 54.5%. Hong Kong, by contrast, started level with Germany at 10 million but lost a tenth of its visitors, ending the period as the least visited destination at 9 million."]]},{"id":"W1-TB-04","task":1,"type":"Table","prompt":["The graph below shows the percentage of people unemployed in the total labour work force across 9 countries in 1994 and 2004.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-04-1.jpg","w":1024,"h":793}],"models":[["The table compares the percentage of unemployed people in the workforce across nine countries in two years, 1994 and 2004.","Overall, the unemployment rate fell in five of the nine countries, while the remaining four experienced an increase. It is also noticeable that Ireland recorded the most dramatic decline, losing its position as the country with the highest joblessness to Poland.","Looking at the countries where unemployment dropped, Ireland saw by far the most significant improvement. Its rate plummeted from a table-leading 14.8% in 1994 to just 4.4% in 2004, a fall of over ten percentage points, leaving it with the lowest figure of any country by the end of the period. The United Kingdom also managed to halve its unemployment, dropping from 9.5% to 4.7%. Italy, Canada and the United States followed a similar downward path but with more moderate declines, from 11.8%, 10.6% and 7.2% to 8.4%, 7.7% and 5.4% respectively.","By contrast, the proportion of jobless adults rose in the remaining four nations, with Poland experiencing the sharpest increase. Having started at 12.4%, the Polish unemployment rate surged by 6.6 percentage points to reach 19% by 2004, making it the highest in the table by a wide margin. Germany and Japan also saw their rates rise, climbing from 7% and 2.7% to 9.4% and 4.7% respectively. Australia’s figure edged up only marginally, from 5% to 5.4%."]]},{"id":"W1-TB-05","task":1,"type":"Table","prompt":["The table illustrates the percentage of age of visitors from the UK to Spain in 1981 and in 2015.","Summarise the information by selecting and reporting the main features and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-05-1.jpg","w":1024,"h":572}],"models":[["The table compares the age profile of British tourists visiting Spain in 1981 and 2015, showing the proportion of visitors who belonged to each of five age groups.","Overall, people aged 25 to 35 made up the largest share of UK visitors in both years, although their dominance weakened considerably. It is also clear that young adults and the over-55s grew markedly in importance, whereas the 36 to 45 group moved in the opposite direction.","The two middle-aged groups both lost ground over the period. In 1981, half of all visitors were aged 25 to 35, more than twice the 22% recorded for those aged 36 to 45. By 2015, the former had fallen to 32%, still the highest figure in the table, while the latter had almost halved to 12%, ending level with the youngest group.","The remaining three categories, by contrast, all expanded. The most dramatic change was among 16 to 24-year-olds, whose share almost quadrupled from just 4%, the smallest figure in 1981, to 15%. Visitors aged over 55 also rose substantially, from 16% to a quarter of the total, overtaking the 36 to 45 group to become the second largest category. Children aged 15 and under, meanwhile, saw only a marginal increase, from 10% to 12%."]]},{"id":"W1-TB-06","task":1,"type":"Table","prompt":["The table below shows the number of full-time students from India who studied at various universities in the UK in 2020/21 and 2021/22.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-06-1.jpg","w":1400,"h":626}],"models":[["The table compares the number of full-time Indian students enrolled at six UK universities across two academic years, 2020/21 and 2021/22, along with the size of the change at each institution.","Overall, every university in the table attracted more students from India in the second year, with the combined total nearly doubling. It is also noticeable that the institutions with the largest intakes were not those recording the fastest growth, and that Coventry displaced BPP as the leading destination.","Looking at the largest institutions, BPP University hosted the most Indian students in 2020/21, at 3,505, ahead of Greenwich and Coventry, which stood at around 2,400 each. By 2021/22, however, Coventry had risen to 5,290 to take the lead, having gained 2,900 students, the biggest absolute increase of any university. BPP followed closely at 5,145, while Greenwich reached 4,540.","The three remaining universities operated on a smaller scale but expanded sharply. Sheffield began with just 815 students, the lowest figure in the table, yet almost tripled this to 2,345, an increase of 187.7 percent. Leicester more than doubled its intake to 2,390, matching Coventry’s original figure, while Anglia Ruskin grew more modestly, by 69.6 percent, from 1,925 to 3,265."]]},{"id":"W1-TB-07","task":1,"type":"Table","prompt":["The table below gives information about languages with the most native speakers.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-07-1.jpg","w":1285,"h":382}],"models":[["The table shows the number of native speakers and additional-language speakers of six of the world’s most widely spoken languages, along with the total number of speakers of each.","Overall, Mandarin Chinese has by far the most speakers in total, while English is the only language with more additional-language speakers than native speakers. It is also clear that Arabic and Portuguese have the fewest speakers, as both are spoken almost exclusively as first languages.","Mandarin Chinese and English stand out in terms of total speakers. Mandarin is spoken by 1,090 million people, of whom 900 million are native speakers, more than twice the figure for any other language, while 190 million speak it as an additional language. English ranks second with 942 million speakers in total, but only 339 million of these are native speakers, whereas 603 million have learned it as an additional language, the highest figure in that column.","The four remaining languages have much smaller and predominantly native speaker bases. Hindi and Spanish have similar numbers of native speakers, at 370 million and 350 million respectively, although Hindi has more additional-language speakers, 120 million compared with 70 million, giving it a total of 490 million against 420 million for Spanish. Arabic and Portuguese each have just over 200 million native speakers but very few additional-language speakers, at 24 million and only 10 million, resulting in totals of 230 million and 213 million."]]},{"id":"W1-TB-08","task":1,"type":"Table","prompt":["The tables below give information about sales of Fairtrade-labelled coffee and bananas in 1999 and 2004 in five European countries.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-08-1.jpg","w":985,"h":647}],"models":[["The tables compare sales of Fairtrade-labelled coffee and bananas in five European countries in 1999 and 2004, measured in millions of euros.","Overall, sales of Fairtrade coffee increased in every country over the period, whereas banana sales rose in only three of the five. It is also noticeable that the UK saw by far the most dramatic growth in coffee, while Switzerland remained the dominant market for bananas.","Regarding coffee sales, the UK began with just 1.5 million euros in 1999, less than Switzerland and Denmark, but its sales had multiplied more than thirteen times to reach 20 million by 2004, the highest figure in the table. Switzerland, the leader in 1999 at 3 million euros, saw its sales double to 6 million, ending in second place. The three remaining countries recorded much smaller changes, with Denmark, Belgium and Sweden all finishing at around 1 to 2 million euros.","As for bananas, Switzerland was the largest market throughout, with sales tripling from 15 to 47 million euros. The UK and Belgium also grew substantially, to 5.5 and 4 million euros respectively. In contrast, Sweden and Denmark were the only countries to record a decline in either product, falling from 1.8 to 1 million and from 2 to 0.9 million euros."],["The two tables illustrate how much Fairtrade-labelled coffee and bananas were sold in five countries in Europe in 1999 and 2004, with all figures given in millions of euros.","Overall, the market expanded considerably over the five-year period, driven mainly by the UK in coffee and Switzerland in bananas. However, this growth was not universal, as Sweden and Denmark saw their banana sales contract.","The two dominant markets grew fastest. In 1999, UK coffee sales stood at only 1.5 million euros, half the corresponding Swiss figure, yet by 2004 they had surged to 20 million, making the UK the largest single coffee market. Swiss banana sales followed a similar pattern on a larger scale, climbing from 15 to 47 million euros, more than double the highest coffee figure recorded anywhere.","The remaining figures were considerably more modest. Belgium and Sweden saw their coffee sales edge up to 1.7 and 1 million euros respectively, while Denmark’s rose only marginally to 2 million. In the banana market, Belgium grew almost sevenfold to 4 million euros, but Sweden and Denmark moved in the opposite direction, each dropping to around 1 million euros by the end of the period."]]},{"id":"W1-TB-09","task":1,"type":"Table","prompt":["The table gives information about five types of vehicles registered in Australia in 2010, 2012, and 2014.","Summarise the information by selecting and reporting the main features, and make any comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-09-1.jpg","w":1400,"h":416}],"models":[["The table shows the number of five types of vehicles registered in Australia in 2010, 2012 and 2014, together with the percentage change in each category over the period.","Overall, registrations of every type of vehicle increased, with motorcycles and light trucks recording the fastest growth. It is also clear that passenger vehicles were by far the most numerous in all three years, whereas light trucks were the least common.","The two largest categories grew steadily but at a moderate rate. Passenger vehicles numbered 11.8 million in 2010, rising to 12.7 million in 2012 and 13 million by 2014, an increase of 10.2%. Commercial vehicles followed a similar path on a much smaller scale, climbing from 2.3 million to 2.7 million, or 17.4%, and consistently amounting to roughly a fifth of the passenger vehicle figure.","The three smaller categories showed more varied rates of growth. Motorcycles expanded the most in relative terms, from 540,000 to 709,000, a rise of 31.3%, with most of this growth occurring in the first two years. Light trucks also grew substantially, by 23.6%, yet remained the smallest category, reaching only 131,000 in 2014. Heavy trucks, by contrast, recorded the slowest growth of all, edging up from 384,000 to 390,000 in 2012 before rising more noticeably to 416,000, an overall increase of just 8.3%."]]},{"id":"W1-TB-10","task":1,"type":"Table","prompt":["The table below shows the amount of electricity used each day of the week in a typical hospital in a number of countries (in megawatts/mw).","Summarise the information by selecting and reporting the main features, and make any comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-10-1.jpg","w":1292,"h":363}],"models":[["The table compares the amount of electricity, measured in megawatts (mw), used on each day of the week by a typical hospital in five countries.","Overall, consumption in French and Japanese hospitals remained broadly stable throughout the week, whereas figures in Canada and Russia rose markedly towards the weekend and the opposite was true for Argentina. It is also clear that hospitals in France and Canada consumed the most electricity, while those in Argentina consistently used the least.","France and Japan showed the most consistent patterns. French hospitals used between 31 and 33 mw every day, the highest figures in the table from Monday to Thursday, while Japanese consumption hovered in an even narrower band of 17 to 19 mw, roughly half the French level.","The remaining three countries followed clear weekly trends. Canadian hospitals held steady at 26 to 27 mw from Monday to Thursday, before jumping to 36 mw on Friday and 38 mw over the weekend, overtaking France as the largest consumer. Russia followed a similar upward path, with its figure doubling from 12 mw on Monday to 24 mw on Sunday. Argentina, by contrast, moved in the opposite direction, its consumption falling from 9 to 10 mw early in the week to just 5 mw by Sunday, barely an eighth of the Canadian figure that day."],["The table illustrates how much electricity a typical hospital in each of five countries consumed on every day of a single week, with all figures given in megawatts (mw).","Overall, the ranking of the five countries stayed largely the same throughout the week, except at the top, where France led from Monday to Thursday before Canada took over. It is also noticeable that the gap between the largest and smallest consumers widened considerably towards the weekend.","From Monday to Thursday, consumption was relatively steady in every country. French hospitals used the most electricity, at 31 to 33 mw a day, ahead of those in Canada at 26 to 27 mw. Japan followed at 17 to 19 mw, while Russia and Argentina recorded much lower figures, at 12 to 16 mw and 9 to 10 mw respectively.","From Friday onwards, however, the picture changed noticeably. Canadian consumption jumped to 36 mw on Friday and reached 38 mw on both Saturday and Sunday, overtaking France, whose figures barely changed, as did those for Japan. Russian hospitals also used steadily more electricity, ending the week at 24 mw, double their Monday level. Argentina was the only country to cut its consumption, which fell to just 5 mw on Sunday. As a result, the difference between the highest and lowest consumers grew from 23 mw on Monday to 33 mw by the end of the week."]]},{"id":"W1-TB-11","task":1,"type":"Table","prompt":["The table shows the proportion of income adults and children spent on four common items in the UK in 1998.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-11-1.jpg","w":1328,"h":511}],"models":[["The table shows the percentage of their income that adults and children in the UK spent on four items in 1998, with separate figures for men and women and for boys and girls.","Overall, adults spent the largest share of their income on food, whereas children devoted most of theirs to music and electronic equipment. It is also clear that the differences between the sexes were widest among adults, particularly for food and electronic equipment.","Among adults, food was by far the largest expense, taking a quarter of their income, although women spent almost three times as large a share on it as men, at 39% compared with 14%. Electronic equipment showed the reverse pattern, accounting for 10% of men’s spending but just 1% of women’s. Music took an identical 5% for both sexes, while videos took just 1% overall.","Children’s spending priorities were very different. Music was their largest expense, at 39% of their income, with girls spending slightly more than boys, 40% compared with 38%. Electronic equipment came second at 23% overall, but boys spent more than three times as large a share on it as girls (18% versus 5%). Videos took 12% of children’s income overall, with boys and girls recording similar figures of 18% and 17%, while food accounted for only around a tenth of their spending, 15 percentage points less than for adults."]]},{"id":"W1-TB-12","task":1,"type":"Table","prompt":["The table below shows the number of upper secondary school leavers enrolling in different colleges of a comprehensive university.","Summarise the information by selecting and reporting the main features, and make any comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-12-1.jpg","w":1400,"h":397}],"models":[["The table shows how many upper secondary school leavers enrolled in five colleges of a comprehensive university in each academic year from 2014-15 to 2017-18.","Overall, Information Technology attracted the most new students throughout the period, while Finance and Banking recorded by far the fastest growth. It is also clear that Medicine was the only college whose enrolment fell in every year, whereas Education remained almost unchanged.","The technology and finance colleges grew consistently. Information Technology enrolled 2,631 students in 2014-15, and this figure rose slightly every year to reach 2,810 in 2017-18. Finance and Banking began with only 1,120 students, the lowest figure in the table and less than half the IT intake, but its enrolment increased sharply each year to 2,640 by 2017-18, more than doubling and almost matching the starting figure for IT.","The remaining three colleges showed contrasting patterns. Education was the most stable, with enrolment hovering between 2,376 and 2,392 throughout. Medicine, by contrast, declined steadily from 2,566 to 2,202, falling from second place to last. Law was the most erratic, jumping from 1,560 to 2,040 in 2015-16 before slumping to 1,483 the following year, the lowest figure of any college that year, and then recovering strongly to 2,218 in the final year."],["The table compares the number of secondary school graduates who enrolled in five different colleges of a comprehensive university over four academic years, from 2014-15 to 2017-18.","Overall, total enrolment across the five colleges rose over the period, with Information Technology and Finance and Banking growing in every year. In contrast, Medicine declined continuously, falling from the second most popular college to the least popular by the end of the period.","At the start of the period, three colleges had similar intakes of around 2,400 to 2,600 students. Information Technology led with 2,631, followed closely by Medicine at 2,566 and Education at 2,392, while Law and Finance and Banking attracted far fewer students, at 1,560 and 1,120 respectively. Altogether, the five colleges enrolled 10,269 new students in 2014-15.","By 2017-18, the order had changed considerably. Information Technology remained in first place after modest yearly increases, reaching 2,810, but Finance and Banking had more than doubled its intake to 2,640, moving from last place to second. Education stayed almost constant at 2,389, while Law, despite a sharp dip to 1,483 in 2016-17, ended at 2,218. Medicine, which lost more than a hundred students every year, finished with 2,202, the lowest figure of the five. As a result, total enrolment reached 12,259, almost a fifth higher than four years earlier."]]},{"id":"W1-TB-13","task":1,"type":"Table","prompt":["The table below gives information about the production of cocoa beans (in tons) in six regions between 1992 and 1998.","Summarise the information by selecting and reporting the main features and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-13-1.jpg","w":1400,"h":496}],"models":[["The table shows the amount of cocoa beans, in tons, produced in six regions at two-year intervals between 1992 and 1998.","Overall, Asia and South America were the largest producers, and both recorded dramatic increases in the final two years, with Asia overtaking South America to become the leading region. The four smaller producers, by contrast, showed mixed patterns, with Africa experiencing the most dramatic rise and fall.","South America was initially the leading producer, with output stable at around 140,000 tons in 1992 and 1994 before dipping slightly to 127,000 tons in 1996. Asia started just below this, at 119,000 tons, but its production rose at every interval, almost doubling to 234,000 tons in 1996 and reaching 436,000 tons by 1998, more than three and a half times its original level. South American output also surged in the last two years, more than tripling to 389,000 tons, though still below Asia.","The remaining regions produced far less. Oceania was the only one to grow steadily, from 40,000 to 77,000 tons. Africa’s output was the most volatile, climbing from 29,000 tons to a peak of 119,000 tons in 1996, then plummeting to just 25,000 tons in 1998, the lowest figure of any region that year. North and Central America and England both fluctuated, the former ending at its starting level of 46,000 tons and the latter slightly below its initial 56,000, at 49,000 tons."],["The table compares the production of cocoa beans, in tons, in six regions in 1992, 1994, 1996 and 1998.","Overall, total cocoa production more than doubled over the period, with most of the growth coming from Asia and South America in the final two years. In contrast, Africa and England were the only regions to finish the period producing less than in 1992.","Between 1992 and 1996, changes were relatively gradual in most regions. South America was the largest producer in 1992, at 143,000 tons, but its output slipped slightly to 127,000 tons by 1996, by which time Asia, whose production had nearly doubled from 119,000 to 234,000 tons, had taken the lead. Africa’s output rose most sharply in relative terms, more than quadrupling from 29,000 to 119,000 tons, while Oceania grew steadily to 65,000 tons. North and Central America and England both fluctuated, ending this period at 39,000 and 43,000 tons respectively.","The final two years brought much more dramatic changes. Asian production almost doubled again to 436,000 tons, while South America’s output more than tripled to 389,000 tons, so that these two regions together produced roughly four fifths of all cocoa in 1998. Oceania continued its steady rise to 77,000 tons, and North and Central America recovered to its 1992 level of 46,000 tons. Africa, however, saw its production collapse to just 25,000 tons, while England edged up only slightly to 49,000 tons."]]},{"id":"W1-TB-14","task":1,"type":"Table","prompt":["The table below shows the results of a survey to find out what members of a city sports club think about the club’s activities, facilities and opening hours.","Summarise the information by selecting and reporting the main features, and make any comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-14-1.jpg","w":962,"h":404}],"models":[["The table shows the results of a survey of male and female members of a city sports club, giving the percentage who were very satisfied, satisfied or not satisfied with the club’s range of activities, its facilities and its opening hours.","Overall, the majority of members of both sexes were positive about all three aspects of the club. However, men were considerably happier than women with the range of activities, whereas the reverse was true for opening hours, and the two groups held very similar views of the facilities.","The clearest gender differences concerned activities and opening hours. As many as 95% of male members were either very satisfied or satisfied with the range of activities, with 55% very satisfied, compared with 70% of women, 30% of whom were not satisfied. Opening hours showed the opposite pattern. Almost three quarters of women (72%) were very satisfied and only 3% were dissatisfied, whereas just 44% of men were very satisfied and 37% were unhappy, the highest level of dissatisfaction in the table.","Opinions about the club facilities, by contrast, were broadly similar across the sexes. Around two thirds of both groups were very satisfied, at 64% of women and 63% of men, while a further 22% and 27% respectively were satisfied. Only a small minority expressed dissatisfaction, namely 14% of female members and 10% of male members."],["The table presents the findings of a survey in which male and female members of a city sports club rated their satisfaction with the club’s activities, facilities and opening hours.","Overall, satisfaction was high among both men and women, with most respondents describing themselves as very satisfied in every case except women’s views of the activities. It is also noticeable that each sex had one major area of complaint, namely the range of activities for women and the opening hours for men.","Female members were most positive about the club’s opening hours and facilities. A total of 97% expressed satisfaction with the opening hours, with 72% very satisfied, and 86% were happy with the facilities. Their views on the range of activities were far more divided, however. Equal proportions, 35%, were very satisfied and satisfied, while 30% were not satisfied, ten times the proportion dissatisfied with opening hours.","Male members, by contrast, were most enthusiastic about the activities and least positive about the opening hours. Only 5% of men were dissatisfied with the range of activities, while more than half (55%) were very satisfied. Their satisfaction with the facilities was almost identical to that of women, with 90% satisfied or very satisfied. Opening hours, however, divided male opinion sharply. Although 44% were very satisfied, more than a third (37%) were not satisfied, over twelve times the proportion of women who shared this view."]]},{"id":"W1-TB-15","task":1,"type":"Table","prompt":["The tables below give the distribution of the world population in 1950 and 2000, with an estimate of the situation in 2050.","Summarise the information by selecting and reporting the main features, and make any comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-15-1.jpg","w":1037,"h":537}],"models":[["The tables show the size of the world population in 1950 and 2000, with an estimate for 2050, together with its distribution across six regions.","Overall, the global population is projected to have more than tripled over the century, while Asia is home to the majority of people throughout. It is also noticeable that Africa’s share is expected to grow considerably, whereas the proportions living in Europe and North America are set to shrink.","The world total and Asia dominate the figures. The global population stood at 2.5 billion in 1950 and had more than doubled to 6 billion by 2000, and it is estimated to reach 9 billion by 2050. Asia accounted for more than half of this total in every year, its share rising from 56% to 60% in 2000 and expected to stay at a similar level, 59%, in 2050.","The remaining regions moved in opposite directions. Africa’s share increased from 9% to 13%, overtaking Europe by 2000, and is forecast to reach a fifth of the world’s population by 2050. Latin America also grew, from 6% to 9%, but is expected to remain at that level. Europe, by contrast, saw its share fall from 22% to 12%, and this is projected to drop to just 7%, while North America’s proportion is predicted to decline steadily from 7% to 4%. Oceania accounted for 1% or less throughout."],["The tables illustrate the total world population in 1950 and 2000, along with a projection for 2050, and the percentage of people living in six regions in each of these years.","Overall, the world population grew rapidly in the second half of the twentieth century and is expected to keep rising, though at a slower pace. In terms of distribution, Asia was and will remain by far the most populous region, while Africa replaced Europe as the second largest by 2000 and is expected to widen this lead considerably.","Between 1950 and 2000, the global population increased from 2.5 billion to 6 billion. Meanwhile, Asia’s share climbed from 56% to 60%, and Africa and Latin America also gained ground, rising to 13% and 9% respectively. Europe, meanwhile, lost almost half of its share, which fell from 22% to 12%, and North America slipped from 7% to 5%.","Some of these trends are projected to continue to 2050, while others level off. The world population is expected to grow by a further 3 billion to reach 9 billion. Africa is forecast to see the biggest change, with its share rising to 20%, almost three times Europe’s projected 7%. Asia’s share, by contrast, is likely to remain broadly stable at 59%, as is Latin America’s at 9%, while North America’s is expected to edge down to 4% and Oceania’s to stay at 1%."]]},{"id":"W1-TB-16","task":1,"type":"Table","prompt":["The table below gives information about UK independent films.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-16-1.jpg","w":1125,"h":546}],"models":[["The table provides data on 148 UK independent films, showing the number and proportion of releases in ten genres alongside each genre’s share of ticket income.","Overall, there is a striking mismatch between how often a genre is released and how much it earns, with comedy generating almost half of all ticket revenue from under a fifth of films. Conversely, drama and documentary are the most common genres, yet they bring in only a small fraction of income.","Four genres earn a disproportionately large share of revenue. Comedy’s 26 releases (17.6%) account for 45.4% of ticket sales, roughly two and a half times their share of output, while horror’s 14 films (9.5%) produce more than double that proportion, at 20.2%. The most extreme case is the biopic, whose single release, just 0.7% of the total, takes 9.1% of income, more than either drama or documentary. Action films also outperform slightly, at 4.1% against 2.7%.","The remaining genres underperform, except crime, whose two shares are identical at 4.7%. Drama and documentary each have 35 releases (23.6%), together making up almost half of all films, yet they earn only 8.3% and 2.9% of income respectively. Thrillers fare even worse relative to their size, with 8.8% of releases but just 1.3% of revenue, while romance and other genres also fall short, earning 0.8% and 3.2% from 3.4% and 5.4% of releases."]]},{"id":"W1-TB-17","task":1,"type":"Table","prompt":["The table below shows the hours of leisure time spent by people in different age groups in Someland.","Summarise the information by selecting and reporting the main features, and make any comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-17-1.jpg","w":1400,"h":428}],"models":[["The table shows how many hours people in seven age groups, from teenagers to those in their seventies, spent on six leisure activities in Someland.","Overall, watching television or videos was the most time-consuming pastime for every age group, particularly the youngest and the oldest, whereas cinema-going consistently occupied very little time. It is also clear that the time devoted to group activities, both social and sporting, generally decreased with age.","Watching TV and videos followed a U-shaped pattern across the age groups. Teenagers spent 1,200 hours on this activity, the highest figure in the table, and people in their seventies were not far behind at 1,100 hours. By contrast, those in their thirties spent only 400 hours, with the figure rising gradually in each older group.","Activities involving larger groups declined markedly with age. Teenagers and people in their twenties each spent 350 hours socialising with four or more people, yet this fell to 50 hours in the thirties and forties and just 25 hours from the fifties onwards. Group exercise fell even more sharply, from 450 hours among teenagers to nothing at all for people in their sixties and seventies. Smaller-scale activities were more evenly spread, with socialising in groups of four or fewer ranging from 150 to 300 hours, peaking in the thirties, while individual exercise varied between 50 and 200 hours. Cinema-going never exceeded 100 hours in any group."]]},{"id":"W1-TB-18","task":1,"type":"Table","prompt":["The table below gives information about the problems faced by children in two primary schools in 2005 and 2015.","Summarise the information by selecting and reporting the main features, and make any comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-18-1.jpg","w":1400,"h":771}],"models":[["The table compares the percentage of children experiencing seven types of educational problem at two primary schools, A and B, in 2005 and 2015.","Overall, School A had a far higher proportion of children with difficulties than School B in both years, although the gap narrowed considerably. It is also clear that problems at School A generally declined over the decade, whereas those at School B stayed the same or increased slightly.","At School A, the most common problems in 2005 related to classroom behaviour and communication. Following instructions and concentration in lessons affected 42% and 40% of pupils respectively, but both figures had fallen by more than half to 18% by 2015. Listening skills and verbal expression of ideas, each affecting 35% of children initially, also dropped markedly, to 20% and 21%. The literacy problems, by contrast, changed little, with spelling difficulties declining from 30% to 25%, handwriting remaining at 28% and reading rising marginally from 22% to 23%.","School B, meanwhile, recorded much lower percentages in every category. Its highest figures in both years were for concentration and verbal expression, at 15% and 14% to 15% respectively. Two problems doubled over the period, with following instructions rising from 6% to 12% and spelling from 5% to 10%. The remaining figures barely changed, with reading, handwriting and listening problems affecting between 7% and 12% of pupils in 2015."]]},{"id":"W1-TB-19","task":1,"type":"Table","prompt":["The table below illustrates weekly consumption by age group of dairy products in a European country.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-19-1.jpg","w":1345,"h":666}],"models":[["The table shows how much milk and butter people in four age groups in a European country consume each week and whether they prefer full-fat or low-fat versions.","Overall, milk consumption rises with age, whereas butter consumption peaks among people aged 45 to 65. It is also noticeable that the youngest group is the only one to prefer full-fat versions of both products, while those aged 25 to 45 favour low-fat options most strongly.","Milk consumption increases steadily across the age groups, from 1,200 ml a week among under-25s to 1,650 ml and 1,670 ml in the two middle groups and reaching 1,900 ml among the over-65s. Preferences for fat content, however, vary considerably. Most under-25s (59%) choose full-fat milk, but this proportion falls to just 20% among 25 to 45-year-olds, four fifths of whom drink low-fat milk. Full-fat milk then recovers to 45% among 45 to 65-year-olds before dropping to 30% among the oldest group.","Butter shows a very different pattern. Weekly consumption rises from 12 g among the youngest group to 19 g among 25 to 45-year-olds and then more than triples to 60 g in the 45 to 65 group, before halving to 30 g among those over 65. The youngest group again favours full-fat butter, at 60%, and 62% of 25 to 45-year-olds choose low-fat butter, while the two older groups are almost evenly divided."]]},{"id":"W1-TB-20","task":1,"type":"Table","prompt":["The table below shows the number of visitors in the UK and their average spending from 2003 to 2008.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-20-1.jpg","w":1400,"h":603}],"models":[["The table provides data on the number of visits made to the UK by overseas visitors between 2003 and 2008, together with their total spending, the average amount spent per visit and the average length of stay.","Overall, both the number of visits and total spending increased considerably over the period, as did the average spend per visit. By contrast, the average length of stay fell slightly, particularly in the final two years.","The number of visits rose steadily from 24.7 million in 2003 to 32.7 million in 2006, an increase of roughly a third, before levelling off at 32.8 million in 2007 and dipping slightly to 31.9 million in 2008. Total spending followed a broadly similar path, climbing from £11.9 billion to £16 billion in 2006. However, unlike visitor numbers, it reached its highest point in the final year, at £16.3 billion, after a slight fall in 2007.","The average amount spent per visit fluctuated at first, falling from £475 in 2003 to £466 the following year, before recovering to £486 in 2006 and £487 in 2007. It then rose more sharply to £511 in 2008, the highest figure of the period. The average stay, meanwhile, remained stable at between 8.2 and 8.4 nights from 2003 to 2006, but dropped to 7.7 nights in both 2007 and 2008, the shortest stays recorded."]]},{"id":"W1-TB-21","task":1,"type":"Table","prompt":["The table below gives information about populations in Australia and Malaysia in 1980 and 2002.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-21-1.jpg","w":1162,"h":525}],"models":[["The table compares Australia and Malaysia in 1980 and 2002 across five demographic indicators, from total population to the proportion of people aged over 65.","Overall, Malaysia’s population grew much faster than Australia’s, overtaking it during the period, and its birth and growth rates remained considerably higher. Australia, by contrast, had a far older population, with a much larger and growing share of over-65s.","In 1980, Australia’s population of 14.7 million was slightly larger than Malaysia’s 13.7 million. By 2002, however, Malaysia’s population had risen by more than three quarters to 24.3 million, whereas Australia’s had grown by only a third to 19.6 million. Malaysia also had a much higher birth rate, at 3.2% in 1980, more than double Australia’s 1.5%. Although the Malaysian figure fell to 2.2% by 2002, it remained well above Australia’s 1.3%. Average annual growth showed a similar gap, easing from 2.4% to 2.1% in Malaysia while edging up from 1.2% to 1.3% in Australia.","The gender balance, by contrast, was almost even in both countries and barely changed. Women made up 50.1% of Australians in both years, whereas men slightly outnumbered women in Malaysia, at 50.3% rising to 50.6%. The proportion of older people, however, differed sharply. In 1980, 9.6% of Australians were over 65, compared with only 3.7% of Malaysians, and by 2002 the Australian figure had climbed to 12.4%, almost three times the Malaysian figure of 4.3%."]]},{"id":"W1-TB-22","task":1,"type":"Table","prompt":["The table below shows the number of students living in the UK gaining English language teacher training qualifications in 2007/8 and 2008/9, and the proportion of male qualifiers.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-22-1.jpg","w":1400,"h":603}],"models":[["The table shows the number of UK-resident students who gained English language teacher training qualifications in 2007/8 and 2008/9, broken down by qualification type and gender.","Overall, the total number of qualifiers remained almost unchanged, and women made up the large majority in both years. It is also clear that TEFL was by far the more common qualification, although it lost some ground to Cambridge UCLES CELTA and other qualifications, while the proportion of men fell in both categories.","The total number of qualifiers rose by just 15, from 32,930 to 32,945. However, the gender balance shifted slightly, as the number of female qualifiers increased from 23,842 to 24,324, whereas the number of men fell from 8,165 to 7,511. As a result, the proportion of male qualifiers dropped by two percentage points, from 24.7% to 22.7%.","TEFL accounted for more than three quarters of all qualifications in both years, but the number obtaining it fell slightly from 25,446 to 24,917, largely because fewer men gained it. Its male share, the highest in the table, slipped only marginally from 26.9% to 26.2%. Cambridge UCLES CELTA and other qualifications, by contrast, grew from 7,484 to 8,028, helped by an increase of almost 500 in the number of female qualifiers. Male qualifiers in this category fell sharply from 1,295 to 966, so that their share dropped from 17.3% to just 12.1%, the lowest figure recorded."]]},{"id":"W1-TB-23","task":1,"type":"Table","prompt":["The table below shows the total population and the proportion of males and females aged 15 and aged 75 in the UK from 1911 to 2011.","Summarise the information by selecting and reporting the main features, and make any comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-23-1.jpg","w":1024,"h":764}],"models":[["The tables provide data on the UK’s total population in 1911, 1961 and 2011, together with the proportion of people aged 15 and aged 75 and the number of males and females in each of these two age groups.","Overall, the total population grew steadily over the century, while the share of 15-year-olds fell and that of 75-year-olds rose sharply. It is also clear that males outnumbered females among 15-year-olds from 1961 onwards, whereas women made up the larger group among 75-year-olds in every year.","The UK population rose by exactly 10 million at each interval, from 36.1 million in 1911 to 56.1 million in 2011. Over the same period, the proportion aged 15 declined from 1.86% to 1.23%, as the number of people in this age group changed little. The male figure edged up from 334,200 to 354,400, whereas the female figure slipped marginally from 335,700 to 333,700, so the two sexes, almost equal in number in 1911, had drawn apart by 1961.","The 75-year-old group followed a very different pattern. Its share of the population tripled, from 0.23% to 0.70%. The number of men of this age rose more than fivefold, from 34,100 to 181,300, increasing at both intervals. Women of 75, by contrast, also rose more than fivefold, to 254,900 in 1961, but then fell back to 210,100 in 2011, though they still outnumbered men in all three years."]]},{"id":"W1-TB-24","task":1,"type":"Table","prompt":["The tables below show people’s reasons for giving up smoking, and when they intend to give up.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-TB-24-1.jpg","w":1300,"h":550},{"src":"wimg/W1-TB-24-2.jpg","w":1300,"h":612}],"models":[["The tables show the five most common reasons smokers give for wanting to quit and when they intend to do so, broken down by daily cigarette consumption.","Overall, improving general health is by far the most frequently cited reason for wanting to give up, while present health problems are mentioned least. It is also clear that most smokers intend to quit, and that lighter smokers are both more likely to plan to stop and more likely to plan to do so soon.","Looking at the reasons, 71% of smokers want to give up because it is better for their health in general, rising from 64% among the heaviest smokers to 74% among the lightest. Financial considerations rank second, at 31%, followed by a lower risk of smoking-related illnesses at 25%. Family pressure is cited by 16%, while only 12% mention present health problems, although this rises to 19% among heavy smokers.","As for timing, 71% of smokers intend to give up, most commonly within the next six months (35%), while 21% plan to quit within a year and 12% within a month. The proportion intending to quit rises as consumption falls, from 60% of heavy smokers to 79% of light smokers, and light smokers are far more likely to plan to stop within a month, at 21% compared with 8%. Conversely, 40% of those who smoke 20 or more a day have no intention of giving up."]]},{"id":"W1-MX-01","task":1,"type":"Mixed charts","prompt":["The graphs indicate the source of complaints about the bank of America and the amount of time it takes to have the complaints resolved.","Summarise the information by selecting and reporting on the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-01-1.jpg","w":1200,"h":1400}],"models":[["The pie chart illustrates the percentage breakdown of the sources of complaints made against the Bank of America, while the bar chart displays the average time taken to investigate and resolve these complaints between 2000 and 2004.","Overall, the vast majority of complaints originated from the public. Additionally, the average waiting period for a resolution remained relatively stable at five months throughout the period, with the exception of a temporary increase in 2001.","Regarding the sources of complaints, the public accounted for the largest proportion, contributing 63% of the total. Government agencies and out-of-state complaints followed, representing 11% and 10% respectively. Insurance companies contributed a slightly lower figure of 8%, while media and bank employees made up two of the smallest shares, each accounting for just 3% of the complaints.","Turning to the average time required for investigation and final action, the figure stood at 5 months in 2000. This number rose to a peak of 6 months in 2001 before dropping back to 5 months in 2002. From that point onwards, the average time remained constant at 5 months through to the end of the period in 2004."]]},{"id":"W1-MX-02","task":1,"type":"Mixed charts","prompt":["The table below shows the numbers of visitors to Ashdown Museum during the year before and the year after it was refurbished. The charts show the result of surveys asking visitors how satisfied they were with their visit, during the same two periods.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-02-1.jpg","w":1024,"h":631}],"models":[["The table compares the total number of visitors to Ashdown Museum in the year before and the year after its refurbishment, while the two pie charts show how satisfied the visitors surveyed in each of those years were with their visit.","Overall, the museum attracted more visitors following its refurbishment, and satisfaction levels improved markedly. Before the work, negative ratings slightly outweighed positive ones, whereas afterwards a clear majority of respondents expressed satisfaction.","In terms of attendance, the number of visitors climbed from 74,000 in the year before the refurbishment to 92,000 in the year after, an increase of 18,000, or almost a quarter.","Turning to the surveys, responses in the year before the refurbishment were marginally more negative than positive. ‘Dissatisfied’ was the largest category at 40%, and a further 10% of respondents were very dissatisfied, meaning that exactly half rated their visit unfavourably. By comparison, 30% were satisfied and 15% very satisfied, a combined 45%.","In the year after the refurbishment, this pattern was largely reversed. The satisfied share rose to 40%, making it the largest group, while the proportion of very satisfied respondents more than doubled to 35%, bringing positive ratings to three quarters of the total. At the same time, the dissatisfied figure fell sharply to 15% and the very dissatisfied figure halved to 5%, leaving just a fifth of respondents unhappy with their visit. The proportion who gave no response remained unchanged at 5% in both years."]]},{"id":"W1-MX-03","task":1,"type":"Mixed charts","prompt":["The graphs below give information about men and women participating in the Olympic games from 1924 to 2012.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-03-1.jpg","w":1100,"h":1200}],"models":[["The bar chart compares the numbers of men and women who took part in the Olympic Games in 1924, 1952, 1984 and 2012, while the line graph shows the total number of participants in the same years.","Overall, participation in the Olympics more than tripled over the period. Men outnumbered women in every year shown, but the number of female athletes grew far more quickly, so that the gap between the sexes had narrowed considerably by 2012.","In 1924, around 3,000 men competed in the Games, while only about 100 women took part. Male participation then rose to about 4,500 in 1952 and 5,200 in 1984, before reaching nearly 5,900 in 2012, almost twice its original level. The number of women grew much more dramatically. It increased to around 500 in 1952 and 1,500 in 1984, and then more than tripled to roughly 4,800 in 2012, only about 1,100 fewer than the number of men.","The line graph reflects these trends. The total number of participants rose steadily from just over 3,000 in
