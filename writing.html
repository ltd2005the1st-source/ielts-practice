he 6 pm news attracted the most viewers almost every month, while the 1 pm bulletin had the smallest and most stable audience. It is also noticeable that the 11 pm news, introduced in May, rose rapidly to become the most watched programme in August, at the same time as viewing figures for the 9:30 pm news fell sharply.","The 6 pm news had the largest audience at the start of the year, with about 4.8 million viewers a day in January. Despite monthly fluctuations, it fell gradually to around 3.3 million by December. The 1 pm news, on the other hand, barely changed, with daily viewing figures staying between about 1.2 and 1.4 million throughout the year.","The two late evening programmes showed the most dramatic changes. Viewing figures for the 9:30 pm news rose steadily from about 3.2 million in January to 3.8 million in May. The 11 pm news, which began in May with only around 200,000 viewers, grew to about 4.1 million in August, overtaking the 6 pm news. During the same three months, the 9:30 pm audience plunged to just over 1 million. From September onwards, however, this pattern reversed, as the 9:30 pm news recovered to about 3 million viewers in December, while the 11 pm news fell to below 1 million."]]},{"id":"W1-LG-19","task":1,"type":"Line graph","prompt":["The line charts give information about the demand for steel and number of workers employed in a country from January to December.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-LG-19-1.jpg","w":1204,"h":1400}],"models":[["The two line graphs show steel production and demand, in million tonnes, in a country over twelve months, together with the number of workers in the industry.","Overall, steel production exceeded demand in every month except December, and both production and employment fell considerably over the year. It is also noticeable that the number of workers followed a similar pattern to production, with a peak early in the year, a second smaller peak in late summer and a sharp decline at the end.","Steel production started at 4,000 million tonnes in January and rose to almost 5,000 million tonnes in February. After staying at around 4,000 million tonnes until July and dipping in August, it rose again to nearly 4,900 million tonnes in September. From then on, it fell steeply to only about 800 million tonnes in December. Demand, meanwhile, fluctuated between roughly 1,650 and 3,000 million tonnes for most of the year, typically 1,000 to 2,000 million tonnes below production. After dropping to almost zero in November, however, it recovered to 2,000 million tonnes in December, overtaking production for the only time.","The number of workers employed in the industry rose from 5 million in January to a peak of about 5.6 million in February. It then fell dramatically to around 3 million in March and varied between about 2.5 and 3.1 million until July. After a brief rise to 3.5 million in August, employment declined steadily, finishing the year at only 1 million."]]},{"id":"W1-LG-20","task":1,"type":"Line graph","prompt":["The graph below gives information from a 2008 report about consumption of energy in the USA since 1980 with projections until 2030.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-LG-20-1.jpg","w":1024,"h":765}],"models":[["The line graph shows energy consumption in the USA by fuel type from 1980 to 2008, along with projections up to 2030, measured in quadrillion units.","Overall, petrol and oil has been by far the most important source of energy throughout the period and is expected to remain so. Coal and natural gas have come next, while nuclear, solar and wind power, and hydropower have made up only a small fraction of total consumption.","Consumption of petrol and oil stood at about 35 quadrillion units in 1980, then dipped to around 31 in 1985 and fluctuated slightly until 1995. After that, it rose steadily to just over 40 by the time of the report, and it is projected to reach almost 50 by 2030.","Coal and natural gas followed broadly similar paths at a much lower level. Coal rose from roughly 16 units in 1980 to about 22 in the mid-1990s, while natural gas fluctuated between around 17 and 23 units, and the two crossed several times. From around 2015, however, their paths are expected to diverge, as coal is forecast to climb to roughly 32 units by 2030, whereas natural gas is predicted to level off at about 25.","The three remaining sources were far less significant. Nuclear energy roughly doubled to about 7.5 units by 2005 and is projected to stay close to this figure, while solar and wind power and hydropower have hovered around 3 to 5 units and are expected to change very little."]]},{"id":"W1-BC-01","task":1,"type":"Bar chart","prompt":["The chart illustrates the spending by residents in food, transport and entertainment in three areas.","Summarize the information by selecting and reporting the main features and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-01-1.jpg","w":1024,"h":567}],"models":[["The bar chart compares how much residents of three areas spent on food, transport and entertainment in 2007, with all figures given in millions of dollars.","Overall, Area B recorded the highest spending in every category, whereas Area A recorded the lowest. It is also noticeable that food was the largest expense in Areas A and B, while residents of Area C spent the most on entertainment.","Areas A and B followed the same pattern, with food at the top and transport at the bottom. In Area B, residents spent $37 million on food, only marginally more than the $36 million devoted to entertainment, while transport came to $34 million. Area A showed the same ranking on a smaller scale. Food stood at $30 million, entertainment at $28 million and transport at roughly $27 million, the lowest figure on the chart.","Area C, by contrast, reversed this order. Its spending climbed steadily from $32 million on food to $33 million on transport and $35 million on entertainment, so the category that led elsewhere was its smallest. Even so, Area C outspent Area A in all three categories, and its entertainment figure fell just $1 million short of Area B’s. Taken together, residents of Area B spent approximately $107 million, compared with about $100 million in Area C and $85 million in Area A."]]},{"id":"W1-BC-02","task":1,"type":"Bar chart","prompt":["The chart below shows what percentage of the population in different countries was aged 65 years or older in 1985 and 2035.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-02-1.jpg","w":1024,"h":765}],"models":[["The bar chart compares the proportion of the population aged 65 or over in England, Wales, Scotland, Northern Ireland and the UK as a whole in 1985, with projections for 2035.","Overall, the share of older people is expected to rise substantially in every country, with Wales having the highest proportion in both years. It is also noticeable that the differences between the countries are projected to narrow slightly, as those with the lowest figures in 1985 are set to see the largest increases.","In 1985, the proportion of people aged 65 and over ranged from about 12% to 16%. Wales had the oldest population, at roughly 16%, followed by England and the UK as a whole at around 15% each. Scotland’s figure was slightly lower, at about 14%, while Northern Ireland had the youngest population, with only around 12% aged 65 or over.","By 2035, all of these figures are projected to have risen considerably. Wales is expected to remain at the top, with just over a quarter of its population (about 26%) aged 65 or above, an increase of ten percentage points. Scotland and Northern Ireland are predicted to see the sharpest growth, of around eleven percentage points each, reaching roughly 25% and 23% respectively. England and the UK are set to follow similar paths, with their figures climbing from 15% to about 23%, level with Northern Ireland."]]},{"id":"W1-BC-03","task":1,"type":"Bar chart","prompt":["The graph below shows the number of boys and girls playing sports in an English town in 2012.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-03-1.jpg","w":1024,"h":556}],"models":[["The bar chart compares the number of boys and girls who played six different sports in an English town in 2012.","Overall, boys outnumbered girls in four of the six sports, with the largest difference in football, while girls were more numerous in swimming and badminton. It is also clear that football was the most popular sport among boys, whereas swimming attracted the most girls, and hockey was the least popular sport for both.","Football and tennis were the sports most dominated by boys. Some 60 boys played football, almost three times the figure of around 21 girls, while tennis attracted 50 boys compared with about 37 girls. Cycling showed a similar pattern on a smaller scale, with roughly 36 boys taking part, against just 20 girls. Hockey was the least popular sport overall, with only 15 boys and about 9 girls playing it.","Girls, by contrast, outnumbered boys in two sports. Swimming was their favourite activity, with 50 participants, compared with around 41 boys. Badminton was played by 40 girls, a third more than the 30 boys who chose it. When both sexes are combined, swimming was the most popular sport in the town, with about 91 participants, ahead of tennis at roughly 87 and football at around 81."]]},{"id":"W1-BC-04","task":1,"type":"Bar chart","prompt":["The bar chart shows the divorce rates in two European countries from 2011 to 2015.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-04-1.jpg","w":1024,"h":722}],"models":[["The bar chart compares divorce rates in two European countries, Finland and Sweden, over the five years from 2011 to 2015.","Overall, the divorce rate in Finland rose over the period, whereas the rate in Sweden fell after an initial increase. It is also clear that Sweden had the higher rate in the first four years, but Finland overtook it in the final year.","Finland’s divorce rate started at around 37% in 2011 and dipped to its lowest point of roughly 33% the following year. From then on, however, it rose steadily, reaching about 39% in 2013 and approximately 41% in 2014, a level it maintained in 2015.","Sweden followed a very different path. Its rate was around 44% in 2011 and climbed to a peak of nearly 49% in 2012, the highest figure on the chart. It then declined at every subsequent interval, to roughly 47% in 2013 and 45% in 2014, before dropping sharply to about 37% in 2015. As a result, Sweden’s rate ended the period around four percentage points below Finland’s, having been about 16 points higher in 2012."],["The bar chart illustrates the divorce rates in Finland and Sweden in each year from 2011 to 2015, expressed as percentages.","Overall, the two countries moved in opposite directions after 2012, with Finland’s rate rising and Sweden’s falling. Consequently, the gap between them, which was widest in 2012, narrowed steadily until Finland overtook Sweden in 2015.","In the first two years, the difference between the two countries widened. In 2011, Sweden’s divorce rate stood at around 44%, about seven percentage points above Finland’s figure of roughly 37%. The following year, Sweden’s rate rose to almost 49% while Finland’s fell to about 33%, so the gap more than doubled to around 16 percentage points.","From 2013 onwards, however, the two figures converged. Finland’s rate climbed to about 39% in 2013 and then to roughly 41%, where it remained in 2014 and 2015. Sweden’s figure, meanwhile, declined at every interval, slipping to approximately 47% and 45% before falling sharply to around 37% in 2015. In that final year, Sweden recorded its lowest rate of the period and, for the first time, a lower rate than Finland, by about four percentage points."]]},{"id":"W1-BC-05","task":1,"type":"Bar chart","prompt":["The chart below gives information on the percentage of Canadians who gave money to charitable organizations by age range for the years 2000 and 2015.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-05-1.jpg","w":800,"h":520}],"models":[["The bar chart compares the percentage of Canadians in five age groups who donated money to charitable organisations in 2000 and 2015.","Overall, the proportion of donors fell among the three groups under 50, whereas it rose among those aged 50 and over. As a result, the age group with the highest share of donors changed from 35 to 49 in 2000 to 50 to 64 in 2015, while the youngest group had the lowest figure in both years.","The three younger age groups all became less likely to give. The 35 to 49 group had the highest proportion of donors in 2000, at about 39%, but this fell to roughly 34% by 2015. A similar decline occurred among 25 to 34-year-olds, from around 29% to 25%. The most dramatic change was among the youngest adults, aged 18 to 24, whose figure almost halved from 20% to approximately 11%, by far the lowest share on the chart.","The two older groups, by contrast, moved in the opposite direction. The proportion of donors aged 50 to 64 rose from about 34% to 38%, making this the most generous age group by 2015. Among those aged 65 and over, the figure increased from roughly 31% to 34%, which meant that by 2015, older Canadians were as likely to donate as those aged 35 to 49."]]},{"id":"W1-BC-06","task":1,"type":"Bar chart","prompt":["The chart below shows the number of people employed in five types of work in one region of Australia in 2001 and 2008.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-06-1.jpg","w":1024,"h":768}],"models":[["The bar chart compares the number of people working in five occupations in one Australian region in 2001 and 2008.","Generally, sales employed considerably more people than any other type of work in both years, whereas farming employed the fewest. Three of the five occupations grew over the period, with computing expanding most markedly, and this growth was sufficient to rearrange the order of the three middle categories.","Sales was by some margin the largest employer, accounting for approximately 157,000 workers in 2001 and rising modestly to around 165,000 seven years later, a figure more than double that of any other occupation. Computing experienced by far the steepest growth, climbing from roughly 59,000 to almost 80,000, an increase of some 20,000 people. Nursing also grew, though only slightly, from around 56,000 to just over 60,000.","The two remaining occupations moved in the opposite direction. Accounting employed approximately 65,000 people in 2001, making it the second largest category at that point, but the figure fell to just under 60,000 by 2008, by which time it had been overtaken by both computing and nursing to become only the fourth largest. Farming, the smallest category throughout, declined from around 27,000 to roughly 19,000, a loss of almost a third of its workforce and the sharpest proportional fall of the five."]]},{"id":"W1-BC-07","task":1,"type":"Bar chart","prompt":["The chart below shows the percentage of the population in the UK who consumed the recommended daily amount of fruit and vegetables in 2002, 2006 and 2010.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-07-1.jpg","w":1024,"h":765}],"models":[["The bar chart shows the percentage of men, women and children in the UK who ate the recommended daily amount of fruit and vegetables in 2002, 2006 and 2010.","Overall, the proportion of people meeting the recommendation rose in all three groups between 2002 and 2006 before falling back in 2010, though it remained above its original level. It is also clear that women were the most likely to eat enough fruit and vegetables in every year, whereas children were by far the least likely.","Adults followed almost identical patterns, with women consistently a few percentage points ahead of men. In 2002, around 25% of women ate the recommended amount, compared with roughly 22% of men. Both figures peaked in 2006, at about 32% for women and 28% for men, before declining to around 27% and 24% respectively in 2010. Throughout the period, therefore, the gap between the sexes stayed at about three to four percentage points.","Children recorded much lower figures than adults in all three years. Only about 11% of children consumed the recommended daily amount in 2002, less than half the proportion of women. This figure rose by half to roughly 16.5% in 2006 but then fell to about 13.5% in 2010. Even at its highest point, the proportion of children eating enough fruit and vegetables was well below the lowest figure recorded for men."]]},{"id":"W1-BC-08","task":1,"type":"Bar chart","prompt":["The graph below shows the changes in the number of Asian elephants between 1997 and 2004.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-08-1.jpg","w":1024,"h":765}],"models":[["The bar chart compares the estimated populations of Asian elephants in nine countries in 1997 and 2004.","Overall, elephant numbers fell in seven of the nine countries, with Laos remaining stable and Cambodia being the only country to record an increase. It is also clear that India had by far the largest population in both years, followed by Myanmar.","The countries with the largest elephant populations all recorded declines, though at very different rates. India’s estimated population fell from almost 10,000 to around 7,500, a drop of roughly a quarter, but it remained more than one and a half times that of any other country. Myanmar saw a more modest fall, from about 5,300 to 4,700, while Sri Lanka’s figure slipped from 3,000 to approximately 2,700.","The sharpest proportional falls occurred in Thailand, Malaysia and China. Thailand’s population dropped from about 3,700 to just over 1,300, and Malaysia’s fell by around two thirds, from roughly 3,100 to 1,100. China’s elephant numbers halved from 1,000 to 500, the smallest population on the chart in 2004. The remaining three countries saw little change. Vietnam’s figure edged down from around 1,300 to 1,200, Laos held steady at about 1,200, and Cambodia was the sole exception to the downward trend, its population rising slightly from about 1,300 to 1,500."]]},{"id":"W1-BC-09","task":1,"type":"Bar chart","prompt":["The chart below shows the percentage of international students among university graduates in different Canadian provinces between 2001 and 2006.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-09-1.jpg","w":1024,"h":623}],"models":[["The bar chart compares the proportion of university graduates who were international students across eight Canadian provinces in two years, 2001 and 2006.","Overall, the percentage of international graduates rose in seven of the eight provinces over the five-year period, with Alberta being the sole exception. It is also noticeable that New Brunswick recorded the highest figures in both years.","New Brunswick had the highest proportion in 2001, at approximately 7%, and this figure increased to nearly 12% by 2006. Nova Scotia followed a similar upward trajectory, climbing from roughly 6.5% to just over 10.5%. Meanwhile, British Columbia experienced the most dramatic growth; starting at just under 5% in 2001, its percentage more than doubled to end level with Nova Scotia at about 10.5% in 2006.","Of the remaining provinces, Quebec also saw a substantial rise, growing from around 6% to around 8.5%. The provinces of Manitoba and Newfoundland and Labrador shared virtually identical figures, with their proportions rising from roughly 3.5% to just under 7%. Ontario recorded the lowest percentage in 2001, at just over 3%, but its figure picked up to roughly 6% by the end of the period. Alberta, by contrast, moved in the opposite direction entirely; it was the only province to see a decline, with its proportion falling from 5% to approximately 4%, making it the province with the lowest share in 2006."]]},{"id":"W1-BC-10","task":1,"type":"Bar chart","prompt":["The charts below show what the history and engineering graduates of a particular university were doing six months after graduating. The figures cover a two-year period.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-10-1.jpg","w":1009,"h":593}],"models":[["The bar charts compare what history and engineering graduates of one university were doing six months after graduating, in each of two consecutive years.","Overall, the majority of graduates in both subjects were in employment, with the proportion rising slightly in the second year. However, engineering graduates were more likely to have found a job, whereas history graduates were considerably more likely to be in further study.","Employment was by far the most common outcome for both groups. Around 64% of history graduates were working in the first year, and this figure rose to about 67% in the second. The equivalent figures for engineering graduates were higher, at roughly 75% and 78%. Further study was the second most common destination for history graduates, accounting for about 27% in the first year and 25% in the second, more than twice the corresponding figures for engineers, at around 12% and 8%.","The two smallest categories followed opposite patterns in the two subjects. Among history graduates, about 6% took time out in both years, a higher proportion than those seeking work, which slipped from around 3% to 2%. The reverse was true for engineering graduates, of whom only about 2% took time out, while roughly 11% were still looking for work in the first year and 12% in the second, by which point this group had overtaken further study as their second most common outcome."]]},{"id":"W1-BC-11","task":1,"type":"Bar chart","prompt":["The chart below shows the percentage of households in owned and rented accommodation in England and Wales between 1918 and 2011.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-11-1.jpg","w":1400,"h":1271}],"models":[["The bar chart illustrates the percentage of households in England and Wales that were either owned or rented over a 93-year period from 1918 to 2011.","Overall, the proportion of households in owned accommodation rose considerably, drawing level with rented households in 1971 and overtaking them thereafter. Conversely, rented accommodation was initially the dominant housing type but witnessed a steady decline throughout most of the period.","In 1918, rented accommodation accounted for nearly 80% of all households, while only about 20% of homes were owned. Over the next few decades, the gap narrowed consistently; by 1953, the figure for rented households had dropped to approximately 68%, while ownership rose to just over 30%. This trend continued until 1971, when the percentages for both categories converged at 50%.","Following this crossover, home ownership continued to climb, reaching its peak at nearly 70% in 2001. Meanwhile, the proportion of rented households fell to its lowest point of around 30% in the same year. However, the final decade saw a slight reversal in the trend; by 2011, home ownership had declined to approximately 64%, while rented accommodation experienced a modest increase to just over 35%."]]},{"id":"W1-BC-12","task":1,"type":"Bar chart","prompt":["The chart below shows the amount of household waste treated by four methods in the City of Maryland in 2000, 2010 and 2020.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-12-1.jpg","w":1400,"h":606}],"models":[["The bar chart shows how much household waste was treated by four different methods in the City of Maryland in 2000, 2010 and 2020, measured in million tonnes.","Generally, recycling replaced landfill as the most common method of waste treatment over the period. It is also noticeable that incineration rose sharply before falling back, while composting increased steadily yet remained among the smallest categories.","Landfill and recycling moved in opposite directions. In 2000, landfill was by far the dominant method at 32 million tonnes, four times the 8 million tonnes recycled. It then declined at both intervals, to 24 million tonnes in 2010 and only 11 million by 2020, a fall of roughly two thirds. Recycling followed the reverse path, rising to 18 million and then to 29 million tonnes, by which point it handled almost three times as much waste as landfill.","The two remaining methods showed contrasting patterns. Incineration was the only method to rise and then fall, surging from 6 million tonnes to a peak of 22 million in 2010 before dropping back to 9 million. Composting grew consistently but on a much smaller scale, climbing from just 2 million tonnes to 5 million and finally to 9 million, ending level with incineration."]]},{"id":"W1-BC-13","task":1,"type":"Bar chart","prompt":["The chart below shows how frequently people in the USA ate in fast food restaurants between 2003 and 2013.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-13-1.jpg","w":1352,"h":950}],"models":[["The bar chart shows how often people in the USA ate at fast food restaurants in 2003, 2006 and 2013, across six frequency categories.","Overall, eating fast food once a week or once or twice a month was the most common habit in all three years, whereas very few Americans ate it every day or never at all. It is also noticeable that the two leading categories swapped positions over the period, with monthly visits overtaking weekly ones by 2013.","The two most popular frequencies together accounted for around three fifths of respondents in every year. In 2003, 31% of Americans ate fast food once a week and 30% did so once or twice a month. Three years later, the weekly figure rose to 33% while the monthly figure fell to 25%. By 2013, however, the pattern had reversed, with 33% eating fast food once or twice a month, compared with 28% once a week.","The remaining categories were considerably smaller. Those who ate fast food several times a week made up 17% in 2003, peaking at 20% in 2006 before falling to 16%, while people eating it only a few times a year rose slightly from 13% to 15%. At the extremes, daily consumers and those who never ate fast food each accounted for no more than 5% in any year, and both figures edged down, to 3% and 4% respectively, by 2013."]]},{"id":"W1-BC-14","task":1,"type":"Bar chart","prompt":["The chart below shows the online sales of smartphones, laptops and tablets in the first quarter of 2019.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-14-1.jpg","w":1400,"h":668}],"models":[["The bar chart compares online sales, in millions of units, of laptops, tablets and smartphones in each month from January to April 2019.","Overall, the three products followed very different patterns, and each of them was the best seller in at least one month. Laptop sales fell in the middle of the period before recovering, whereas tablet and smartphone sales peaked in February and March and then declined.","Laptops were the best-selling device at the beginning and end of the period. Around 49 million units were sold online in January, but this figure fell steadily to roughly 34 million in February and only 24 million in March, the lowest monthly total for laptops. Sales then rebounded strongly to about 52 million in April, the product’s highest figure and enough to regain first place.","Tablets and smartphones moved in the opposite direction. Tablet sales roughly doubled from about 31 million in January to around 63 million in February, making them the leading product that month, and remained at this level in March before falling back to approximately 27 million in April. Smartphones started as the weakest seller, at just 19 million, but their sales climbed rapidly to about 45 million in February and peaked at roughly 72 million in March, the highest figure on the chart. In April, however, smartphone sales dropped to around 43 million, though they still ranked second."]]},{"id":"W1-BC-15","task":1,"type":"Bar chart","prompt":["The bar chart describes the sales of different goods in pounds (£) in the UK over four seasons in 2015.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-15-1.jpg","w":1400,"h":800}],"models":[["The bar chart compares the value of sales, in pounds, of five categories of goods in the UK across the four seasons of 2015.","Overall, clothing was the best-selling category in every season, peaking in winter. It is also noticeable that winter brought the strongest sales of electrical equipment and toys, whereas household items declined steadily and garden products sold the least in the coldest months.","Clothing and household items, the two leaders in spring, both lost ground during the middle of the year. Clothing sales fell from £100,000 in spring to around £70,000 in autumn, only to surge to a peak of roughly £110,000 in winter. Household items, by contrast, saw no such recovery, sliding at every stage from £80,000 to £50,000 and ending the year in fourth place.","Electrical equipment and children’s toys both dipped in summer before climbing to their highest point in winter. Electrical goods fell from £60,000 to about £50,000, then recovered to reach £80,000. Toys, the weakest category in spring and summer, tripled from their summer low of £20,000 to £60,000. Garden products moved in the opposite direction, hovering between £35,000 and £40,000 for three seasons before halving to just £20,000 in winter."]]},{"id":"W1-BC-16","task":1,"type":"Bar chart","prompt":["The chart shows British Emigration to selected destinations between 2006 and 2009.","Summarize the information by selecting and reporting the main features and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-16-1.jpg","w":1024,"h":683}],"models":[["The bar chart compares the number of British people who emigrated to five countries, Australia, Canada, Germany, the USA and Greece, in each year from 2006 to 2009.","Overall, Australia was by far the most popular destination throughout the period, and it was the only country to attract more British emigrants every year. Greece, by contrast, received the fewest emigrants in three of the four years, despite a dramatic but short-lived surge in 2007.","The two most popular destinations moved in opposite directions. Emigration to Australia rose steadily from around 42,000 in 2006 to 45,000 in 2007 and 48,000 in 2008, reaching a peak of about 52,000 in 2009, the highest figure on the chart. Canada was the second most popular destination, with about 36,000 British emigrants in both 2006 and 2007, but this figure then fell to roughly 28,500 in 2008 and recovered only slightly to 29,500 in 2009.","The remaining three countries attracted fewer emigrants and showed contrasting patterns. Germany received between 20,000 and 23,000 a year, with numbers falling slightly each year. Figures for the USA fluctuated within a similar range, dipping from about 22,000 to 20,000 in 2007 before rising to around 24,500 and then 23,000. Greece was the most erratic destination. Its figure nearly tripled from about 12,000 in 2006 to roughly 35,000 in 2007, almost matching Canada, before plummeting to 14,000 in 2008 and 13,000 in 2009."]]},{"id":"W1-BC-17","task":1,"type":"Bar chart","prompt":["The chart below shows waste collection by a recycling centre from 2011 to 2015.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-17-1.jpg","w":1240,"h":1028}],"models":[["The bar chart shows the amount of waste, in tons, collected by a recycling centre in four categories each year from 2011 to 2015.","Overall, the collection of all four types of waste fell in 2012 but then recovered, ending the period higher than in 2011. Paper was the most collected material in every year except 2013, while garden waste was the least collected in every year.","Paper and glass were the two largest categories. Paper collection fell from about 57 tons in 2011 to 50 tons in 2012 and 40 tons in 2013, when glass, at roughly 48 tons, briefly overtook it. Paper then rebounded strongly, reaching 51 tons in 2014 and peaking at 70 tons in 2015. Glass collection was more stable, fluctuating between about 41 and 48 tons before reaching around 52 tons in the final year.","Tins and garden waste were collected in smaller quantities and followed a similar pattern. The amount of tins dipped from about 35 tons to 27 tons in 2012, recovered to roughly 33 to 34 tons over the next two years and rose to 39 tons in 2015. Garden waste saw the most dramatic drop, more than halving from around 32 tons to just 15 tons in 2012, the lowest figure recorded. It then recovered to 31 tons in 2013 and, after dipping to 27 tons in 2014, finished at about 35 tons."]]},{"id":"W1-BC-18","task":1,"type":"Bar chart","prompt":["The graph gives information about the age of the population of Iceland between 1990 and 2020.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-18-1.jpg","w":1130,"h":630}],"models":[["The bar chart shows how the population of Iceland was distributed across five age groups in 1990, 2000, 2010 and 2020.","Overall, the 25 to 54 age group was by far the largest throughout, and its share grew considerably over the period, whereas the proportions of children and young people declined steadily. The two oldest groups, by contrast, changed relatively little.","The share of people aged 25 to 54 rose at every interval, from about 32% in 1990 to 35% in 2000 and 38% in 2010, before jumping to almost half of the population, at around 49%, in 2020. The two youngest groups moved in the opposite direction. Children aged 0 to 14 made up the second largest group in every year, but their share fell from roughly 26% to 18%. The decline was even steeper among 15 to 24-year-olds, whose proportion dropped from about 22% to just 8%, making them the smallest group by 2020.","The older age groups remained comparatively stable. People aged 65 and over accounted for around 13% of the population in 1990 and 2000, edging up to about 15% in 2010 before slipping to 14% in 2020. The 55 to 64 group, meanwhile, declined gradually from roughly 14% to 10%. Consequently, by 2020 there were proportionally more people aged 65 and over than people aged 55 to 64, reversing the position in 1990."]]},{"id":"W1-BC-19","task":1,"type":"Bar chart","prompt":["The bar chart below shows the sector contributions (in percentage) to India’s gross domestic product from 1960 to 2000.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-19-1.jpg","w":1180,"h":712}],"models":[["The bar chart illustrates the contributions of agriculture, industry and services to India’s gross domestic product (GDP), in percentage terms, at ten-year intervals from 1960 to 2000.","Overall, agriculture and services moved in opposite directions, with services replacing agriculture as the largest contributor to GDP by 1990. Industry, meanwhile, grew during the first two decades before levelling off.","Agriculture and services effectively swapped positions over the period. In 1960, agriculture accounted for around 63% of India’s GDP, almost four times the figure for services, at about 17%. Agriculture’s share then fell at every interval, to roughly 54% in 1970, 46% in 1980 and 31% in 1990, before dropping to just 14% in 2000, less than a quarter of its original level. Services followed the reverse path, rising steadily to about 28% in 1980 and then more sharply to 45% in 1990, overtaking agriculture, and reaching approximately 63% by 2000, matching agriculture’s 1960 figure.","Industry played a smaller but more stable role. Its contribution was roughly 16% in 1960, slightly below that of services, and it rose to about 21% in 1970 and 25% in 1980. From then on, however, its share remained unchanged at around 25% until the end of the period. As a result, industry overtook agriculture in the final decade, becoming the second largest sector in 2000."],["The bar chart compares the shares of India’s gross domestic product contributed by three sectors, namely agriculture, industry and services, in 1960, 1970, 1980, 1990 and 2000.","Overall, India’s economy shifted away from agriculture towards services over these four decades. Agriculture was the dominant sector until 1980, but by the end of the period, services generated the majority of GDP, while industry’s share had grown only modestly.","Between 1960 and 1980, agriculture remained the largest contributor, although its share declined from about 63% to 46%. Over the same twenty years, the other two sectors expanded at a similar pace. Services grew from approximately 17% to 28%, and industry from roughly 16% to 25%, so that by 1980 these two sectors together accounted for slightly more of GDP than agriculture did.","The final two decades brought more dramatic changes. Agriculture’s share fell sharply to around 31% in 1990 and then to only 14% in 2000. Services, by contrast, accelerated, jumping to 45% in 1990 to become the largest sector and reaching about 63% in 2000. Industry was the only sector to remain stable during this time, holding at around 25%, which meant that it overtook agriculture in 2000, although services still accounted for two and a half times its share."],["The bar chart provides information about how much each of three sectors, agriculture, industry and services, contributed to India’s gross domestic product (GDP) between 1960 and 2000, expressed as percentages.","Overall, the structure of India’s economy changed dramatically over the period, as services rose from one of the smallest sectors to by far the largest, while agriculture fell from first place to last. Industry’s share, by contrast, grew only in the first two decades and then stabilised.","In 1960, agriculture clearly dominated the economy, producing around 63% of GDP, whereas industry and services contributed only about 16% and 17% respectively. Agriculture’s share declined gradually to approximately 46% in 1980 and then more steeply, falling by more than two thirds between 1980 and 2000 to finish at just 14%. Services, meanwhile, increased at every interval. The growth was gradual at first, to about 28% in 1980, but it then accelerated, and services overtook agriculture in 1990 at roughly 45%, before reaching 63% in 2000.","Industry followed a different pattern from the other two sectors. Its contribution rose from about 16% to 21% in 1970 and to 25% in 1980, but it showed no further change in the following two decades. Although industry never became the leading sector, it ended the period ahead of agriculture, a position it had not held at any earlier point."]]},{"id":"W1-BC-20","task":1,"type":"Bar chart","prompt":["The bar shows the percentage of people going to cinemas in one European country on different days.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-20-1.jpg","w":1193,"h":647}],"models":[["The bar chart illustrates the percentage of people attending cinemas in a specific European country on different days of the week in the years 2003, 2005, and 2007.","Overall, it is evident that cinema attendance was significantly higher on weekends compared to weekdays throughout the period. Additionally, Saturday was consistently the most popular day for movie-goers, while weekdays generally witnessed lower and more fluctuating figures.","Looking at the weekends in more detail, Saturday recorded the highest attendance rates in all three years. In 2003, the figure stood at 40%, which rose to a peak of 45% in 2005 before dropping slightly to roughly 43% in 2007. Sunday followed a similar pattern, starting at 30% in 2003, climbing to roughly 34% in 2005, and falling back to just over 30% in 2007. Meanwhile, the percentage of people going to cinemas on Fridays remained perfectly stable at 30% across all three years.","Regarding weekdays, the figures were considerably lower, generally hovering between 10% and 20%. Tuesday was the most popular weekday, with attendance starting at 20% in 2003, dipping to roughly 17% in 2005, and recovering to nearly 20% in 2007. Wednesday experienced a steady downward trend, falling from roughly 16% in 2003 to below 10% in 2007, making it the least popular day by the end of the period. Finally, attendance on Mondays and Thursdays fluctuated mildly, staying between roughly 9% and 14%."]]},{"id":"W1-BC-21","task":1,"type":"Bar chart","prompt":["The charts below show the price of fuel in two states of the USA from 2005 to 2009.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-21-1.jpg","w":820,"h":1024}],"models":[["The two bar charts compare the cost of gasoline and petrol, measured in US dollars per litre, in two American states over the five years from 2005 to 2009.","Overall, prices in both states followed a broadly similar course, climbing to a peak in 2008 before falling steeply the following year to below their 2005 levels. In every year and in both states, gasoline cost exactly twenty cents per litre more than petrol.","In State A, the rise was uninterrupted. Gasoline began the period at $0.80 per litre and increased annually, reaching $1.05 in 2006, $1.20 in 2007 and a high of $1.40 in 2008. Petrol tracked this movement precisely, starting at $0.60 and peaking at $1.20. In 2009, however, both fuels fell dramatically, to $0.75 and $0.55 respectively, leaving them cheaper than they had been at the start of the period.","State B followed the same overall shape but with one departure. After rising from $0.90 to $1.15 between 2005 and 2006, gasoline dipped slightly to $1.10 in 2007 before climbing to its peak of $1.30 the year after, and petrol, twenty cents lower throughout, moved identically. State B was the more expensive of the two states in the first two years, but from 2007 onwards it was consistently cheaper, and its 2008 peak fell ten cents short of State A’s. Its prices also ended the period marginally lower, at $0.70 and $0.50."]]},{"id":"W1-BC-22","task":1,"type":"Bar chart","prompt":["The chart below shows the total number of minutes (in millions) of telephone calls in Finland, divided into three categories, from 1995 to 2004.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-22-1.jpg","w":1400,"h":788}],"models":[["The bar chart illustrates the total number of minutes of telephone calls in Finland from 1995 to 2004, divided into three distinct categories: local landline, national and international landline, and mobiles.","Generally, local landline calls were the most popular type throughout the period, despite fluctuating significantly. Meanwhile, both national and international landline calls and mobile calls experienced upward trends, with the latter witnessing the most dramatic growth.","Regarding local landline calls, the figure began at approximately 12,000 million minutes in 1995. It rose gradually to reach a peak of around 17,000 million minutes in 2001. However, following this peak, the consumption of minutes witnessed a drop, returning to its initial 1995 level of roughly 12,000 million minutes by 2004.","In contrast, the other two categories showed consistent growth. National and international landline usage started at roughly 6,000 million minutes and climbed steadily to just over 10,000 million minutes by the end of the period. The most significant change was seen in mobile calls; starting at a negligible amount in 1995, the figure grew rapidly, especially after 2000, to nearly 10,000 million minutes in 2004, almost catching up to the figures for national and international landlines."]]},{"id":"W1-BC-23","task":1,"type":"Bar chart","prompt":["The graphs below show the total percentage of films released and the total percentage of ticket sales in 1996 and 2000 in a country.","Summarize the information by selecting and reporting the main features and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-23-1.jpg","w":959,"h":1024}],"models":[["The two bar charts compare four film genres in a particular country in terms of their share of releases and their share of cinema ticket sales, in 1996 and 2000.","Generally, drama dominated the release schedules in both years while comedy consistently sold the most tickets, and the mismatch between these two measures widened over the period. Romance was the only genre whose share of sales fell.","Drama and comedy were the two largest genres in terms of releases, together accounting for almost half of all films in 1996 and 60% in 2000. Drama was the more prominent of the two, rising from 27% of releases in 1996 to 35% four years later, yet it converted this into only 16% and 17% of ticket sales respectively, a shortfall of eighteen percentage points by 2000. Comedy, by contrast, achieved an almost exact correspondence between the two figures, taking 20% of releases and 20% of sales in 1996, and 25% and 23% in 2000.","The two remaining genres were considerably smaller but moved in opposite directions. Fantasy grew on both counts, from 12% to 16% of releases and from 3% to roughly 6.5% of sales, the latter amounting to a doubling of its share. Romance was the only genre to remain static in terms of releases, at around 6% in both years, while its share of ticket sales halved from 5% to 2%, leaving it the least commercially successful of the four."]]},{"id":"W1-BC-24","task":1,"type":"Bar chart","prompt":["The bar charts below show the percentage of workers in four European countries, France, Denmark, Sweden and the UK, by the number of hours they work per week.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-24-1.jpg","w":1024,"h":889}],"models":[["The bar charts compare the proportion of workers in France, Denmark, Sweden and the UK according to how many hours they work per week, across eight bands ranging from 1-14 hours to over 50.","Overall, a working week of 36 to 40 hours is the most common in Denmark, Sweden and the UK, whereas French employees most typically work 31 to 35 hours. It is also clear that nobody in any country works more than 50 hours, while Sweden has the largest share of people on reduced hours.","Standard full-time hours dominate in three of the countries. The UK shows the strongest concentration, with exactly half of its workers doing 36 to 40 hours, followed by Denmark at 45%. France presents a different picture, as 35% of its workforce falls into the 31-35 band, more than twice the 15% working 36 to 40 hours. Sweden’s peak is the least pronounced, at just 30%.","Shorter weeks are most widespread in Sweden, where 20% work 15 to 20 hours and another 20% work 21 to 30, so half of all Swedish employees work under 31 hours. The corresponding figure is 40% in France and only 30% in both Denmark and the UK. At the other extreme, the four countries are identical, with 5% working 41 to 45 hours and another 5% working 46 to 50."]]},{"id":"W1-BC-25","task":1,"type":"Bar chart","prompt":["The graphs below show the number of medals won by the top five countries in the summer and winter Olympics.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-25-1.jpg","w":1399,"h":1400}],"models":[["The two bar charts compare the total number of Olympic medals won by the five most successful countries of all time in the Winter and Summer Games, with a breakdown by medal type for the Winter Games.","Overall, the United States has won by far the most medals in the Summer Olympics, whereas Norway leads the Winter rankings, with the United States in second place. It is also clear that medal totals in the Summer Games are far higher than in the Winter Games, as even the fifth-placed Summer country has won almost twice as many medals as the Winter leader.","In the Winter Olympics, Norway has won around 370 medals in total, about 130 of them gold, more than any other country. The United States follows with roughly 305 medals, including just over 100 golds, and Germany ranks third with about 240. Russia and Canada have very similar records, each with close to 200 medals, although Russia has won slightly more gold medals, at about 78 compared with Canada’s 73.","The Summer Olympics figures are on a much larger scale. The United States has won approximately 2,500 medals, about 650 more than Russia, which is second with roughly 1,850. Germany is close behind with around 1,700, but there is a sharp drop to the remaining two countries, with Great Britain and France having won roughly 850 and 700 medals respectively."]]},{"id":"W1-BC-26","task":1,"type":"Bar chart","prompt":["The bar chart below shows the percentage of people living alone in 5 different age groups in the US from 1850 to 2000.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-26-1.jpg","w":1024,"h":768}],"models":[["The bar chart shows the percentage of people in five age groups who lived alone in the US in 1850, 1900, 1950 and 2000.","Overall, living alone was uncommon in every age group for most of the period, but it became considerably more widespread by 2000. It is also clear that the older age groups recorded the highest proportions whenever data was available, with people aged 55 to 64 living alone most often in 1950 and 2000.","In 1850 and 1900, the figures for the three youngest groups, from 17 to 46, ranged between roughly 2% and 3% in both years, and no data is shown for the two oldest groups in 1850 or for the 55 to 64 group in 1900. In 1900, the 47 to 54 group recorded the highest figure, at about 3.5%. By 1950, little had changed for those under 55, whose proportions remained between about 2% and 3%, but the figure for people aged 55 to 64 reached around 9%.","The most dramatic increases occurred between 1950 and 2000. The proportion of 55 to 64-year-olds living alone almost doubled to about 17%, the highest figure on the chart, while that of 47 to 54-year-olds quadrupled to roughly 13%. The younger groups also saw substantial rises, with the 27 to 36 group reaching about 8%, the 37 to 46 group around 7% and the youngest adults approximately 5%."]]},{"id":"W1-BC-27","task":1,"type":"Bar chart","prompt":["The chart below shows information about changes in average house prices in five different cities between 1990 and 2002 compared with the average house prices in 1989.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-27-1.jpg","w":1024,"h":600}],"models":[["The bar chart compares average house prices in five cities over two periods, 1990 to 1995 and 1996 to 2002, expressed as the percentage change from average prices in 1989.","Overall, house prices in most of the cities rose in the second period after falling or growing only slightly in the first. London experienced the most dramatic shift, from one of the largest falls to by far the largest rise, while Tokyo was the only city where prices remained below their 1989 level throughout.","Between 1990 and 1995, three of the five cities recorded lower average prices than in 1989. Prices in Tokyo and London fell the most, by around 7.5% each, while New York saw a decline of about 5%. By contrast, prices in Frankfurt and Madrid rose slightly, by roughly 3% and 2% respectively.","From 1996 to 2002, the picture changed considerably. London’s average prices climbed to around 12% above the 1989 level, a swing of almost 20 percentage points and the highest figure on the chart. New York also moved from a fall to a rise, with prices about 5% higher than in 1989, while Madrid’s increase doubled to approximately 4%. Frankfurt, however, was the only city to see smaller growth than in the first period, with prices just 1% above their 1989 level. Tokyo’s prices remained about 5% below the 1989 average, the only negative figure in this period."]]},{"id":"W1-BC-28","task":1,"type":"Bar chart","prompt":["The bar chart gives information about the number of car journeys into the city center made by residents and non-residents.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-28-1.jpg","w":700,"h":480}],"models":[["The bar chart shows the average number of car journeys made into a city centre each day by residents and non-residents between 1996 and 2005, and indicates when two traffic measures were introduced.","Overall, car journeys by both groups fell over the period, with each of the two traffic measures followed by a sharp drop for one group in particular. It is also noticeable that residents made more journeys than non-residents at the start, but non-residents overtook them after parking meters were introduced.","From 1996 to 1999, residents made the majority of journeys, at between roughly 9,200 and 9,800 a day. Non-resident journeys, meanwhile, increased steadily from 5,000 to about 8,200. Following the introduction of parking meters between 1999 and 2000, however, resident journeys roughly halved to around 5,000 a day, while non-resident journeys were barely affected, remaining at about 7,800 to 8,100 until 2002. As a result, non-residents made considerably more journeys than residents during this period.","The closure of Westgate Street and Park Lane between 2002 and 2003 had the opposite effect. Non-resident journeys plummeted from about 8,100 to 3,000, falling below the resident figure, which itself dropped more moderately to roughly 3,900. Both groups then recovered somewhat by 2005, with resident journeys returning to around 4,000 and non-resident journeys climbing to about 4,900, almost exactly their 1996 level."]]},{"id":"W1-BC-29","task":1,"type":"Bar chart","prompt":["The bar chart below shows transport preferences among young people in four countries in a single year.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-29-1.jpg","w":1024,"h":765}],"models":[["The bar chart compares the proportions of young people in the UK, the United States, France and Italy who favoured three modes of transport, namely cars, motorcycles and bicycles, in a single year.","Overall, the car was the preferred option in three of the four countries, with France the only nation where cycling proved more popular. It is also clear that motorcycles attracted the least interest everywhere except the United States, where bicycles ranked last instead.","Cars were especially dominant in Italy, chosen by roughly 74% of young people. That is more than six times the figure for either of the other two modes, which stood at about 12% for bicycles and 9% for motorcycles. The UK and the US recorded identical preferences for cars, at 60%, yet their remaining choices mirrored each other exactly: 30% of young Britons opted for bicycles and only 10% for motorcycles, whereas in America these figures were reversed.","France presented a markedly different picture. Bicycles were the most popular choice there, at around 46%. This was the highest cycling figure in the chart and some six percentage points above cars, which, at 40%, were less popular in France than in any other country. Motorcycles, by comparison, appealed to only about 12% of French youngsters, broadly in line with the UK and Italy."]]},{"id":"W1-BC-30","task":1,"type":"Bar chart","prompt":["The bar chart shows the number of working hours per week for men and women in Australia.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-BC-30-1.jpg","w":1400,"h":867}],"models":[["The bar chart compares the percentage of men and women in Australia who worked within five ranges of weekly hours, from 0 to 10 up to over 80.","Overall, men were more heavily concentrated in the longer working weeks, whereas women were more common in the shorter ones. A working week of 30 to 50 hours was the most typical for both sexes, and the two groups were level only in the highest category.","Women outnumbered men in the two lowest brackets. Around 15% of women worked up to 10 hours a week, three times the figure for men, which stood at just 5%. A similar gap appeared in the 10 to 20 hour range, where roughly 22% of women were represented compared with about 13% of men.","The pattern reversed at longer hours. The 30 to 50 hour bracket was by far the most common for both groups, but men led here by around 9 percentage points, at 44% against 35% for women. The difference was even more marked in the 60 to 80 hour range, in which about 30% of men worked compared with only 19% of women. Finally, men and women were equal in the over 80 category, with each group accounting for roughly 10%."]]},{"id":"W1-PC-01","task":1,"type":"Pie chart","prompt":["The graph shows data on the global manufacture of passenger cars in 2015.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-PC-01-1.jpg","w":1024,"h":765}],"models":[["The pie chart shows how global passenger car production was divided among seven regions of the world in 2015.","Overall, car manufacturing was heavily concentrated in a few regions, with Greater China and Europe together producing just over half of the world’s passenger cars. By contrast, South America and the Middle East and Africa made only very small contributions.","Greater China was the largest producer, accounting for 26% of global output, only one percentage point more than Europe, at 25%. North America ranked third with 19%, which meant that these three regions together manufactured 70% of all passenger cars. Japan and Korea made up a further 16%, so the four leading regions were responsible for 86% of world production between them.","The remaining three regions played a far more limited role. South Asia contributed 8% of the global total, exactly half the share of Japan and Korea. South America’s share was smaller still, at 4%, and the Middle East and Africa produced the lowest proportion of all, at just 2%. Taken together, these three regions accounted for only 14% of world passenger car production, little more than half of Greater China’s share on its own."],["The pie chart illustrates the proportion of the world’s passenger cars that were manufactured in each of seven regions in 2015.","Overall, Greater China, Europe and North America were the three leading producers, together accounting for more than two thirds of global output. The Middle East and Africa, on the other hand, produced the smallest share of the world’s cars.","The two largest producers had almost identical shares. Greater China manufactured 26% of the world’s passenger cars, while Europe produced exactly a quarter. North America came some way behind, with 19%, and Japan and Korea were in fourth place with 16%, three percentage points less than North America.","There was a considerable gap between these four regions and the rest. South Asia accounted for 8% of global production, half the figure for Japan and Korea, and South America for just 4%. The Middle East and Africa made the smallest contribution, at only 2%, thirteen times less than Greater China. In other words, the three smallest producing regions combined manufactured a smaller proportion of the world’s cars than Japan and Korea alone."]]},{"id":"W1-PC-02","task":1,"type":"Pie chart","prompt":["The charts below show the percentage of volunteers by organizations in 2008 and 2014.","Summarize the information by selecting and reporting the main features and making comparisons where relevant."],"imgs":[{"src":"wimg/W1-PC-02-1.jpg","w":1400,"h":887}],"models":[["The two pie charts compare the percentage of volunteers working for six types of organisation in 2008 and 2014.","Overall, environmental organisations replaced educational organisations as the most popular choice among volunteers over the period, and sport also saw a marked rise. In contrast, the shares of volunteers going to art, educational and other organisations all fell, while health care remained a minor category throughout.","Environmental and educational organisations swapped positions over the six years. In 2008, educational organisations attracted the largest share of volunteers, at 24 percent, slightly ahead of environmental organisations at 21 percent. By 2014 this order had reversed, as the share volunteering for environmental causes climbed to 29 percent, the highest figure on either chart, while the share for educational organisations fell to just 17 percent.","Sport followed a similar upward path to environmental organisations, rising from 15 to 25 percent to become the second most common category in 2014. Art moved in the opposite direction, falling from 18 to 12 percent, and the share volunteering for other organisations nearly halved, from 15 to 9 percent. Health care remained the smallest category in both years, edging up only slightly, from 7 to 8 percent."]]},{"id":"W1-PC-03","task":1,"type":"Pie chart","prompt":["The chart shows the main methods of transportation for people travelling to a university for work or study in 2004 and 2009.","Summarise the information by selecting and reporting the main features and make comparisons wherever relevant."],"imgs":[{"src":"wimg/W1-PC-03-1.jpg","w":1400,"h":840}],"models":[["The two pie charts compare the main methods of transport used by people travelling to a university in the UK for work or study in 2004 and 2009.","Overall, the car and the bus were the two most common ways of travelling to the university in both years, but they swapped positions over the period, with the bus replacing the car as the most popular method. It is also clear that cycling became considerably more popular, while walking and the train remained minor options.","In 2004, more than half of all journeys to the university (51%) were made by car, while the bus accounted for a third. Five years later, however, the share of people travelling by car had fallen dramatically to 28%, a drop of 23 percentage points. Over the same period, bus use rose by 13 percentage points to 46%, making it by far the most popular method in 2009, with a share almost as large as the car’s had been in 2004.","The three remaining methods were far less common. Cycling showed the most significant growth, with its share almost doubling from 9% to 16%. Walking also became slightly more popular, rising from 4% to 6%, while the train was the least common method in both years, accounting for only 3% of journeys in 2004 and 4% in 2009. Taken together, these three methods made up just 16% of journeys in 2004 but more than a quarter in 2009."]]},{"id":"W1-PC-04","task":1,"type":"Pie chart","prompt":["The two pie charts below show the online shopping sales for retail sectors in Canada in 2005 and 2010.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-PC-04-1.jpg","w":1400,"h":800}],"models":[["The two pie charts compare the share of online sales accounted for by four retail sectors in Canada, namely electronics and appliances, food and beverage, home furnishings and video games, in 2005 and 2010.","Overall, food and beverage and video games increased their shares of online sales over the five years, while the other two sectors lost ground. As a result, food and beverage replaced electronics and appliances as the largest sector, and home furnishings fell from second place to last.","In 2005, electronics and appliances made up the largest proportion of online sales, at 35%, followed by home furnishings with a quarter of the total. Food and beverage accounted for 22%, and video games had the smallest share, at 18%. Five years later, the share of electronics and appliances had fallen moderately to 30%, but the decline was steeper for home furnishings, whose share dropped by ten percentage points to just 15%, the lowest figure in either chart.","The two remaining sectors moved in the opposite direction. Food and beverage saw the largest increase, with its share rising by ten percentage points from 22% to 32%, which made it the leading sector in 2010, slightly ahead of electronics and appliances. Video games also grew, from 18% to 23%, overtaking home furnishings to move from last place to third. Consequently, the four sectors were more evenly balanced in 2010 than in 2005, apart from the much smaller share of home furnishings."]]},{"id":"W1-PC-05","task":1,"type":"Pie chart","prompt":["The pie graphs show the nutritional consistency of two dinner dishes.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-PC-05-1.jpg","w":1128,"h":1400}],"models":[["The two pie charts compare the nutritional composition of two dinner dishes, a medium baked potato and a portion of macaroni, broken down into five components.","Overall, carbohydrates were the largest component of both dishes, but they made up a much greater proportion of the macaroni. The baked potato had a more balanced composition, with higher proportions of protein, glucose and other nutrients, whereas the macaroni contained twice as much saturated fat in percentage terms.","Carbohydrates accounted for just over half (52%) of the nutritional content of the macaroni, compared with roughly a third (35%) of the baked potato. Protein was the second largest component of the potato, at 25%, more than double its share in the macaroni, at 11%. Glucose also formed a larger part of the potato than of the macaroni, at 15% compared with 11%.","The remaining two components showed contrasting patterns. Saturated fat was the smallest component of the baked potato, at only 10%, but it was the second largest component of the macaroni, at 21%. Other nutrients, by contrast, made up 15% of the potato but only 5% of the macaroni, the smallest proportion in either chart. In other words, while the five components of the potato all accounted for between 10% and 35%, the macaroni was dominated by carbohydrates and saturated fat, which together made up almost three quarters of its content."]]},{"id":"W1-PC-06","task":1,"type":"Pie chart","prompt":["The pie chart gives information on UAE government spending in 2000. The total budget was AED 315 billion.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-PC-06-1.jpg","w":1024,"h":660}],"models":[["The pie chart shows how the UAE government’s total budget of AED 315 billion was divided among ten areas of spending in 2000.","Overall, social security received by far the largest share of government spending, almost as much as the next three categories combined. Health and education were the only other areas to receive more than a tenth of the budget, while transport received the smallest share.","Social security accounted for 31.9% of total expenditure, equivalent to roughly AED 100 billion. Health and personal social services came second with 16.9%, slightly more than half the figure for social security, followed by education with 12.1%. Together, these three areas absorbed over 60% of the government’s budget.","The remaining seven categories each received less than 8% of total spending. Debt interest and other expenditure were allocated identical shares of 7.3%, or about AED 23 billion each, and defence received a similar proportion, at 7%. Spending on law and order made up 5.4% of the budget, while housing, heritage and the environment accounted for 4.8%, and industry, agriculture and employment for 4.2%. Transport received the lowest share of all, at just 2.9%, or approximately AED 9 billion, which was around eleven times less than the amount spent on social security."],["The pie chart illustrates the proportions of the UAE government’s spending, which totalled AED 315 billion, allocated to different areas in 2000.","Overall, the budget was dominated by social security, which received almost a third of the total. Welfare, health and education together accounted for the majority of spending, whereas transport and areas related to the economy and the environment received relatively small shares.","The largest proportion of the budget, 31.9%, was spent on social security. The second largest area was health and personal social services, at 16.9%, and education ranked third, at 12.1%. In monetary terms, this meant that roughly AED 190 billion out of the total of AED 315 billion was spent on these three areas.","Spending on the other areas was much more evenly divided. Three categories received between 7% and 7.3% each, namely debt interest, other expenditure and defence. Slightly smaller shares were allocated to law and order, at 5.4%, housing, heritage and the environment, at 4.8%, and industry, agriculture and employment, at 4.2%. Finally, transport received the smallest proportion of the budget, at 2.9%. It is noticeable that the government spent more on debt interest than on transport and on industry, agriculture and employment combined."]]},{"id":"W1-PC-07","task":1,"type":"Pie chart","prompt":["The pie charts show figures for the use of public libraries in 1991 and 2000 in Britain.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-PC-07-1.jpg","w":1024,"h":687}],"models":[["The pie charts compare the reasons why people visited public libraries in Britain in 1991 and 2000, together with the total number of visits in each year.","Overall, library use grew over the period, and borrowing or returning books remained by far the most common purpose in both years despite a fall in its share. It is also noticeable that borrowing videos emerged as a significant new activity, whereas studying and reading newspapers became far less popular.","Book borrowing dominated both charts, although its share slipped from 65% to 55%. Because total visits rose from 290 million to 350 million, however, the actual number of such visits edged up slightly, from roughly 189 million to 193 million. Obtaining information followed a clearer upward path, its share doubling from 10% to 20%, which meant around 70 million visits in 2000 compared with 29 million in 1991.","The remaining categories moved in contrasting directions. Borrowing or returning videos, absent in 1991, accounted for 18% of visits by 2000, making it the third largest category. In contrast, reading newspapers or magazines fell from 15% to just 5%, while studying collapsed from 10% to a mere 2%, the smallest share in either chart, equivalent to only about 7 million visits."]]},{"id":"W1-PC-08","task":1,"type":"Pie chart","prompt":["The chart below shows a comparison of different kinds of energy production in France in 1995 and 2005.","Summarize the information by selecting and reporting the main features and making comparisons where relevant."],"imgs":[{"src":"wimg/W1-PC-08-1.jpg","w":1024,"h":548}],"models":[["The two pie charts compare the proportions of energy produced in France from five different sources in 1995 and 2005.","Overall, coal, gas and petroleum were the three main sources of energy in both years, although petroleum lost a considerable share over the decade. By contrast, nuclear power and other sources, which were the two smallest categories, both grew noticeably.","In 1995, energy production was divided almost equally between the three leading sources. Coal accounted for 29.80% of the total, very slightly more than gas, at 29.63%, and petroleum, at 29.27%. Ten years later, coal and gas had both increased their shares marginally, to 30.93% and 30.31% respectively, with coal remaining the largest source. Petroleum, however, fell by almost ten percentage points to 19.55%, so that it now made up only around a fifth of the total.","The remaining two sources played a much smaller role but expanded considerably. Nuclear power generated 6.40% of France’s energy in 1995, and this figure rose to 10.10% in 2005. The increase was even more marked for other sources, whose share almost doubled, from 4.90% to 9.10%. Consequently, by 2005, nuclear power and other sources together produced almost as much energy as petroleum, whereas in 1995 their combined share had been less than two fifths of petroleum’s."]]},{"id":"W1-PC-09","task":1,"type":"Pie chart","prompt":["The pie charts below show the sources of electricity generation in a country in 2000 and 2020.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-PC-09-1.jpg","w":1400,"h":843}],"models":[["The two pie charts compare the proportions of electricity generated from five sources in a country in 2000 and 2020.","Overall, the country’s electricity supply became far more evenly balanced over the period, as coal lost its dominant position. Natural gas and renewables both grew considerably to become the two largest sources by 2020, whereas the shares of coal, nuclear power and oil all fell.","In 2000, coal was by far the most important source, generating almost half of the country’s electricity, at 48%. This share fell dramatically over the following twenty years to just 19%, which left coal in third place. Natural gas and renewables, by contrast, both expanded substantially. The share of natural gas rose from 18% to 32%, making it the leading source in 2020, while renewables saw the most remarkable growth, increasing almost fivefold from only 6% to 29%.","The two remaining sources both declined slightly. Nuclear power provided a fifth of the country’s electricity in 2000, the second largest share at the time, but this figure dropped to 17% in 2020. Oil accounted for 8% of electricity generation in 2000, slightly more than renewables, but its share fell to just 3% by 2020, making it the smallest source by a considerable margin. As a result, the difference between the largest and smallest sources narrowed from 42 percentage points to 29."]]},{"id":"W1-PC-10","task":1,"type":"Pie chart","prompt":["The pie charts below show the most common advantages and disadvantages of Bowen Island, according to a survey of visitors.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-PC-10-1.jpg","w":520,"h":670}],"models":[["The two pie charts show the results of a survey in which visitors to Bowen Island were asked about the island’s most common advantages and disadvantages.","Overall, the high cost of living was by far the most frequently mentioned disadvantage, while the people were the most commonly cited advantage, closely followed by the scenery. Each chart was dominated by one or two categories, with the remaining factors mentioned far less often.","Turning first to the disadvantages, exactly half of the visitors complained about the high cost of living on the island. Entertainment was the second most common complaint, mentioned by a quarter of respondents, half the proportion for the cost of living. The weather and food quality were cited much less frequently, by 15% and 10% of visitors respectively.","As for the advantages, the people of Bowen Island were the most popular feature, chosen by 42% of the visitors surveyed. The scenery came a close second, at 35%, so these two factors together accounted for more than three quarters of all responses. By contrast, only 12% of visitors named the island’s culture as its main advantage, and a similar proportion, 11%, mentioned good accommodation, the smallest figure in either chart."],["The pie charts illustrate what visitors to Bowen Island considered to be its most common advantages and disadvantages, according to the results of a survey.","Overall, visitors’ views on the island’s strengths focused mainly on its people and scenery, while the most widely reported weakness was the high cost of living. In both charts, the two leading factors together accounted for around three quarters of responses or more.","The cost of living was the main concern for visitors, with half of all respondents identifying it as a disadvantage. Entertainment was mentioned by 25%, and the weather by 15%. Food quality was the least common complaint, cited by only one in ten visitors, a fifth of the figure for the cost of living.","Among the advantages, the people were mentioned most often, by 42% of respondents, which was seven percentage points more than the figure for the scenery, at 35%. The two remaining advantages received far less attention, with 12% of visitors choosing the island’s culture and 11% its good accommodation. It is therefore noticeable that the two smaller advantages, taken together, were mentioned by fewer visitors than entertainment, the second most common disadvantage."]]},{"id":"W1-PC-11","task":1,"type":"Pie chart","prompt":["The chart below shows the percentage of the day working adults spent doing different activities in a particular country in 1958 and in 2008.","Summarise the information by selecting and reporting the main features and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-PC-11-1.jpg","w":960,"h":1024}],"models":[["The provided pie charts illustrate the distribution of daily activities for working adults in a particular country across two years: 1958 and 2008.","Generally, working consumed the largest proportion of the day in both periods, and its share increased significantly by 2008. While time spent sleeping and going out decreased, time dedicated to relaxing at home and travelling to work saw an increase.","In 1958, working and sleeping each accounted for a substantial portion of the day, at 33% and 32% respectively. Going out with friends or family occupied 19% of the day, while relaxing at home made up 8%. Other activities, such as hobbies or playing sport, constituted 6%, and travelling to work was the least time-consuming activity at 2%.","By 2008, the percentage of time spent working rose notably to 42%, making it the most significant daily activity. Conversely, time a
