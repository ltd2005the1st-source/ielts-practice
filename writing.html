e relevant."],"imgs":[{"src":"wimg/W1-MP-29-1.jpg","w":902,"h":1116}],"models":[["The maps show an industrial area in the town of Norbiton as it is now and how it is planned to be developed in the future.","Overall, the area is set to be transformed from an industrial zone into a residential one, with all the factories replaced by housing and a range of public facilities. The road network is also planned to be extended, including a new bridge across the river to the north.","At present, the industrial area lies to the east of the town, between a main road in the south and a river in the north, with farmland on the far side of the river. A short road leads north from the main road to a roundabout, which is surrounded by three factories. A second road runs east from the roundabout, with two factories on each side of it and another at its far end.","Under the plan, all eight factories will be demolished. A second, smaller roundabout will be built where the access road meets the main road, with shops and a medical centre on either side of the road just south of the central roundabout. The eastern road will be lined with housing, with a playground to its north and a school at its end. Two new roads will also branch off the central roundabout. One will run northwest, with housing on both sides, and the other will go north, crossing the river by a bridge, to a road on the former farmland, where more housing will be built."],["The two maps compare the present layout of the Norbiton industrial area with a plan for its future development.","Overall, the plan will turn the area into a residential neighbourhood with its own services, replacing every factory on the site. Housing will be built in several parts of the area, and the development will also extend north of the river onto what is currently farmland.","Currently, the site is used only for industry. There are eight factories in total, three positioned around a central roundabout and five along a road that leads east from it. The roundabout is linked to a main road in the south, and the town lies to the west. North of the site, a river flows from west to east, separating it from an area of farmland.","In the future, the central roundabout and the road to the east will be kept, but the surrounding land will be used very differently. Housing will replace the factories along the eastern road, a playground will be built north of this road, and a school will stand at its eastern end. A road will be added to the northwest of the roundabout, also with houses along it. To the south of the roundabout, shops and a medical centre will be built, and a new roundabout will be added at the junction with the main road. Finally, a road heading north will cross the river by a new bridge, leading to further housing on part of the farmland."]]},{"id":"W1-MP-30","task":1,"type":"Map or plan","prompt":["The maps below show the center of a small town called Birshire as it is now, and plans for its development.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-30-1.jpg","w":1024,"h":683},{"src":"wimg/W1-MP-30-2.jpg","w":1024,"h":683}],"models":[["The maps show the centre of a small town called Birshire as it is now and how it is planned to develop in the future.","Overall, the town centre is set to become more residential and commercial, as both farms, the farmer’s market and the open field will be replaced by new facilities and housing. The road network will also be extended, while the public park and the main residential block will remain unchanged.","At present, McGoldrick Road runs from north to south through the town centre, with That Street branching off to the east. In the west, a block surrounded by a road is lined with houses on its northern and western sides and a row of shops to the south, and a farmer’s market stands in the northwest corner. East of McGoldrick Road, there are two farms, Griffiths Farm in the northeast and Hoolahan Farm in the centre, as well as a public park and an open field in the southeast.","Under the plan, That Street will be extended westwards across McGoldrick Road, with a roundabout at the junction, and the farmer’s market will be removed. Griffiths Farm will be replaced by a supermarket, and Hoolahan Farm by a car park with access from both That Street and McGoldrick Road. The open field will become a sports centre. In the west, the shops will make way for a row of six houses, and an extra house will be built on the western side of the block."]]},{"id":"W1-MP-31","task":1,"type":"Map or plan","prompt":["The maps below show Hunderstone town at present and a proposed plan for it.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-31-1.jpg","w":1024,"h":536}],"models":[["The two maps show the current layout of the town of Hunderstone and a proposed plan for its future development.","Overall, the plan focuses mainly on improving the road network, with a new roundabout and a new road, the A4, to be built. In addition, the airfield will be replaced by an industrial estate, while the A2, the railway and the town centre will remain where they are.","At present, the A2 runs from north to south along the western side of the town, with a roundabout in the middle. A short road links the A2 to an airfield in the northwest. From the roundabout, a second road runs southeast, crossing a north-south railway line beside a gas station and ending at a ring road that surrounds the town centre in the built-up area to the east.","Under the plan, the airfield will become an industrial estate, and the road leading to it from the A2 will be extended eastwards as far as the railway. The point where the road from the A2 roundabout meets the railway will be redesigned, with a large new roundabout built just north of the gas station. This roundabout will also give access to the ring road around the town centre. Finally, a new road called the A4 will be built in the south of the town, linking the A2 to the area near the railway, with a further section running south from the town centre."],["The maps illustrate the town of Hunderstone as it is now and how it would look if a proposed plan were carried out.","Overall, the main structure of the town will stay the same, but the western half will see significant changes to its land use and road network. The most important changes are the conversion of the airfield into an industrial estate, the construction of a second roundabout and the addition of the A4.","Currently, the town is divided by a railway running from north to south. To the west of the railway lie the A2, which has a roundabout, and an airfield connected to the A2 by a short road. A road from the A2 roundabout crosses the railway next to a gas station and leads to the town centre, which is enclosed by a ring road within the built-up area east of the railway.","In the proposed plan, the airfield will be replaced by an industrial estate, which will be connected to both the A2 and the railway by road. Where the road from the A2 currently crosses the railway, a large roundabout will be constructed, improving the connection between the western side of the town and the town centre. In the south, the A4 will be built, running east from the A2 towards the railway, and another part of this new road will lead southwards from the town centre. The gas station, the railway and the built-up area will remain unchanged."]]},{"id":"W1-MP-32","task":1,"type":"Map or plan","prompt":["The plans below show the South Wing of Walton Museum in 2008 and in 2012 after it was redeveloped.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-32-1.jpg","w":1024,"h":1024}],"models":[["The plans illustrate the layout of the South Wing of Walton Museum in 2008 and the changes made to it after its redevelopment in 2012.","Overall, the wing was transformed from a two-storey building into a much taller one, rising to four levels on its right-hand side and offering a wider range of visitor facilities. Despite this, the special exhibition room, the shop and the reading room retained their original positions.","In 2008, visitors walked in from the path through an open entrance on the upper floor, which led to the reception and the reading room, while the lower floor housed the special exhibition room, the shop and a cloakroom, connected by a staircase. By 2012, this entrance had been enclosed to form an entrance hall, and the reception and cloakroom had been merged into a single room. The stairs had given way to a lift running the full height of the building, and the former cloakroom had been converted into a children’s play area.","The most striking change was the addition of new floors. A restaurant was built above the reception, with a terrace beside it on the roof of the entrance hall. On the right-hand side, two extra storeys were added above the reading room, housing a self-service room and a further exhibition room beneath a pitched roof."]]},{"id":"W1-MP-33","task":1,"type":"Map or plan","prompt":["The plan below shows the village of Pebbleton 20 years ago and now.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-33-1.jpg","w":1069,"h":1335}],"models":[["The two maps show the village of Pebbleton twenty years ago and today.","Overall, the village has been developed with more housing and new leisure and community facilities, mainly in its northern part. Access has also been improved by the addition of a footpath linking the village to the school across the river, while the main road layout has remained the same.","Twenty years ago, Old Fort Road ran westwards from a roundabout in the east of the peninsula, which was connected by a road bridge to Coast Road and a school on the southern side of the river. Lighthouse Lane branched off Old Fort Road to the north, ending near a row of four houses on the northern coast. At the western end of the peninsula stood a lighthouse, with an old fort just south of it and a film studio near the southwestern shore. There was also a playing field beside Old Fort Road.","Today, the lighthouse, the film studio, the playing field and the roads all remain. However, the row of houses has been extended from four to seven, and a community centre has been built at the northern end of Lighthouse Lane. The old fort has been replaced by a children’s playground, and tennis courts have been laid out along the western side of Lighthouse Lane. In addition, a footpath now runs from the playground past the film studio and over the river to Coast Road, giving residents a direct route to the school."]]},{"id":"W1-MP-34","task":1,"type":"Map or plan","prompt":["The maps below show the village of Stokeford in 1930 and 2010.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-34-1.jpg","w":1024,"h":603}],"models":[["The maps show the village of Stokeford in 1930 and 2010.","Overall, Stokeford changed from a small farming village into a much larger residential area, as its farmland was replaced by housing and new roads. The bridge, the main road and the post office remained, but several other buildings were removed, extended or given new uses.","In 1930, a main road ran south from a bridge in the north of the village, with the River Stoke to its west. A small number of houses lined both sides of this road near the bridge, and further south on its western side were two shops and a post office. A primary school stood on the eastern side of the road, and to its south there was a large house set in gardens with trees. The rest of the area, both east of the road and between the road and the river, was farmland.","By 2010, all the farmland had disappeared and been covered with houses. In the northeast, a network of new roads had been built, lined with houses, and further housing estates had been constructed along new roads to the west of the main road and on both sides of it in the south. The shops had gone, but the post office was still in the same place. The primary school had been extended, and the large house had been enlarged and turned into a retirement home, although its gardens had become smaller."]]},{"id":"W1-MP-35","task":1,"type":"Map or plan","prompt":["The maps below show a science park in 2008 and the same park today.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-35-1.jpg","w":1024,"h":765}],"models":[["The two maps illustrate the modifications made to a science park from 2008 until now.","Overall, it is apparent that the layout has undergone significant changes, with the most noticeable shifts being the alternation to the size of some buildings and the addition of new amenities to accommodate scientific research purposes.","Regarding the Northern section of the park, a new research and development area has been added in the space formerly occupied by grassland. It is directly connected to the existing offices. Additionally, the original reception area attached to these offices has been converted into a university hub.","In the southern half of the map, the IT centre has been repurposed as an Innovation centre whereas the woodland area adjacent to it remains largely unchanged. While the business units on the western side remain intact, the cyber security building in the southeastern corner has been substantially enlarged into an L-shaped building, expanding into what was previously a patch of grassland and woodland. The central car park has also been reduced in size in order to make way for the expansion of the cyber security building.","In terms of transport and access improvements, a new station has been constructed on the railway line running along the southern border, linked to the central building by a new path. Moreover, a new road has been built across the park from the west, passing the car park and joining the main road on the eastern edge, and cycle paths now run alongside both roads. There is also a new bus stop on the eastern road."],["The two maps show the layout of a science park in 2008 and today.","Overall, the science park has become considerably more developed, with new and larger buildings replacing much of its grassland. Transport links have also been greatly improved, with the addition of a road, cycle paths, a bus stop and a railway station.","In 2008, the north of the park was mostly grassland, with offices and a reception in the northeast. Business units stood in the west, and a car park was located in the centre, connected by paths to the main buildings. In the south, there was a circular IT centre with a cyber security building to its east, while the southwest corner was wooded and a railway line ran along the southern edge. The only road ran along the eastern side of the park.","Today, the grassland in the north has been replaced by a research and development building, linked to the offices, and the reception has become a university hub. The business units and the car park remain, although the car park is slightly smaller, and the IT centre has been converted into an innovation centre. The cyber security building has been greatly extended northwards into the former grassland in the east. A new road now crosses the park from the west, and both roads have cycle paths. A bus stop has also been added on the eastern road, and a station has been built on the railway line, with paths leading to the innovation centre and the cyber security building."]]},{"id":"W1-MP-36","task":1,"type":"Map or plan","prompt":["The maps below show the changes in area after the construction of a hydroelectric power dam.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-36-1.jpg","w":1024,"h":847}],"models":[["The two maps illustrate the changes that took place in a river valley between 1980 and 2000 following the construction of a hydroelectric dam.","Overall, the region was fundamentally transformed from a landscape of natural habitats, heritage sites, and agriculture into a reservoir used for power generation and leisure. It is also clear that the creation of the lake flooded the original features, and the village was replaced by a smaller one south of the dam, together with new infrastructure.","Looking at the area north of the dam, the river originally flowed between two mountain ranges. In 1980, the western side featured a forest, ancient structures, and rare plants and animals, while the eastern bank contained irrigated farmland and a village. By 2000, the damming of the river had created a vast lake that entirely submerged these areas. The new body of water was subsequently utilized for fishing and sailing.","Turning to the structural additions, the hydroelectric dam was erected across the southern section of the river. A hotel was built on the eastern shore of the new lake, while a new and much smaller village of just two houses was established further south, downstream of the dam. To distribute the power generated, electricity pylons were installed running southwest from the facility, alongside an additional line supplying electricity directly to the relocated village."]]},{"id":"W1-MP-37","task":1,"type":"Map or plan","prompt":["The diagrams show the cross-sections of two tunnels, one joining France and Italy and the other joining two Japanese islands.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-37-1.jpg","w":1251,"h":1113}],"models":[["The diagrams show cross-sections of two tunnels, the Mont-Blanc Road Tunnel linking France and Italy and the Senkan Railway Tunnel linking two Japanese islands, together with their lengths and construction periods.","Overall, the Senkan Railway Tunnel is far longer than the Mont-Blanc Road Tunnel and took much longer to build. The two tunnels also differ in what lies above them, as the Mont-Blanc tunnel passes through a mountain, whereas the Senkan tunnel runs under the sea.","The Mont-Blanc Road Tunnel runs in a straight, level line from its French end to its Italian end, a distance of 11.60 km. At its highest point, the mountain above the tunnel rises 3.5 km above it. The tunnel was built over a period of eight years, from 1957 to 1965.","The Senkan Railway Tunnel, by contrast, is 53.85 km long, more than four and a half times the length of the road tunnel. It connects Hakodate City on Hokkaido Island with Aomori City on the other island, passing beneath the Tsugaru Strait. Unlike the Mont-Blanc tunnel, it is not level, as it slopes down from each end and runs horizontally beneath the seabed, reaching 240 metres below sea level at its lowest section. Construction of this tunnel lasted 42 years, from 1946 to 1988, more than five times as long as the Mont-Blanc project."],["The two diagrams compare the Mont-Blanc Road Tunnel between France and Italy with the Senkan Railway Tunnel in Japan, showing their cross-sections, lengths and construction times.","Overall, the Japanese railway tunnel is considerably longer and deeper below the surface than the European road tunnel, and its construction took several decades rather than a few years. While the road tunnel goes through a mountain, the railway tunnel goes under a strait.","In terms of size, the Senkan Railway Tunnel stretches for 53.85 km, compared with only 11.60 km for the Mont-Blanc Road Tunnel. The road tunnel is completely flat, running directly through the base of a mountain that rises to 3.5 km above it. The railway tunnel follows a different shape, descending from Hakodate City on Hokkaido Island and from Aomori City at the other end to a long horizontal section that lies 240 metres below the surface of the Tsugaru Strait.","The construction periods of the two tunnels were also very different. Work on the Mont-Blanc tunnel began in 1957 and was completed in 1965, taking only eight years. The Senkan tunnel, on the other hand, was started earlier, in 1946, but was not finished until 1988, after 42 years. In other words, it took over five times longer to build a tunnel that is around four and a half times longer."],["The diagrams illustrate the cross-sections of two tunnels, one carrying a road through Mont Blanc between France and Italy and the other carrying a railway between two islands in Japan.","Overall, the two tunnels differ in almost every respect shown. The Senkan Railway Tunnel is much longer, runs beneath the sea rather than a mountain and took far longer to complete than the Mont-Blanc Road Tunnel.","The Mont-Blanc Road Tunnel was constructed between 1957 and 1965. It is 11.60 km long and links the French and Italian ends in a straight, horizontal line, with up to 3.5 km of mountain directly above it. Its shape is therefore simple, following the base of the mountain from one side to the other.","The Senkan Railway Tunnel, built between 1946 and 1988, connects Hakodate City on Hokkaido Island to Aomori City on another Japanese island. It is 53.85 km long, almost five times the length of the road tunnel. Rather than running horizontally throughout, the railway tunnel slopes downwards from both ends before levelling off under the seabed of the Tsugaru Strait, at a depth of 240 metres below sea level. The project lasted 42 years, which is 34 years longer than the construction of the Mont-Blanc tunnel."]]},{"id":"W1-MP-38","task":1,"type":"Map or plan","prompt":["The maps below show the changes that occurred to a town named Willington in 1780, 1860, and 2000.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-38-1.jpg","w":1024,"h":765}],"models":[["The given maps illustrate the differences in the layout of a town named Willington in 1780, 1860, and 2000.","Overall, Willington developed from a small farming settlement surrounded by woodland into a much larger town, as its farmland and woods gradually disappeared. Over the same period, the number of homes increased fivefold, and new transport links and public facilities were added.","Looking at the town in 1780, there were four plots of farmland on the eastern side of a river that crosses the Western half of the map. Near the farmland, there were two villages, comprising 100 houses. The rest of Willington was mostly covered by a forest.","In 1860, significant changes were made to the town. These included the construction of a bridge crossing the river and a road providing access from the river to the villages. The area of farmland was halved, going from four to only two plots. While 100 more homes were built, equivalent to an additional village altogether, the wooded area began to shrink in size.","By 2000, the woods and the farmland had been completely cleared and replaced by two school buildings and four sports fields, linked to the villages by a new road. Meanwhile, the housing area of Willington continued to grow, reaching 500 homes in six villages. Additionally, two other additions were made to the area around the river: a row of shops along the eastern bank and a wetland for birds at the southern end of the river."]]},{"id":"W1-MP-39","task":1,"type":"Map or plan","prompt":["The diagrams show how the layout of a school library changed.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-39-1.jpg","w":825,"h":1024}],"models":[["The diagrams illustrate how the layout of a school library has changed, comparing its arrangement five years ago with the current plan.","Overall, the library has shifted from a traditional space built around books and administration towards a more technology-oriented and flexible facility. The top book shelves, the meeting room and the general arrangement of rooms were the only features to remain untouched.","Along the left-hand side, the classroom has been converted into a recording studio, and the single borrowing and returning desk has been divided into two separate counters, one for each function, while the meeting room has stayed in place. On the right, the vertical desk for computers has been replaced by desks for students’ laptops, and the library office in the bottom right corner has been transformed into a conference room.","The central area has also been reorganised. The four studying tables, which formed a two-by-two block, have been increased to six private studying tables set out in two rows of three. Meanwhile, the book shelves at the top centre have been retained, but those at the bottom centre have been removed to make way for further desks for students’ laptops, so the library now offers less shelving and more working space."]]},{"id":"W1-MP-40","task":1,"type":"Map or plan","prompt":["The maps below show a beachfront area in Australia in 1950 and today.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-40-1.jpg","w":687,"h":1024}],"models":[["The two maps illustrate the changes that have taken place in a beachfront area in Australia between 1950 and the present day.","Overall, the area has been developed into a better-equipped leisure destination, with new parking, dining and surfing facilities added, mostly on its western side. The beach, the lighthouse and the central amenities, however, have remained unchanged.","The most extensive alterations have occurred in the west. The playground that once stood near the city end of the road has been cleared to make way for a second car park, while a restaurant has been built along the western edge of the site with a surf club beside it. Directly below, the original 25-metre pool has been enlarged into a 50-metre pool. The road from the city, which in 1950 terminated at the car park in the northeast, has also been extended eastwards and now turns south, running along the eastern boundary as far as the lighthouse.","By comparison, the eastern half has seen only one addition, a second surf club positioned between the existing car park and the 25-metre pool. This pool and the neighbouring lighthouse have retained their original positions, as have the dining tables and the pavilion in the centre of the area. The beach itself also remains untouched at the bottom of the map."]]},{"id":"W2-OP-01","task":2,"type":"Opinion","prompt":["Because international tourism brings economic benefits, governments in developing countries should prioritise it over protecting local traditions and natural environments. To what extent do you agree or disagree?"],"imgs":[],"models":[["For many developing nations, international tourism is one of the few reliable sources of foreign currency and employment. Some therefore argue that governments should place it above the protection of local customs and ecosystems, but I strongly disagree, since culture and nature are the very assets that attract visitors and much of the damage done to them can never be undone.","Admittedly, the economic case for prioritising tourism is persuasive, particularly in countries with a narrow industrial base. Firstly, visitor spending supports a wide range of livelihoods, from hotel staff and tour guides to street vendors and the farmers who supply restaurants. In regions with few factories or offices, these jobs may be the main alternative to subsistence farming or migration to the city. Secondly, tourism generates tax revenue that can be channelled into schools, hospitals and roads. For example, island states such as the Maldives depend heavily on tourism income to fund their public services. However, this argument rests on a false choice, as protecting heritage and ecosystems does not hold growth back. From this perspective, the benefits of tourism are real, but they do not justify sacrificing what makes a destination valuable.","The more fundamental point is that a country’s culture and environment are its main attractions, and many of them are irreplaceable. To begin with, visitors rarely travel thousands of kilometres for generic resorts; they come for unspoilt coastlines, rainforests and ways of life unlike their own. If unchecked hotel construction turns a pristine bay into an overcrowded strip, demand eventually moves elsewhere. A case in point is Boracay in the Philippines, which the government closed to tourists for six months in 2018 after years of uncontrolled development had polluted its waters. In addition, damage to traditions and nature is often permanent. A polluted river may take decades to recover, and a ritual staged nightly for tour groups can gradually lose its meaning for the community that practises it. Therefore, safeguarding these assets protects local residents and the long-term tourism economy alike.","In conclusion, although tourism brings substantial economic benefits, governments should not prioritise it over local traditions and natural environments, since these attractions sustain the industry and are often impossible to restore. Developing countries should therefore manage tourism so that its revenue funds the preservation of the places and cultures it depends on."]]},{"id":"W2-OP-02","task":2,"type":"Opinion","prompt":["Computers and the Internet have made it possible for office workers to do much of their work from home instead of working in offices every day. People say that working from home should be encouraged.","What is your opinion?"],"imgs":[],"models":[["Advances in computing and high-speed Internet have made the home a realistic alternative to the office for millions of employees. Remote work offers clear benefits, giving staff greater flexibility and saving companies considerable costs, but it also brings distractions and weakens team relationships. In my view, working from home should be encouraged, but as part of a balanced arrangement that still includes regular time in the office.","Working from home brings substantial advantages for both employees and employers. Firstly, it gives workers greater control over their time. Without a long daily commute, employees gain hours each week that can be spent with family, exercising or resting, and they can more easily combine their jobs with caring for children or elderly relatives. For example, a parent working remotely can take a child to school in the morning and still complete a full day’s work. Secondly, remote work allows companies to reduce their overheads. Renting and maintaining large offices involves heavy spending on rent, electricity and equipment, so firms with fewer staff on site can redirect these savings into new projects or bonuses for high performers. For these reasons, remote work clearly benefits both sides of the employment relationship and is worth encouraging.","Nevertheless, working entirely from home has drawbacks that make some office presence necessary. To begin with, the home environment is full of distractions that do not exist in a well-organised office. Household chores, noisy family members and personal devices can easily interrupt concentration, and without direct supervision some employees find it difficult to separate work from personal life, which may reduce productivity. In addition, purely remote arrangements can weaken relationships within a team. Informal conversations, spontaneous problem-solving and face-to-face meetings help colleagues build trust and share knowledge, which video calls only partly replace. To illustrate, a new graduate who never meets colleagues in person may struggle to learn from experienced staff or feel part of the company. Consequently, the office still plays an important role in maintaining focus and team spirit.","In conclusion, working from home deserves encouragement because it offers flexibility to workers and savings to employers, but its distractions and isolating effects mean that it should not replace the office entirely. Companies should therefore adopt hybrid schedules, allowing staff to work remotely on some days while meeting in person on others."],["The rapid spread of video conferencing and cloud-based software has transformed the idea of where work must take place. I firmly believe that working from home should be encouraged, as it improves employees’ well-being and allows firms to recruit from a much wider pool of talent, while its main drawbacks, such as weaker collaboration, can be managed with the right tools and practices.","Remote work offers advantages that benefit both individual workers and the organisations that employ them. Firstly, it has a positive effect on employees’ well-being. Removing the daily commute reduces stress, fatigue and travel costs, and the time saved can be spent on sleep, exercise or family life, which leaves staff more rested and motivated. Secondly, remote work enables companies to hire the best candidates regardless of where they live. Talented people in small towns, those with disabilities that make travel difficult and parents with caring responsibilities can all contribute fully without relocating or commuting. For instance, a software firm in Hanoi can employ a skilled developer living in a provincial town without asking that person to move to the capital. Taken together, these benefits make remote work attractive to employees and employers alike, and they are difficult to achieve in a traditional office.","Admittedly, working from home can make collaboration and supervision more difficult, but these problems are far from insurmountable. To begin with, communication between colleagues can be maintained through digital platforms. Shared documents, messaging apps and regular video meetings allow teams to exchange ideas and solve problems quickly, even across different cities, while occasional in-person gatherings can strengthen personal relationships. In addition, managers can monitor progress by focusing on results rather than hours spent at a desk. Setting clear weekly goals and reviewing completed work gives a more accurate picture of performance than simply observing who is present in the office. To illustrate, many technology companies have operated with largely remote teams for years by relying on clear targets and regular online check-ins. Therefore, the challenges of remote work call for better management rather than a return to the office.","To sum up, working from home should be encouraged because it improves well-being and widens access to talent, while its difficulties with collaboration and supervision can be overcome. Employers should therefore invest in digital tools and results-based management so that remote work can reach its full potential."]]},{"id":"W2-OP-03","task":2,"type":"Opinion","prompt":["Some people believe that scientific research and development should be carried out by governments rather than private corporations. What is your opinion?"],"imgs":[],"models":[["Scientific discoveries now shape almost every part of modern life, from the medicines people take to the phones they carry. While private corporations make an important contribution to research and development, I believe governments should play the leading role, because public bodies prioritise the common good and can fund the long-term basic research on which later innovation depends.","Private companies undoubtedly bring valuable strengths to scientific research. Firstly, they are highly effective at turning discoveries into practical products. Because their survival depends on meeting consumer demand, firms invest heavily in development, testing and manufacturing, and they can move from laboratory to market far faster than most public institutions. For example, technology companies have refined touchscreens, batteries and processors into the smartphones now used by billions of people. Secondly, competition between corporations encourages constant improvement. Rival firms race to offer better and cheaper products, which pushes them to fund research that keeps them ahead. Much of the rapid improvement in electric vehicle batteries over the past decade has been driven by this kind of rivalry. However, this commercial focus means that companies concentrate on projects likely to make a profit. From this perspective, private research is efficient but inevitably selective.","Governments, by contrast, are better placed to direct research towards the long-term public interest. To begin with, public funding can support basic research that has no immediate commercial value. Studies in physics, biology or mathematics may take decades to produce practical applications, so profit-driven firms are reluctant to finance them, yet they lay the foundations for future breakthroughs. A case in point is the Internet, which grew out of ARPANET, a network funded by the United States Department of Defense in the late 1960s. In addition, governments can ensure that the benefits of research are widely shared. Publicly funded findings are often published openly, and states can steer research towards areas such as climate change, public health and agriculture, which matter to all citizens regardless of income. Therefore, government leadership ensures that research serves society as a whole rather than only paying customers.","In conclusion, private corporations bring speed and practical focus to scientific development, but governments should take the main responsibility because they support basic research and protect the public interest. Governments should therefore maintain strong research budgets while forming partnerships that allow companies to turn publicly funded discoveries into useful products."]]},{"id":"W2-OP-04","task":2,"type":"Opinion","prompt":["It is said that children should be encouraged to build a small network of close acquaintances from a young age, instead of befriending a wide range of people without many close relationships.","What is your opinion on this?"],"imgs":[],"models":[["Friendships formed in childhood play a significant role in shaping how people relate to others for the rest of their lives. I agree that children should be encouraged to build a small circle of close friends rather than a large number of superficial ones, as deep friendships teach them how to sustain meaningful relationships and provide vital emotional support, while wider social circles can develop naturally as they grow older.","Encouraging a few close friendships benefits children both socially and emotionally. Firstly, it allows them to learn the skills involved in maintaining a genuine relationship. Real intimacy requires time, attention and repeated interaction, and by investing these in a few friends, children learn to share, compromise, apologise and resolve disagreements. Spreading their attention across dozens of acquaintances, by contrast, tends to produce shallow interactions that teach little about trust. Secondly, close friends offer emotional security during difficult moments. A child who has a trusted companion is more likely to talk openly about worries and to recover from setbacks such as poor marks or conflicts at home. For example, a pupil who is teased in the playground can cope far better with the support of one loyal friend than with many casual acquaintances who do not step in. For these reasons, close friendships form a strong foundation for children’s emotional development.","Admittedly, having a wide range of acquaintances has its own merits, but this goal suits older children and adults better. To begin with, young children are still developing basic social skills, so pressure to befriend large numbers of people can overwhelm them. Shy children in particular may feel anxious if constantly pushed into new groups. In addition, broader networks tend to develop naturally later in life. Secondary school, university and work bring constant opportunities to meet new people, and adolescents who have learned the value of trust in close friendships are better equipped to build healthy connections within these larger circles. To illustrate, a university student who has kept one childhood best friend often knows what a reliable friendship looks like and chooses new friends more wisely. Consequently, the priority in childhood should be depth rather than breadth.","In conclusion, children benefit more from a few close friendships, which teach relationship skills and provide emotional support, than from many shallow ones, especially as wider networks usually come later. Parents and teachers should therefore give children time to strengthen their existing friendships rather than pushing them to be popular."]]},{"id":"W2-OP-05","task":2,"type":"Opinion","prompt":["Some people say that children should start learning foreign languages as early as possible, otherwise they would face huge setbacks later on.","What is your opinion?"],"imgs":[],"models":[["In an increasingly interconnected world, the ability to speak a second language has become a valuable asset for education and employment. I agree that children should start learning foreign languages as early as possible, since young learners acquire pronunciation and grammar more naturally and gain cognitive benefits, and the concern that early study overloads them can be addressed through appropriate teaching methods.","Early language learning offers advantages that become harder to obtain with age. Firstly, young children absorb new sounds and structures with remarkable ease. Their developing brains are highly receptive to the rhythm and pronunciation of a language, so they tend to imitate native speakers closely rather than translating word by word as adults often do. For example, a child who listens to English songs and cartoons from the age of four often develops a more natural accent than a teenager who begins formal lessons at fifteen. Secondly, learning a second language strengthens general thinking skills. Switching between two vocabularies and grammatical systems exercises memory, attention and problem-solving, abilities that support performance in other subjects such as mathematics and science. In other words, an early start is a valuable investment in a child’s overall development.","Some argue that children should first master their mother tongue and core subjects, as an additional language might overwhelm them. While this concern is understandable, it can largely be resolved through the way languages are taught. To begin with, early lessons need not resemble the grammar drills used with older students. Learning through songs, games and stories keeps the experience enjoyable and pressure-free, so young children treat the new language as play rather than work. In addition, parents and teachers can monitor each child’s progress and adjust the amount of exposure accordingly. A child who seems confused can spend less time on the foreign language, while one who enjoys it can be given more. To illustrate, many primary schools introduce English through short daily sessions of rhymes and picture books, which add little burden to the timetable. Therefore, the risk of overload is a reason to teach carefully, not a reason to wait.","In conclusion, starting foreign languages early helps children develop natural pronunciation and stronger thinking skills, and concerns about overload can be managed through playful, flexible teaching. Schools and parents should therefore introduce a second language in the early years, using methods that keep learning enjoyable."],["As globalisation increases demand for multilingual workers, many parents now enrol their children in language classes before they can even read. I agree to a large extent that an early start is beneficial, because young children learn pronunciation more naturally and are less afraid of making mistakes. However, the claim that late starters will face huge setbacks is exaggerated, since motivation and good teaching matter as much as age.","The case for early language learning rests mainly on children’s natural abilities and their relaxed attitude to mistakes. Firstly, young children are exceptional imitators. By copying the adults and media around them, they pick up the sounds and patterns of a language naturally, which often allows them to achieve a more native-like accent than people who begin in adolescence. Secondly, children are generally less self-conscious than older learners. They willingly experiment with new words and sentences without worrying about sounding foolish, and this willingness to speak gives them far more practice. For example, a six-year-old may happily repeat a new phrase dozens of times in a game, whereas a teenager might stay silent for fear of embarrassment. For these reasons, early childhood is an ideal period to begin learning a foreign language.","Nevertheless, it would be wrong to suggest that those who start later are doomed to fail. To begin with, older learners possess advantages of their own. Adolescents and adults can understand grammatical explanations, use dictionaries and apply study strategies consciously, so they often make faster progress in the early stages than young children do. To illustrate, many adults who begin learning English at university go on to reach a high level of fluency, particularly when they need it for work or study abroad. In addition, an early start is only effective if children receive enough high-quality exposure. One short lesson a week with an untrained teacher may achieve very little, so the age of starting is less important than the quality and quantity of instruction. Therefore, an early start is helpful but not essential for success.","In conclusion, children should ideally begin learning foreign languages early because they imitate sounds easily and learn without fear, but a later start does not necessarily lead to failure. Governments should therefore ensure that early language programmes are well resourced, while reassuring older learners that determined study can still bring excellent results."],["In today’s globalised society, foreign language proficiency plays an increasingly important role in education, careers and international communication. I completely agree that children should begin learning foreign languages as early as possible, as this builds their confidence and openness towards other cultures, while delaying it risks leaving them at a lasting disadvantage.","Learning a foreign language from an early age brings significant benefits for children’s personal development. Firstly, it helps them become more confident communicators. Children who grow up using two languages become used to expressing themselves in different ways and adapting to different listeners, which makes them more willing to speak up in class and in unfamiliar social situations. This confidence often extends to other areas of school life, such as presentations and group work. Secondly, early language learning opens children’s minds to other cultures. Through foreign songs, stories and festivals, young learners discover that people around the world think and live differently, which encourages curiosity and tolerance rather than suspicion. For example, a child who learns Japanese through picture books may become fascinated by Japanese customs and later make friends with exchange students more easily. In short, an early start shapes children into confident and open-minded individuals.","On the other hand, delaying foreign language learning can create obstacles that are difficult to overcome. To begin with, older beginners may miss the period when the ear is most sensitive to new sounds. As a result, they often find it harder to distinguish and reproduce unfamiliar sounds, which can affect both their pronunciation and their listening comprehension for years. In addition, a late start can widen the gap between learners in the same class. Students who begin at secondary school may find themselves far behind classmates who started in kindergarten, and this difference can damage their confidence and motivation. To illustrate, a twelve-year-old who joins a class where most pupils already read simple English stories may feel embarrassed to participate and gradually lose interest. Therefore, postponing language learning can limit children’s progress and future opportunities.","In conclusion, beginning a foreign language early builds children’s confidence and cultural awareness, while delay can lead to weaker pronunciation and a damaging gap with their peers. Parents and schools should therefore introduce foreign languages as early as possible, making the most of the years when children learn most naturally."]]},{"id":"W2-OP-06","task":2,"type":"Discussion","prompt":["Since online shopping has become increasingly popular nowadays, some people say that it will completely replace traditional shopping in shops, stores and supermarkets soon. Some others disagree. Discuss both views and give your opinion."],"imgs":[],"models":[["The growth of e-commerce over the past decade has transformed the way people buy everything from clothes to groceries. Some believe that online shopping will soon replace shops, stores and supermarkets entirely because of its convenience and lower prices, while others argue that physical stores offer a hands-on and social experience that the Internet cannot provide. In my view, although online shopping will keep expanding, it will not completely replace traditional retail.","Those who expect online shopping to take over point to its powerful advantages. The most important is convenience, as people can now buy almost anything from home at any hour using only a phone. This saves them the time and effort of travelling to a shop, queuing at the till and carrying heavy bags home. For example, a busy worker can order a whole week’s groceries in a few minutes during a lunch break. In addition, online shopping tends to be cheaper and offers far more choice. Sellers who operate only on the Internet avoid the heavy cost of renting and staffing physical shops, and a single website can display more products than any store could fit on its shelves. For these reasons, it is easy to see why some people believe online shopping could eventually overtake the traditional kind.","Those who disagree, however, argue that physical shops provide benefits the Internet cannot fully replace, and I share this view. One key advantage is the chance to examine products in person. Customers can touch, try on and inspect goods before paying, which matters a great deal for items such as clothes, furniture and fresh food, and they avoid the risk of delivery delays or damaged parcels. Another important point is that shopping is often an enjoyable activity in itself. Many people treat a trip to the shops as a social outing with friends or family, combining it with a meal or a film in a way that clicking a button at home cannot match. To illustrate, even online retailers such as Amazon have opened physical stores, suggesting that customers still value shopping in person. Because of these lasting advantages, physical stores are likely to remain an important part of people’s lives.","In conclusion, while online shopping offers convenience, lower prices and greater choice, traditional shops provide the chance to inspect goods and a social experience that the Internet cannot replicate. Retailers should therefore combine both channels, using their websites for convenience and their stores for service and experience."]]},{"id":"W2-OP-07","task":2,"type":"Opinion","prompt":["Public celebrations (such as national days, festivals, etc.) are held in most countries. These are often quite expensive and some people say that governments should spend their money making more useful investments.","Do you agree or disagree?"],"imgs":[],"models":[["National days, traditional festivals and anniversaries of historical events are marked in most countries with fireworks, parades and concerts, often funded by the state. I agree to a large extent that much of this money would be better spent on more useful investments such as public services and research. However, I do not believe celebrations should lose public funding entirely, as they strengthen national unity and attract tourists.","There are many pressing needs that deserve public money more than large-scale celebrations. Firstly, essential services such as schools and hospitals remain underfunded in many places. These facilities affect citizens every day, and without adequate government investment, families must rely on expensive private alternatives, which places the heaviest burden on those with the lowest incomes. For example, the cost of a single night of fireworks in a major city could fund the repair of classrooms in a rural district where students study in overcrowded buildings. Secondly, scientific and technological development requires sustained funding. Without investment in universities and research, a country risks falling behind its competitors and losing the innovations that drive future growth. Such investment may not produce visible results immediately, but its benefits accumulate over decades. For these reasons, governments should seriously reconsider how much they spend on festivities that last only a day or two.","Nevertheless, public celebrations bring benefits that justify a reduced, rather than abolished, budget. To begin with, they help build national pride and a sense of unity. Events that commemorate historical achievements or traditional values bring people of different backgrounds together and remind them of their shared identity, which can strengthen social cohesion. In addition, well-organised festivals can generate considerable income. They attract domestic and international visitors who spend money on hotels, restaurants and transport, so part of the original cost is recovered through the wider economy. To illustrate, the Rio de Janeiro Carnival draws huge numbers of tourists every year and supports a great many local businesses. Therefore, a carefully reduced budget for celebrations is more sensible than eliminating them altogether.","In conclusion, while public funds should be directed mainly towards essential services and scientific progress, celebrations deserve a modest share because they promote unity and boost tourism. Governments should therefore scale down extravagant displays and seek private sponsorship, allowing important events to continue without draining resources from more urgent priorities."],["Lavish public celebrations, from national day parades to New Year firework displays, have long been funded by governments around the world. I completely agree that this money should be redirected towards more useful investments, since celebrations bring only short-lived benefits and can be financed in other ways, whereas areas such as infrastructure and workforce training deliver lasting gains for citizens.","Public celebrations are a questionable use of government budgets for two main reasons. Firstly, their benefits rarely last beyond the event itself. A parade or fireworks display may entertain crowds for a few hours, but it does little to improve citizens’ health, education or living standards in the long term, and it can even leave behind litter, noise and traffic congestion that cost more public money to address. For example, after large New Year’s Eve gatherings, city streets are often covered in rubbish that requires an expensive clean-up operation. Secondly, such events can be funded without relying on taxpayers. Corporate sponsors, ticket sales and community fundraising are viable alternatives, and businesses are often eager to associate their brands with popular festivals, since this gives them valuable publicity. Consequently, spending large sums of public money on celebrations represents a clear misallocation of limited resources.","By contrast, investment in other areas produces benefits that last for decades. To begin with, public infrastructure such as roads, hospitals and flood defences improves the safety and quality of life of every citizen. These facilities continue to serve the population long after they are built, and they are particularly important for communities that cannot afford private alternatives. A case in point is Japan, whose long-term investment in earthquake-resistant buildings and early warning systems has saved countless lives. In addition, funding training for teachers, nurses and skilled workers strengthens the economy. A well-trained workforce is more productive and adaptable, which raises incomes and attracts investment. Unlike a fireworks display, these skills continue to benefit the economy throughout a worker’s career. Therefore, these areas offer a far greater return on public spending than any single celebration.","In conclusion, government money spent on public celebrations brings only temporary benefits and could be replaced by private funding, while infrastructure and workforce training improve lives for generations. Governments should therefore leave the financing of festivities largely to sponsors and communities and concentrate public budgets on long-term investments."]]},{"id":"W2-OP-08","task":2,"type":"Opinion","prompt":["The education you receive from your family is more important than the education you receive from school.","To what extent do you agree with this statement?"],"imgs":[],"models":[["Children learn from many sources as they grow up, but their families and their schools are by far the most influential. I disagree that family education is more important than schooling, as each provides something the other cannot. Families shape a child’s values and emotional security, whereas schools deliver structured knowledge and the social skills needed in a wider community.","The education children receive at home forms the foundation of their character. Firstly, families are the first and most powerful teachers of values and behaviour. Through daily example and correction, parents teach honesty, respect and manners, and children tend to adopt the attitudes they observe at home long before they enter a classroom. These early lessons are difficult to undo later, which is why the home has such lasting influence. Secondly, a supportive family provides the emotional security that makes learning possible. Children who feel loved and encouraged develop self-esteem and resilience, so they are more willing to attempt difficult tasks and recover from failure. For example, a pupil whose parents praise effort rather than only results is often more persistent when faced with a challenging mathematics problem. In this sense, family education prepares children to benefit from everything they learn later.","However, schools offer an education that families can rarely replicate. To begin with, they provide systematic instruction across a broad range of subjects. Trained teachers follow a carefully designed curriculum in mathematics, science, literature and foreign languages, giving students the knowledge and qualifications needed for further study and employment. Even highly educated parents seldom have the time or expertise to teach all of these subjects to the same standard. In addition, schools allow children to interact with peers and adults from diverse backgrounds. Working in groups, resolving disagreements with classmates and following shared rules teach cooperation and tolerance that are difficult to learn within a single household. To illustrate, a group science project requires students to divide tasks, negotiate ideas and meet deadlines together, much as they will in future workplaces. Therefore, school education is just as essential as the lessons learned at home.","In conclusion, family education instils values and emotional security, while schools provide structured knowledge and social experience, so neither can be considered more important than the other. Parents and teachers should therefore communicate regularly and reinforce each other’s efforts, ensuring that children receive a complete education."],["From the moment children are born, they begin learning from the people around them, long before they ever sit in a classroom. I agree only in part that family education is more important than schooling. It is more influential in shaping character and attitudes to learning, but schools are more important when it comes to academic knowledge and preparing young people for work.","The education provided by families is more important in forming a child’s character and approach to learning. Firstly, the values children absorb at home tend to remain with them for life. Parents teach right and wrong, manners and responsibility through constant daily example, and these lessons are reinforced over many years in a way that school rules cannot match. Secondly, families largely determine how children feel about learning itself. Parents who read with their children, answer their questions patiently and show interest in their progress create curiosity and motivation, which then influence how well they perform at school. For example, a child who has been read bedtime stories every night is likely to start school with a wider vocabulary and a genuine love of books. For these reasons, the family’s influence on character and motivation outweighs that of any school.","On the other hand, schools are more important in providing knowledge and preparing children for adult life. To begin with, they offer specialised instruction that most families, however devoted, cannot provide. Subjects such as chemistry, advanced mathematics and foreign languages require qualified teachers, laboratories and structured courses, and without them students would lack the qualifications needed for university and skilled careers. In addition, schools introduce children to the rules and relationships of a wider society. Students must follow timetables, meet deadlines and work with classmates they did not choose, which prepares them for the expectations of the workplace. To illustrate, a student who leads a class project learns to coordinate peers and take responsibility for results, skills that are rarely practised at home. Therefore, in academic and professional terms, school education clearly plays the greater role.","In conclusion, family education is more important for shaping values and motivation, whereas school education matters more for knowledge and preparation for working life. Parents should therefore take their role as first educators seriously, while governments ensure that every child has access to high-quality schooling."],["Education is widely recognised as one of the most important influences on a child’s future. While some argue that what children learn at home matters most, I believe family upbringing and formal schooling are equally important, since families build moral character and emotional intelligence, while schools develop intellectual abilities and the teamwork skills demanded by modern society.","Family education lays the foundation for moral and personal growth. Firstly, parents are children’s first role models, instilling values such as respect, self-discipline and responsibility that shape behaviour for years to come. Because these lessons are repeated daily in real situations, they become deeply rooted habits rather than abstract rules. For instance, parents who encourage a child to apologise for mistakes or share toys with siblings nurture empathy and social awareness from an early age. Secondly, the emotional support offered by a family gives children a sense of security that is essential for their mental well-being. Without this stable base, young people may struggle with confidence and find it harder to form healthy relationships. No school, however well run, can fully replace the security of a caring home. Consequently, family upbringing plays a decisive role in forming a child’s character.","Formal schooling, however, is equally indispensable for intellectual and social development. To begin with, schools provide systematic instruction in demanding subjects that enhance cognitive abilities and open up career options. While parents may help with reading and basic arithmetic, few possess the expertise to teach physics, computer programming or literature at an advanced level. For example, a student who learns coding at school may discover a talent that leads to a career in technology, an opportunity the family alone could not have offered. In addition, schools give students the chance to collaborate with peers from varied backgrounds. Group projects, sports teams and clubs refine skills such as communication, negotiation and problem-solving, which are increasingly valued by employers. Ultimately, formal education equips children to meet the demands of a competitive and rapidly changing society.","In conclusion, families build the moral values and emotional security children need, while schools provide the academic knowledge and teamwork skills required for future success, so neither form of education is more important than the other. Families and schools should therefore work as partners, keeping each other informed about a child’s progress and needs."]]},{"id":"W2-OP-09","task":2,"type":"Opinion","prompt":["It is believed that when choosing a job, young adults should always prioritize long-term salary over job satisfaction.","What is your opinion on this?"],"imgs":[],"models":[["Choosing a first career is one of the most consequential decisions young adults make, affecting their finances, health and sense of purpose for years. Although a high long-term salary offers valuable security, I disagree that it should always take priority, because job satisfaction leads to better performance, a more sustainable career and greater personal fulfilment.","Advocates of prioritising salary make a reasonable case, but it has clear limits. Firstly, a well-paid job provides financial stability. A reliable and growing income allows young people to support their families, buy a home, save for retirement and cope with emergencies, all of which become harder on a low wage. For example, a graduate who accepts a highly paid position at an investment bank may be able to buy a flat years earlier than friends in lower-paid fields. However, focusing on money alone can come at a serious cost. Long hours in an unfulfilling role often lead to stress and burnout, which can damage both mental and physical health and eventually reduce a person’s ability to earn at all. From this perspective, salary is important, but it is not a sufficient reason on its own to choose a job.","By contrast, prioritising job satisfaction brings benefits that money cannot buy. To begin with, people who enjoy their work tend to perform better and stay committed for longer. Genuine interest in the job encourages them to work harder and keep improving, which often results in promotions and, ultimately, a respectable income anyway. To illustrate, a young designer who loves her craft may begin on a modest salary but build such a strong portfolio that she later earns more than peers who chose safer, better-paid paths. In addition, satisfying work contributes to overall well-being. A job that matches a person’s values and interests provides a sense of purpose and achievement, which supports mental health and makes the many hours spent at work feel worthwhile. Therefore, job satisfaction offers a more reliable foundation for a successful and happy career.","To sum up, although a high long-term salary provides financial security, prioritising it at the expense of satisfaction risks burnout, while enjoyable work encourages strong performance and personal fulfilment. Young adults should therefore look for roles they find meaningful, while ensuring that the pay is sufficient to meet their basic needs."],["Young adults entering the job market often face a difficult choice between a position that pays well and one they genuinely enjoy. While I accept that salary matters, especially at the start of adult life, I believe job satisfaction deserves greater weight, as it encourages the skill development that drives long-term success and protects people’s mental health.","There are understandable reasons why some young people put salary first. The chief one is that a good income allows them to become financially independent at a stage of life when expenses are high. A well-paid position helps them repay student loans, rent their own accommodation and set money aside for plans such as further study or starting a family. Furthermore, money saved early in a career can grow considerably over time. Because savings and investments accumulate returns over decades, even modest amounts put aside in a person’s twenties can make a substantial difference by retirement. For example, a young engineer who accepts a better-paid job abroad may be able to clear her student debts within a few years. For these reasons, salary is clearly an important consideration for young adults.","Nevertheless, I would argue that job satisfaction should carry more weight in the early years of a career. Firstly, young adults who enjoy their work are more likely to develop valuable skills. Genuine interest motivates them to learn, take on challenges and seek feedback, and the expertise they build often leads to higher earnings later, whereas an unfulfilling job may offer good pay but little growth. To illustrate, a graduate who joins a small start-up out of passion may gain broad experience in marketing, finance and management that later earns a senior position. Secondly, a satisfying job helps protect mental health over the long term. Work occupies a large share of a person’s waking hours, so years spent in a disliked role can lead to stress, low mood and a sense of wasted potential, regardless of how generous the salary is. Therefore, satisfaction is the wiser priority for young people building their careers.","In conclusion, although a high salary offers independence and early savings, job satisfaction encourages skill development and safeguards well-being, making it the more important factor overall. Young adults should therefore choose work they find fulfilling, while seeking roles that offer fair pay and opportunities for growth."]]},{"id":"W2-OP-10","task":2,"type":"Opinion","prompt":["Employers should focus on personal qualities and experience instead of degrees and qualifications when choosing someone for a job.","To what extent do you agree?"],"imgs":[],"models":[["In a competitive economy, the quality of a company’s workforce is often what separates successful firms from struggling ones. I disagree that employers should focus on personal qualities and experience instead of degrees, as qualifications remain essential evidence of knowledge in many fields. In my view, effective recruitment should weigh both, since character and experience show how candidates will work, while qualifications confirm what they know.","Personal qualities and practical experience are undoubtedly valuable to employers. Firstly, attributes such as reliability, adaptability and willingness to learn determine how well new staff fit into a team. A candidate with excellent grades but poor communication or a negative attitude may disrupt colleagues and reduce productivity, whereas a cooperative employee often raises the performance of an entire department. Secondly, hands-on experience shows that a candidate can apply knowledge in real situations. People who have handled actual customers, projects or problems tend to need less training and can contribute ideas that academic study alone might not provide. For example, several large technology companies, including IBM, have removed degree requirements from many job advertisements in order to recruit skilled candidates who learned on the job. For these reasons, employers are right to give considerable weight to character and experience.","However, degrees and qualifications remain indispensable in the hiring process. To begin with, many professions require formally certified knowledge for safety and legal reasons. Doctors, engineers, pilots and lawyers must complete recognised training and pass examinations before they are allowed to practise, because mistakes in these fields can endanger lives or cause serious financial harm. In addition, qualifications offer a standardised way of comparing candidates. When hundreds of people apply for one position, degrees and certificates allow employers to identify those with the necessary background quickly and fairly, before assessing personality and experience in interviews. To illustrate, an accounting firm may shortlist only applicants with professional accounting certificates and then use interviews to judge integrity and teamwork. Therefore, qualifications provide a reliable foundation that personal qualities cannot replace.","To sum up, personal qualities and experience reveal how well candidates will perform and fit in, while qualifications prove essential knowledge and help employers compare applicants fairly. Employers should therefore use qualifications to set a minimum standard and then rely on interviews and practical tasks to select the candidate with the best character and experience."]]},{"id":"W2-OP-11","task":2,"type":"Opinion","prompt":["Some people say that classrooms should focus on being open, relaxing and friendly, rather than being serious and disciplined. To what extent do you agree or disagree?"],"imgs":[],"models":[["Ideas about what a good classroom looks like have changed considerably, with many schools moving away from strict rows of silent pupils. I agree only in part that classrooms should be open, relaxed and friendly rather than serious and disciplined. A friendly atmosphere reduces anxiety and encourages creativity, but a degree of discipline remains necessary for concentration and perseverance, so the best classrooms combine both.","A disciplined classroom offers important advantages that should not be abandoned. Firstly, clear rules create the conditions for concentration. When students know what behaviour is expected and what will happen if they break the rules, distractions such as chatting or phone use are minimised, allowing lessons to proceed efficiently. Secondly, discipline helps students develop perseverance and a strong work ethic. Completing assignments on time, revising regularly and following instructions carefully build habits that are essential for demanding tasks at university and work. For example, students who are required to submit homework every week tend to develop the self-discipline needed to manage long-term projects later in life. Consequently, a serious approach plays a crucial role in shaping both academic success and character.","Conversely, a relaxed and friendly environment brings benefits that strict systems often lack. To begin with, it reduces the stress that excessive pressure can cause. In highly rigid classrooms, students who struggle to meet expectations may become anxious and fearful of making mistakes, which harms both their well-being and their learning. A supportive atmosphere, by contrast, encourages them to ask questions and admit when they do not understand. In addition, openness allows students to explore their creativity. When teachers welcome unusual ideas and allow some freedom in how tasks are approached, students are more likely to experiment and discover their own talents. To illustrate, a literature class that invites students to debate different interpretations of a story often produces more original thinking than one in which the teacher simply dictates the correct answer. Therefore, friendliness and openness are essential for students’ emotional and personal growth.","In conclusion, while discipline supports concentration and perseverance, a relaxed atmosphere protects students from undue stress and fosters creativity, so neither approach should be pursued at the expense of the other. Teachers should therefore establish a few clear, consistently enforced rules while maintaining a warm and encouraging relationship with their students."],["The atmosphere of a classroom has a powerful influence on how much students learn and how they behave. I largely disagree that classrooms should prioritise being open and relaxed over being serious and disciplined, since order protects every student’s right to learn and teaches responsibility. Nevertheless, a friendly atmosphere has real value, provided that it operates within clear and consistently enforced rules.","A disciplined classroom is essential for effective teaching and learning. Firstly, order protects the learning time of the whole class. In a room of thirty students, even one or two disruptive individuals can prevent a teacher from explaining new material, so firm rules ensure that the majority are not held back by a few. For example, a teacher who must repeatedly stop a lesson to deal with noise may cover only half the planned content, leaving every student less prepared for examinations. Secondly, discipline teaches accountability and time management. When rules are applied consistently and reasonable consequences follow misbehaviour or missed deadlines, students learn that their actions have results, preparing them for the expectations of higher education and employment. For these reasons, discipline should remain the foundation of any classroom, whatever the age of the students.","That said, an open and friendly approach has clear benefits when it is combined with structure. To begin with, a warm relationship between teachers and students encourages participation. Students who feel comfortable are more willing to ask questions, share ideas and admit confusion, which allows teachers to identify problems early. In addition, enthusiasm for a subject often grows in a positive atmosphere, and motivated students tend to work harder and achieve better results. However, these benefits depend on a framework of rules, since unrestricted freedom tends to produce noise, distraction and lower productivity. To illustrate, a group discussion can be lively and productive when students know they must take turns and stay on topic, but it quickly becomes chaotic without such guidelines. Therefore, friendliness should complement discipline rather than replace it.","In conclusion, discipline is the most important element of an effective classroom because it protects learning time and builds accountability, although a friendly atmosphere can increase participation and motivation within that structure. Schools should therefore set firm, fair rules while training teachers to create a supportive environment in which students feel comfortable to contribute."]]},{"id":"W2-OP-12","task":2,"type":"Opinion","prompt":["With the rise of technology, translation tools have become so advanced that it is believed that acquiring foreign languages would no longer be useful or necessary in the near future.","To what extent do you agree or disagree?"],"imgs":[],"models":[["Recent advances in machine translation, most visibly in applications such as Google Translate, have led some people to argue that learning a foreign language will soon serve little purpose. Although these tools are undeniably useful, I strongly disagree that language learning will become unnecessary, since it brings cognitive benefits and a depth of communication that technology cannot replicate.","The appeal of this view is not difficult to understand. Firstly, translation applications are now fast, accurate enough for everyday purposes and available on almost every phone. They allow people to communicate acro
