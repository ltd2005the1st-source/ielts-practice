well-being. To begin with, constant background noise makes sustained concentration difficult. Phone calls and casual conversations interrupt workers repeatedly, so tasks that demand deep focus, such as drafting reports or analysing data, take longer and contain more errors. In addition, the lack of privacy can increase stress. Employees may hesitate to discuss sensitive matters when anyone nearby can listen, and those who feel permanently watched by supervisors often report lower job satisfaction. To illustrate, an accountant who needs to take a confidential call about a client’s finances may have to search for an empty meeting room or risk being overheard. What makes these drawbacks decisive is that they undermine the very collaboration open offices are meant to promote, since a team that cannot concentrate or speak freely is unlikely to perform better. Therefore, the damage to concentration, privacy and well-being outweighs the communication benefits and financial savings.","In conclusion, although open-plan offices make communication easier and reduce costs, they too often sacrifice concentration, privacy and employee well-being. Companies would therefore be wiser to combine shared areas for teamwork with quiet rooms where employees can work undisturbed."]]},{"id":"W2-AD-10","task":2,"type":"Advantages and disadvantages","prompt":["People now have the freedom to work and live anywhere in the world thanks to the development of communication technology and transportation.","Do the advantages of this development outweigh the disadvantages?"],"imgs":[],"models":[["In recent decades, affordable air travel and instant online communication have made national borders far less of a barrier to people’s careers. As a result, individuals can work remotely for foreign employers or relocate abroad with relative ease, which opens up new career prospects and strengthens ties between nations. However, I contend that the drawbacks of this freedom, namely social isolation and the loss of skilled workers from poorer countries, are considerably more significant.","Admittedly, greater mobility offers individuals wider career opportunities and helps to build a more connected global community. Firstly, instant communication tools and improved transport links allow people to pursue jobs that were once beyond their reach. Workers are no longer limited to local vacancies, so they can choose positions with higher salaries and better prospects while also gaining exposure to diverse cultures. For instance, a software developer in Vietnam can now work remotely for a European company, earning a competitive income without leaving home. Moreover, the movement of people across borders encourages international collaboration. Professionals who have lived or worked abroad often act as links between businesses in different countries, which facilitates cross-border partnerships and boosts foreign trade. Considering these points, the freedom to live and work anywhere benefits both individuals and national economies.","Nevertheless, this development can harm the well-being of those who move and weaken the countries they leave behind. The most immediate drawback is social isolation. People who relocate abroad or work entirely online often spend long periods away from family and friends, relying on video calls rather than face-to-face contact, which can lead to loneliness and weaker personal relationships. In addition, the ease of migration contributes to brain drain, as skilled professionals leave their home countries in pursuit of better pay. This deprives developing nations of the doctors, engineers and teachers they have invested in training, slowing their economic progress. A case in point is the Philippines, where large-scale emigration of nurses has left many local hospitals understaffed. For these reasons, the costs of this freedom tend to fall on families and poorer nations, which are least able to absorb them.","In conclusion, although advances in communication and transport have widened career choices and strengthened international ties, the isolation they can cause and the brain drain they accelerate are, in my view, more serious. Governments in developing countries should therefore offer stronger incentives to retain skilled workers, while employers of remote staff should create more opportunities for in-person contact."]]},{"id":"W2-AD-11","task":2,"type":"Advantages and disadvantages","prompt":["Many career choices demand vocational skills or specialist knowledge. However, despite this, most schools still focus on teaching academic subjects such as history or social studies.","Do the advantages of this outweigh the disadvantages?"],"imgs":[],"models":[["Although many careers today require vocational training or specialist expertise, most schools continue to concentrate on academic subjects such as history and social studies. While this focus can leave students short of practical skills and may bore those unsuited to classroom study, I believe these drawbacks are outweighed by its benefits, namely the broad thinking skills it builds and the way it keeps future options open.","There are real advantages to keeping schools focused on academic subjects. The first is that these subjects develop broad intellectual skills that are useful in almost any career. Studying history and social studies trains students to analyse information, build arguments and express themselves clearly, abilities that remain valuable whatever path they follow. For example, a student who learns to research and write essays at school will find those same skills useful later whether they become a lawyer, a manager or a journalist. A further benefit is that an academic education keeps students’ future options open rather than narrowing them too early. Since most teenagers are still unsure of what career they want, a general education allows them to explore different fields and provides the qualifications needed for university, the gateway to many specialist professions. For these reasons, an academic focus gives students a flexible and lasting foundation.","Nevertheless, this approach does carry some disadvantages. The main one is that it can leave students without the practical skills many jobs now demand, since theoretical subjects do little to prepare them for hands-on work such as coding or a technical trade. For example, a school leaver hoping to become an electrician or a software developer may finish their education with strong essay-writing skills but no training in the field they wish to enter. Another drawback is that a purely academic curriculum can disengage students who do not enjoy classroom study, as those with practical talents may find abstract lessons dull and lose motivation. However, these problems can be reduced by offering vocational options alongside academic ones, so they do not outweigh the lasting value of a broad education.","In conclusion, while a focus on academic subjects can neglect practical training and discourage some students, I believe its advantages are greater overall, because it builds transferable thinking skills and keeps young people’s futures open. The ideal solution is for schools to maintain their academic core while adding vocational choices, so that every student is well prepared for the path they choose."]]},{"id":"W2-AD-12","task":2,"type":"Advantages and disadvantages","prompt":["In many developing countries of the world, tourism is a major industry with great economic significance. However, it is said that tourism can also be a source of problems in these countries.","What are the advantages and disadvantages of tourism growth in developing countries? Do the advantages outweigh the disadvantages?"],"imgs":[],"models":[["For many developing nations, tourism has become a cornerstone of the economy, yet its rapid growth is often blamed for environmental and social problems. Although tourism can damage fragile ecosystems and disrupt local communities, I believe its advantages, particularly economic development and the preservation of cultural heritage, are greater.","Admittedly, tourism growth can create serious problems for developing countries. Firstly, it can damage the environment. The construction of resorts and the pressure of large visitor numbers can destroy habitats, deplete scarce resources such as water and pollute once-pristine beaches and forests. For example, Boracay in the Philippines had to be closed to tourists for six months in 2018 after years of uncontrolled development had polluted its waters. Secondly, tourism can bring social and economic instability. Property prices may rise beyond the reach of local residents, profits may flow to foreign hotel chains, and economies that depend heavily on tourism can be devastated by a single crisis, as the COVID-19 pandemic showed. From this perspective, the concerns about rapid tourism growth are clearly justified.","Nevertheless, the benefits of tourism growth are, in my view, more significant. To begin with, tourism drives economic development. Visitor spending generates foreign currency and creates jobs in hotels, restaurants, transport and guiding, providing incomes for people who might otherwise have few opportunities, while also encouraging investment in roads, airports and public services that benefit residents. In many developing countries, tourism is one of the largest sources of employment for young people and women. In addition, tourism can help preserve cultural heritage and traditional ways of life. When visitors come to see historic sites, traditional crafts and festivals, communities gain both the motivation and the funds to protect them. To illustrate, ticket revenue from visitors has helped fund the conservation of the ancient town of Hoi An in Vietnam, whose well-preserved architecture now attracts travellers from around the world. Therefore, the economic and cultural gains of tourism outweigh its drawbacks, particularly as most of its problems can be reduced through careful management.","In conclusion, although tourism growth in developing countries can harm the environment and cause social instability, the jobs, income and heritage protection it brings are more important. Governments should therefore manage tourism responsibly through sustainable planning, visitor limits and fair regulation, so that it remains a source of progress rather than lasting harm."]]},{"id":"W2-AD-13","task":2,"type":"Advantages and disadvantages","prompt":["More and more people now work from home rather than in an office. What are the advantages and disadvantages of this trend?"],"imgs":[],"models":[["Advances in digital communication have enabled a growing proportion of employees to carry out their duties from home rather than in a central workplace. This trend offers notable benefits in terms of flexibility and cost, but it also carries risks for teamwork and personal wellbeing.","The main advantages of remote work are greater flexibility and lower expense. Employees who work from home can arrange their hours around personal commitments, which tends to improve both job satisfaction and productivity. A parent, for example, can attend a school event during the afternoon and complete the remaining tasks in the evening. Working from home also removes the cost and fatigue of daily commuting. Workers save money on fares and fuel, while employers can rent smaller premises, so both sides benefit financially. Many employees also report fewer interruptions at home, which allows them to concentrate on demanding tasks for longer periods and finish projects more efficiently. Companies, in turn, can recruit from a much wider geographical area, since suitable candidates no longer need to live near the office. For these reasons, remote work makes employment more adaptable and less costly.","Against this, working from home can weaken collaboration and blur the boundary between work and private life. Colleagues who rarely meet in person may find it harder to build trust and exchange ideas informally, and newcomers in particular miss the guidance that comes from observing experienced staff. For instance, a junior employee in an office can ask a quick question at the next desk, whereas a remote worker may hesitate to interrupt a colleague with a message. In addition, the absence of a physical workplace makes it difficult to switch off. Employees may answer emails late into the evening, and isolation can leave some feeling lonely. Managers may also find it harder to monitor progress and give timely feedback, so problems can remain unnoticed for weeks. Employees without a quiet workspace or a reliable internet connection may find their efficiency falls, which makes the arrangement unequal. Consequently, remote work can undermine both teamwork and wellbeing if it is not managed carefully.","In conclusion, working from home provides flexibility and savings, but it risks weakening collaboration and personal balance. Employers should therefore adopt a hybrid model that combines remote days with regular time in the office, so that both sets of concerns are addressed."]]},{"id":"W2-AD-14","task":2,"type":"Advantages and disadvantages","prompt":["Some students choose to study at a university in a foreign country rather than on their own. Do the advantages of this outweigh the disadvantages?"],"imgs":[],"models":[["Increasingly, students are leaving their home countries to pursue degrees overseas. Although this choice can be expensive and emotionally demanding, I firmly believe that the academic, linguistic and personal benefits outweigh these drawbacks. The question is whether the long-term gains justify these short-term difficulties.","The principal drawbacks of studying abroad are financial pressure and homesickness. International tuition fees and living costs are usually considerably higher than domestic ones, which can leave families in debt or force students to take part-time jobs that distract from their studies. Moreover, living far from relatives and familiar surroundings can cause loneliness, particularly during the first months. For instance, a student who cannot return home for the holidays may struggle with isolation while adjusting to an unfamiliar climate and culture. However, these difficulties are generally temporary, and scholarships and university support services can reduce them. Students may also face unfamiliar academic expectations and a second language, which can lower their grades in the early stages. Visa regulations and limits on working hours add further uncertainty, and scarce accommodation in popular university cities can force some students into poor housing far from campus. The disadvantages, though genuine, are therefore manageable.","In contrast, the benefits are lasting and far-reaching. Students gain access to respected institutions and diverse teaching methods that may not be available at home, which strengthens their qualifications. Employers often value graduates with international experience, since it signals adaptability and independence. Students also improve their language skills and broaden their outlook by living among people from different backgrounds. A student in an English-speaking country, for example, practises the language daily and typically reaches fluency far faster than classroom study alone would allow. These advantages continue to help graduates throughout their careers. Many students form friendships and professional contacts with people from several countries, and these networks can lead to job opportunities long after graduation. Studying abroad also encourages greater self-reliance, because students must manage budgets and daily routines without family support. Taken together, they provide a return that outlasts the temporary costs of living abroad.","To conclude, studying abroad involves financial and emotional difficulties, but the academic and personal gains are more substantial and more durable. Universities and governments should therefore expand scholarships and support services so that more students can benefit from the experience."]]},{"id":"W2-AD-15","task":2,"type":"Advantages and disadvantages","prompt":["In many families, both parents now work full time and children spend much of their time in childcare or with relatives. What are the advantages and disadvantages of this?"],"imgs":[],"models":[["In many modern households, both parents are employed full time, and young children consequently spend a large part of the day in childcare or with relatives. This arrangement brings clear benefits for family income and children's social development, but it also limits the time that parents can devote to their children. Understanding both sides of this situation is important for parents and policymakers alike.","The main advantages are greater financial security and early social development. Two incomes allow families to afford better housing, education and healthcare, which creates a more stable environment in which children can grow up. Children in childcare also have regular contact with others of their own age. For example, a child at a nursery learns to share, take turns and cooperate with classmates, skills that help later when starting school. Relatives who help with childcare can similarly strengthen family ties and pass on traditions. Moreover, close ties with grandparents and other relatives give children a sense of belonging and cultural identity, which supports their emotional security as they grow older. These benefits show that shared responsibility for children can enrich both a family's circumstances and a child's development.","On the other hand, children may receive less individual attention from their parents, and parents themselves may suffer from exhaustion. Long working hours leave little time for the conversations, play and guidance that build a close emotional bond. A parent who returns home tired in the evening, for instance, may have little energy to help with homework or listen to a child's worries. This can leave children feeling neglected, and some may seek attention through misbehaviour. At the same time, the pressure of balancing work and childcare can cause stress and strain relationships between partners. Parents who feel constantly pressed for time may also feel guilty about missing important moments, such as a child's first words or school performances. Over time, this strain can reduce the enjoyment that family life should bring and affect the parents' health. Therefore, the lack of shared time can have negative consequences for the whole family.","To sum up, dual-income households benefit from financial stability and children's social development, but they risk reducing parental involvement and increasing stress. Employers should help by offering flexible hours and parental leave, so that parents can meet both their work and family responsibilities."]]},{"id":"W2-AD-16","task":2,"type":"Advantages and disadvantages","prompt":["Many people believe that governments should encourage the use of renewable energy sources such as solar and wind power. What are the advantages and disadvantages of relying on these sources?"],"imgs":[],"models":[["As concern about climate change grows, many governments are promoting renewable sources such as solar and wind power. These sources offer important environmental and economic advantages, yet their reliability and initial cost present genuine difficulties. A balanced view of these sources is therefore essential before governments commit large sums.","The most significant advantages are environmental protection and long-term economic benefit. Solar and wind installations produce electricity without burning fossil fuels, so they release far fewer greenhouse gases and help to slow global warming. They also draw on resources that will never run out, which reduces dependence on imported oil and gas. A household with solar panels, for example, can cut its electricity bills considerably once the equipment has been paid for. Over time, falling equipment prices and low running costs make renewable power increasingly competitive. Renewable sources can also create employment, since manufacturing, installing and maintaining the equipment requires a skilled workforce. Rural areas with ample sun or wind may benefit especially from the new investment. For these reasons, renewable energy supports both a cleaner environment and a more secure energy supply.","However, relying on these sources also raises practical problems. The first is intermittency. Solar panels produce little power at night or in cloudy weather, and wind turbines stop generating when the air is still, so supply does not always match demand. Unless efficient storage is available, countries may still need conventional power stations as a back-up. The second is the high initial investment. Building large solar farms and wind turbines requires substantial capital, and these projects also occupy extensive areas of land or coastline, which may affect wildlife and local communities. For instance, wind farms near residential areas often attract objections about noise and appearance. Repair and maintenance of this infrastructure can also be expensive, particularly offshore or in remote regions. In addition, the manufacture and disposal of panels and turbine blades creates waste, which means that renewable power is not entirely free of environmental cost. Consequently, the transition to renewables demands careful planning and considerable funding.","In conclusion, renewable energy protects the environment and ensures long-term supply, but its variability and high start-up costs cannot be ignored. Governments should therefore invest in storage technology and grid improvements, which would allow societies to rely on these sources with greater confidence."]]},{"id":"W2-AD-17","task":2,"type":"Advantages and disadvantages","prompt":["An increasing number of people are choosing to live in large cities rather than in the countryside. What are the advantages and disadvantages of this development?"],"imgs":[],"models":[["Across the world, a growing number of people are moving to large cities in search of a better life. This trend gives individuals access to employment and services that rural areas rarely provide, but it also creates problems of cost, congestion and stress. Understanding both sides is essential for anyone deciding where to build a career and a home.","The main attractions of city life are economic opportunity and access to services. Cities contain a wide range of employers, so residents have more choice of careers and usually earn higher wages than in the countryside. They also offer superior education, healthcare and cultural facilities. For example, a young graduate from a small town can find specialist jobs, universities, hospitals and public transport within a single metropolitan area. This concentration of opportunities allows people to develop their skills and improve their living standards more quickly. Cities also bring people into contact with a variety of cultures and ideas, which broadens their horizons and encourages creativity and innovation. Public transport networks further make it possible to live without owning a car. Cities therefore offer prospects that rural communities struggle to match.","On the other hand, urban living brings higher costs and a poorer quality of life for many residents. Housing is considerably more expensive in large cities, and a significant proportion of income may go on rent alone, leaving less for savings. Furthermore, crowded streets, heavy traffic and noise contribute to pollution and stress. Commuters who spend hours in traffic each day, for instance, have less time to relax or spend with their families, and long-term exposure to polluted air can damage health. These pressures can also weaken community ties, since residents often know few of their neighbours. Crime rates are often higher in densely populated areas, and small apartments offer little private space or access to green areas. People who grew up in smaller communities may feel anonymous and isolated, despite being surrounded by others. As a result, the very qualities that make cities attractive can undermine the wellbeing of those who live there.","To sum up, cities provide jobs and services but impose heavy financial and personal costs. Governments should therefore build affordable housing and efficient public transport, so that urban growth improves the lives of residents rather than diminishing them."]]},{"id":"W2-AD-18","task":2,"type":"Advantages and disadvantages","prompt":["Fast food and ready-made meals are becoming more popular as people have less time to cook. What are the advantages and disadvantages of this trend?"],"imgs":[],"models":[["As working hours lengthen and daily schedules become busier, more people are relying on fast food and ready-made meals instead of cooking at home. This habit saves time and money, but it can damage health and weaken family traditions. It is worth considering both sides of this change, since it affects people of every age.","The main advantages are convenience and affordability. Ready-made meals can be bought or heated within minutes, which is invaluable for people who return home late or have little energy after a long working day. They also free up time for other activities, such as study, exercise or time with family. A busy student, for example, can eat a quick meal between lectures rather than spending an hour in the kitchen. In addition, fast food is often cheap and widely available, so people on limited budgets can still obtain a filling meal. Meals can also be prepared with minimal cooking skills, which suits people who live alone or who have not learned to cook. The wide variety of dishes available further allows consumers to try different cuisines without leaving their neighbourhood. For these reasons, convenience food meets the needs of modern, time-pressed lifestyles.","However, regular consumption of such food carries serious drawbacks. Many ready-made products contain high levels of sugar, salt and saturated fat, and eating them frequently increases the risk of obesity, diabetes and heart disease. Individuals who rely on them may also lack essential nutrients that fresh fruit and vegetables provide. Furthermore, the decline in home cooking affects family life and practical skills. Families who no longer prepare and share meals together lose an important opportunity to talk, and children who do not see cooking at home may grow up unable to prepare a healthy meal themselves. Eating quickly in front of a screen or while travelling also encourages people to consume more than they need without noticing. The packaging used for takeaway meals creates large quantities of waste, which adds an environmental cost to the health concerns. Consequently, the convenience of fast food can come at a considerable long-term cost.","In conclusion, fast food and ready-made meals provide speed and affordability, but they threaten health and the habit of shared meals. Schools and governments should promote nutrition education and clear food labelling, so that people can enjoy the convenience without damaging their wellbeing."]]},{"id":"W2-AD-19","task":2,"type":"Advantages and disadvantages","prompt":["In some countries, people are living longer and the proportion of older people in the population is growing. Do the advantages of this development outweigh the disadvantages?"],"imgs":[],"models":[["Thanks to improved healthcare and living standards, people in many countries now live longer than previous generations, and older citizens make up a growing share of the population. Although this trend places pressure on public finances, I believe that its advantages are greater than its disadvantages.","The disadvantages are primarily economic. As the proportion of retired people rises, fewer workers support more pensioners, which strains pension systems and increases the tax burden on the working population. Older people also tend to need more medical treatment and long-term care, so health budgets rise considerably. In some countries, for instance, hospitals and care homes struggle to find enough staff to look after a growing number of elderly patients. Nevertheless, these problems can be reduced by sensible policies. Raising the retirement age gradually and encouraging private savings would ease pressure on public funds, and healthy older people can remain in work for longer. Younger workers may also resent paying higher contributions for benefits they fear will not exist when they retire, which can create tension between generations. Rural areas with ageing populations additionally lose schools and shops as younger residents move away. The disadvantages are therefore real but can be managed.","The advantages, by comparison, are more fundamental. Longer life expectancy is itself a sign of progress, since it gives individuals more years with their families and more time to pursue their interests. Older citizens also contribute a great deal to society. Many act as volunteers, mentors or carers for grandchildren, which allows younger parents to work. A retired teacher who helps pupils with reading at a local school, for example, provides skilled assistance at no cost. In addition, older people possess experience and knowledge that benefit workplaces and communities, and they spend money on goods and services, which supports local economies. Many elderly people also have savings and property, so they act as a source of financial support for younger relatives and a stable group of consumers for local businesses. Societies with a large number of older citizens often show greater political stability and social responsibility. These contributions are valuable and widely shared.","In conclusion, ageing populations create financial pressures, but longer lives and the contributions of older people are more significant, and the costs can be addressed through reform. Governments should therefore plan early, adjusting pensions and healthcare so that society benefits fully from longer lives."]]},{"id":"W2-AD-20","task":2,"type":"Advantages and disadvantages","prompt":["Social media allows people to keep in touch with friends and family across the world. What are the advantages and disadvantages of communicating in this way?"],"imgs":[],"models":[["The rise of social media platforms has transformed the way people maintain relationships, particularly over long distances. While this form of communication is fast and inexpensive, it also raises concerns about the quality of relationships and personal privacy.","The main advantages are speed and low cost. Messages, photographs and video calls reach friends and relatives on the other side of the world within seconds, and most platforms are free to use. This is especially valuable for families separated by migration or work. For example, a grandparent in one country can watch a grandchild's birthday celebration live from another continent, something that was impossible a generation ago. Social media also makes it easy to rebuild contact with old friends and to keep up with their lives through shared updates. Messaging tools also allow people to communicate with many contacts simultaneously, which is particularly useful for organising events or sharing news with a large family. People who are shy or live in remote places may find it easier to express themselves and build friendships online. As a result, relationships that might once have faded because of distance can now be sustained with very little effort.","However, communicating in this way has significant drawbacks. Online interaction tends to be brief and superficial, and some people begin to prefer messaging to meeting in person. Over time, this can weaken the depth of friendships, as tone and emotion are easily misunderstood in text. Someone who writes a short comment intended as a joke, for instance, may unintentionally offend a recipient who cannot see their expression. In addition, sharing personal information on public platforms creates risks. Photographs and details of daily life may be seen by strangers, and users can become targets of fraud or harassment. Constant notifications may also distract people from work and from those physically present, so face-to-face conversations are interrupted. Some users compare their lives unfavourably with the carefully selected images posted by others, which can damage self-esteem and happiness. Therefore, the convenience of social media is offset by threats to the quality of relationships and to privacy.","In conclusion, social media enables fast and affordable contact across borders, but it can make friendships shallower and expose users to risk. Individuals should therefore use these platforms to supplement rather than replace personal meetings, and should be careful about the information they share."]]},{"id":"W2-AD-21","task":2,"type":"Advantages and disadvantages","prompt":["International tourism has become one of the largest industries in the world. What are the advantages and disadvantages of this growth for the countries that receive tourists?"],"imgs":[],"models":[["Cheaper flights and rising incomes have made international travel accessible to millions of people, turning tourism into one of the world's largest industries. For host countries, this growth brings valuable income and employment, but it also creates environmental and economic vulnerabilities.","The chief advantages of tourism are economic growth and improved infrastructure. Visitors spend money on accommodation, food, transport and souvenirs, which generates employment for a wide range of workers, from hotel staff to local guides. It also brings in foreign currency, which can be used to fund public services. In addition, the demand from tourists often leads governments to improve airports, roads and public facilities that local residents also use. For instance, a coastal town that attracts visitors may gain a modern road network and reliable electricity as a result. These benefits can be especially important for developing countries that have few other sources of income. Tourism can also help to preserve cultural heritage, because income from visitors pays for the restoration of monuments and supports traditional crafts that might otherwise disappear. Local pride in these assets often grows when they attract international interest. For these reasons, tourism can be a powerful driver of national development.","Nevertheless, rapid growth in tourism has serious drawbacks. Large numbers of visitors place heavy pressure on natural sites, causing pollution, waste and damage to fragile habitats such as beaches and coral reefs. Moreover, countries that rely heavily on tourism become vulnerable to events beyond their control. During the pandemic of 2020, for example, travel restrictions caused the income of many island economies to collapse almost overnight, leaving thousands of workers without jobs. Tourism can also push up prices of housing and food, which hurts local residents, and can lead to traditions being commercialised for visitors. Seasonal work is common in the industry, so many employees receive low wages and have little job security. Profits may also flow to foreign-owned hotel chains rather than remaining in the local community, which limits the benefit to ordinary residents. Consequently, an economy built mainly on tourism may prove unstable and costly in other ways.","In conclusion, tourism brings income, jobs and better infrastructure, but it can damage the environment and leave economies exposed to sudden shocks. Governments should therefore limit visitor numbers at sensitive sites and diversify their economies, so that the benefits of tourism are not outweighed by its costs."]]},{"id":"W2-AD-22","task":2,"type":"Advantages and disadvantages","prompt":["More schools are replacing printed textbooks with tablets and computers for learning. Do the advantages of this change outweigh the disadvantages?"],"imgs":[],"models":[["In many schools, printed textbooks are gradually giving way to tablets and computers as the main tools for learning. Although this shift raises concerns about distraction and cost, I believe that its educational benefits are greater than its drawbacks.","The disadvantages of digital devices are chiefly distraction and expense. Pupils using a tablet have easy access to games and social media, and many find it hard to resist the temptation to switch applications during lessons. Prolonged screen use can also cause eye strain and reduce the amount of handwriting practice that children receive. Furthermore, providing every pupil with a device is costly, and equipment can break or fail at a crucial moment. A lesson, for instance, may be interrupted if the school network stops working. However, these problems can be limited by sensible measures. Teachers can restrict applications and schedule breaks from screens, and schools can arrange maintenance and shared funding. Parents and schools may worry about children's privacy, as educational applications collect information about pupils. Unequal access to devices and internet connections at home can also widen the gap between richer and poorer families, although schools can reduce this through loan schemes. These drawbacks are therefore largely manageable.","In comparison, the advantages are considerable and long term. Digital materials can be updated instantly, whereas printed textbooks quickly become outdated, so pupils always study accurate and current information. Devices also allow interactive learning through videos, simulations and quizzes that make difficult topics easier to understand. A science pupil, for example, can watch an animated model of a chemical reaction instead of studying a single diagram. In addition, software can adjust the difficulty of exercises to each learner, giving weaker students extra practice and challenging stronger ones. Pupils also carry a single light device instead of a heavy bag of books, and they develop digital skills that employers now expect. Digital devices also make learning more accessible to pupils with special needs, since text can be enlarged or read aloud and learners can work at their own speed. Taken together, these benefits enhance both learning and preparation for working life.","To conclude, tablets and computers carry risks of distraction and cost, but their flexibility, accuracy and interactive features give them greater educational value. Schools should adopt them alongside clear rules on usage and continued handwriting practice, so that pupils gain the benefits without the drawbacks."]]},{"id":"W2-DS-01","task":2,"type":"Discussion","prompt":["Some people believe individuals should change their lifestyles to fight climate change. Others argue that only government and corporate action can make a real difference.","Discuss both views and give your own opinion."],"imgs":[],"models":[["Climate change is one of the defining challenges of this century, and there is disagreement over who should take the lead in tackling it. Some believe that ordinary people must change the way they live, since their combined choices are significant, while others argue that only governments and large companies control the largest sources of emissions. In my opinion, although individual effort matters, lasting change depends mainly on action from those in power.","Those who place the responsibility on individuals make a fair point. The first argument is that the daily choices of billions of people add up to an enormous environmental impact. When households use less electricity, waste less food, fly less and buy fewer unnecessary goods, the combined effect of these small decisions can reduce emissions on a considerable scale. A second argument is that changes in behaviour can push companies and governments to act, because businesses follow their customers and politicians follow their voters. When enough people demand greener products and cleaner policies, those in power are forced to respond. For example, growing consumer demand for plant-based food has led many supermarket chains and fast-food companies to expand their meat-free ranges. For these reasons, individual action is far from pointless.","Those who favour government and corporate action, however, argue that the main sources of the problem lie beyond the reach of ordinary people, and I find this view more convincing. To begin with, a large share of global emissions comes from power generation, heavy industry and transport networks that individuals cannot control. A family may recycle carefully for years, yet its savings are tiny compared with the emissions of a single coal-fired power station. In addition, only governments and corporations have the money, technology and legal authority to make structural changes. They can build renewable energy networks, set strict limits on pollution and redesign entire industries. To illustrate, the United Kingdom closed its last coal-fired power station in 2024 after years of government policy, a change no amount of individual effort could have achieved. Therefore, relying mainly on individuals would never be enough to solve the crisis.","In conclusion, while personal lifestyle changes help reduce emissions and can encourage wider action, serious progress depends mainly on governments and corporations, which control the largest sources of pollution. Governments should therefore lead with ambitious policies, while individuals support them through their consumer choices and votes."]]},{"id":"W2-DS-02","task":2,"type":"Discussion","prompt":["Some argue that developing countries should be allowed to prioritise economic growth over environmental protection. Others believe environmental standards must apply equally to all nations.","Discuss both views and give your own opinion."],"imgs":[],"models":[["As the world struggles to respond to climate change, nations disagree over who should bear the cost of protecting the environment. Some argue that poorer countries should be free to put economic growth first, as they still face urgent poverty and contributed little to the problem, while others insist that the same standards must apply everywhere because pollution affects every nation. In my opinion, environmental standards should apply to all countries, but developing nations deserve more time and substantial financial support.","Those who defend prioritising growth have understandable reasons. Firstly, developing nations face pressing needs that richer countries resolved long ago. Industrial growth is one of the most reliable ways to lift people out of poverty, and strict environmental rules can slow this growth, leaving millions without jobs, electricity or proper healthcare. For example, a country building its first reliable power grid may find coal far cheaper than solar or wind energy, and being forced to choose the more expensive option could delay development for years. Secondly, there is a question of fairness. Today’s wealthy nations built their prosperity through more than a century of heavy pollution, so it seems unjust to demand that latecomers meet limits the rich world never faced. From this perspective, some flexibility for poorer nations appears reasonable.","Those who call for equal standards, however, make an equally serious case, and I largely agree with them. To begin with, the atmosphere does not respect national borders. Emissions from a rapidly industrialising country raise temperatures and sea levels everywhere, including in nations that pollute very little, so exempting large economies would undermine global efforts. In addition, weaker rules in some countries can encourage a race to the bottom. Polluting industries may simply relocate to wherever regulation is weakest, which shifts emissions rather than reducing them. The solution is therefore shared standards combined with assistance. A case in point is Vietnam’s Just Energy Transition Partnership, agreed in 2022, under which wealthy countries pledged billions of dollars to help it move away from coal. Taken together, these points show that common standards with support are both fairer and more effective.","In conclusion, developing countries have strong reasons to prioritise growth, but because pollution harms everyone and weak rules simply move it elsewhere, environmental standards should apply to all nations. Wealthy countries should therefore provide finance and technology so that poorer nations can meet these standards without sacrificing development."]]},{"id":"W2-DS-03","task":2,"type":"Discussion","prompt":["Some believe that healthcare should be provided free by the state to everyone. Others argue that those who can afford to pay should contribute to the cost.","Discuss both views and give your own opinion."],"imgs":[],"models":[["As populations age and medical treatment becomes more expensive, governments everywhere face difficult decisions about how to fund healthcare. Some believe the state should provide it free to everyone as a basic right, while others argue that those who can afford it should contribute to keep the system sustainable. In my opinion, essential care should be free for all, but wealthier citizens can reasonably be asked to pay towards non-urgent or more expensive treatment.","Supporters of completely free healthcare put forward a strong moral and social case. Firstly, they argue that good health is a basic human right rather than a privilege for the rich. When treatment is free, nobody is forced to delay seeing a doctor or fall into debt because of illness, which protects the poorest and most vulnerable members of society. For example, a low-income family facing a serious diagnosis can focus on recovery instead of worrying about how to pay hospital bills. Secondly, free care benefits society as a whole. A population that can treat illnesses early and control the spread of disease is healthier and more productive, so free healthcare is an investment in the national economy rather than simply a cost. A case in point is Thailand, whose universal coverage scheme greatly expanded access to treatment for rural and low-income citizens. For these reasons, free healthcare is highly attractive.","Those who believe the wealthy should contribute, however, raise practical concerns that cannot be ignored. To begin with, providing everything free to everyone is extremely expensive. Hospitals, staff, medicines and modern equipment cost enormous sums, and when all of this is funded through taxation alone, systems can become overstretched, leading to long waiting lists and falling standards. In addition, asking richer citizens to pay part of the cost releases public money for those who genuinely cannot afford treatment. To illustrate, Singapore requires citizens to save for medical expenses through compulsory personal accounts, which helps keep public spending under control while still protecting those in need. Therefore, contributions from those who can pay can make healthcare fairer and more sustainable.","In conclusion, free healthcare protects the vulnerable and benefits society, but contributions from wealthier citizens help keep the system affordable and responsive. Governments should therefore guarantee free essential care for everyone, while introducing income-based charges for non-urgent or costly treatments."]]},{"id":"W2-DS-04","task":2,"type":"Discussion","prompt":["Some people think that all university students should study whatever they like. Others believe that they should only be allowed to study subjects that will be useful in the future, such as those related to science and technology.","Discuss both these views and give your own opinion."],"imgs":[],"models":[["As governments compete in a technology-driven global economy, the question of what university students should study has become increasingly important. While some believe students should be free to choose any subject, because interest leads to better learning, others argue that they should be limited to useful fields such as science and technology to meet economic needs. In my view, although practical needs matter, restricting subject choice would do more harm than good.","Those who support complete freedom of choice argue that passion drives academic success and that usefulness takes many forms. Firstly, students who study subjects they are genuinely curious about tend to engage more deeply, persevere through difficulties and achieve better results. Forcing them into fields they have no interest in, by contrast, often produces disengagement and burnout. Secondly, subjects outside science and technology contribute valuable skills such as critical thinking, ethical reasoning and cultural understanding, even if their value is harder to measure. For example, Steve Jobs credited a calligraphy course he took out of curiosity with shaping the attractive typography of early Apple computers. For these reasons, allowing students to follow their interests can produce graduates who are both fulfilled and professionally valuable.","Supporters of restricting subject choice, on the other hand, contend that universities have a responsibility to prepare students for economic realities. To begin with, many countries face shortages of engineers, scientists and technology specialists. Channelling more students into these fields could address skills gaps and strengthen national competitiveness. In addition, graduates in less directly applicable subjects sometimes struggle to find jobs that match their qualifications, which wastes both their time and public money. To illustrate, a graduate in a crowded humanities field may end up in work that requires no degree at all. However, this argument overlooks the fact that societies need teachers, lawyers, journalists and artists as much as engineers, and compulsion removes the autonomy that makes higher education meaningful. Consequently, while the intention behind this view is understandable, applying it as a blanket policy would be damaging.","In conclusion, while there is a reasonable case for aligning university study with economic needs, students should remain free to choose their own subjects, as motivation and diverse skills benefit society. Universities should therefore preserve this freedom while offering strong career guidance and information about job prospects."],["The purpose of higher education has become a subject of renewed debate, as governments question whether degrees in some fields offer value for money. Some maintain that students should be free to pursue any subject, while others insist that study should be confined to areas of clear future usefulness, particularly science and technology. In my view, although there is a case for steering students towards national priorities, imposing restrictions on subject choice would be both impractical and harmful in the long run.","Those who defend unrestricted choice argue that motivation is the foundation of genuine learning and that usefulness is broader than it appears. Firstly, students who choose a field out of real interest tend to read beyond the syllabus and persist through difficulties, whereas those pushed into an unwanted discipline often disengage or drop out altogether. Secondly, the assumption that only technical subjects are useful rests on a narrow definition of usefulness. Law, education, healthcare and the arts perform functions that no society can do without. For example, many countries currently face serious shortages of qualified teachers and nurses, which shows that skills gaps are by no means confined to engineering. For these reasons, freedom of choice serves both individual students and the wider economy.","Proponents of restriction, however, contend that universities, especially those funded by taxpayers, should serve national priorities. To begin with, they point out that economies need large numbers of engineers, data specialists and medical researchers. Directing enrolment towards these disciplines could therefore align education with the demands of the labour market, reducing graduate unemployment. In addition, graduates in oversubscribed fields often end up in work unrelated to their degrees, which represents a waste of public funds. However, this argument assumes that future demand can be predicted accurately, when many fields now considered essential barely existed a generation ago. To illustrate, careers in social media management and data science were almost unknown in the 1990s, and automation is already reshaping several technical professions. Consequently, a policy designed around today’s shortages risks creating tomorrow’s surpluses.","In conclusion, while the desire to match graduates with economic demand is understandable, students should keep the right to choose their own courses, since motivation matters and future needs are difficult to predict. Governments should therefore use scholarships and clear employment data to make priority subjects attractive, rather than restricting choice."]]},{"id":"W2-DS-05","task":2,"type":"Discussion","prompt":["Completing university education is thought by some to be the best way to get a good job. Conversely, other people think that getting experience and developing soft skills is more important.","Discuss both views and give your opinion."],"imgs":[],"models":[["In today’s competitive job market, young people are constantly advised on how best to prepare for employment. Some maintain that a university degree is the surest route to a good job because it provides specialised knowledge and recognised credentials, while others argue that practical experience and soft skills matter more to employers. In my view, a degree provides an important foundation, but it is the combination of qualifications and real-world competence that leads to career success.","Advocates of university education emphasise that a degree opens doors that would otherwise remain closed. Firstly, many well-paid and respected professions, such as medicine, law and engineering, require formal academic training by law, so a degree is not merely an advantage but a necessity. Secondly, universities equip students with specialised knowledge and a credential that signals competence and commitment to employers. For example, a graduate applying for a research position is far more likely to be shortlisted than a candidate without comparable academic training. In addition, many large employers run graduate schemes that accept only degree holders. These schemes often provide structured training and rapid promotion, giving graduates a clear advantage at the start of their careers. In this sense, higher education remains a reliable gateway to stable and rewarding careers.","Proponents of experience and soft skills, on the other hand, contend that academic qualifications alone are no longer sufficient. To begin with, abilities such as communication, teamwork, adaptability and problem-solving are highly valued by employers, and they are usually developed through practice rather than lectures. A candidate who has completed internships, worked part-time or run a small business often shows initiative and workplace readiness that a fresh graduate may lack. In addition, some industries now place more weight on demonstrated skills than on formal credentials. To illustrate, several large technology companies, including IBM, have removed degree requirements from many job advertisements in order to recruit capable candidates who learned their skills through experience. Consequently, practical experience can sometimes outweigh academic credentials, particularly when employers need people who can contribute immediately.","In conclusion, while a university education offers valuable knowledge and access to certain professions, experience and soft skills are equally important in proving a candidate’s ability. Students should therefore combine their studies with internships, part-time work and extracurricular activities, so that they graduate with both qualifications and practical competence."]]},{"id":"W2-DS-06","task":2,"type":"Discussion","prompt":["Some people think that when recruiting, companies should aim to take on people who are innovative and able to work independently while others believe they should recruit people who are able to work in a team and follow instructions.","Discuss both views and give your opinion."],"imgs":[],"models":[["As markets change faster than ever, employers face difficult choices about the kind of people they hire. Some believe companies should recruit innovative, independent individuals who can generate new ideas, while others argue that team players who follow instructions are more valuable for maintaining quality and safety. In my view, the right balance depends on the role, but most companies need a workforce that combines both qualities.","Supporters of hiring innovative and independent candidates argue that such employees drive progress and require little supervision. Firstly, these individuals can generate original ideas and take the initiative without constant oversight. Because managers spend less time on detailed supervision, they can focus on strategic planning and leadership. Secondly, creativity is essential in industries characterised by rapid change, such as technology, research and design, where companies that fail to innovate are quickly overtaken by competitors. For example, Facebook was created by a university student with an original idea, and it went on to transform the way people communicate online. However, excessive independence can cause serious coordination problems if employees ignore agreed procedures. For these reasons, creative and self-reliant workers are powerful drivers of innovation, but they need a clear framework.","Those who favour team players who follow instructions, however, point out that many roles depend on coordination and consistency. To begin with, fields such as healthcare, aviation and manufacturing rely on collective effort and strict procedures to maintain safety and quality. A single employee who decides to work differently from colleagues could cause serious errors. In such settings, reliability and respect for procedures matter far more than originality. To illustrate, airline pilots and cabin crew follow detailed checklists and communicate constantly, because even small deviations can endanger passengers. In addition, teamwork improves communication and workplace relationships, which tends to raise efficiency and morale. Nevertheless, a workforce composed entirely of rule-followers may lack creativity and struggle to adapt to unexpected challenges. Therefore, collaborative and disciplined employees are essential in structured environments, although they also benefit from colleagues who can think differently.","In conclusion, innovative and independent employees are vital in fast-changing industries, while team players who follow instructions are essential in roles requiring coordination and safety. Companies should therefore recruit a mix of both types and look for candidates who can think creatively while still working well within a team."],["In an economy shaped by rapid technological change, the qualities employers look for in new staff have become a subject of considerable debate. Some argue that companies should prioritise innovative people who can work independently, while others believe that the ability to cooperate and follow instructions is more important. In my opinion, although teamwork remains necessary, innovation and independence are increasingly the qualities that give companies a competitive advantage.","Those who prefer team players who follow instructions make a reasonable case. Firstly, many organisations depend on coordination and consistency to deliver reliable products and services. Factories, hospitals and airlines operate according to detailed procedures, and employees who work in harmony with their colleagues reduce the risk of costly or dangerous mistakes. Secondly, cooperative employees create a positive working environment. People who communicate well, share information and accept guidance from managers tend to strengthen relationships within a team, which improves morale and efficiency. Managers can also delegate tasks with confidence, knowing that instructions will be carried out as intended. For example, factory workers on an assembly line must work closely together to keep production running smoothly and prevent accidents. For these reasons, the ability to work in a team and follow instructions remains important.","Supporters of hiring innovative and independent people, however, argue that these qualities drive long-term success, and I agree with this view. To begin with, companies in competitive markets survive only by constantly developing new products and better ways of working. Employees who can identify problems and propose original solutions without waiting for instructions are therefore extremely valuable. A case in point is Google, whose practice of allowing engineers to spend part of their time on their own projects is often credited with producing services such as Gmail. In addition, independent workers need less supervision, which allows managers to concentrate on strategy rather than checking every task. Admittedly, such employees may sometimes resist established rules, but clear goals and regular communication can reduce this problem. Therefore, innovative and self-reliant staff are the key to growth in a changing economy.","In conclusion, team players who follow instructions help maintain consistency and morale, but innovative and independent employees are increasingly essential for growth and adaptation. Companies should therefore prioritise creativity and initiative when recruiting, while ensuring that new employees also have the basic communication skills needed to work with others."]]},{"id":"W2-DS-07","task":2,"type":"Discussion","prompt":["Some people believe that social media sites, such as Facebook or Twitter, have a negative impact on people’s health and their social skills. Others believe that these sites bring people together in a beneficial way.","Discuss and give your own opinion."],"imgs":[],"models":[["Social media platforms have become part of daily life for billions of people, changing how they communicate, share news and spend their free time. Some believe these sites damage users’ health and social skills, while others argue that they bring people together in valuable ways. In my opinion, social media does both, and whether its effect is positive depends largely on how moderately and selectively it is used.","Critics of social media argue that it harms both health and the ability to socialise. Firstly, platforms are designed to be highly addictive, and excessive use affects physical and mental well-being. Hours of scrolling encourage a sedentary lifestyle and can cause eye strain, poor posture and lost sleep, while exposure to violent content, hateful comments or sensational news can increase anxiety, particularly among young and emotionally vulnerable users. Secondly, online interaction cannot fully replace face-to-face communication. Skills such as reading body language, listening actively and showing empathy develop mainly through real conversations, so people who socialise mostly online may become less confident in person. For example, a teenager who spends evenings messaging friends rather than meeting them may later find job interviews or group discussions unusually stressful. For these reasons, the concerns about social media are well founded.","Supporters of social media, on the other hand, point out that it connects people in ways that were impossible before. To begin with, it allows users to maintain relationships across long distances. Messages, video calls and shared photos help families separated by migration or study abroad stay involved in each other’s lives, while online communities allow people with shared interests or problems to find support. For people who are isolated by illness or disability, these online connections can be especially valuable. In addition, social media can unite people around important causes. Campaigns spread quickly online, raising awareness and encouraging collective action on a global scale. To illustrate, the #MeToo movement gained worldwide attention largely through social media, prompting public debate about sexual harassment in many countries. Therefore, social media can strengthen relationships and give people a powerful collective voice.","In conclusion, social media can damage health and weaken social skills, but it also helps people stay connected and act together on shared concerns. Users should therefore limit their screen time, choose carefully what they consume and ensure that online contact supports rather than replaces real-life relationships."]]},{"id":"W2-DS-08","task":2,"type":"Discussion","prompt":["Some people think it is better for one single legal system throughout the world. Others say countries should have their own laws.","Discuss both sides and give your opinion."],"imgs":[],"models":[["Laws protect people’s rights and maintain order, but they vary enormously from one country to another. Some people believe a single legal system for the whole world would make life fairer and cooperation easier, while others argue that each country should keep its own laws to reflect its culture and needs. In my opinion, the best approach is a combination of shared international rules for global problems and national laws for everything else.","Supporters of a single global legal system point to the fairness and cooperation it could bring. Firstly, the same laws everywhere would mean that people are treated equally wherever they live. Basic rights, such as freedom from discrimination or access to a fair trial, would not depend on which country a person happens to be born in. Secondly, a shared legal framework would make it easier to solve problems that cross borders, such as climate change, international crime and trade disputes. Countries would no longer need to negotiate separate agreements for every issue. For example, the European Union has shown that common rules on trade and data protection can make cooperation between member states much smoother. For these reasons, a single legal system has clear attractions.","Those who believe each country should have its own laws, however, raise strong objections, and I largely agree with them. To begin with, laws reflect a society’s culture, religion and history, so rules that work well in one country may be unsuitable in another. Laws on issues such as alcohol, marriage or freedom of speech differ widely because societies hold different values, and imposing a single set of rules could cause strong resistance. In addition, national laws are easier to create and enforce. A government that understands local conditions can respond quickly to its citizens’ concerns, whereas a global legal system would require a huge and slow international authority. To illustrate, even within the European Union, member states keep their own criminal and family laws because these matters are closely tied to national identity. Therefore, countries need the freedom to make most of their own laws.","In conclusion, a single legal system could promote fairness and cooperation, but cultural differences and practical difficulties make it unrealistic. Countries should therefore keep control of their domestic laws while cooperating through international agreements on global issues such as climate change and human rights."],["In an increasingly interconnected world, the legal systems that govern societies are coming under growing scrutiny. While some advocate a single global legal framework to ensure equal treatment and foster international cooperation, others argue that each nation should retain its own laws to reflect its distinct social and cultural context. In my view, a balanced integration of both approaches is essential, with global rules confined to genuinely transnational issues.","Advocates of a unified global legal system highlight its potential to promote equity and reduce international friction. Firstly, common laws would provide a shared foundation for resolving disputes between individuals, companies and states. Instead of navigating conflicting national regulations, parties to a cross-border contract or dispute could rely on a single, predictable set of rules. This predictability would reduce legal costs for businesses and encourage international trade and investment. Secondly, uniform regulation would greatly facilitate collective responses to transnational challenges such as environmental degradation, human trafficking and financial crime, which no single state can address alone. For example, the United Nations Convention on the Law of the Sea already provides a common framework governing navigation and resources in international waters. From this perspective, greater legal harmonisation appears both logical and beneficial.","Conversely, defenders of national legal systems contend that the right of each country to make its own laws is indispensable. To begin with, national legislation can be tailored precisely to local traditions, values and socioeconomic conditions, thereby preserving cultural identity and maintaining public consent. A single code imposed from outside would almost certainly be perceived as an imposition, potentially provoking widespread resistance. Laws on matters such as family life, religion and freedom of expression reflect deeply held values that differ considerably between societies. In addition, national laws are generally enforced more efficiently, as they fall directly under the authority of governments accountable to their own citizens. A comprehensive global framework, by contrast, would require an enormous bureaucracy and raise complex questions of sovereignty. To illustrate, disagreements over the authority of the International Criminal Court, which several major powers have declined to join, reveal how reluctant states are to surrender legal control. Therefore, national autonomy remains essential.","In conclusion, while a single global legal system could enhance fairness and cooperation, its practical and cultural obstacles are considerable. Governments should therefore pursue deeper legal cooperation on specific transnational concerns, while retaining full autonomy over domestic affairs."]]},{"id":"W2-DS-09","task":2,"type":"Discussion","prompt":["Some believe that the international sports events are greatly beneficial, not only for international relations but also for the hosting country, while others claim that holding these events is a waste of money.","Discuss both sides and give your own opinion."],"imgs":[],"models":[["Every few years, countries compete fiercely for the right to host events such as the Olympic Games or the FIFA World Cup. Some believe these tournaments improve international relations and benefit the host nation, while others argue that they are an extravagant waste of public money. In my opinion, such events can bring real benefits, but only when hosts plan carefully to avoid long-term financial burdens.","Supporters of international sports events emphasise their diplomatic and economic value. Firstly, these tournaments bring nations together in a spirit of friendly competition, encouraging cultural exchange and goodwill. Athletes and fans from around the world meet, share experiences and learn about one another, which can ease tensions between countries. For example, at the 2018 Winter Olympics in South Korea, athletes from North and South Korea marched together at the opening ceremony and competed as a joint women’s ice hockey team. Secondly, hosting can stimulate the local economy and improve infrastructure. New transport links, stadiums and housing create jobs during construction, while visitors spend money on hotels, restaurants and souvenirs. Long after the event, improved facilities and a higher international profile can continue to attract tourists and investors. These benefits suggest that sports events can promote both global unity and national prosperity.","Critics, however, argue that the costs of hosting often outweigh the benefits. To begin with, the expense of building venues, providing security and organising the event can place enormous strain on public budgets. Many hosts spend far more than originally planned and are left with debts and expensive facilities that are rarely used afterwards. To illustrate, several venues built for the 2004 Athens Olympics were abandoned soon after the Games, becoming symbols of wasted public money. In addition, focusing resources on a short-term spectacle may divert attention from pressing domestic needs such as healthcare, education and housing. A few weeks of international attention seldom justify years of reduced investment in these essential services. Therefore, without careful planning, hosting major sports events can squander resources that could address more important problems.","In conclusion, international sports events can strengthen relations between nations and boost the host’s economy, but their high costs and the risk of unused facilities cannot be ignored. Governments should therefore bid to host only when they can reuse existing venues and ensure that new infrastructure serves residents long after the event."]]},{"id":"W2-DS-10","task":2,"type":"Discussion","prompt":["Movies and computer games containing violence are more popular than ever. Some people say they have a negative effect on society and should be censored. Others say they are just harmless relaxation.","Discuss both these views and give your own opinion."],"imgs":[],"models":[["Violent action films and shooting games now attract enormous audiences, many of them teenagers. Some argue that this content harms society and should be censored, while others regard it as harmless entertainment that helps people relax. In my view, violent media can have negative effects, particularly on children, but age restrictions and parental guidance are a better response than outright censorship.","Critics of violent movies and games argue that they can damage individuals and society. Firstly, repeated exposure to graphic violence may make people less sensitive to real suffering. When brutal fights and killings appear constantly as entertainment, aggression can start to seem normal, and young viewers in particular may become less shocked by violence in real life. Secondly, such content can affect the mental health of vulnerable groups. Intense, disturbing images can cause anxiety or nightmares in children, and because this material is widely available online, parents find it difficult to control what their children see. For example, a ten-year-old who plays a game designed for adults may encounter scenes far more frightening than a child of that age can process. For these reasons, the concerns about violent media deserve to be taken seriously.","Supporters, on the other hand, argue that violent films and games are a legitimate form of entertainment that most people enjoy safely. To begin with, they offer a way to release stress. Many adults play action games or watch thrillers after a demanding day, experiencing excitement in a fictional world without harming anyone. Most of these viewers clearly distinguish between fiction and reality, and they show no tendency towards violence in their daily lives. In addition, much of this content has genuine artistic or strategic value. Action films often combine violence with complex storytelling, while multiplayer games require planning, cooperation and quick decision-making. To illustrate, war films such as Saving Private Ryan use graphic scenes to show the horror of conflict and encourage reflection rather than to glorify violence. Therefore, banning such content would deprive millions of adults of a popular form of entertainment and art.","In conclusion, violent movies and games can desensitise viewers and upset vulnerable children, but for most adults they are harmless entertainment with genuine artistic value. Governments should therefore enforce age ratings strictly rather than censoring such content, while parents monitor what their children watch and play."]]},{"id":"W2-DS-11","task":2,"type":"Discussion","prompt":["As cities of the world are increasing in population, some people believe that forested areas should be cleared for new urban areas to be built. Others say that forests must always be conserved.","Discuss both views and give your opinion."],"imgs":[],"models":[["As urban populations continue to grow, cities face increasing pressure to expand into the surrounding countryside. Some argue that forests should be cleared to provide land for housing and services, while others insist that forests must always be protected. In my opinion, although cities need space to grow, forests should be preserved because their environmental and economic value far outweighs the short-term gains of clearing them.","Those who support clearing forests for urban development emphasise the urgent needs of growing cities. Firstly, rising populations require more housing. When demand exceeds supply, property prices and rents soar, forcing many families into overcrowded or unaffordable accommodation, so new land for construction can ease this pressure. Without new land, young families may be forced to live far from their workplaces and endure long daily commutes. Secondly, expanding cities need space for essential infrastructure and services. Schools, hospitals, roads and business districts all require land, and building them can improve living standards and create jobs in construction and services. For example, a fast-growing city might clear an area of woodland on its edge to build a new hospital and thousands of affordable homes. From this perspective, clearing some forested land seems a reasonable response to rapid population growth.","Those who champion forest conservation, however, highlight benefits that cities cannot replace, and I agree with them. To begin with, forests protect the environment and nearby communities. Tree roots bind the soil and reduce erosion, which lowers the risk of floods and landslides, while forests absorb carbon dioxide and help regulate the climate. In addition, forests are home to a vast range of plants and animals, many of which have value for scientific research and medicine. They can also attract visitors and generate income through sustainable tourism. Moreover, cities can grow without destroying forests by building upwards, improving public transport and redeveloping unused land. To illustrate, London’s Green Belt has limited outward expansion for decades, encouraging the reuse of former industrial sites within the city instead. Therefore, conserving forests is both necessary and achievable.","In conclusion, clearing forests can provide land for housing and services, but the environmental, scientific and economic value of forests makes their conservation far more important. Governments should therefore protect forests by law and meet housing needs through high-density building and the redevelopment of disused urban land."]]},{"id":"W2-DS-12","task":2,"type":"Discussion","prompt":["Some people think that success in life comes from hard work and determination, while others think that there are more important factors such as money and appearance. Discuss both views and give your opinion."],"imgs":[],"models":[["Definitions of success vary from person to person, but most people associate it with achieving their goals and living a fulfilling life. Some believe this depends mainly on hard work and determin
