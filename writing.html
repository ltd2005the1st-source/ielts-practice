3-1.jpg","w":1400,"h":993}],"models":[["The diagrams illustrate the stages and equipment involved in making cement, and how this cement is then combined with other materials to produce concrete for building.","Overall, cement production is a five-stage process that begins with limestone and clay being crushed and ends with the finished cement being packed into bags. By contrast, making concrete is far simpler, involving a single stage in which four ingredients are mixed together, with gravel making up the largest share.","In the first diagram, limestone and clay are fed into a crusher, which reduces them to a fine powder. This powder is passed through a mixer before entering a rotating heater, where heat is applied at the lower end of the cylinder. The heated material then emerges onto a grinder, which turns it into cement, and the final product is packed into bags.","The second diagram shows that concrete is made from four ingredients in fixed proportions. Gravel, which consists of small stones, accounts for half of the mixture, followed by sand at 25%, cement at 15% and water at 10%. These are combined in a large concrete mixer, which rotates continuously to blend them into concrete that is ready for building work."]]},{"id":"W1-DG-24","task":1,"type":"Diagram","prompt":["The diagram below shows how one type of coal is used to produce electricity.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-24-1.jpg","w":1024,"h":590}],"models":[["The diagram illustrates the process by which a particular type of coal is converted into electricity for consumers.","Overall, the process comprises eight main stages, beginning with the extraction of coal from a mine and ending with the distribution of electricity along two routes. What is notable is that the coal is not used directly but is first turned into gas, and that waste heat is given off at two separate points along the way.","Initially, coal is extracted from a mine and fed into a crusher, where it is broken into smaller pieces. The crushed coal is then loaded onto vehicles and taken by truck to a gasifier, in which heat from an external source converts it into gas.","The gas is subsequently piped to a cooling plant, and it is at this point that the first quantity of waste heat is released. Once cooled, the gas passes to a cleaning plant before being delivered to a gas power plant, where it is used to generate electricity and a second share of waste heat is lost. Finally, the electricity is distributed along two routes, one supplying a group of buildings and the other feeding a set of pylons that serves an industrial area."]]},{"id":"W1-DG-25","task":1,"type":"Diagram","prompt":["The diagram below shows how orange juice is produced.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-25-1.jpg","w":1024,"h":702}],"models":[["The diagram illustrates how fresh oranges are processed into two types of orange juice, fresh juice and concentrated juice, both of which are sold in supermarkets.","Overall, after three shared stages the process splits into two branches, a short one producing fresh juice and a much longer one producing concentrated juice, and both end with packaged juice reaching supermarkets. It is also notable that the solid waste from extraction is turned into animal feed, and that in the second branch water is first removed from the juice and later added back.","To begin with, fresh oranges are delivered by truck to a factory, where they are washed and then passed through an extraction machine. This separates the juice from the solid waste, which is used as animal feed. At this point, the process divides into two lines.","In the first line, the freshly extracted juice is packaged straight away and sent to supermarkets for sale. Because it involves only these two steps, this is by far the shorter of the two routes.","In the other line, some of the juice is carried in refrigerated trucks to an evaporation plant, where water is removed to produce concentrated juice. This concentrate is canned and kept in a warehouse before being taken to another factory, where water is added back. Finally, the juice is packaged and delivered to supermarkets, just as the fresh juice is."]]},{"id":"W1-DG-26","task":1,"type":"Diagram","prompt":["The diagrams below give information about the manufacture of frozen fish pies.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-26-1.jpg","w":310,"h":290},{"src":"wimg/W1-DG-26-2.jpg","w":1383,"h":1200}],"models":[["The diagrams illustrate how frozen fish pies are made on a production line and what the finished pie contains.","Overall, the production line has two separate starting points, one for potatoes and one for fresh salmon, which come together in a shared final stage where the pies are assembled, wrapped and frozen. It is notable that the two main ingredients are handled on very different timescales, as potatoes can be delivered up to one month before processing, whereas the salmon must be used within 12 hours of delivery.","The potatoes are dealt with on the upper line. Once they have been delivered, they are cleaned and peeled, and they are then cut into slices. These slices are boiled and chilled before being placed in storage until they are needed for the pies.","Meanwhile, the fresh salmon is processed on the lower line within 12 hours of arriving at the factory. It is seasoned with lemon juice and salt and cooked in a steam oven, after which workers remove the skins and bones and the fish is inspected. At this point, prepared peas and prepared sauce are added, and the stored potato slices are laid on top, so that the pie matches the layout of the microwaveable container in the first diagram. Finally, each pie is wrapped and frozen before being either stored or dispatched."],["The first diagram shows the contents of a frozen fish pie, while the second outlines the production line on which it is made.","Overall, the pie consists of four ingredients in a microwaveable container, namely fish, peas and sauce with a layer of potato on top. Its production involves two preparation lines, one for potatoes and one for salmon, which merge in a final assembly stage before the pies are frozen.","In the preparation phase, the two main ingredients are handled separately. Potatoes, which can be delivered up to one month in advance, are cleaned, peeled and sliced before being boiled, chilled and stored. The salmon, by contrast, is processed within 12 hours of delivery, being seasoned with lemon juice and salt, cooked in a steam oven and then passed to workers who remove the skins and bones. Once this has been done, the fish is inspected.","The assembly phase begins once the fish has passed inspection. Prepared peas and prepared sauce are added to it, and the potato slices are taken from storage and placed on top, which gives the pie the structure shown in the first diagram. The pies are then wrapped and frozen, after which they are either stored or dispatched."]]},{"id":"W1-DG-27","task":1,"type":"Diagram","prompt":["The diagram below shows how electricity is generated in a hydro-electric power station.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-27-1.jpg","w":1024,"h":684}],"models":[["The diagram illustrates how electricity is generated at a hydro-electric power station and then delivered to consumers, starting with the evaporation of seawater.","Overall, the process falls into two main phases, the natural movement of water from the sea into a reservoir and the generation and distribution of electricity, which ends with power reaching hospitals, schools and homes. What is notable is that the water forms a closed loop at the power station, since it is pumped back into the reservoir after passing through the turbine.","The process begins when heat from the sun causes seawater to evaporate and form clouds, which are carried inland over a mountain. As the clouds release rain, the water collects in a reservoir held back by a dam. From there, it is released through a valve, which can be opened or closed to control the flow, and runs downhill through a pipe towards a turbine.","The second phase takes place at and beyond the power station. The force of the falling water drives the turbine, which generates electricity, while the used water travels along a horizontal pipe to a pump that sends it back up into the reservoir. Meanwhile, the electricity is carried by high-voltage cables suspended from pylons to a transformer station. Finally, it is distributed through underground cables to end users such as hospitals, schools, factories and private houses."]]},{"id":"W1-DG-28","task":1,"type":"Diagram","prompt":["The diagrams show a structure that is used to generate electricity from wave power.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-28-1.jpg","w":854,"h":1040}],"models":[["The diagrams illustrate the design of a structure that uses the movement of waves to generate electricity, and how it works as waves arrive and retreat.","Overall, the structure is made up of a chamber and a vertical column containing a turbine, and it is built against a cliff or sea wall. It works on a straightforward principle, namely that air moving through the column turns the turbine in the same direction whether a wave is coming in or going out, so electricity is produced in both phases.","Turning to the structure, the chamber has a curved roof and is open to the sea at its lower end, allowing waves to flow in and out. At the end nearest the cliff, it joins a tall column which is open at the top, and a turbine connected to an electricity supply is fitted inside this column.","As for the way the structure operates, an incoming wave flows into the chamber and pushes the air inside it up through the column, turning the turbine and generating electricity. When the wave retreats, the water level in the chamber falls, and air is drawn back down the column from the top. This downward flow of air again passes through the turbine, which keeps turning in the same direction, so electricity continues to be produced."],["The two diagrams depict how a structure built on the coast generates electricity from wave power.","Overall, the process consists of two phases, one when a wave enters the structure and one when it moves back out to sea, and electricity is generated in both. The most notable feature is that the turbine always rotates in the same direction, even though the air flows upwards in the first phase and downwards in the second.","In the first diagram, a wave approaches the cliff or sea wall and rushes into a chamber built against it. As the water rises inside the chamber, it forces air up a vertical column, where the air passes through a turbine and makes it spin. This movement generates electricity before the air escapes from the open top of the column.","The second diagram shows what happens as the wave retreats. With the water now flowing back out of the chamber, air is sucked into the column from above and moves down through the turbine. Despite this change in the direction of the airflow, the turbine continues to turn the same way, and as a result electricity is still produced."]]},{"id":"W1-DG-29","task":1,"type":"Diagram","prompt":["The diagram below gives information about the recycling of glass and plastic containers.","Summarize the information by selecting and reporting the main features and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-29-1.jpg","w":1400,"h":1025}],"models":[["The diagram illustrates the life cycle of glass and plastic containers and compares the ways in which each material is recycled.","Overall, both materials follow a closed loop, sharing the same first stages of collection and transport before separating into two recycling lines that end with new products. It is notable that, although each line has five stages, plastic is melted and reshaped by the same machine, whereas glass requires separate machines for these two processes.","The cycle begins when new glass and plastic products are used for three to eight weeks and then placed in collection bins. Five to ten days later, they are transported to a recycling centre, where the two materials are separated. Glass is sorted by colour and crushed, after which the pieces are washed, melted and reshaped into new products, with the last two steps carried out by separate machines.","Plastic, by contrast, is sorted by thickness and quality before being bundled together. These bundles are then shredded into small pieces, which are washed and finally melted and reshaped in a single machine. The resulting new plastic products return to the start of the cycle alongside the recycled glass."]]},{"id":"W1-DG-30","task":1,"type":"Diagram","prompt":["The picture below shows how a hot air balloon works.","Summarize the information by describing the main features of the charts and making comparisons where appropriate."],"imgs":[{"src":"wimg/W1-DG-30-1.jpg","w":1024,"h":768}],"models":[["The diagrams illustrate the structure of a hot air balloon and the principle that allows it to rise.","Overall, the balloon consists of two main sections, a large envelope above and a basket below, which are joined by ropes. It works on a straightforward principle, namely that air heated by a burner is lighter than cool air and therefore rises to the top of the envelope.","Turning to the structure, the envelope is made up of a series of vertical strips called gores, each of which is divided into smaller panels. At the very top is a parachute valve, a self-sealing flap that allows hot air to escape at a controlled rate, while the opening at the base of the envelope is surrounded by a band known as the skirt. Below this, ropes connect the envelope to a basket, which holds propane cylinders, with burners positioned just above it.","As for the way the balloon operates, propane from the cylinders is mixed with air at the burners to produce a flame, which heats the air inside the envelope. As the second diagram shows, this hot air is light and rises to the upper part of the balloon, whereas the cool, heavy air stays near the opening at the bottom. When necessary, some of the hot air can be released through the parachute valve at a controlled rate."]]},{"id":"W1-DG-31","task":1,"type":"Diagram","prompt":["The diagram below shows how energy is produced from coal.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-31-1.jpg","w":1024,"h":619}],"models":[["The diagram illustrates how electricity is generated from coal in a plant that uses both a gas turbine and a steam turbine.","Overall, the process involves two generating stages fed by a single supply of coal, the first driven by purified gas and the second by steam produced from the waste heat of the first. It is also notable that unwanted by-products are removed at three points, namely slag, harmful substances and flue gases, before the electricity reaches the pylons.","To begin with, coal is delivered by truck and carried up a conveyor into a furnace, where it is burned with oxygen piped in from a nearby plant. This produces slag, which is removed from the bottom of the furnace, and raw syngas, which is passed to a removal unit. Here, carbon dioxide, mercury and sulphur are extracted, leaving purified syngas.","The purified syngas is then fed into a gas turbine, which drives a generator and produces the first supply of electricity. Rather than being wasted, the hot exhaust gases from this turbine are channelled into a heat recovery steam generator, where they are used to raise steam, while the remaining flue gases escape through a chimney. The steam powers a steam turbine connected to a second generator, and the electricity from both generators is finally carried away by a pylon for distribution."],["The diagram depicts the stages by which coal is converted into electricity.","Overall, the process can be divided into two phases, the preparation of a clean fuel gas from coal and the use of this gas to generate electricity in two separate turbines. What is notable is that the heat given off by the first turbine is not wasted but is used to produce steam for the second.","In the first phase, coal is brought to the site by truck and lifted on a conveyor into a furnace, into which oxygen is also piped from a separate plant. The burning coal yields two products, slag and raw syngas. The slag is discarded, whereas the raw syngas is sent to a removal unit, where carbon dioxide, mercury and sulphur are taken out to create purified syngas.","In the second phase, the purified syngas powers a gas turbine linked to a generator, which produces electricity. The hot exhaust gases leaving this turbine then pass into a heat recovery steam generator, which releases flue gases into the air and produces steam. This steam drives a steam turbine with its own generator, and the electricity from both generators is carried away through a pylon."]]},{"id":"W1-DG-32","task":1,"type":"Diagram","prompt":["The diagram below shows the production of steam using a gas cooled nuclear reactor.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-32-1.jpg","w":1024,"h":718}],"models":[["The diagram illustrates the structure of a gas-cooled nuclear reactor and the way in which it produces steam.","Overall, the installation consists of two main units, a reactor enclosed in concrete shielding and a heat exchanger beside it, which are linked by a hot gas duct and a cool gas duct. It works on a straightforward principle, namely that circulating gas carries heat from the reactor to the heat exchanger, where water is turned into steam.","Turning to the structure, the core of the reactor contains uranium fuel elements surrounded by graphite moderators, all of which sit inside a pressure vessel. Boron control rods and charge tubes for loading fuel enter the vessel from above, passing through the concrete radiation shielding around the reactor. The heat exchanger, by contrast, is a tall cylinder containing a coiled pipe, with a water circulator on the pipe near its lower end.","As for the way the system operates, gas in the pressure vessel is heated as it rises past the fuel elements and leaves through the hot gas duct. It then flows down through the heat exchanger and around the coiled pipe, through which water is driven upwards by the circulator. This water absorbs the heat and is converted into steam, which is piped to a turbo-alternator. Meanwhile, the cooled gas returns along the cool gas duct and is pushed back into the reactor by a gas blower, at which point the cycle begins again."]]},{"id":"W1-DG-33","task":1,"type":"Diagram","prompt":["The diagram below shows the production of electricity using a system called Ocean Thermal Energy Conversion (OTEC).","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-33-1.jpg","w":852,"h":1024}],"models":[["The diagram illustrates how a system known as Ocean Thermal Energy Conversion (OTEC) uses seawater to generate electricity and produce drinking water.","Overall, the system draws on two sources of seawater, warm water at the surface (29°C) and cold water from a depth of 1,000 metres (5°C), and passes them through three main components, an evacuated evaporation chamber, a turbine and a condensing chamber. It is notable that the process yields two useful outputs, electricity and drinking water, while its only waste product is salt water.","The process starts at the surface, where warm seawater enters the evacuated evaporation chamber and is converted into water vapour by solar energy. As this happens, the salt is left behind and flows downwards out of the chamber, while the saltless vapour rises and is channelled through a turbine, which turns and creates electricity.","From the turbine, the vapour travels down a long pipe into the condensing chamber. Meanwhile, cold seawater is drawn in from the deep ocean and flows around this chamber, where it mixes with the salty water coming from the evaporation chamber. As a result, the vapour inside condenses into pure water, which leaves the system as drinking water, whereas the mixture of cold seawater and salt is discharged at the bottom as waste salt water."],["The diagram explains how an Ocean Thermal Energy Conversion (OTEC) system produces both electricity and drinking water from seawater.","Overall, the system has two linked sections, an upper section in which warm surface water is turned into vapour to drive a turbine, and a lower section in which that vapour is condensed with the help of cold water from the deep ocean. What is notable is that a single input, seawater, results in three outputs, namely electricity, drinking water and waste salt water.","In the upper section, warm seawater at 29°C flows from the ocean surface into an evacuated evaporation chamber, where solar energy converts it into water vapour. The salt separates from the water at this point and drains downwards, whereas the vapour, now free of salt, rises out of the chamber. It then passes through a turbine, causing it to turn and create electricity.","The lower section relies on cold seawater at 5°C, which is piped in from a depth of 1,000 metres. Having passed through the turbine, the vapour travels down into a condensing chamber, around which this cold water circulates together with the salt from the upper section. The vapour then condenses into pure water and flows out as drinking water, while the cold seawater and salt leave the system as waste salt water."]]},{"id":"W1-DG-34","task":1,"type":"Diagram","prompt":["The diagram below gives the information about the Hawaiian island chain in the centre of the Pacific Ocean.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-34-1.jpg","w":1024,"h":486}],"models":[["The diagram illustrates how the Hawaiian island chain in the central Pacific Ocean was formed, together with a map of its major islands.","Overall, the islands are the result of volcanic activity above a ’hot spot’ that stays in one place while the Pacific plate moves over it, so that the chain runs from the youngest volcano to the oldest, which dates back 80 million years. The map shows that Hawaii is by far the largest of the eight major islands.","The eruption process begins 2,883 kilometres below the surface, where a ’hot spot’ spume within the solid dense rock remains static. From this point, a narrow magma spume rises through the Pacific plate, and numerous eruptions gradually build up a new volcano on the ocean floor. Meanwhile, the Pacific plate shifts at a rate of 7 to 9 centimetres per year, so older volcanoes are carried north-west, away from the hot spot, while the youngest volcano develops directly above it.","The map shows the eight major islands arranged in a line from Niihau in the north-west to Hawaii in the south-east, with Kauai, Oahu, Molokai, Lanai, Kahoolawe and Maui lying in between. Hawaii is considerably larger than all the others, whereas Niihau, Lanai and Kahoolawe are the smallest."]]},{"id":"W1-MP-01","task":1,"type":"Map or plan","prompt":["The maps show how an industrial area will change into a housing area in the future.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-01-1.jpg","w":1024,"h":623}],"models":[["The two maps show the current layout of an industrial area and a plan to redevelop it as a residential area in the future.","Overall, every industrial building on the site is set to be demolished and replaced by housing, gardens and parking facilities. The only feature that will remain unchanged is the main road surrounding the whole area.","At present, the site is used entirely for industrial and business purposes. An entrance and reception building stands in the middle of the northern side, with a packing building and a storage building on the western side. The centre and south of the site are occupied by six offices and a canteen, while a large factory takes up most of the eastern side.","Under the plan, the entrance and reception building will be replaced by a row of three two-bedroom houses along the northern edge, with communal gardens laid out directly south of them. On the western side, the packing and storage buildings will make way for a three-bedroom house and a larger four-bedroom house. The offices and canteen in the south will be cleared, and parking garages will be built in the southern part of the centre, leaving much of the middle of the site open. Finally, the factory in the east will be replaced by a block of apartments, with a parking area to its north."]]},{"id":"W1-MP-02","task":1,"type":"Map or plan","prompt":["The maps give information about a university sports court.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-02-1.jpg","w":712,"h":771}],"models":[["The two maps compare the layout of a university sports facility in 1990 and at present.","Overall, the facility has been developed considerably, with the main sports area now enclosed in a building and more courts provided outside it. However, these improvements have come at the expense of the park and the car park, which no longer exist.","In 1990, the western part of the site contained a park in the north and a car park in the south. The eastern part was an open area with an outdoor swimming pool in the northeast, two tennis courts in the southeast and a small group of facilities to the west of them, namely a café, a reception area and changing rooms.","Today, the eastern part of the site is covered by a single building, and the pool inside it has become an indoor pool. The café remains in the northwest corner of this building, while the reception area has been enlarged and now runs from north to south below it. The changing room has been moved further east, beneath the pool, and the two tennis courts have been replaced by a fitness centre. On the western side of the site, the park has been turned into a basketball court, and the car park has made way for four tennis courts, twice as many as before."],["The maps illustrate how a university sports facility has changed from 1990 to the present day.","Overall, the facility has been expanded and modernised, offering a wider range of sports than before. The most noticeable changes are the construction of a building around the pool and the other main facilities, and the replacement of the park and car park with outdoor courts.","In 1990, swimming and tennis were the only sports available at the facility. There was a large outdoor pool, with two tennis courts below it, and visitors could use a café, reception and changing rooms located to the west of these. A park and a car park occupied the western side of the site.","At present, all the eastern facilities are housed under one roof. The pool has been kept in the same position but is now indoors, and the area that used to contain the two tennis courts is now a fitness centre. The changing room has been moved east to sit between the pool and the fitness centre, while the café has stayed in the same place and the reception has been extended. The western side of the site has been entirely redeveloped for sport, with a basketball court where the park used to be and four tennis courts on the site of the former car park. As a result, the site no longer has any parking or green space."]]},{"id":"W1-MP-03","task":1,"type":"Map or plan","prompt":["The plans show the room layouts for training sessions for up to ten people and more than ten people.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-03-1.jpg","w":1024,"h":719}],"models":[["The plans illustrate how the same training room is arranged for sessions of no more than ten participants and for sessions with more than ten.","Overall, smaller groups sit around a single U-shaped arrangement of tables, whereas larger groups are divided into three separate clusters. The entrance stays in the northeastern corner in both layouts, but the presenter’s desk and the morning tea area are moved to make room for the extra seating.","In Plan A, the presenter’s chair and desk occupy the northwestern corner, with a whiteboard to their right, just inside the entrance. The ten participants sit at individual tables that form a U shape in the centre of the room, with three seats along each side and four across the bottom. Morning tea is served from a long table against the southern wall, behind the seating.","In Plan B, the morning tea area is relocated to an L-shaped space that wraps around the northwestern corner, and it holds twice as many cups. The whiteboard shifts towards the centre of the northern side, while the presenter’s desk sits just below it to the right, in a more central position. Seating capacity rises to eighteen, divided into three groups of six. Two of these groups sit side by side in the middle of the room, while the third occupies the southern end, where the morning tea table used to be."]]},{"id":"W1-MP-04","task":1,"type":"Map or plan","prompt":["The maps show changes in the layout of a bookstore between 2000 and the present.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-04-1.jpg","w":507,"h":837}],"models":[["The two plans show how the layout of a bookstore has changed between 2000 and the present day.","Overall, the bookstore has been reorganised to include a café and a seating area, and as a result, the book sections now take up less space and have been moved to the edges of the store. The area near the entrance, however, has remained exactly the same.","In 2000, customers entered the store from the west. The travel section stood directly ahead of them, with the new books section just south of it and the service desk in the southwest corner. Fiction books occupied a long section along the northern wall and a second section in the northeast corner. In the middle of the store, there were three rows of shelves for art, hobbies and cookery, and a non-fiction section was located along the southern wall.","Today, the travel section, the new books section and the service desk are still in their original positions near the entrance. Elsewhere, however, the store looks very different. The northern wall is now divided into four smaller sections for art, hobbies, cookery and fiction, so that fiction now has much less space than before. Non-fiction books have been moved to the northeast corner, previously part of the fiction area. The former non-fiction section in the south has become a café, and the centre of the store, where the art, hobbies and cookery shelves used to stand, now contains three tables with chairs for customers."]]},{"id":"W1-MP-05","task":1,"type":"Map or plan","prompt":["The plans below show the layout of a university sports centre now, and how it will look after redevelopment.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-05-1.jpg","w":1400,"h":1272}],"models":[["The plans show the current layout of a university sports centre and how it will look after a planned redevelopment.","Overall, the sports centre will be expanded considerably to the west and east, with the two outdoor court areas replaced by new indoor facilities. The original central building, however, will remain largely unchanged.","At present, the sports centre consists of a single building with an entrance on its southern side leading into a reception area. Beyond the reception lies a 25m pool, with a gym along the northern side of the building, a changing room to the west of the pool and seating to its east. Outside the building, there are outdoor courts on both its western and eastern sides.","After redevelopment, the central part of the building will stay exactly as it is, but the outdoor courts will disappear and the building will be extended in both directions. The western extension will contain a large leisure pool in the north, with a second changing room and a sports shop to its south, next to the entrance. The eastern extension will be dominated by a sports hall built beside the seating area, with two dance studios along the eastern edge. In the southeast corner, a café and a third changing room will be added, so that the entrance will be flanked by the sports shop on one side and the café on the other."]]},{"id":"W1-MP-06","task":1,"type":"Map or plan","prompt":["The maps below show changes to the ground floor plan of a university department in 2000 and 2015.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-06-1.jpg","w":1024,"h":717}],"models":[["The two maps show how the ground floor of a university department changed between 2000 and 2015.","Overall, the department was expanded over the fifteen years, with more teaching space, a new building and a car park, at the expense of the green area to the east. The road and the main entrance, however, remained the same.","In 2000, the department occupied a single building to the north of a road junction, reached by a main entrance leading north from the road to a central corridor. Two seminar rooms, S1 and S2, were located on the western side of the corridor, while a third seminar room, S3, a small library and an office were on its eastern side. The land to the east of the building was covered with trees.","By 2015, the main building had been extended northwards, with two new seminar rooms, S4 and S5, added on either side of a longer corridor. The library had been moved out of the main building, and the office had been enlarged to take over its space. The trees to the east had been cut down, and a new building had been constructed in the northeast, containing an IT centre and the relocated library, joined by a short corridor. In addition, a car park had been built between the main building and the road, just to the east of the main entrance."],["The maps illustrate the ground floor layout of a university department in 2000 and the changes that had been made to it by 2015.","Overall, the department became considerably larger, with the main building extended, a separate building added and a car park built. These developments meant that the trees which had covered the eastern part of the site were completely removed.","The main building was enlarged and partly reorganised. In 2000, it consisted of three seminar rooms, S1, S2 and S3, together with a library and an office, all arranged around a central corridor running north from the main entrance. By 2015, the corridor had been extended to the north, and two additional seminar rooms, S4 and S5, had been built at its end, bringing the total to five. At the same time, the library was removed from this building, and the office was expanded into the space it had occupied.","The surrounding area also changed significantly. The trees east of the main building in 2000 had all been cleared by 2015. In their place, a small new building was constructed in the northeast corner of the site, housing the library in its southern part and a new IT centre in its northern part. Further south, a car park was laid out next to the main entrance, on the northern side of the road. The road junction and the main entrance itself, on the other hand, remained unchanged."]]},{"id":"W1-MP-07","task":1,"type":"Map or plan","prompt":["The plans below show a small theater in 2010, and the same theater in 2012.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-07-1.jpg","w":1024,"h":687}],"models":[["The plans show the layout of a small theatre in 2010 and after it had been redeveloped in 2012.","Overall, the theatre was enlarged over the two years, with extensions added on both sides of the building, and almost every facility apart from the auditorium was relocated or replaced. The changes provided more space backstage and new facilities for both performers and the audience.","In 2010, the stage was at the northern end of the building, with a dressing room directly behind it and a storage room in the northwest corner. The audience sat in a large auditorium in the centre, which was entered from a foyer at the southern end of the theatre. The main door was in the middle of the foyer’s southern wall, with an admin office and a ticket office in the southwest corner and a café in the southeast corner.","By 2012, the area behind the stage had become a corridor that wrapped around the back and eastern side of the stage. The dressing room had moved to the former storage room in the northwest, with new showers below it, while the storage room had been relocated to a new extension in the northeast. At the southern end, the foyer had been extended westwards, and a large restaurant had been built in its southwest corner, replacing the admin and ticket offices. The admin office had moved to a small new room on the western side of the auditorium, and the café had been replaced by the ticket office."]]},{"id":"W1-MP-08","task":1,"type":"Map or plan","prompt":["The maps below show the changes in the art gallery ground floor in 2005 and the present day.","Summarize the information by selecting the main features, and make comparisons.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-08-1.jpg","w":1024,"h":765}],"models":[["The two plans compare the ground floor of an art gallery in 2005 and at present.","Overall, the eastern side of the gallery has not changed, but the western side has been completely reorganised, with the café, office and fourth exhibition room replaced by new facilities. The gallery has also become more accessible, with the addition of a lift and a wheelchair ramp.","In 2005, visitors entered the gallery from the south into a long entrance hall with a reception desk, which led to a staircase at the northern end. Three exhibition rooms, numbered 1 to 3 from south to north, occupied the whole of the eastern side. On the western side, there was a café in the northwest corner and a gallery office below it, while exhibition room 4, the largest room on the floor, took up the southwest corner.","Today, exhibition rooms 1 to 3, the reception and the stairs remain in the same places, but a lift has been installed beside the stairs, and a ramp for wheelchairs has been built at the entrance. The café has been converted into a gallery shop, and the office has been removed, creating more open space in the hall, where a vending machine now stands. Exhibition room 4 has been divided into two smaller areas, a temporary exhibition space in the north and a children’s area in the south. As a result, the gallery now has only three permanent exhibition rooms."]]},{"id":"W1-MP-09","task":1,"type":"Map or plan","prompt":["The two maps below show the changes of a small park from 1980 to the present day.","Summarise the information by selecting and reporting the main features and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-09-1.jpg","w":1024,"h":1024}],"models":[["The two maps illustrate how a small park has changed between 1980 and the present day.","Overall, the park has been opened up and redeveloped to offer more recreational facilities, with its boundary walls removed and its single winding path replaced by a network of routes. The pond, the benches around it and the original statue, however, have remained unchanged.","In 1980, the park was enclosed by walls, with gates only on its western and southern sides. A single path ran from the western gate past a statue in the north before curving south to the southern gate, dividing the park in two. West of this path lay a pond surrounded by three benches, while the eastern half was filled with around ten trees. Two flower beds occupied the southern end, one on either side of the path.","Today, the walls and gates have disappeared, and the original path has given way to a network linking all four sides of the park, with a main north-south route and a branch leading east. The wooded northeast has been partly cleared, leaving just four trees alongside three new picnic tables and a barbecue. In the south, the western flower bed has been replaced by a row of bushes, while the eastern one has made way for three more statues."]]},{"id":"W1-MP-10","task":1,"type":"Map or plan","prompt":["The maps compare two floor plans of one trade conference held in 2009 and 2010.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-10-1.jpg","w":1400,"h":839}],"models":[["The plans compare the layout of a trade conference in 2009 and 2010.","Overall, the northern part of the venue remained the same in both years, while the southern part was reorganised considerably. The most noticeable changes were the relocation and enlargement of the exhibition area and the removal of the meeting room and the display area.","In 2009, visitors could enter the venue through a main entrance in the northwest or a side entrance in the northeast, with a registration desk located between them. The western side of the hall was occupied by a concert hall with four seats and, to its south, a meeting room containing a stage and four seats. A display area was situated in the centre of the venue, while a small exhibition area lay in the south, next to a long balcony that ran along the eastern side.","In 2010, both entrances and the main registration desk were in the same positions, but the rest of the layout was very different. The concert hall and the meeting room had been removed from the western side, which was now taken up by a larger exhibition area. The display area had disappeared, and a smaller concert hall, with a stage and three seats, had been built in the southern part of the venue, roughly where the exhibition area had been. A second registration desk had also been added, and a lounge area had been created on the balcony."]]},{"id":"W1-MP-11","task":1,"type":"Map or plan","prompt":["The plans below show a student room for two people and a student room for one person at an Australian University.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-11-1.jpg","w":1150,"h":884}],"models":[["The plans compare two types of student accommodation at an Australian university, a room for two people and a room for one person, in terms of their size, cost and layout.","Overall, the room for two people is larger, more expensive and better furnished than the single room, although it is cheaper per person. Both rooms have a similar basic arrangement, with a bathroom in one corner, kitchen facilities along one wall and windows on the opposite side.","The double room costs $350 a week, compared with $200 for the single room, which means that each student sharing the larger room pays $175, or $25 less than a student living alone. Both rooms are 6 metres long, but the double room is 4 metres wide, while the single room is only 2.5 metres wide. The double room therefore has an area of 24 square metres, more than one and a half times the 15 square metres of the single room.","In terms of furniture, both rooms contain a bathroom, a television and a small kitchen area with a sink, a stove and a microwave. The single room also has one study desk and one bed placed beside the windows. The double room, by contrast, has two of each, with each bed positioned next to a study desk. In addition, it offers several items not found in the single room, including a round table with two chairs, two cupboards in the middle of the room and bookshelves."]]},{"id":"W1-MP-12","task":1,"type":"Map or plan","prompt":["The maps below show the future plan about the Biology School in a particular university.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-12-1.jpg","w":1400,"h":813}],"models":[["The two maps illustrate the current layout of the Biology School at a particular university and how it is planned to develop in the future.","Overall, the site is set to become considerably more built-up, with most of its trees cleared to make way for new facilities and several existing buildings expanded or relocated. The road, the central library and the indoor sports hall, however, will remain unchanged.","The most dramatic change concerns the green areas. At present, eleven trees in two rows line the northern edge, and a further five stand in the southwest corner. Under the plan, only four trees will remain in the north, with a lab and an office erected between them, while the southwestern trees will be cleared entirely for a staff car park beside the road.","Several existing facilities will also be enlarged. The single teaching building, which currently stands near the road in the west, will be moved eastwards to sit directly south of the library and joined by a second, linked teaching building. Likewise, a second lecture room will be added below the existing one, and the IT centre will be considerably extended and shifted slightly further south, while the café will move a short distance east. The only change of use will occur east of the library, where the drama centre is to be converted into a music centre."]]},{"id":"W1-MP-13","task":1,"type":"Map or plan","prompt":["The plans below show the layout of a public library now, and how it will look after development.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-13-1.jpg","w":1400,"h":796}],"models":[["The plans show the current layout of a public library and how it will look after a planned development.","Overall, the library will be extended to the east, almost doubling in size, and the new section will provide a dedicated area for children as well as several new facilities. The original part of the library will stay largely the same, although some shelves will be moved.","At present, the library consists of a single room, entered by steps on its southern side. There are male and female restrooms along the northern wall, and a seating area occupies the centre of the room. Thriller and romance books are shelved along the western wall, while fantasy, mystery and children’s books are arranged along the eastern wall, with further children’s books along the southern wall.","After the development, the original room will become the main area, still entered from the south. The restrooms, seating and the thriller and romance sections will remain unchanged, but the fantasy books will be moved to the northern wall between the two restrooms, and the mystery section will be placed against the eastern wall. All the children’s books will be moved into a new kids’ area in the extension, which will also include its own seating and a separate entrance with steps on the eastern side. In addition, the extension will contain a computer room in the southeast, which visitors can reach from the main area, and a staffroom and a store in the northeast, with a staff entrance to the north."]]},{"id":"W1-MP-14","task":1,"type":"Map or plan","prompt":["The diagram below shows the floor plan of a public library 20 years ago and how it looks now.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-14-1.jpg","w":1400,"h":1382}],"models":[["The two plans show the layout of a central library twenty years ago and at present.","Overall, the library has been modernised and now offers a wider range of services, including a computer room, a lecture room, a café and self-service machines. However, the space for printed books, magazines and other media has been reduced, and the tables and chairs in the central hall have been removed.","Twenty years ago, visitors entered the library from the south into a central hall containing two round tables with chairs. To the left of the entrance was a reading room for newspapers and magazines, and beyond it lay a large area for adult fiction books, with a room for CDs, videos and computer games in the northwest corner. On the right of the entrance, there was an enquiry desk dealing with tickets and book returns, behind which were an area for adult non-fiction books and a children’s book room in the northeast corner.","Today, the central hall is empty. On the western side, the reading room has been converted into a computer room, the adult fiction area now holds all the reference books, and the former multimedia room has become a children’s fiction room with two sofas and space for storytelling events. On the eastern side, the enquiry desk has been replaced by a café, and the non-fiction area now contains adult fiction books, an information desk and three self-service machines. Finally, the children’s book room has been turned into a lecture room."],["The plans compare the ground floor of a central library as it was twenty years ago with its present layout.","Overall, every room in the library has changed its function, and only the entrance and the basic arrangement of rooms on either side of a central hall have stayed the same. The changes show a shift away from traditional reading and borrowing towards technology, events and refreshments.","Adult fiction and adult non-fiction books occupied the two large areas in the middle of the building, on the western and eastern sides respectively. There was also a separate room for children’s books, another for CDs, videos and computer games, and a reading room for newspapers and magazines. Visitors could sit at two tables in the central hall, and an enquiry desk next to the entrance handled tickets and book returns.","At present, the library’s collections have been reorganised and partly reduced. Adult fiction has moved to the eastern side, replacing the non-fiction section, which no longer appears on the plan, while the western area now holds reference books. Children’s fiction has a room in the northwest corner, with sofas and an area for storytelling events. The multimedia materials and the reading room have disappeared, replaced by the children’s room and a computer room respectively. Meanwhile, the enquiry desk has made way for a café, an information desk and self-service machines have been installed, and the former children’s room is now used for lectures."]]},{"id":"W1-MP-15","task":1,"type":"Map or plan","prompt":["The map below shows a school in 1985 and the school now.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-15-1.jpg","w":1024,"h":727}],"models":[["The two maps show the layout of a school in 1985 and today, when the number of students has risen from 1,500 to 2,300.","Overall, the school has been developed to accommodate more students, with additional classrooms and new sports facilities. As a result, the playing fields have become considerably smaller, and the parking space on the site has been reduced.","In 1985, an entrance and an exit on the northern road led to a large car park. A smaller car park was located south of this road, next to a classroom building, and a short road led south from the main car park towards the playing fields. The western side of the site contained an office and a long library, while a two-storey classroom block stood on the eastern side. The southern half of the school was occupied by playing fields.","Today, the entrance and exit are in the same positions, but the car park is now semicircular, and the smaller car park and the road leading south have been removed. The office is unchanged, but the library has been replaced by a smaller learning resources centre with a computer room. A third storey has been added to the classroom block in the east, and two new classroom buildings have been built in the middle of the site, one in the west and one in the east. Finally, a swimming pool and a fitness centre have been built in the southwest, taking over part of the playing fields."]]},{"id":"W1-MP-16","task":1,"type":"Map or plan","prompt":["The plans below show the site of an airport now and how it will look after redevelopment next year.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-16-1.jpg","w":717,"h":1024}],"models":[["The plans show the current layout of Southwest Airport and how it will look after a redevelopment planned for next year.","Overall, the airport will be expanded and given more passenger facilities, with the most significant change being a much larger gate area. The basic structure of the terminal, with departures and arrivals halls leading to security and passport control areas, will remain the same.","At present, passengers enter the departures hall from the south and find a check-in area on the western side and a café on the eastern side. They then pass through security and passport control to a small rectangular gate area, where a walkway gives access to eight gates. Arriving passengers pass through passport control and customs into an arrivals hall that contains no facilities.","After the redevelopment, the gate area will be replaced by a Y-shaped building with 18 gates, more than twice the current number, and a sky train will take passengers through it instead of the walkway. A row of shops will also be added between security and the gates. In the departures hall, the check-in area will move to the eastern side, replacing the café, and a bag drop will be installed in its former position, while a new café will be placed in the southwest corner. The arrivals hall will also be improved, with a café, an ATM and a car hire service added."],["The diagrams compare the present layout of Southwest Airport with the layout that is planned after its development next year.","Overall, the redevelopment will greatly increase the airport’s capacity and provide a wider range of services for both departing and arriving passengers. While the terminal building itself will keep its present shape, the gate area will be rebuilt on a much larger scale.","The most dramatic change will take place in the north of the airport. Currently, there is a narrow rectangular area with only eight gates, four on each side, and passengers move between them using a walkway. In the future, this will become a large Y-shaped area with 18 gates, and passengers will travel through it by sky train. Shops will also be built just beyond security, so that passengers can use them on their way to the gates.","The departures and arrivals halls will both be reorganised. In the departures hall, which currently has only a check-in area and a café, a bag drop will be added in the west, with the check-in area moving to the east and the café to the southwest corner. The arrivals hall, which is empty at the moment, will be equipped with a café, an ATM and a car hire desk. The security and passport control area for departures and the passport control and customs area for arrivals will stay where they are."]]},{"id":"W1-MP-17","task":1,"type":"Map or plan","prompt":["The two maps below show road access to a city hospital in 2007 and in 2010.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-17-1.jpg","w":1400,"h":896}],"models":[["The two maps show the roads and facilities providing access to a city hospital in 2007 and 2010.","Overall, the road layout around the hospital was improved over the three years, mainly through the addition of two roundabouts and a bus station. Parking was also reorganised, with separate car parks for staff and the public replacing the single shared car park.","In 2007, the hospital was surrounded by Ring Road, which was connected to City Road in the south by Hospital Road, running from north to south. There were simple junctions at both ends of Hospital Road, and four bus stops lined each side of it. A single car park for both the public and staff was located to the east of Hospital Road, between Ring Road and City Road, with its entrance on Ring Road.","By 2010, both junctions on Hospital Road had been replaced by roundabouts, one where it met Ring Road and the other where it met City Road. All eight bus stops had been removed, and a bus station had been built to the west of Hospital Road, linked to the southern roundabout by a short road. The original car park east of Hospital Road had become a car park for staff only, still with its entrance on Ring Road, while a new public car park had been built further east, beside the hospital, with direct access from the eastern side of Ring Road."]]},{"id":"W1-MP-18","task":1,"type":"Map or plan","prompt":["The two maps show Kingston’s University Hospital in 1990 and 2020.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-18-1.jpg","w":1024,"h":844}],"models":[["The two maps show the layout of Kingston’s University Hospital in 1990 and 2020.","Overall, the hospital site expanded considerably over the thirty years, with a second hospital building, a larger car park and a more complex road system replacing the farmland in the east. The original hospital building remained in the same place but was used only for outpatients by 2020.","In 1990, the site consisted of a single hospital building in the northwest, connected by a straight road to an entrance on Nessan’s Road in the south. A short road branched east from this access road to a car park, and a large area of farmland occupied the northeast and east of the site.","By 2020, the farmland had disappeared. In its northern part, a new building for inpatients had been built directly east of the original hospital, which had become the outpatients’ building, and the two were linked. The car park had been extended eastwards into the former farmland, roughly doubling in size. The original entrance had become the public entrance, and the road from it now led to a system of three roundabouts, which provided access to the car park from two directions. In addition, a separate ambulance entrance had been created to the west of the public entrance, with its own road leading straight to the outpatients’ building."]]},{"id":"W1-MP-19","task":1,"type":"Map or plan","prompt":["The maps below show an island, before and after the construction of some tourist facilities.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-19-1.jpg","w":1024,"h":936}],"models":[["The two maps show an island before and after the construction of a number of facilities for tourists.","Overall, the island has been developed from an almost untouched natural area into a holiday resort, with accommodation, a restaurant, a reception building and a pier added. Most of the development has taken place in the western and central parts of the island, while the eastern end has remained largely undeveloped.","Before the development, the island, which is approximately 250 metres long, had no buildings at all. A few palm trees grew in the west, and a larger group of palm trees stood in the east. There was a beach on the western tip of the island.","After the development, two groups of accommodation huts have been built in the west and centre of the island. The western group, consisting of six huts, has been built around the palm trees in that area, while the central group of nine huts is arranged in a circle. A reception building stands between the two groups, with a restaurant to its north. These facilities are linked by a network of footpaths, one of which leads to the beach, where tourists can now go swimming. A vehicle track connects the reception to a new pier on the southern coast, where boats can moor. The trees at the eastern end of the island have been kept."]]},{"id":"W1-MP-20","task":1,"type":"Map or plan","prompt":["The maps below show Paradise Island in the past and present.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-20-1.jpg","w":1104,"h":1400}],"models":[["The two maps illustrate how Paradise Island has changed from its earlier state to the present day.","Overall, the island has been developed from a largely undisturbed natural site into a fully equipped tourist destination, with accommodation, dining and leisure facilities added throughout. Only the beach, the natural spring and the rocks off the northeastern coast have survived the transformation, though the beach is now open for swimming.","In the past, the island was largely undeveloped, with clusters of palm trees occupying the central area. The single man-made structure was a scientific research station situated in the west, just inland from a short pier where a small boat was moored. A beach lay off the northwestern shore, and a natural spring was located towards the eastern end of the island, with a group of rocks lying in the sea beyond the northeastern tip.","At present, the palm trees have been cleared to make way for a large hotel complex, erected on the site of the former research station and accompanied by an outdoor swimming pool to its north. The pier has been considerably extended so that cruise ships can now dock there, and swimming is permitted at the beach. In the centre of the island, an open restaurant with an adjoining barbecue area has been constructed, while a café has been added beside the natural spring. A scenic lookout now faces the rocks in the northeast, and a cycle path runs around the island, linking the new facilities."]]},{"id":"W1-MP-21","task":1,"type":"Map or plan","prompt":["The maps below show the changes that have taken place at the waterfront area of a town called Darwin between 2009 and 2014.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-21-1.jpg","w":1400,"h":768}],"models":[["The two maps show the changes that took place in the waterfront area of Darwin between 2009 and 2014.","Overall, the area was transformed from a largely industrial zone into one used mainly for housing, education and leisure. Both industrial areas disappeared, while more residential buildings, a university building, a harbour and a large number of trees were added.","In 2009, the southern half of the site was occupied by a large industrial area, with three residential buildings standing along its northern edge. A second, smaller industrial area lay in the north, enclosed by a circular footpath around a lake and a small group of trees. A school stood in the northwest and a convention centre to its north, while two swimming pools were located beside the sea in the east. A road ran along the western and northern edges of the site to a fishing area on the coast.","By 2014, the southern industrial area had been cleared and turned into woodland, and a new footpath crossed the site from west to east, leading to a newly built harbour on the sea. The number of residential buildings had doubled to six, with a row of trees planted just south of them and a university building to their west. In the north, the industrial area within the circular footpath had been removed, and a third swimming pool had been built near the school. The school, the convention centre, the lake, the road and the fishing area all remained unchanged."]]},{"id":"W1-MP-22","task":1,"type":"Map or plan","prompt":["The maps above show the development of the village of Ryemouth between 1995 and the present.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-22-1.jpg","w":1024,"h":577}],"models":[["The two maps illustrate the changes which took place in the coastal village of Ryemouth between 1995 and the present day.","Overall, Ryemouth has been transformed from a working village supported by farming and fishing into a resort catering for visitors. The redevelopment has substantially increased the amount of accommodation available while replacing the village’s original industries with leisure facilities, leaving only the coffee shop and most of the road network unchanged.","The most extensive change has been the expansion of places to stay. The two small hotel buildings to the west of the village centre have been rebuilt as larger multi-storey blocks, while the public park that once occupied much of the centre and east has been cleared to make way for three holiday homes. Closer to the shore, the fish market has been demolished and two rows of apartments erected in its place, and the residential area in the north-west has grown considerably as well.","The village’s original sources of livelihood, meanwhile, have given way to amenities for visitors. The farmland in the north-east has been converted into a golf course, with tennis courts added on the eastern boundary immediately below it, and a car park now serves the holiday homes. The sports facility on the western side has become a restaurant, and the morning fishing boats and their pier have been replaced by yachts moored along the same stretch of coast."]]},{"id":"W1-MP-23","task":1,"type":"Map or plan","prompt":["The maps show improvements that have been made to a university campus between 2010 and the present day.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-23-1.jpg","w":900,"h":750},{"src":"wimg/W1-MP-23-2.jpg","w":900,"h":750}],"models":[["The two maps illustrate how a university campus has been developed between 2010 and the present day.","Overall, the campus has become more built-up, with its academic and residential space expanded and several separate amenities brought together in a single student facilities complex. The lake and the main road are the only major features to have been retained, although the green space around the lake has disappeared.","Teaching and administration have been reorganised. In 2010, arts and science were taught together in one teaching block just southeast of the main road, while the university offices stood on the opposite side. Today, each subject has a building of its own, as the teaching block has been replaced by a modern arts building and the offices have been demolished to make way for a science building.","The most extensive changes, however, concern student life. A second accommodation block has been added beside the original one in the northwest, and another has been built in the east on the former site of the two shops. The smaller residence in the southwest, by contrast, has been removed, and a large building containing shops, offices and other student facilities now occupies this site, extending onto part of the former lawn. The restaurant in the southeast has also gone, and a new road has been built in that corner. Finally, although the lake remains, its lawn and seating area no longer exist."]]},{"id":"W1-MP-24","task":1,"type":"Map or plan","prompt":["The maps below show the town of Langley in 1910 and 1950.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-24-1.jpg","w":960,"h":690},{"src":"wimg/W1-MP-24-2.jpg","w":960,"h":690}],"models":[["The maps illustrate the changes that took place in the town of Langley over a forty-year period between 1910 and 1950.","Overall, Langley was converted from an industrial settlement into a residential and recreational one, with the factory, the railway and all of the smaller dwellings giving way to apartment blocks and a public park.","In 1910, Jordan Street ran from north to south along the western edge of the town, with a row of townhouses on each side. To the northeast lay a factory and wasteland, with a store, a laundry and a café further east. Sherman Street ran east through the centre, lined with terraced houses, and further south lay more wasteland, a cluster of railway workers’ cottages and a railway line along the southern boundary.","By 1950, the factory and the terraced houses to its south had been demolished to make way for three large blocks known as Sherman Mansions, and the townhouses on the western side of Jordan Street had likewise been replaced by flats, while those on the eastern side were cleared entirely. In the southern half of the town, the southern terraced houses, the wasteland, the cottages and the railway line had all been removed to create Sherman Park, which contained a pond and a children’s play area in its southeastern corner. A new road, New Lane, had been built along the eastern edge, with three stores erected on its far side, replacing the single store north of Sherman Street. The laundry and the café remained in their original positions throughout."],["The two maps compare the layout of the town of Langley in 1910 and 1950.","Overall, Langley changed from an industrial town with large areas of wasteland into a residential area with a park and more shops. Most of the original buildings were demolished during the forty years, and only the laundry, the café and the two main streets remained.","In 1910, Jordan Street ran north to south on the western side, lined on both sides by townhouses. Sherman Street ran eastwards from Jordan Street, with terraced houses on both sides. The area north of these houses was occupied by a factory and wasteland, while a store, a laundry and a café stood at the eastern end of Sherman Street. South of Sherman Street, there was another area of wasteland and a row of railway workers’ cottages, and a railway line ran along the southern edge of the town.","By 1950, the town had been almost completely redeveloped. The factory, the northern wasteland and the terraced houses north of Sherman Street had been replaced by three blocks of flats called Sherman Mansions. The townhouses west of Jordan Street had been rebuilt as three large blocks of flats, and those to its east had been demolished. The southern half of the town, including the railway line, had become Sherman Park, with a pond and a children’s play area. In addition, a new road, New Lane, had been built along the eastern side of the park, with three stores beside it, while the original store had disappeared."]]},{"id":"W1-MP-25","task":1,"type":"Map or plan","prompt":["The maps below show changes in the city of Nelson in recent times.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-25-1.jpg","w":1400,"h":921}],"models":[["The two maps show how the city of Nelson has changed between 2000 and the present day.","Overall, Nelson has been extensively modernised, with new facilities for shopping, transport, accommodation and entertainment. The university, the city centre and the port are the only features that have remained, and the city centre has become more environmentally friendly, with a bike rental scheme and no traffic along the waterfront.","In 2000, the university stood in the north of the city, with a group of trees to its east. A train station was located in the northwest, and an old market occupied the area to the west of the city centre. A road ran from west to east between the city centre and the port in the south.","Today, the trees have been replaced by a new shopping centre, and a hall of residence has been built in the northwest, west of the university. The old train station has gone, and a new train station has been built directly north of the city centre, with a tramline linking the university area to the city centre. The old market has made way for a new shop, while a new covered market has been built on the eastern side of the city centre, which itself now contains a bike rental scheme. In the south, the road has become a pedestrian-only area, and a restaurant and some bars and clubs have opened beside the port."]]},{"id":"W1-MP-26","task":1,"type":"Map or plan","prompt":["The diagrams below show changes in Felixstone in the UK between 1967 and 2001.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-26-1.jpg","w":720,"h":958}],"models":[["The maps show the changes that took place in Felixstone, a town in the UK, between 1967 and 2001.","Overall, Felixstone was transformed from a town with farming and fishing activities into a tourist resort. The farmland, the fish market, the marina and the pier all disappeared, while a new hotel, apartments, two beaches and wind turbines were added.","Regarding the northern part of the town, in 1967, there was an area of farmland in the northeast corner. However, by 2001, this area had been completely redeveloped and replaced by a new hotel with a swimming pool and tennis courts. It is also noticeable that the shops which were previously situated on the right-hand side of Highstreet had been removed to make way for newly constructed apartments.","Turning next to the remaining areas of the town, the land next to the new hotel and the beachside, which was previously a fish market in 1967, had been transformed into a private beach in 2001. Furthermore, a large marina and pier that once stood on the seafront of this town had been removed and replaced with a public beach. Other changes to the area include a wind turbine facility located to the south of the dunes, and the addition of a car park beside the original hotel near the seafront."]]},{"id":"W1-MP-27","task":1,"type":"Map or plan","prompt":["The maps below show a part of a village in 1910 and the same part of the village in 2010.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-27-1.jpg","w":976,"h":1400}],"models":[["The maps compare the layout of one section of Shalton village in 1910 with the same area a century later, in 2010.","Overall, the village has been transformed from a small settlement of independent shops surrounded by greenery into a much denser residential area, with retail concentrated into a single supermarket. The three main roads, the school and the post office, however, have remained unchanged throughout the period.","In 1910, the heart of the area was a triangular block bounded by School Road to the northwest, London Road to the northeast and High Street to the south. Within this block stood a large house among trees, with a grocer, a house and a baker along its southern side. A butcher was situated on the opposite side of School Road, beyond which lay the school, and a post office stood just beyond the northern tip of the block, on the far side of London Road. Only three houses lay outside the block, one north of School Road and two along the far side of High Street.","By 2010, the trees and the large house had disappeared entirely, replaced by new houses, and the grocer had been converted into a café while the baker’s site had likewise been built over with housing. The butcher had been replaced by a supermarket with its own parking area, and the house north of School Road had become a bank. More houses had also appeared along London Road and High Street. The school, the post office and the three main roads were the only features to remain unchanged."]]},{"id":"W1-MP-28","task":1,"type":"Map or plan","prompt":["The maps below show the centre of a small town called Islip as it is now, and plans for its development.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MP-28-1.jpg","w":1140,"h":1200}],"models":[["The maps show the centre of the small town of Islip as it is now and a plan for its future development.","Overall, the town centre is set to be transformed, with a dual carriageway around it, a pedestrian zone at its heart and several new facilities, including a shopping centre and a bus station. The development will also extend into part of the countryside to the north.","At present, a main road runs through the town centre from west to east, with rows of shops on both sides. North of the northern row is countryside, while the area south of the southern row is mainly housing. Two side roads lead south from the main road, one in the west curving towards the school, and one in the east ending at a park.","Under the plan, a dual carriageway will be built in a loop around the town centre, connecting to the main road at both ends, and the central section of the main road will become a street for pedestrians only. The northern row of shops will be replaced by a bus station, a shopping centre and a car park, built partly on former countryside, with new housing to their east. The southern row of shops will be kept, and the housing south of it will remain, but some new housing will be built in the southeast, reducing the size of the park. The school will be slightly enlarged and will lie just outside the new road."],["The two maps illustrate the present layout of Islip town centre and the changes that are planned for it.","Overall, the plan aims to separate traffic from pedestrians in the town centre, while providing more shopping, parking and public transport facilities. Most of the existing housing will remain, but new housing will be added in two areas.","Currently, all traffic passes through the middle of the town centre along a main road running from west to east, which is lined with shops on both sides. The northern side of the town centre borders on countryside. To the south, there is a large residential area, with a park in the east and a school in the southwest, each reached by a side road from the main road.","In the future, traffic will be diverted onto a new dual carriageway that will encircle the town centre, and the stretch of main road between the rows of buildings will be pedestrianised. North of this pedestrian street, the existing shops will make way for a bus station, a shopping centre and a car park, and new housing will be built in the northeast. The shops on the southern side of the street will remain, as will most of the housing behind them. However, the park will be reduced in size to make room for new housing, and the two side roads will disappear, replaced by the dual carriageway. The school will remain in the southwest, just outside the new ring road."]]},{"id":"W1-MP-29","task":1,"type":"Map or plan","prompt":["The maps below show an industrial area in the town of Norbiton, and planned future development of the site.","Summarize the information by selecting and reporting the main features, and make comparisons wher
