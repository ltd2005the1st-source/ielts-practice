nearly every young person during their formative years, they are well placed to reverse this trend.","In conclusion, teenagers read less mainly because of the appeal of digital entertainment and the association of books with schoolwork. Schools should therefore make reading enjoyable through free reading time, wider book choices and shared activities, so that this valuable habit is not lost to future generations."]]},{"id":"W2-PS-04","task":2,"type":"Problems and solutions","prompt":["Nowadays, not enough students choose scientific or research-oriented courses at university in many countries.","What do you think are the causes of this trend?","What effects may this have on a society in the long run?"],"imgs":[],"models":[["In recent years, a noticeable decline has emerged in the number of students choosing science and research-based degrees in many countries. This trend can chiefly be attributed to the difficulty of scientific subjects and the modest financial rewards of research careers, and in the long run it may slow innovation and leave societies dependent on foreign expertise.","This trend can be explained mainly by the demands of scientific study and the limited appeal of research careers. Firstly, scientific subjects are widely regarded as difficult. Fields such as physics, chemistry and engineering require rigorous analytical thinking, a solid grounding in mathematics and years of sustained effort, which many students find intimidating compared with business or humanities courses. Secondly, research careers often offer modest pay and slow progression. Entry-level research positions, particularly in universities, usually come with limited salaries and short-term contracts, whereas finance, law and marketing promise faster financial rewards. Students from less wealthy families may feel they cannot afford to spend years on poorly paid research. For example, a talented chemistry graduate may receive a far higher starting salary from a bank than from a research laboratory. Consequently, many capable students avoid science not because they lack interest, but because they are concerned about their future livelihoods.","This shortage of science graduates could have serious long-term effects on society. To begin with, it may slow the pace of innovation. Breakthroughs in medicine, renewable energy and technology depend on large numbers of trained researchers, so a shrinking scientific workforce could delay new treatments and cleaner technologies that would improve living standards. To illustrate, the rapid development of COVID-19 vaccines was possible only because many scientists had spent years researching the underlying technology. In addition, countries without enough domestic scientists risk becoming dependent on foreign expertise and imported technology. They may have to pay heavily for patents, equipment and specialists from abroad, which weakens their economic competitiveness and self-sufficiency. Over time, these effects could leave a society poorly equipped to solve the very problems science is best suited to address.","In conclusion, the difficulty of scientific subjects and the modest rewards of research careers are the main reasons fewer students choose these fields. If this trend continues, innovation may slow and countries may become increasingly dependent on foreign expertise, so governments should take steps to make scientific careers more attractive."],["Many countries are currently experiencing a decline in the number of students choosing scientific or research-oriented courses at university. This trend stems largely from the heavy workload of these courses and uncertain starting salaries, and it may leave societies short of essential professionals and less able to deal with global challenges.","The decline in science students can be attributed to the demanding nature of these courses and uncertain job prospects. Firstly, scientific study involves heavy workloads and complex concepts. Research also requires patience, as experiments often fail repeatedly before producing useful results, so students who fear struggling or failing may choose easier alternatives. The mathematics required for many science degrees can also be a barrier for students who struggled with the subject at school. Secondly, entry-level salaries in research can be low and unpredictable. Many research positions depend on government funding and short-term grants, so young scientists may face years of insecure contracts, while graduates in fields such as business often find well-paid jobs more quickly. For example, a young biologist may spend several years moving between temporary research projects before securing a permanent position. For these reasons, many students see science as a high-effort, low-reward choice.","In the long run, this trend could harm society in two important ways. To begin with, it may create shortages in essential professions. Hospitals, energy companies and engineering firms all depend on scientifically trained staff, so a shrinking pool of graduates could leave important positions unfilled and slow the development of public services and infrastructure. Some countries already rely on recruiting doctors and engineers from abroad to fill these gaps. In addition, societies may become less able to respond to complex global problems. Issues such as climate change, pandemics and food security require in-depth research and specialised knowledge, and without enough scientists, countries may struggle to develop effective solutions. To illustrate, during the COVID-19 pandemic, countries with strong scientific institutions were able to test, track and study the virus far more effectively than those without them. Therefore, a lack of science students could weaken both everyday services and crisis responses.","In conclusion, fewer students choose science because of its heavy demands and uncertain salaries, and this may lead to shortages of essential professionals and a weaker response to global challenges. Governments should therefore offer scholarships and better-paid research positions to make these careers more attractive."],["It is widely accepted that scientific knowledge is essential to the development of any society. However, the number of students choosing science as their major at university appears to be falling in many countries, mainly because of the complexity of these subjects and fierce competition for scientific jobs. As a result, national economies and the quality of education may both suffer.","There are two main reasons behind the shortage of students studying science at university. Firstly, the complexity of these subjects deters many students. Scientific degrees require students to master large amounts of interconnected theory and specialised knowledge, and success demands not only ability but also great determination. Many students who enjoyed science at school are discouraged once they realise how demanding university-level study is. Secondly, competition for well-paid scientific jobs is intense, and these careers can feel narrow. Graduates in science often compete for a limited number of positions in laboratories and research institutes, whereas graduates in economics or social sciences can enter a wide variety of industries, start their own businesses and change direction more easily. For example, a business graduate may move between marketing, finance and management, while a physics graduate may find fewer obvious career paths. Therefore, many students choose majors that seem to offer greater flexibility and security.","This trend may harm society in two significant ways. To begin with, it can weaken a country’s economic competitiveness. Modern economies depend on high-technology industries such as semiconductors, biotechnology and artificial intelligence, which require large numbers of skilled scientists and engineers. A case in point is Taiwan, whose success in semiconductor manufacturing relies heavily on a large supply of highly trained engineers. In addition, a shortage of science graduates can lower the quality of science education itself. When few graduates have a strong scientific background, schools struggle to recruit qualified science teachers, so the next generation receives weaker teaching and becomes even less likely to choose science. This creates a vicious circle that is difficult to break. Consequently, the decline in science students can damage both the economy and the education system.","In conclusion, the complexity of scientific subjects and the narrow, competitive nature of scientific careers discourage many students, and this may reduce economic competitiveness and weaken science education. Governments should therefore invest in science teaching and create more attractive career paths for science graduates."],["In an era of rapid technological change, scientific and research-oriented subjects are more important than ever. Yet in many parts of the world, fewer students are choosing these subjects at university, largely because of uninspiring science teaching at school and the attraction of more lucrative fields. In the long term, this may reduce public understanding of science and weaken governments’ ability to make well-informed decisions.","To begin with, this trend can be attributed to the way science is taught and the appeal of alternative careers. Firstly, many students lose interest in science long before they reach university. When lessons focus on memorising formulas and definitions rather than on experiments and real-world problems, students often see science as dry, difficult and irrelevant to their lives. For example, a student who has only ever copied equations from the board may never discover how chemistry explains cooking or how physics makes smartphones work. Secondly, careers in business, law and technology appear more financially rewarding. Students and parents often believe that these fields lead to higher salaries and faster promotion, so they steer away from research careers that seem less secure. Popular culture also tends to celebrate entrepreneurs and celebrities rather than scientists. Taken together, poor early experiences and financial considerations push many students away from science.","The shortage of science students can have adverse effects on society in several ways. To begin with, it may reduce the public’s scientific literacy. When fewer people understand how scientific evidence works, false claims about health, food or the environment spread more easily and are harder to challenge. To illustrate, misinformation about vaccines has led some parents to refuse vaccinations for their children, contributing to outbreaks of preventable diseases such as measles. In addition, governments may lack the experts they need to make sound decisions. Policies on energy, public health and climate change depend on reliable scientific advice, and a shortage of qualified specialists can result in poorly informed choices with long-lasting consequences. Therefore, the decline in science students can affect both public understanding and the quality of government decisions.","To sum up, poor science teaching and the appeal of more lucrative careers discourage students from choosing science, which may weaken public understanding of science and the quality of policymaking. Schools and universities should therefore make science teaching more practical and engaging to inspire future scientists."]],"sibling":"W2-PS-05"},{"id":"W2-PS-05","task":2,"type":"Problems and solutions","prompt":["Nowadays, not enough students choose scientific or research-oriented subjects at university in many countries.","What do you think are the causes of this trend?","How do you think we can encourage students to pursue scientific and research-oriented subjects?"],"imgs":[],"models":[["In recent years, there has been a noticeable decline in the number of students choosing scientific or research-focused subjects at university in many countries. This trend stems mainly from the difficulty of these subjects and the uncertain rewards of scientific careers, but it can be reversed through financial incentives and more engaging science education in schools.","The lack of students choosing scientific subjects can be attributed to two main reasons. Firstly, these subjects are widely seen as difficult. Courses such as physics, chemistry and engineering involve rigorous study and demand a strong background in mathematics, which can discourage students who find these areas challenging, especially when humanities or business courses appear more accessible. Secondly, scientific careers can seem uncertain and highly competitive. While some fields, such as medicine and technology, offer high salaries, many research roles are poorly funded, and only a small number of researchers achieve stable, well-paid positions. For example, a graduate who wishes to become a research scientist may need to complete a doctorate and several short-term contracts before finding a permanent post. Consequently, many young people concerned about their future income choose other fields.","To address this issue, governments and schools both need to play an active role. To begin with, providing scholarships and better financial support for science students would make these subjects more attractive. Generous funding would make scientific degrees accessible to students from low-income backgrounds and persuade high achievers who might otherwise choose business or law, while better salaries for researchers would make the career itself more appealing. A case in point is the National Science Foundation in the United States, whose graduate fellowships fund the studies of thousands of promising young scientists. In addition, schools should make science lessons more practical and engaging. When students carry out experiments, take part in science fairs or solve real-world problems, they are likely to see science as exciting and meaningful rather than boring or reserved for exceptionally gifted people. Therefore, financial support and inspiring teaching could encourage far more students to choose science.","In conclusion, the decline in science enrolment is driven largely by the perceived difficulty of these subjects and limited career prospects. Governments should therefore offer scholarships and better-paid research positions, while schools introduce hands-on science teaching from an early age, so that more students are inspired to enter these vital fields."]],"sibling":"W2-PS-04"},{"id":"W2-PS-06","task":2,"type":"Problems and solutions","prompt":["Even though doctors advise old people to get more exercise, many of them do not get nearly enough.","What are the reasons for this?","What can be done for old people to exercise more?"],"imgs":[],"models":[["Regular exercise is one of the simplest and most effective ways for older people to stay healthy and independent, yet many ignore their doctors’ advice to be more active. This is mainly because they fear injury and underestimate the benefits of exercise, but families and public health campaigns can help them adopt a more active lifestyle.","There are two main reasons why many elderly people do not exercise enough. Firstly, they are often afraid of hurting themselves. As people age, their bones become more fragile and their balance less reliable, so many worry that physical activity could lead to falls, injuries or pain, especially if they have existing health problems. For example, an older person who has already suffered a fall may avoid even short walks for fear that it will happen again. Secondly, many seniors do not fully understand why exercise matters. Some believe that once they have retired and no longer need to work or look after young children, there is little point in staying physically active, and they may not realise that regular movement can prevent heart disease, maintain muscle strength and improve mood. Together, fear and a lack of awareness keep many older people inactive.","Several measures could encourage older people to exercise more. To begin with, families can provide support and companionship. Gentle activities such as walking, swimming or gardening are suitable for most seniors, and younger relatives can make them more enjoyable by taking part too. A grandchild who regularly invites a grandparent for an evening walk, for instance, can help build a healthy habit while strengthening their relationship. In addition, public campaigns and community programmes can raise awareness and offer safe ways to exercise. Doctors can appear in television and radio campaigns to explain the benefits of activity, while local authorities can organise classes designed specifically for older people. To illustrate, groups of older people practising tai chi or dancing in public parks every morning are a familiar sight in many Asian cities, showing how shared activities can make exercise sociable and safe. Therefore, support from families and communities can help seniors become far more active.","In conclusion, many older people do not exercise enough because they fear injury and do not appreciate its benefits. Families and local authorities should therefore work together, offering companionship, accurate information and safe group activities, so that older people can enjoy healthier and more independent lives."]]},{"id":"W2-PS-07","task":2,"type":"Problems and solutions","prompt":["Scientists believe that in order to protect the environment, people must use less energy in their daily lives. However, most people have not changed the way they live.","Why do you think many people have not taken individual action?","What could be done to encourage them to take action?"],"imgs":[],"models":[["Although scientists warn that reducing energy consumption is essential to protecting the environment, most people have made little change to their daily habits. This inaction stems mainly from a sense that individual effort makes no difference and from the inconvenience and cost of changing, but financial incentives and better public infrastructure could motivate people to do more.","There are two main reasons why so many people fail to take individual action. Firstly, many feel that their own efforts are insignificant. Faced with a problem as vast as climate change, people often believe that switching off a few lights or driving less will make no measurable difference compared with the emissions of entire industries and nations, so they assume the responsibility lies with governments and corporations. Secondly, changing one’s lifestyle is often inconvenient and expensive. Using less energy may mean giving up familiar comforts, enduring a colder home in winter or paying more for energy-efficient appliances. For example, a family on a tight budget may continue using an old, inefficient refrigerator simply because they cannot afford a new one. In short, a feeling of powerlessness combined with the pull of convenience keeps most people from acting.","Fortunately, several measures could encourage individuals to change their behaviour. To begin with, governments can make sustainable choices financially attractive. Subsidies for solar panels, insulation and energy-efficient appliances, together with higher taxes on wasteful consumption, would make the greener option the cheaper one rather than the more expensive. A case in point is Germany, where generous payments for electricity generated by solar panels encouraged large numbers of households to install them on their roofs. In addition, governments should invest in infrastructure that makes low-energy living convenient. Reliable public transport, safe cycle lanes and clear energy labels on products allow people to reduce their consumption without major sacrifices, while public campaigns can show how much collective action achieves. Therefore, combining incentives with supportive infrastructure would remove many of the barriers that currently discourage action.","In conclusion, most people have not reduced their energy use because they doubt their impact and are reluctant to sacrifice comfort or money. Governments should therefore make sustainable living cheaper and more convenient through subsidies, taxes and investment in public infrastructure, encouraging far more people to play their part in protecting the environment."]]},{"id":"W2-PS-08","task":2,"type":"Problems and solutions","prompt":["More and more wild animals have appeared on endangered lists, and some have become extinct in the span of the last few decades.","What are the causes of this?","What can be done to solve this problem?"],"imgs":[],"models":[["In recent decades, growing numbers of wild animals have been added to endangered lists, and some species have disappeared altogether. This crisis is caused mainly by the destruction of natural habitats and by climate change, but it can be tackled through stronger protection of wild areas and programmes that breed endangered species in captivity.","The decline of wild animals can be attributed to two main causes. Firstly, human activities such as deforestation, farming and urban expansion destroy natural habitats. As forests and wetlands are cleared, animals are left with less space to find food, shelter and mates, and their populations become small and isolated. For example, the clearing of rainforests in Indonesia for palm oil plantations has greatly reduced the habitat of orangutans. Secondly, climate change is altering ecosystems faster than many species can adapt. Rising temperatures, changing rainfall patterns and more frequent extreme weather can destroy food sources and breeding grounds, particularly for species that live in very specific conditions. Coral reefs, for instance, have suffered widespread bleaching as ocean temperatures rise, threatening the many species that depend on them. These points considered, habitat destruction and climate change are the main drivers of species decline.","Several measures can be taken to tackle this problem. To begin with, governments should expand and protect nature reserves and national parks. Strictly protected areas, connected by corridors of natural land, allow animals to move, feed and breed safely, while laws against illegal logging and land clearing prevent further destruction. Such protection also benefits local communities by preserving clean water and attracting eco-tourists. In addition, captive breeding and reintroduction programmes can save species on the brink of extinction. Zoos and conservation organisations can breed endangered animals in safe conditions and later release them into protected habitats once their numbers have recovered. To illustrate, the California condor, which had fallen to just 27 birds in the 1980s, has been saved from extinction through captive breeding and now flies in the wild again. Therefore, combining habitat protection with breeding programmes could go a long way towards preventing further extinctions.","To sum up, the loss of natural habitats and the effects of climate change are pushing many species towards extinction. Governments should therefore protect and connect wild areas, support captive breeding programmes and reduce greenhouse gas emissions, so that endangered animals can survive and recover in the future."],["Over the past several decades, an alarming number of species have joined the ranks of the endangered, and a considerable few have vanished altogether. This decline is driven mainly by the expansion of human settlements and agriculture and by illegal hunting, but it can be slowed through stricter law enforcement and efforts to reduce demand for wildlife products.","This phenomenon can largely be traced back to two underlying causes. Firstly, the relentless expansion of human settlements and agriculture has stripped countless species of their natural habitats. As land is cleared for farms, timber and housing, animals are left with shrinking territories in which to feed, breed and shelter, and many populations become too fragmented to survive in the long run. Secondly, the illegal hunting and trading of wildlife continues to push numerous species towards extinction. Animals prized for their tusks, horns, skins or use in traditional medicine are targeted by poachers who profit from enormous black-market demand. For example, rhinoceroses are hunted for their horns, which can sell for very high prices despite having no proven medical value. Taken together, habitat loss and poaching are among the most significant drivers of species decline worldwide.","Fortunately, a number of measures could be adopted to address this crisis. To begin with, authorities must tighten legislation against poaching and illegal wildlife trafficking. Severe penalties for offenders, combined with well-trained and well-equipped park rangers, would make poaching far riskier and less profitable, while protected reserves would safeguard critical habitats from logging, mining and urban sprawl. In addition, reducing consumer demand for wildlife products would remove the financial incentive for poaching. Public education campaigns can inform people that products such as ivory and rhino horn come from the cruel killing of endangered animals and have no special health benefits. To illustrate, China banned its domestic trade in ivory at the end of 2017, a decision widely welcomed by conservation groups as a major step towards protecting elephants. Therefore, enforcement and demand reduction together could help reverse this troubling trend.","In conclusion, habitat loss and poaching are the foremost causes of the growing number of endangered and extinct species. Through stricter law enforcement, protected reserves and campaigns to reduce demand for wildlife products, however, governments can slow this trend and safeguard the world’s remaining wildlife for future generations."]]},{"id":"W2-PS-09","task":2,"type":"Problems and solutions","prompt":["In recent years, there has been a rise in the use of performance-enhancing drugs in sports.","What are the consequences of this trend for athletes?","What measures should be taken to combat this issue?"],"imgs":[],"models":[["As the financial rewards and prestige of professional sport have grown, so has the temptation for athletes to use banned substances to improve their performance. This trend can seriously damage athletes’ health and destroy their careers and reputations, but it can be combated through more advanced testing and better education combined with tougher penalties.","The use of performance-enhancing drugs has serious consequences for the athletes who take them. Firstly, these substances can cause lasting damage to their health. Steroids, stimulants and blood-boosting drugs may lead to heart problems, liver damage, hormonal imbalances and psychological effects such as aggression and depression, and some of these problems may only appear years later. Athletes who push their bodies beyond natural limits are also more likely to suffer serious injuries. Secondly, doping can ruin an athlete’s career and reputation. Those who are caught face long bans, lose their medals and prize money and may never regain the trust of fans and sponsors. For example, the cyclist Lance Armstrong was stripped of his seven Tour de France titles in 2012 after investigators found evidence of systematic doping. Consequently, the short-term gains of doping are far outweighed by its long-term costs.","Several measures should be taken to combat this issue. To begin with, sports organisations must make testing more frequent and more sophisticated. Unannounced tests during training periods, as well as at competitions, make it much harder for athletes to escape detection, while storing samples for years allows them to be retested as new methods are developed. A case in point is the athlete biological passport, introduced by the World Anti-Doping Agency, which monitors changes in an athlete’s blood and hormone levels over time to reveal signs of doping. In addition, young athletes should receive education about the dangers of drugs, combined with strict penalties for those who cheat. Coaches and doctors who supply banned substances should also be punished, since athletes are often pressured by the people around them. Therefore, a combination of better detection, education and firm sanctions could greatly reduce doping in sport.","In conclusion, the growing use of performance-enhancing drugs endangers athletes’ health and can end their careers in disgrace. Sports authorities should therefore invest in advanced testing, educate young athletes about the risks and impose tough penalties on everyone involved in doping, so that fair competition can be restored."]]},{"id":"W2-PS-10","task":2,"type":"Problems and solutions","prompt":["In many societies, there is a growing emphasis on sustainable living and reducing environmental impact.","What are the challenges of adopting a sustainable lifestyle?","What practical actions can individuals take to contribute to sustainability?"],"imgs":[],"models":[["As concern about climate change and pollution grows, more people are being encouraged to live in ways that reduce their impact on the environment. However, adopting a sustainable lifestyle can be difficult because green products are often expensive and modern habits are hard to change. Even so, individuals can make a real contribution by consuming less and choosing greener ways to travel and use energy.","There are two main challenges that prevent people from living more sustainably. Firstly, environmentally friendly options are often more expensive. Organic food, electric cars, solar panels and products made from recycled or durable materials usually cost more than conventional alternatives, so families with limited budgets may feel they cannot afford them. Secondly, modern lifestyles are built around convenience. Fast fashion, single-use packaging, cheap flights and food delivery make daily life easier, and changing these habits requires time, effort and planning that many busy people lack. In addition, in some areas, sustainable choices are simply not available. For example, a commuter living in a suburb with no reliable bus service may have no realistic alternative to driving to work every day. Taken together, cost, convenience and limited infrastructure make sustainable living a challenge for many people.","Nevertheless, there are practical actions that individuals can take. To begin with, people can reduce how much they consume and waste. Repairing clothes and electronic devices instead of replacing them, buying second-hand goods, avoiding single-use plastics and eating less meat all reduce the resources and energy needed to produce new products. To illustrate, repair cafés, which began in Amsterdam in 2009, now operate in many countries, allowing volunteers to help people fix broken household items for free. In addition, individuals can choose greener ways to travel and use energy at home. Walking, cycling or using public transport for short journeys, switching off appliances when they are not in use and choosing energy-efficient light bulbs can significantly lower a household’s carbon footprint, and these changes often save money too. Therefore, small daily actions, repeated by millions of people, can make a meaningful difference.","In conclusion, the cost of green products, the pull of convenience and gaps in infrastructure make sustainable living difficult, but individuals can still contribute by consuming less and choosing greener transport and energy habits. Governments should support these efforts by making sustainable options cheaper and more widely available."]]},{"id":"W2-PS-11","task":2,"type":"Problems and solutions","prompt":["Many men and women are making the decision to have children later in life.","Why is this trend occurring?","What are the impacts of this development on the modern family and society?"],"imgs":[],"models":[["In the past, it was considered normal for couples to marry young and start a family soon afterwards, but in many countries today, people are having children much later in life. This trend is driven mainly by changing career patterns and rising living costs, and it can make parenthood more difficult for families while contributing to an ageing population.","There are two main reasons why people are delaying parenthood. Firstly, career opportunities, particularly for women, have expanded greatly. As more women pursue higher education and demanding professional careers, many prefer to establish themselves at work before having children, since it is difficult to balance young children with long hours and frequent travel during the early stages of a career. Secondly, the rising cost of living makes it harder to afford a family. Owning a home, paying for childcare and covering education costs require a stable income, so many couples wait until they feel financially secure. For example, a young couple in a large city may spend years saving for a deposit on a flat before they feel ready to have a child. Therefore, professional ambition and financial pressure encourage many people to postpone parenthood.","This trend has significant consequences for families and society. To begin with, having children later can be harder for parents. Older women may find it more difficult to conceive and face a higher risk of complications during pregnancy, while older parents may have less energy for the demanding early years of child-rearing. In addition, delayed parenthood contributes to falling birth rates, because couples who start later often have fewer children. Over time, this produces an ageing population, with fewer young workers to support the growing number of retired people. To illustrate, South Korea, where many people marry and have children late, now has the lowest fertility rate in the world, raising serious concerns about its future workforce. Consequently, delayed parenthood presents challenges for both families and the wider economy.","In conclusion, people are having children later mainly because of career priorities and the high cost of raising a family, and this trend can make parenthood more difficult and contribute to an ageing society. Governments should therefore support young families through affordable housing, childcare and paid parental leave, so that people feel able to have children earlier if they wish."],["Across much of the world, it has become increasingly common for couples to postpone having children until their thirties or beyond, in contrast to earlier generations who tended to start families young. This shift is caused mainly by longer education and later marriage, together with advances in fertility treatment, and its effects on families and society are mixed, bringing both greater stability and demographic challenges.","This trend can be attributed to two principal causes. Firstly, young people now spend longer in education and marry later. Many study for degrees and postgraduate qualifications well into their twenties and then focus on building their careers, so they meet long-term partners and settle down later than their parents did. Secondly, medical advances have made later parenthood more achievable. Fertility treatments such as in vitro fertilisation, which led to the first so-called test-tube baby in 1978, now allow many people in their late thirties and forties to have children, giving couples more confidence that they can wait. For example, a woman who completes a doctorate and becomes established in her profession may feel able to start a family at forty with medical support if necessary. Consequently, both social changes and medical progress encourage couples to delay parenthood.","This development carries significant consequences for families and society, some beneficial and others concerning. On the positive side, older parents tend to be more financially secure and emotionally mature. They are often better able to provide a stable home, pay for their children’s education and handle the stresses of family life calmly, which can give their children a strong start. On the negative side, later parenthood usually means smaller families and falling birth rates, which over time produce an ageing population with too few young workers to support the elderly and sustain economic growth. To illustrate, Japan, where the average age of first-time mothers has risen considerably, faces a shrinking population and severe labour shortages. Therefore, the impacts of this trend are genuinely mixed rather than entirely harmful.","In conclusion, the growing tendency to have children later in life results mainly from longer education, later marriage and advances in fertility treatment. While it creates more stable families, it also contributes to an ageing population, so policymakers should prepare by supporting families and adapting pension and healthcare systems."]]},{"id":"W2-PS-12","task":2,"type":"Problems and solutions","prompt":["In developing countries nowadays, urban population centers are facing serious problems relating to people’s living conditions and quality of life, despite rapid economic growth.","Why does this issue arise?","What can be done to make the situation better?"],"imgs":[],"models":[["In many developing countries, rapid economic growth has turned cities into centres of opportunity, yet large numbers of urban residents still endure overcrowding, poor housing and inadequate services. This problem arises mainly because migration outpaces the development of infrastructure and because the benefits of growth are unevenly shared, but it can be eased through investment in public infrastructure and the development of smaller cities.","There are two main reasons why living conditions in growing cities remain poor. Firstly, the number of people moving to cities often grows faster than infrastructure can be built. Rural migrants arrive in search of work, but housing, water supply, sanitation and public transport cannot expand quickly enough, leading to overcrowding and shortages of basic services. Secondly, the benefits of economic growth are often concentrated among a wealthy minority. While new office towers and luxury apartments appear, many low-paid workers can afford only cramped rooms or informal settlements without proper sanitation or security. For example, in cities such as Dhaka in Bangladesh, large numbers of garment workers live in crowded slums close to the factories where they work. These points considered, rapid migration and inequality explain why economic growth does not automatically improve urban living conditions.","Several measures could improve the situation. To begin with, governments should invest heavily in public infrastructure and affordable housing. Building clean water systems, sewage networks, public transport and low-cost homes would allow cities to accommodate growing populations while improving the quality of life of poorer residents. A case in point is Singapore, where large-scale public housing built by the government now provides homes for the majority of the population. Upgrading informal settlements with clean water and proper drainage can also improve conditions quickly for the poorest residents. In addition, governments should encourage development in smaller cities and rural regions. Investing in schools, hospitals and industries outside the largest cities would create jobs closer to people’s home towns, reducing the pressure on overcrowded urban centres. Therefore, a combination of better infrastructure and more balanced regional development could make urban growth more sustainable.","In conclusion, poor living conditions in developing cities arise mainly from rapid migration and the unequal distribution of wealth. Governments should therefore invest in infrastructure and affordable housing while spreading economic development more evenly across their countries, so that rapid growth translates into a better quality of life for all."],["Although many developing economies are growing rapidly, the quality of life in their cities often fails to keep pace. This problem arises largely from poor urban planning and severe environmental pollution, but it can be improved through better public transport and stronger environmental protection.","The decline in urban living conditions can be attributed to two main factors. Firstly, many cities have expanded without proper planning. As new residential and industrial areas spring up quickly, roads, schools, hospitals and green spaces are often not built alongside them, so residents face long commutes, congested streets and overstretched public services. In some areas, housing is built right next to factories, exposing families to noise and polluted air. Secondly, rapid industrialisation and rising vehicle numbers have caused serious pollution. Factories, construction sites and millions of motorbikes and cars release harmful emissions, while waste and sewage pollute rivers and canals, and people living in these conditions, especially children and the elderly, suffer from respiratory illnesses and other health problems. For example, cities such as Hanoi and New Delhi regularly experience periods of air pollution so severe that residents are advised to stay indoors. Therefore, unplanned growth and pollution seriously reduce the quality of urban life.","To address these challenges, governments should invest in better planning and environmental protection. To begin with, building efficient public transport systems would reduce traffic congestion and pollution at the same time. Metro lines, bus rapid transit and safe cycling routes give residents alternatives to private vehicles, making cities cleaner and easier to move around. Land around new stations can also be planned for homes, shops and parks, reducing the need for long journeys. To illustrate, Ho Chi Minh City opened its first metro line in 2024, offering commuters a faster and cleaner alternative to crowded roads. In addition, stricter environmental regulations and more green spaces would improve residents’ health. Governments can require factories to reduce emissions, improve waste collection and create parks along rivers and in densely populated districts. Therefore, careful planning and environmental investment can ensure that economic growth improves rather than damages people’s lives.","In conclusion, poor living conditions in developing cities result mainly from unplanned expansion and heavy pollution. Governments should therefore invest in public transport, enforce environmental standards and create more green spaces, so that their cities can offer residents a healthy and comfortable quality of life."]]},{"id":"W2-PS-13","task":2,"type":"Problems and solutions","prompt":["In many large cities, the number of cars on the road is increasing, and traffic jams are now part of daily life. What problems does this cause? What measures can be taken to solve these problems?"],"imgs":[],"models":[["As the number of private vehicles on city streets continues to climb, traffic congestion has become an everyday feature of urban life. Heavy traffic places considerable strain on commuters, businesses and the environment, and it can be eased through a combination of better public transport and more effective management of road use. This essay examines the main problems caused by rising car ownership and the measures that could address them.","The growth in car use creates problems for both economic productivity and public health. The most visible consequence is the loss of time. When thousands of drivers queue at the same junctions each morning, a journey that should take twenty minutes can stretch past an hour, leaving workers stressed and late. This wasted time also raises costs for employers, as delivery schedules slip and fuel is burnt while vehicles stand idle. A second concern is deteriorating air quality. Stop-start driving releases higher levels of nitrogen dioxide and fine particulate matter than steady motion does, and these pollutants are linked to respiratory and cardiovascular illness. For example, residents living beside busy arterial roads often experience higher rates of asthma, and children and older people are particularly vulnerable to these effects. For these reasons, congestion imposes a heavy burden on both the economy and the health of city residents.","Addressing these problems requires measures that reduce the number of vehicles and improve the efficiency of existing roads. Investment in public transport offers the most durable remedy. Frequent and reliable metro, bus and tram services give commuters a realistic alternative to driving, so fewer cars enter the centre at peak hours. Demand management can also discourage unnecessary journeys by car. Congestion charges, which levy a fee on vehicles entering the city centre at busy times, have reduced traffic in London, while higher parking charges make driving to work less attractive. Such pricing measures are most effective when reliable alternatives are available, since drivers who are priced off the road need somewhere else to go. Consequently, a combination of attractive alternatives and pricing signals can reduce congestion without stifling mobility.","In conclusion, rising car ownership generates lost productivity and pollution that harm cities and their residents. While new roads may offer temporary relief, they often attract further traffic, so governments should prioritise public transport and demand management, which address the cause of congestion rather than merely its symptoms."]]},{"id":"W2-PS-14","task":2,"type":"Problems and solutions","prompt":["The number of overweight children is rising in many countries. What are the causes of this trend? What can be done to tackle it?"],"imgs":[],"models":[["Childhood obesity has increased sharply in many countries over recent decades, creating concern among parents, teachers and health authorities. Its causes lie mainly in changes to diet and in declining levels of physical activity, and tackling the problem requires coordinated action by governments, schools and families. This essay considers the main causes of this trend and the measures that could reverse it.","The rise in childhood obesity stems chiefly from changes in what children eat and how much they move. The most significant factor is the widespread availability of cheap, energy-dense food. Sugary drinks, processed snacks and fast food are often cheaper and more convenient than fresh produce, and heavy marketing aimed at young audiences encourages children to request them. As a result, many children consume more calories than they burn, particularly when such products replace meals prepared at home. For instance, sweetened cereals and confectionery are frequently promoted during children's programmes, shaping preferences from a very young age. Reduced physical activity is an equally important contributor. Many children now spend long periods using screens and travel to school by car rather than on foot, so their daily movement has declined considerably. Taken together, these dietary and behavioural changes explain why energy intake has risen while physical activity has fallen.","Effective responses must reduce the availability of unhealthy food and create more opportunities for children to be active. Governments can regulate the marketing and composition of food aimed at children. Restrictions on advertising during children's viewing hours and taxes on sugary drinks raise the price of unhealthy products and reduce their visibility. Mexico, for example, introduced a tax on sugar-sweetened beverages in 2014, and purchases of these drinks subsequently fell. Schools and families also have a vital role in shaping habits. Schools can provide nutritious meals, daily physical education and lessons on healthy eating, while parents can limit screen time and cook more often at home. A case in point is the walk or cycle to school, which allows children to build exercise into their ordinary routine. For these reasons, action in schools and homes is as important as regulation in shaping children's long-term health.","To conclude, rising obesity among children results from cheap, heavily marketed food and declining physical activity. While individual families cannot reverse these trends alone, governments should combine marketing restrictions and fiscal measures with investment in school sport and healthy meals, since a coordinated approach offers the best prospect of lasting improvement."]]},{"id":"W2-PS-15","task":2,"type":"Problems and solutions","prompt":["In many places, young adults can no longer afford to rent or buy their own homes and are staying with their parents well into their thirties. What problems does this create? What solutions can you suggest?"],"imgs":[],"models":[["In many countries, rising property prices and stagnant wages have made independent living unaffordable for a growing number of young adults, who remain in the family home well into their thirties. This arrangement brings difficulties for the individuals concerned, their families and wider society, yet it can be eased through housing policy and changes in the labour market. This essay examines the main problems this situation creates and the solutions that could address it.","Prolonged dependence on parents creates problems for the personal development of young adults and for the wider economy. Living at home for many years can limit the independence and sense of responsibility that adults normally develop. Individuals who have never had to manage their own rent, bills or domestic routines may find it harder to form lasting partnerships or commit to long-term plans, which can delay marriage and starting a family. For instance, a professional in their early thirties may still rely on a parent for meals and laundry, which restricts their capacity to relocate for career opportunities. The situation also has economic consequences. When young people delay moving out, household formation is postponed, so demand for housing, furniture and everyday goods grows more slowly. Taken together, these effects limit personal fulfilment and weaken the economic contribution of younger generations.","Solutions must increase the supply of affordable housing and improve the financial position of young people. Governments can expand housing supply through public building programmes and incentives for private developers. Zoning reform that allows higher-density construction, together with subsidised rental schemes, increases the number of homes available at lower prices. Over time, this increased supply moderates the rents and prices that currently exclude many young people from the market. A case in point is Vienna, where a large proportion of residents live in municipal or subsidised housing, which keeps rents comparatively stable. Young people also need greater financial security to enter the housing market. Schemes that offer deposit assistance, relief from transfer taxes for first-time buyers, or tax-advantaged savings accounts can help them accumulate a deposit more quickly. Consequently, a combination of supply-side and financial measures offers the most realistic route to independent living.","In conclusion, delayed independence restricts the personal development of young adults and slows economic renewal. Although families will continue to provide support, governments should prioritise affordable housing supply and deposit assistance, since these measures address the underlying cause of the problem rather than its effects."]]},{"id":"W2-PS-16","task":2,"type":"Problems and solutions","prompt":["Huge amounts of plastic waste are ending up in the world's oceans. What problems does this cause? What can governments and individuals do to address it?"],"imgs":[],"models":[["Each year, enormous quantities of plastic waste enter the world's oceans, turning coastlines and open waters into dumping grounds. This pollution damages marine ecosystems, threatens human health and undermines economic activities that depend on the sea. This essay examines the main problems caused by ocean plastic and the measures that could reduce it.","Ocean plastic harms marine life and also creates risks for human health and coastal economies. Marine animals are harmed in several ways. Large items such as discarded fishing nets can entangle turtles, seals and seabirds, causing injury or drowning, while smaller fragments are mistaken for food and can block digestive systems. For example, sea turtles frequently ingest plastic bags, which resemble jellyfish, and may starve as a result. Plastic also reaches people through the food chain and damages economies that rely on the sea. Microplastics have been found in fish and shellfish, raising concerns about human consumption, while litter on beaches discourages tourism and imposes cleaning costs on coastal municipalities. These impacts fall hardest on fishing and tourism communities, which have the least capacity to absorb such losses. These consequences show that ocean plastic threatens ecological stability as well as the livelihoods of coastal populations.","Reducing plastic waste requires governments to regulate production and waste systems, while individuals change their consumption habits. Governments can reduce the flow of plastic into the ocean by regulating production and improving waste management. Extended producer responsibility schemes oblige manufacturers to finance the collection and recycling of their packaging, which encourages them to design more recyclable products. Bans on single-use items also reduce the volume of waste at its source. For instance, the European Union has restricted several single-use plastics, including cotton buds and cutlery. Individuals can contribute by reducing their use of disposable products and disposing of waste responsibly. Choosing reusable bottles and bags, supporting businesses that sell goods with minimal packaging, and taking part in local clean-up initiatives all reduce the plastic that reaches rivers and seas. Because individual decisions add up across large populations, such habits can have a considerable cumulative effect. Therefore, coordinated action between authorities and citizens is more effective than either approach working alone.","To sum up, plastic waste harms marine wildlife, endangers human health and damages coastal economies. While citizens can change their daily habits, governments should introduce firm regulation of single-use products and producer responsibility, since only systemic measures can stem the flow of plastic at its source."]]},{"id":"W2-PS-17","task":2,"type":"Problems and solutions","prompt":["Many elderly people in modern societies live alone and rarely see other people. Why is this a problem? What can be done to improve the situation?"],"imgs":[],"models":[["In many modern societies, growing numbers of older people live alone, and a significant proportion rarely meet other people in person. This isolation has consequences for their health, their wellbeing and their place in the community, and it is shaped by changes in family structure, housing patterns and social habits. This essay explains why this is a problem and considers how the situation might be improved.","Social isolation among older people damages both their physical health and their emotional wellbeing. Prolonged isolation is associated with serious physical consequences. Without regular contact, older people may neglect routine medical appointments, fail to notice early symptoms of illness and be less likely to receive help in an emergency. For example, an elderly person living alone who suffers a fall may remain undiscovered for hours, which can turn a minor injury into a life-threatening situation. Loneliness also takes a psychological toll. A lack of conversation and companionship can lead to depression and anxiety, and these conditions can further reduce a person's motivation to leave home, creating a damaging cycle. As a result, isolation harms individuals' health and quality of life, and it can deepen their dependence on public services.","Improving the situation requires community-based programmes and changes in how society supports older people. Local community programmes can bring older people into regular contact with others. Befriending services, day centres and social clubs provide structured opportunities for conversation and activity, while volunteers can make regular visits to people who have few other contacts. Telephone befriending schemes, which many charities and local councils run, are a practical example of how regular contact can be offered at little cost. Intergenerational initiatives and well-designed housing can also reduce isolation. Shared activities between older residents and young people, such as mentoring or joint learning projects, foster mutual respect and friendship across generations. Housing designed with shared communal spaces and accessible transport similarly makes it easier for older people to socialise independently. Taken together, these approaches create the conditions in which older people can maintain meaningful relationships.","In conclusion, social isolation among older people undermines their health and emotional wellbeing, and it weakens the cohesion of communities. Although families will always play a central role, local authorities should expand befriending services and create opportunities for intergenerational contact, since these measures address loneliness before it becomes entrenched."]]},{"id":"W2-PS-18","task":2,"type":"Problems and solutions","prompt":["False information spreads very quickly on social media and often influences public opinion. What problems can this cause? What can be done to deal with it?"],"imgs":[],"models":[["The rapid spread of false information on social media has become one of the most pressing challenges facing democratic societies. Because such content can be shared instantly and reaches vast audiences, it can distort public debate, damage reputations and undermine trust in institutions. This essay considers the problems this creates and the measures that could help to counter it.","False information on social media threatens both individual decision-making and the democratic process. Misleading content can lead people to make poor decisions on matters of health and finance. Fabricated claims about medicines or vaccines may discourage individuals from seeking proven treatment, while fraudulent investment schemes promoted online can cause people to lose their savings. For example, during public health emergencies, rumours about unproven cures have circulated widely and persuaded some people to take harmful substances. At a societal level, false information distorts public debate and erodes confidence in institutions. When citizens are exposed to contradictory accounts of events, they may find it difficult to form reasoned judgements. Deliberately misleading content can also be used to polarise communities or to influence elections. Consequently, misinformation weakens both individual judgement and the shared factual basis on which public life depends.","Effective responses combine responsibility from technology platforms with the critical skills of citizens. Technology companies can reduce the reach of false content through clearer labelling, the removal of coordinated fake accounts and recommendation systems that do not reward sensational material. Governments, for their part, can establish transparent standards requiring platforms to explain how content is moderated. Such measures are most credible when independent fact-checkers are involved, since this prevents moderation from becoming a tool of political control. For instance, the European Union's Digital Services Act requires very large platforms to assess and mitigate systemic risks, including the spread of disinformation. Education is equally important, because citizens who can evaluate sources are less likely to be misled. Schools can teach students to check authorship, compare reports from different outlets and recognise manipulative techniques, such as emotionally charged headlines. Therefore, platform accountability and informed citizens together offer the most durable defence against misinformation.","To conclude, false information on social media endangers personal welfare and weakens the democratic process. While individuals must learn to question what they read, governments should require platforms to address harmful content transparently, since a shared approach offers the best prospect of keeping pace with online deception."]]},{"id":"W2-PS-19","task":2,"type":"Problems and solutions","prompt":["In many countries, a large number of university graduates struggle to find jobs. What are the reasons for this? What measures could be taken to solve the problem?"],"imgs":[],"models":[["In many countries, a considerable number of university graduates find it difficult to secure employment that matches their qualifications. This situation reflects a mismatch between education and the needs of the labour market, together with broader economic conditions, and it can be addressed through reforms to higher education and to employment policy. This essay examines the main causes of graduate unemployment and the measures that could help to resolve it.","Graduate unemployment arises mainly from a mismatch between what universities teach and what employers require, and from a labour market that cannot absorb the growing number of graduates. Many degree programmes emphasise theoretical knowledge at the expense of practical skills such as problem solving, teamwork and digital competence, which employers increasingly value. As a result, graduates may hold qualifications in subjects for which demand is limited. For example, a large number of arts and humanities graduates may compete for a small number of positions in publishing or research, while employers in engineering and technology report difficulty in recruiting. The rapid expansion of university places has also increased the number of graduates faster than the economy can create skilled jobs. When labour markets grow slowly, particularly during recessions, employers become more selective and often prefer candidates with prior experience. Taken together, these factors mean that a degree alone no longer guarantees employment.","Solutions require universities to align teaching with employment needs and governments to stimulate the creation of skilled jobs. Universities can strengthen the link between study and work by embedding practical training in their programmes. Internships, industry-led projects and collaborative courses with local firms allow students to develop applied skills and professional networks while still studying. A case in point is the dual study programmes offered in Germany, which combine university study with paid work placements and frequently lead directly into employment. Governments can also create conditions in which graduates can find skilled work. Targeted investment in sectors such as renewable energy, healthcare and digital services generates demand for qualified staff. Subsidised graduate recruitment schemes lower the risk for employers who hire newcomers.","In conclusion, graduate unemployment stems from a mismatch between education and employment, combined with insufficient demand for skilled labour. Although students must take responsibility for developing marketable skills, universities should embed practical experience in their courses, and governments should invest in sectors that generate skilled jobs, since these reforms address both the supply and the demand sides of the problem."]]},{"id":"W2-PS-20","task":2,"type":"Problems and solutions","prompt":["Students in many countries face intense pressure to achieve high exam results. What problems does this cause? What solutions can you suggest?"],"imgs":[],"models":[["Across many education systems, students face intense pressure to achieve high marks in examinations that often determine their future educational and career opportunities. Such pressure can harm students' mental health, restrict the breadth of their learning and affect their families and wider society. It can, however, be eased through changes in assessment and in the expectations placed on young people. This essay examines these problems and the solutions that could reduce them.","Excessive exam pressure harms students' psychological wellbeing and narrows the scope of their education. Constant pressure to perform can cause significant anxiety, sleep deprivation and, in some cases, depression. For instance, some students in highly competitive systems report regular physical symptoms, such as headaches and insomnia, during revision periods. Pressure to achieve high scores also encourages a narrow style of teaching. Schools may concentrate on material likely to be tested and devote less time to creative subjects, physical activity or critical discussion, all of which are essential for developing independent thinking. As a result, students may become skilled at memorising information without understanding how to apply it. For these reasons, exam pressure undermines both the emotional health of students and the quality of their education.","Solutions should reform assessment methods and reduce the pressure that families and schools place on students. Assessment systems can be reformed so that they measure a wider range of skills and rely less on a single examination. Coursework, project work and continuous assessment spread the workload across the year, which reduces the stress associated with one high-stakes test. For example, several education systems have introduced continuous assessment components alongside final examinations, allowing students to demonstrate learning through different tasks. Schools and parents can also moderate expectations by placing greater emphasis on effort, progress and personal interests. Access to counselling services, sensible homework policies and regular physical activity can support students' wellbeing during demanding periods. When adults make clear that a single result does not define a young person's worth, students are more likely to approach examinations with confidence. Taken together, these changes reduce pressure without abandoning the aim of high standards.","To sum up, intense exam pressure damages students' mental health and narrows the learning they receive. While families and schools must recognise the value of wellbeing, education ministries should diversify assessment methods and fund student support services, since these changes would preserve rigorous standards while protecting the young people those standards are meant to serve."]]},{"id":"W2-PS-21","task":2,"type":"Problems and solutions","prompt":["Popular tourist destinations are receiving more visitors than they can cope with. What problems does this cause for local people and the environment? What can be done to reduce these problems?"],"imgs":[],"models":[["Many popular tourist destinations now receive more visitors than their infrastructure, housing and natural environment can comfortably sustain. This overtourism places strain on local residents and fragile ecosystems alike, and its effects can be reduced through careful planning, fair pricing and the cooperation of visitors themselves. This essay examines the problems this creates for local people and the environment, and the measures that could alleviate them.","Overtourism damages the quality of life of local residents and places heavy pressure on the natural environment. Large numbers of visitors can make daily life difficult for people who live in tourist areas. Demand for short-term rental accommodation pushes up property prices and reduces the supply of homes available to residents, while crowded streets and noise disrupt everyday routines. For example, in some historic city centres, many flats have been converted into holiday lets, forcing long-standing residents to move away. The environment also bears considerable costs. Heavy foot traffic erodes coral reefs, mountain paths and other fragile habitats, while waste disposal and water consumption can overwhelm local services. Transport and accommodation generate substantial emissions, which contribute to the climate impacts that may ultimately threaten the attractions themselves. Consequently, the social and ecological consequences of overtourism can undermine the very qualities that attract visitors in the first place.","Reducing these problems requires authorities to manage visitor numbers and visitors to behave responsibly, while ensuring that tourism benefits local communities. Authorities can regulate tourism more directly by limiting the number of visitors to sensitive sites, introducing timed entry tickets and restricting short-term rentals in residential districts. For instance, Barcelona has taken steps to restrict new tourist accommodation in certain neighbourhoods, illustrating how planning rules can protect housing for residents. Demand can also be spread more evenly across seasons and regions. Promoting lesser-known destinations and off-peak travel reduces congestion in the most famous places, and the revenue generated can fund the maintenance of heritage sites and local services. Visitors can contribute by choosing reputable operators, respecting local customs and minimising their environmental footprint. Taken together, these measures allow tourism to continue while safeguarding the residents and places it depends upon.","In conclusion, overtourism strains housing, public services and fragile ecosystems, and it reduces the quality of life for those who live in popular destinations. Although visitors must travel responsibly, governments and local authorities should cap visitor numbers at sensitive sites and regulate holiday rentals, since such measures protect local communities over the long term."]]},{"id":"W2-PS-22","task":2,"type":"Problems and solutions","prompt":["Young people in rural areas are moving to cities in large numbers, leaving many villages with an ageing population. What problems does this cause? What can be done to encourage people to stay?"],"imgs":[],"models":[["Many young people in rural areas are leaving their villages for cities, attracted by better employment prospects, higher wages and a wider range of education and leisure options. This movement leaves many rural communities with an ageing population and a shrinking economic base. It can be addressed by creating opportunities in the countryside itself. This essay considers the problems caused by this migration and the measures that could encourage young people to remain.","Youth migration leaves rural communities facing economic decline and a shortage of services. The departure of young workers weakens local economies. Farms, small businesses and local services struggle to find staff, and the loss of skilled workers reduces productivity and discourages new investment. For example, a rural area may find that its school closes because fewer families with children remain, which further reduces the appeal of the village to young families. An aging population also creates pressure on health and social services. Older residents often require more medical care and assistance, yet the smaller tax base makes it difficult to fund clinics, transport and care facilities. Taken together, these changes leave rural communities less able to support the residents who remain.","Encouraging young people to stay requires creating local employment and improving access to education, housing and digital connectivity. Creating well-paid rural employment offers the most direct incentive for young people to remain. Governments can support small enterprises, agricultural innovation and rural tourism, while reliable broadband allows graduates to work remotely for urban employers without moving away. Some remote workers in mountain regions have chosen to stay in their home villages once high-speed internet became available. Quality of life also influences where young people decide to live. Affordable housing, good schools and accessible healthcare make villages more attractive to families, while cultural and leisure facilities reduce the sense of isolation that often prompts departure. Local authorities can invest in these services through targeted funding and by working with community groups to plan their provision. Consequently, rural areas that offer both economic opportunity and a good quality of life are more likely to retain their young people.","To conclude, youth migration undermines rural economies, strains services and leaves villages with an ageing population. While individuals must remain free to choose where they live, regional governments should invest in rural enterprise, broadband and affordable housing, since these measures give young people a genuine reason to stay."]]}];
const EX = {}; DATA.forEach(e => EX[e.id] = e);
const TASK1 = DATA.filter(e => e.task === 1), TASK2 = DATA.filter(e => e.task === 2);
const TEST_SECONDS = 3600, MIN_WORDS = {1: 150, 2: 250}, SUGGEST = {1: 20, 2: 40};
const HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const ENDPOINT = String((window.IRT_CONFIG && window.IRT_CONFIG.endpoint) || '').trim();
const HAS_REMOTE = /^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[^/]+\/exec$/.test(ENDPOINT);
const ONLINE = !!(HAS_GAS || HAS_REMOTE);

const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function gas(fn, ...args){
  if(HAS_GAS) return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  if(!HAS_REMOTE) return Promise.reject(new Error('offline'));
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), 30000) : null;
  const body = JSON.stringify({fn, args});
  return fetch(ENDPOINT, {method: 'POST', redirect: 'follow', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body, signal: ctl ? ctl.signal : undefined})
    .then(r => { if(!r.ok) throw Object.assign(new Error('The Apps Script URL answered with error ' + r.status + '. Check the URL in config.js.'), {server: true}); return r.text(); })
    .then(t => {
      let j; try{ j = JSON.parse(t); }catch(e){ throw Object.assign(new Error(/<html|<!DOCTYPE/i.test(t) ? 'Apps Script sent back a web page instead of data. The deployment is probably not set to "Anyone", or it is an old version.' : 'Unexpected answer from Apps Script.'), {server: true}); }
      if(!j || !j.ok) throw Object.assign(new Error((j && j.error) || 'Server error'), {server: true});
      return j.result;
    })
    .catch(err => {
      if(!err.server && fn === 'submitAttempt') return fetch(ENDPOINT, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body}).then(() => ({unconfirmed: true}));
      if(err.name === 'AbortError') throw new Error('Apps Script did not answer within 30 seconds.');
      if(!err.server) throw new Error('Could not reach Apps Script (' + (err.message || 'network error') + ').');
      throw err;
    })
    .finally(() => timer && clearTimeout(timer));
}
const $ = s => document.querySelector(s);
const slug = n => n.trim().toLowerCase().replace(/\s+/g, ' ');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const words = t => (String(t || '').trim().match(/\S+/g) || []).filter(w => /[A-Za-z0-9]/.test(w)).length;
const SUMMARISE = /^summari[sz]e the information\b/i;
const promptLines = e => e.prompt.filter(l => !SUMMARISE.test(l.trim()));
// Task 2: peel the closing instruction ("Discuss both views...", "To what extent...?") onto its own line
const INSTR = /^(discuss|give|explain|describe|suggest|outline|compare|evaluate|provide|include|support|use)\b/i;
function splitT2(lines){
  const parts = [];
  lines.forEach((l, li) => l.trim().split(/(?<=[.?!]["”’)]?)\s+(?=[A-Z“"‘(])/).forEach(t => t.trim() && parts.push({li, t: t.trim()})));
  let k = parts.length;
  while(k > 0 && (/\?["”’)]*$/.test(parts[k - 1].t) || INSTR.test(parts[k - 1].t))) k--;
  if(k === parts.length) return {body: lines, instr: ''};
  if(k === 0) k = 1;
  const body = []; parts.slice(0, k).forEach(x => { body[x.li] = body[x.li] ? body[x.li] + ' ' + x.t : x.t; });
  return {body: body.filter(Boolean), instr: parts.slice(k).map(x => x.t).join(' ')};
}
const hlHtml = t => `<span class="hl">${esc(t)}</span>`;

/* ---------- theme ---------- */
function applyTheme(){
  const pref = LS.get('ielts_theme', LS.get('irt_theme', null));
  const dark = pref ? pref === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.querySelectorAll('[data-theme-toggle]').forEach(b => b.textContent = dark ? 'Light' : 'Dark');
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-theme-toggle]'); if(!b) return;
  LS.set('ielts_theme', document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); applyTheme();
});
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
applyTheme();

/* ---------- state ---------- */
let profile = LS.get('ielts_profile', LS.get('irt_profile', LS.get('irl_profile', null)));
let hist = null, cur = null, tick = null, taskIdx = 0, boundIdx = null, warned = {};
const K = {
  hist: () => 'irw_hist_' + slug(profile.name),
  cur: () => 'irw_cur_' + slug(profile.name),
  next: () => 'irw_next_' + slug(profile.name),
  shuf: () => 'irw_shuf_' + slug(profile.name),
  newOnly: () => 'irw_newonly_' + slug(profile.name),
  types: () => 'irw_types_' + slug(profile.name),
  clr: () => 'irw_clear_' + slug(profile.name)
};
const loadHist = () => { hist = LS.get(K.hist(), {done: [], attempts: []}); };
const saveHist = () => LS.set(K.hist(), hist);
const saveCur = () => { if(cur) LS.set(K.cur(), cur); };

/* ---------- ui helpers ---------- */
function show(id){
  document.querySelectorAll('.screen').forEach(s => { s.classList.add('hidden'); s.classList.remove('enter'); });
  const el = document.getElementById(id); el.classList.remove('hidden'); void el.offsetWidth; el.classList.add('enter');
  window.scrollTo(0, 0);
}
function toast(msg, kind, ms){
  const t = document.createElement('div'); t.className = 'toast ' + (kind || ''); t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, ms || 3600);
}
function dialog(title, body, buttons){
  return new Promise(res => {
    const o = document.createElement('div'); o.className = 'overlay';
    o.innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT">${esc(title)}</h3><p>${body}</p><div class="row"></div></div>`;
    const row = o.querySelector('.row');
