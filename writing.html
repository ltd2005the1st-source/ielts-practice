 1924 to about 5,000 in 1952 and 6,700 in 1984. Growth then accelerated considerably, and by 2012 the total had reached approximately 10,700. Most of this final increase came from women, whose numbers rose by about 3,300 between 1984 and 2012, compared with an increase of only around 700 for men."]]},{"id":"W1-MX-04","task":1,"type":"Mixed charts","prompt":["The table and charts below give information on the police budget for 2017 and 2018 in one area of Britain. The table shows where the money came from and the charts show how it was distributed.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-04-1.jpg","w":798,"h":1024}],"models":[["The table shows where the police budget in one area of Britain came from in 2017 and 2018, while the pie charts show how the money was spent in each year.","Overall, the total budget rose slightly over the two years, and the national government remained by far the largest source of funding. In terms of spending, salaries accounted for the great majority of the budget in both years, although a larger share was spent on technology in 2018.","In 2017, the police received £304.7 million in total. More than half of this, £175.5 million, came from the national government, while local taxes contributed £91.2 million and other sources, such as grants, £38 million. In 2018, the budget increased to £318.6 million. Most of this rise came from local taxes, which grew by about £11 million to £102.3 million, whereas funding from the national government increased only slightly, to £177.8 million, and other sources rose by just £0.5 million.","As for spending, salaries for officers and staff took up three quarters of the budget in 2017, but this share fell to 69% in 2018. Over the same period, the proportion spent on technology almost doubled, from 8% to 14%. Spending on buildings and transport, by contrast, remained unchanged at 17% in both years, which meant that it remained the second largest category."]]},{"id":"W1-MX-05","task":1,"type":"Mixed charts","prompt":["The table and pie chart give information about the population of Australia according to different nationalities and areas.","Summarise the information by selecting and reporting the main features and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-05-1.jpg","w":1380,"h":652}],"models":[["The pie chart shows the make-up of Australia’s population by nationality, while the table shows the percentages of each of five nationalities living in cities and in the countryside.","Overall, Australians make up the vast majority of the population, and the other named nationalities account for only small shares. It is also clear that most people of every nationality live in cities, although Australians are the most likely to live in the countryside and Chinese people the least likely.","According to the pie chart, Australians account for 73% of the population, almost three quarters of the total. The British form the second largest named group, at 7%, followed by New Zealanders at 3%, Chinese people at 2% and Dutch people at just 1%. The remaining 14% of the population belongs to other nationalities, which together form a larger share than the four smaller named groups combined.","The table shows that city living is the norm for every group. Among Australians, 80% live in cities and 20% in the countryside, the highest rural share of the five nationalities. The Dutch have a similar pattern, with 83% in cities and 17% in rural areas. The British and New Zealanders are more urbanised, with around nine in ten living in cities, at 89% and 90% respectively. The Chinese population is almost entirely urban, with 99% living in cities and only 1% in the countryside."]]},{"id":"W1-MX-06","task":1,"type":"Mixed charts","prompt":["The chart below shows the value of one country’s exports in various categories during 2015 and 2016. The table shows the percentage change in each category of exports in 2016 compared to 2015.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-06-1.jpg","w":542,"h":410},{"src":"wimg/W1-MX-06-2.jpg","w":412,"h":191}],"models":[["The bar chart compares the value of one country’s exports in five product categories in 2015 and 2016, while the table shows the percentage change in the value of each category over this period.","Overall, the value of exports rose in four of the five categories, with gems and jewellery being the only exception. Petroleum products and engineered goods were the two most valuable exports in both years, whereas textiles recorded by far the fastest growth.","Petroleum products were the country’s most valuable export, worth just over $60 billion in 2015. This figure increased by 3% to about $63 billion in 2016. Engineered goods followed a similar pattern, but their value grew more quickly, by 8.5%, rising from around $58 billion to $62 billion, so the gap between the two leading categories narrowed to only about $1 billion.","The three remaining categories were worth considerably less. Gems and jewellery ranked third in both years, but their export value fell by 5.18%, from roughly $43 billion to $41 billion. Agricultural products earned about $31 billion in 2015, and this figure changed very little, rising by just 0.81%, the smallest change of any category. Textiles, by contrast, were the least valuable export in 2015, at around $27 billion, but their value jumped by 15.24% to approximately $32 billion in 2016, drawing level with agricultural products."]]},{"id":"W1-MX-07","task":1,"type":"Mixed charts","prompt":["The graphs below provide information on global population figures and figures for urban populations in different world regions.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-07-1.jpg","w":500,"h":310},{"src":"wimg/W1-MX-07-2.jpg","w":469,"h":281}],"models":[["The line graph illustrates the growth of the world population from 1800 to 2100, while the bar chart projects the urban population figures for developed and developing regions from 2015 to 2040.","Overall, the global population is shown to have experienced a dramatic surge since 1800 and is predicted to peak around the mid-21st century before declining. Additionally, while the urban population in developed regions is expected to remain stable, the number of city dwellers in developing regions is projected to witness significant growth.","Regarding the historical and projected world population, the figure stood at approximately 1,000 million in 1800 and rose gradually over the next century. From 1920 onwards, the population climbed exponentially, reaching roughly 6,000 million by the year 2000. This upward trend is expected to continue until the 2040s, peaking at just over 8,000 million, after which the number is predicted to fall steadily to just above 6,000 million by 2100.","Turning to the urban population forecast, developed regions show a plateau, with the number of urban residents remaining constant at approximately 1,300 million throughout the period from 2015 to 2040. In contrast, developing regions are expected to see a sharp increase. Starting at roughly 2,200 million in 2015, the urban population in these areas is predicted to rise at every interval, to about 2,800 million in 2025 and 3,700 million in 2035, reaching 4,000 million by 2040, about three times the figure for developed regions."]]},{"id":"W1-MX-08","task":1,"type":"Mixed charts","prompt":["The chart and table below give information about tourists at a particular holiday resort in Australia.","Summarise the information by selecting and reporting the main features and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-08-1.jpg","w":1024,"h":1024}],"models":[["The pie chart shows the proportion of tourists at an Australian holiday resort by region of origin, while the table compares these groups in terms of length of stay, preferred accommodation and main activity.","Overall, Europeans and Americans make up the vast majority of visitors and also stay the longest, whereas Asians form the smallest group and have the shortest visits. It is also clear that the groups fall into two pairs, with Asians and Americans favouring hotels and sightseeing, while Europeans and visitors from other regions prefer camping and beach activities.","Europeans account for the largest share of tourists, at 37%, closely followed by Americans at 35%, so together they represent almost three quarters of the total. These two groups also stay the longest, for 16 and 14 days respectively. Visitors from other regions make up 18% and stay for 10 days, while Asians constitute only a tenth of all tourists and remain for just a week, less than half the European figure.","The table also reveals two distinct holiday styles. Both hotel-based groups spend most of their time sightseeing, although Asians most often stay in 5-star hotels and Americans in 4-star ones. By contrast, Europeans and tourists from other regions both opt for camping or caravans, but they differ in their main pastime, with Europeans mostly swimming or sunbathing and the latter group choosing surfing."]]},{"id":"W1-MX-09","task":1,"type":"Mixed charts","prompt":["The table and charts below give information about doctors in one country between 1986 and 2006.","Summarize the information by describing the main features of the charts and making comparisons where appropriate."],"imgs":[{"src":"wimg/W1-MX-09-1.jpg","w":1024,"h":765}],"models":[["The table shows the total number of doctors in Australia in 1986, 1996 and 2006, while the two bar charts break down the profession by gender and by place of birth over the same years.","Overall, the number of doctors rose steadily across the twenty-year period, and the profession became noticeably more diverse. Although men remained the majority throughout, the share of women grew at each interval, and doctors born overseas had caught up with those born in Australia by 2006.","According to the table, Australia had 23,720 doctors in 1986. This figure climbed to 29,060 a decade later and reached 35,450 by 2006, an increase of almost 50 percent over the whole period.","Turning to gender, male doctors accounted for around three quarters of the total in 1986, three times the 25 percent made up by women. The gap then narrowed consistently, with the male share falling to about 67 percent in 1996 and roughly 60 percent in 2006, while the female share rose to approximately 33 percent and then 40 percent. Combined with the growth in total numbers, this means the number of female doctors more than doubled over the twenty years.","A similar pattern can be seen in place of birth. In 1986, around 64 percent of doctors were born in Australia, compared with about 37 percent born overseas. The locally born share then slipped to roughly 58 percent in 1996, while the overseas-born share edged up to 42 percent, and by 2006 the two groups were level at 50 percent each."]]},{"id":"W1-MX-10","task":1,"type":"Mixed charts","prompt":["The charts below show the comparison of time spent, in minutes per day, by UK’s males and females on household and leisure activities in 2008.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-10-1.jpg","w":1024,"h":1024}],"models":[["The table compares how many minutes per day men and women in the UK spent on three leisure activities in 2008, while the bar chart shows the time each gender devoted to four types of household work in the same year.","Overall, men spent more time on leisure than women, whereas women did considerably more housework. It is also clear that watching television, videos or listening to the radio was by far the most time-consuming leisure activity for both sexes, while cooking and washing dominated women’s household duties.","According to the table, men spent 137 minutes a day on TV, video and radio, 19 minutes more than the 118 minutes recorded for women. Men spent slightly longer on sport, at 15 minutes compared with 11 for women, while reading was the only leisure activity in which women spent more time, though by just one minute, at 19 versus 18.","The bar chart presents the opposite picture. Women spent around 76 minutes a day on cooking and washing, more than twice the 30 minutes spent by men, and they also did roughly three times as much clothes washing and ironing, at about 30 minutes compared with 10. Shopping showed a smaller gap, with women spending around 35 minutes and men about 25. Repair was the sole exception, as men spent approximately 19 minutes on it, double the female figure of around 9. In total, women did about 150 minutes of household work per day, nearly twice as much as men."]]},{"id":"W1-MX-11","task":1,"type":"Mixed charts","prompt":["The pie graph below shows bottled water consumption in various regions as a percent of global consumption and the bar-chart shows the growth of bottled water consumption in 2001.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-11-1.jpg","w":1024,"h":1024}],"models":[["The pie chart shows how global bottled water consumption was shared among eight regions in 1999, while the bar chart shows the percentage growth in consumption in each of these regions in 2001.","Overall, the USA was by far the largest consumer of bottled water, accounting for almost half of the global total. In terms of growth, however, Asia recorded the fastest increase, whereas Western Europe saw the smallest.","Looking at the pie chart, the USA consumed 48 percent of the world’s bottled water in 1999, more than three times the share of Asia, which came second at 15 percent. The Middle East and Africa followed with 13 and 10 percent respectively. The remaining regions accounted for much smaller shares, with Latin America and New Zealand each making up 5 percent, and Australia and Western Europe just 2 percent each.","The bar chart presents a rather different picture. Consumption in Asia grew by around 14 percent in 2001, the highest rate of all, while Latin America and New Zealand both recorded growth of roughly 12 percent despite their small market shares. The Middle East and Africa grew by about 10 percent, and the USA and Australia by about 8 percent. Western Europe lagged far behind, with growth of only around 2 percent."]]},{"id":"W1-MX-12","task":1,"type":"Mixed charts","prompt":["The table and pie charts below show the number of research students in Australian universities in 2001 and 2010.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-12-1.jpg","w":1024,"h":974}],"models":[["The table shows the number of local and international research students at Australian universities in 2001 and 2010, while the two pie charts break these students down by origin and gender in the same years.","Overall, research student numbers grew considerably over the period, with the international intake expanding far faster than the local one. Although local students still formed the clear majority in 2010, it is also noticeable that female international students overtook their male counterparts.","According to the table, the total number of research students rose from 38,849 to 54,081, an increase of almost 40%. Local enrolments climbed only moderately, from 33,657 to 39,488, whereas international enrolments almost tripled, from 5,192 to 14,593. As a result, the international share of the total more than doubled from 13% to 27%, while the local share shrank from 87% to 73%.","The pie charts show that this shift also changed the gender balance among international students. Local men and women were almost equally represented in both years, at 44% and 43% in 2001 and 38% and 35% in 2010. Among international students, however, women made up just 4% of all research students in 2001, less than half the figure for men, but by 2010 their share had nearly quadrupled to 15%, three percentage points above that of international men."]]},{"id":"W1-MX-13","task":1,"type":"Mixed charts","prompt":["The line graph shows changes in the number of newly graduated students in the UK between 1992 and 2002, and the bar chart shows their proportions.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-13-1.jpg","w":1225,"h":1400}],"models":[["The line graph shows the number of newly graduated students in the UK in 1992, 1997 and 2002, while the bar chart shows the percentages of these graduates who took up five types of job in the same years.","Overall, the number of new graduates was higher at the end of the period than at the start, despite falling after 1997. Professional jobs were by far the most common destination for graduates in every year, although their share declined steadily, while clerical and secretarial jobs, sales and other jobs all became more common.","There were around 165,000 new graduates in the UK in 1992, and this figure rose to a peak of about 195,000 in 1997. It then fell back to roughly 180,000 in 2002, which was still about 15,000 more than in 1992.","In 1992, close to 60% of graduates went into professional jobs, three times the share entering managerial and administrative work, at 20%. Over the next ten years, however, the professional share fell to about 49% and then 42%, and the managerial share edged down to 18%. Clerical and secretarial work, by contrast, saw the largest increase, with its share doubling from about 9% to 18% in 1997 and reaching 19% in 2002, so that it was the second most common type of job by the end of the period. The proportions of graduates working in sales and in other jobs were the smallest, but both rose to about 10% in 2002, from 4% and 6% respectively."],["The charts give information about graduates in the UK between 1992 and 2002, with the line graph showing how many students graduated and the bar chart showing the jobs they went into.","Overall, the number of graduates grew in the first five years and then fell slightly. Over the same period, graduates’ jobs became more varied, as the dominant share of professional jobs shrank and the other categories, apart from managerial and administrative work, grew.","The number of new graduates increased from approximately 165,000 in 1992 to around 195,000 in 1997, an increase of almost a fifth. Five years later, the figure had dropped to about 180,000, although this was still above the 1992 level.","In terms of employment, professional jobs accounted for the largest proportion of graduates throughout, but their share fell by about 16 percentage points, from around 58% to 42%. Managerial and administrative jobs were the second most common choice in 1992, at 20%, but this figure slipped to 18% in 1997 and stayed at that level. As a result, these jobs were overtaken in 2002 by clerical and secretarial positions, whose share more than doubled over the decade, from about 9% to 19%. Sales and other jobs remained the least common, but they also grew. The share of graduates in sales rose from just 4% to 10%, the most rapid relative increase, and the share in other jobs went up from 6% to the same level."]]},{"id":"W1-MX-14","task":1,"type":"Mixed charts","prompt":["The line graph shows the number of books that were borrowed in four different months in 2014 from four village libraries, and the pie chart shows the percentage of books, by type, that were borrowed over this time.","Summarise the information by selecting and reporting the main features and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-14-1.jpg","w":1400,"h":772},{"src":"wimg/W1-MX-14-2.jpg","w":1039,"h":910}],"models":[["The line graph illustrates the number of books borrowed from four different village libraries over a four-month period in 2014, while the pie chart displays the percentage breakdown of these books by genre.","Overall, the borrowing patterns varied significantly among the libraries; while Ryeslip experienced a steady decline, the other three libraries generally saw an increase in book lending, with Sutton Wood exhibiting the most dramatic fluctuations. Additionally, fiction was by far the most popular type of book borrowed during this time.","Regarding the line graph, Ryeslip lent the most books in June, at 300. However, this figure witnessed a gradual downward trend, falling to approximately 175 by September. In contrast, Sutton Wood started at 250 books and rose to roughly 275 in July, before plummeting to 100 in August. This was followed by a sharp recovery, surging to reach the highest point on the graph at 300 books in September. Meanwhile, West Eaton and Church Mount both started at only 50 books and finished the period at 150. West Eaton reached this level in August and then levelled off, whereas Church Mount rose steadily throughout.","Turning to the types of books borrowed, fiction accounted for the largest proportion, representing 43% of the total. Biographies were the next most popular choice at 19%, while History and Science each made up 14%. Self-help books were the least borrowed category, contributing just 10% to the total."]]},{"id":"W1-MX-15","task":1,"type":"Mixed charts","prompt":["The pie chart shows the percentage of persons arrested in the five years ending 1994 and the bar chart shows the most recent reasons for arrest.","Summarise the information by selecting and reporting the main features and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-15-1.jpg","w":1024,"h":1024}],"models":[["The pie charts show the proportions of males and females who were arrested in the five years ending in 1994, while the bar chart compares the reasons for their most recent arrest.","Overall, men were far more likely to have been arrested than women. Public drinking was the most common reason for arrest among both sexes, but men were arrested more often for drink-driving, breach of order and theft, whereas women were more often arrested for public drinking and assault.","Almost a third of males (32%) had been arrested during the five-year period, compared with only 9% of females, so the male figure was more than three times as high. Accordingly, 68% of men and 91% of women had not been arrested.","Turning to the reasons for the most recent arrest, public drinking accounted for about 37.5% of female arrests and 30.5% of male arrests. The biggest difference between the sexes was in drink-driving, which was the reason for around 26% of male arrests but only 14% of female arrests. Men were also more likely to have been arrested for breach of order, at roughly 18% compared with 12%, and for theft, at 16% compared with 12.5%. By contrast, assault accounted for a slightly higher share of arrests among women, at about 19% against 16.5% for men. Other reasons made up similar proportions for both sexes, at 18% to 19%, while a small minority gave no answer, about 7% of women and 4.5% of men."]]},{"id":"W1-MX-16","task":1,"type":"Mixed charts","prompt":["The charts below show the number of Japanese tourists travelling abroad between 1985 and 1995 and Australia’s share of the Japanese tourist market.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-16-1.jpg","w":883,"h":1024}],"models":[["The bar chart shows the number of Japanese tourists who travelled abroad each year from 1985 to 1995, while the line graph shows the percentage of these tourists who visited Australia.","Overall, both the number of Japanese people travelling abroad and Australia’s share of this market grew considerably over the decade, with each figure roughly tripling. Both trends were mostly upward, apart from a few brief interruptions.","In 1985, just under 5 million Japanese tourists travelled abroad. This figure rose every year until 1990, reaching almost 11 million, more than double its original level. After a slight fall in 1991, the number increased to around 11.7 million in 1992 and remained almost the same in 1993. Growth then accelerated in the last two years, and the figure peaked at approximately 15 million in 1995, around three times the 1985 total.","Australia’s share of the Japanese tourist market followed a broadly similar pattern. Only 2% of Japanese tourists visited Australia in 1985, but this proportion rose steadily to 3% in 1987 and 4.9% in 1989. It then dropped to 4.2% in 1990, before recovering to 4.9% in 1991 and climbing year after year to a high of 6.2% in 1994. In the final year, the figure dipped slightly to 6%, although this was still three times the 1985 level. Since the total number of tourists was also rising, the number of Japanese visitors to Australia increased far more than these percentages alone suggest."],["The charts give information about the Japanese tourist market between 1985 and 1995, showing the number of Japanese people who travelled abroad and the proportion of them who chose Australia as their destination.","Overall, outbound tourism from Japan expanded steadily over the period, and Australia became an increasingly popular destination. In both charts, the general upward trend was interrupted only briefly, in 1990 and 1991.","The number of Japanese tourists travelling abroad roughly tripled over the eleven years. It rose from about 5 million in 1985 to just over 8 million in 1988 and nearly 11 million in 1990. The only decline came in 1991, when the figure slipped to about 10.5 million. Growth then resumed, slowly at first, with the figure staying at under 12 million in 1992 and 1993, and then rapidly, to around 13.5 million in 1994 and 15 million in 1995.","Australia’s share of this market also grew substantially. It rose from 2% in 1985 to 3.8% in 1988 and 4.9% in 1989, but in 1990 it fell to 4.2%, at a time when the total number of Japanese tourists going abroad was still increasing. From 1991 onwards, the share rose again every year, from 4.9% to a peak of 6.2% in 1994, before easing to 6% in 1995. It is noticeable, therefore, that the two charts moved in opposite directions in 1990, 1991 and 1995."]]},{"id":"W1-MX-17","task":1,"type":"Mixed charts","prompt":["The table and graph below show the cinema attendance in Australia and also show the average cinema visits of different age groups from 1996 to 2000.","Summarise the information by selecting and reporting the main features and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-17-1.jpg","w":1024,"h":572}],"models":[["The table shows the percentage of Australians who went to the cinema and how often they went on average each year between 1996 and 2000. The line graph compares the visits made by four age groups.","Overall, a larger share of the population went to the cinema over the five years, but people went less often after 1997. It is also clear that all four age groups rose and fell together, with people aged 14 to 24 and over 50 going most often and the 25 to 35 group least often.","According to the table, 62% of Australians went to the cinema in 1996. This jumped to 72% the following year and stayed at about that level for the rest of the period, apart from a slight dip to 70% in 1999. Frequency, by contrast, rose from 10.3 to a high of 11.1 visits in 1997, then dropped sharply to 8.3 in 1998 and barely changed after that.","Looking at the graph, the youngest and oldest groups moved almost in tandem throughout. They rose from about 15 visits in 1996 to roughly 22 in 1997 and fell back to around 15 in 1998. They then peaked at about 23 in 1999 and ended at roughly 18. The 35 to 49 and 25 to 35 groups followed the same ups and downs at consistently lower levels. They started at about 12 and 10 respectively, reached highs of 20 and 18 in 1999, and finished at around 15 and 13, still clearly below the two leading groups."]]},{"id":"W1-MX-18","task":1,"type":"Mixed charts","prompt":["The bar chart below shows the proportions of English men and women of different ages who were living alone in 2011. The pie chart compares the numbers of bedrooms in these one-person households.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-18-1.jpg","w":837,"h":1024}],"models":[["The bar chart shows the proportions of men and women among people living alone in England in 2011, broken down by age group, while the pie chart shows how many bedrooms the homes of people living alone had.","Overall, men made up the majority of people living alone in the younger age groups, whereas women made up an increasingly large majority from the age of 65 onwards. As for accommodation, most people who lived alone had homes with one to three bedrooms, and very few had four or more.","Among people living alone aged 16 to 24, 53% were men and 47% women. The male share was higher still in the next two age groups, at about 62% for those aged 25 to 34 and a peak of around 65% for those aged 35 to 49. The two sexes were equally represented among 50 to 64-year-olds. After that, however, women became the majority, and their share rose with age, from about 63% in the 65 to 74 group to 72% in the 75 to 84 group and 76% among those aged 85 and over. Across all ages, women accounted for 53% of people living alone and men for 47%.","The pie chart shows that two-bedroom homes were the most common, accounting for 35.4% of the total. Three-bedroom homes made up 29.8% and one-bedroom homes 28%, so these three types together accounted for over 93%. By contrast, only 5.3% of people living alone had four bedrooms, and just 1.4% had five or more."]]},{"id":"W1-MX-19","task":1,"type":"Mixed charts","prompt":["The pie chart describes the educational level of the population of Singapore in 2000 and 2010. The bar chart shows how many years the average adult in Singapore was in school.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-19-1.jpg","w":1139,"h":776},{"src":"wimg/W1-MX-19-2.jpg","w":1131,"h":665}],"models":[["The pie charts show the highest level of education achieved by adults in Singapore in 2000 and 2010, while the bar chart shows the average number of years that adult males and females spent at school in five years between 2000 and 2010.","Overall, the population of Singapore became considerably better educated over the decade, with university and master’s qualifications replacing school qualifications as the most common. Both men and women also spent longer at school on average, although men spent more time at school than women throughout and the gap widened.","In 2000, a high school qualification was the most common highest level of education, held by 32.13% of adults, followed by secondary and primary school qualifications, at 26.3% and 25.77% respectively. Only 8.3% of adults had a university qualification and 7.5% a master’s qualification. By 2010, however, the situation had changed dramatically. University and master’s qualifications had become the two largest categories, at 32.93% and 30.31%, so that almost two thirds of adults had studied at this level. The proportions with high school and secondary school qualifications fell to 19.55% and 15.2%, while primary school qualifications dropped to just 2.1%.","As for time spent at school, adult males averaged around 8.9 years in 2000, compared with 8 years for females. The male figure increased at every interval, reaching about 11.7 years in 2010. The female figure, by contrast, rose only slightly, staying at 8 years until 2002 and then fluctuating at around 8.5 years before reaching just under 9 years in 2010."]]},{"id":"W1-MX-20","task":1,"type":"Mixed charts","prompt":["The charts A and B show the share of the UK and Australian cinema market in 2001 and cinema admission in the UK and Australia from 1976 to 2006.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-20-1.jpg","w":968,"h":1024}],"models":[["The bar chart compares the proportions of films from different countries screened in the UK and Australia in 2001. The line graph shows how many cinema admissions, in millions, were recorded in the two countries between 1976 and 2006.","Overall, American films dominated cinema screens in both countries, while home-produced films made up only a small share, particularly in Australia. Admissions also rose substantially in both countries, with the UK recording higher figures throughout.","In 2001, US films accounted for about 77% of films shown in the UK and roughly 67% in Australia. British films came a distant second in the UK at around 21%, but Australian films took just 2% of screenings in their own country. This was well below their 11% share in the UK. Australian cinemas instead showed a larger share of films from other countries, at about 17%, compared with only 4% in the UK, as well as around 6% British films.","Looking at admissions, the UK figure began at just over 100 million in 1976 and peaked at around 125 million two years later. It then slumped to a low of about 54 million in 1984. After that, it recovered steadily, passing its earlier peak in the mid-1990s and reaching a high of roughly 175 million in 2002, before easing to about 156 million in 2006. Australian admissions started much lower, at about 30 million, and stayed between 25 and 45 million until 1990. They then climbed to over 90 million in the early 2000s and finished at around 84 million, almost three times their 1976 level."]]},{"id":"W1-MX-21","task":1,"type":"Mixed charts","prompt":["The chart below shows the proportions of vaccination for the population over 18 in different regions in a country in 2021. The table shows the percentages of vaccine types for different age groups in the same year.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-21-1.jpg","w":1349,"h":667},{"src":"wimg/W1-MX-21-2.jpg","w":1400,"h":590}],"models":[["The bar chart shows the percentages of people over 18 who were vaccinated in urban, rural and mountainous areas of three regions of a country in 2021, while the table shows the proportions of different vaccine types given to six age groups.","Overall, vaccination rates were high in urban areas throughout the country, but considerably lower in mountainous areas. In terms of vaccine types, Pfizer was the main vaccine for the youngest and oldest age groups, while AstraZeneca was the most common for adults aged 18 to 60.","Urban vaccination rates were very similar in all three regions, at between 88% and 90%. In the North, the rural figure was almost identical, at about 90%, but rural rates were lower in the Middle and the South, at around 80% and 75% respectively. Mountainous areas had the lowest rates everywhere, at roughly 68% in the North, 63% in the South and 60% in the Middle.","Almost no one under 16 was vaccinated, and virtually everyone aged 16 to 18 (99.8%) received Pfizer. AstraZeneca accounted for 41% of vaccinations among people aged 18 to 24, 51% among those aged 24 to 50 and 43% among those aged 50 to 60. For people over 60, however, Pfizer was clearly the most common vaccine, at 61%, compared with 23% for AstraZeneca. Sputnik V and Vero Cell made up between 6% and 18% in the adult age groups, while Moderna never exceeded 9% and other types accounted for 3% at most."],["The charts give information about vaccination in a country in 2021, showing adult vaccination rates by area in three regions and the vaccines given to each age group.","Overall, adults in urban areas were the most likely to be vaccinated, and those in mountainous areas the least likely, in every region. The choice of vaccine varied considerably with age, as Pfizer dominated at both ends of the age range, while AstraZeneca was the leading vaccine for most adults.","The North had the highest vaccination rates overall. Around 89% of urban adults and 90% of rural adults there were vaccinated, the only case in which the rural figure was slightly higher than the urban one, and its mountainous areas also had the highest rate of their kind, at 68%. In the Middle and the South, urban rates were similar, at 88% and 90%, but the gap with rural areas was wider, with rural rates of 80% and 75%. Mountainous areas in these regions had rates of only 60% and 63%.","As for vaccine types, Pfizer was given to 99.8% of those aged 16 to 18, while those under 16 were almost entirely unvaccinated. Between the ages of 18 and 60, AstraZeneca was the most common vaccine, peaking at 51% in the 24 to 50 group, where Pfizer accounted for only 8%. Among people over 60, Pfizer again became the main vaccine, at 61%. The other vaccines each accounted for no more than 18% in any group."]]},{"id":"W1-MX-22","task":1,"type":"Mixed charts","prompt":["The chart and table below give information about the weather in Glasgow in 2015.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-22-1.jpg","w":761,"h":1024}],"models":[["The line graph shows the average maximum and minimum temperatures in Glasgow in each month of 2015, while the table gives the corresponding figures for average rainfall, measured in centimetres, and average hours of sunshine per day.","Overall, Glasgow was warmest and sunniest in the summer months and coldest and darkest in midwinter. Rainfall moved in a broadly opposite direction, being lightest in late spring and heaviest at the end of the year.","Both temperature lines followed almost identical curves. In January, the average maximum was only about 5°C and the minimum just over 1°C, a level that the lower line held through February. From March onwards, both figures climbed steadily, reaching their highest points in August at roughly 19°C and 11°C respectively, before falling back to around 9°C and 3°C by December.","Turning to the table, sunshine closely mirrored the temperature pattern, rising from just 1 hour a day in January to a peak of 6 hours in June before declining to 1 hour again in December. Rainfall, by contrast, decreased from 11 cm in January to a low of 6 cm in May. It then rose sharply to 10 cm in July, even though this was one of the sunniest months, and, after a slight dip in August, went on increasing through the autumn to 12.5 cm in December, the wettest month of the year and more than twice the figure for May."]]},{"id":"W1-MX-23","task":1,"type":"Mixed charts","prompt":["The graphs below show average monthly temperature and rainfall in two places in South Africa.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-MX-23-1.jpg","w":692,"h":716},{"src":"wimg/W1-MX-23-2.jpg","w":805,"h":735},{"src":"wimg/W1-MX-23-3.jpg","w":378,"h":168}],"models":[["The two graphs show the average monthly maximum and minimum temperatures and the average monthly rainfall in two places in South Africa, Cape Town and Upington.","Overall, both places are warmest at the beginning and end of the year and coolest in the middle, but Upington has much greater temperature extremes. The two places also have opposite rainfall patterns, as Cape Town receives most of its rain in the cooler months, whereas Upington is wettest in the hottest months.","In Cape Town, the average maximum temperature is about 26°C in January and February and falls to around 18.5°C from June to August, before rising again to 25°C in December. The minimum temperature follows the same pattern, from 16°C in January to a low of about 6°C in July. Rainfall is light from October to March, at between 13 and 30 mm a month, but it increases sharply in the middle of the year, peaking at about 92 mm in June.","Upington is noticeably hotter in summer, with maximum temperatures of about 36°C in January, ten degrees higher than in Cape Town, although they drop to around 21°C in June and July. Its minimum temperature varies even more, from 20°C in January to only 4°C in July. Upington’s rainfall is far heavier overall. It reaches a peak of over 180 mm in March, roughly twice the highest monthly figure for Cape Town, but falls to just 10 to 20 mm a month between June and September, when Cape Town is at its wettest."]]},{"id":"W1-DG-01","task":1,"type":"Diagram","prompt":["The diagram below shows the life cycle of the honey bee.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-01-1.jpg","w":1068,"h":802}],"models":[["The diagram illustrates the life cycle of the honey bee, from the laying of an egg to the development of a mature adult.","Overall, the bee passes through six stages in a continuous cycle, starting as an egg and ending as a mature female that lays eggs of its own. The whole cycle is notably short, taking only 34 to 36 days to complete.","The cycle begins when a female bee lays one or two eggs every three days. These eggs hatch after nine to ten days, and the young bee then grows for five days until it goes through its first moulting.","In the second half of the cycle, the young bee moults for a second time seven days later, after which a further nine days pass before it emerges as a young adult. It then takes another four days to reach maturity, at which point the female is able to lay eggs and the cycle begins again. Of all the stages, the incubation of the eggs is the longest, lasting up to ten days, while the final period before maturity is the shortest, at just four days."],["The diagram shows how a honey bee develops from an egg into a fully grown adult.","Overall, the life cycle consists of six main stages and lasts between 34 and 36 days, beginning with the laying of eggs by females and ending when a young adult reaches maturity. The most noticeable feature is that the bee moults twice before it emerges as an adult.","To begin with, female bees lay one or two eggs every three days. Each egg takes nine to ten days to hatch, which makes this the longest single stage in the cycle.","Once the egg has hatched, the young bee develops for five days before its first moulting, and a second moulting follows seven days later. After a further nine days, a young adult emerges, and it needs just four more days to become mature. In total, the period from hatching to maturity lasts 25 days, roughly two and a half times as long as the egg stage. At that point the cycle is complete, since mature females go on to lay eggs of their own."]]},{"id":"W1-DG-02","task":1,"type":"Diagram","prompt":["The diagram below shows the life cycle of a salmon, from eggs to adult fish.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-02-1.jpg","w":1068,"h":802}],"models":[["The diagram depicts how a salmon develops, from an egg in fresh water to an adult that returns to spawn.","Overall, the salmon passes through seven distinct stages in a continuous cycle, starting as an egg and ending as a spawning adult whose eggs begin the cycle again. The most striking feature is the change of environment, as the fish spends its early life in fresh water, moves out to sea for several years and then returns to spawn and die.","The cycle begins with eggs in fresh water, which hatch after about three months. The young fish, known as alevin, then feed off their yolk sacs for several weeks before developing into fry, which are 5 to 10 weeks old and able to swim. Over the following months, the fry grow into parr, which develop distinctive ’finger’ markings.","In the second half of the cycle, the fish leave fresh water behind. At between one and three years old, they become smolt, which form groups and head out to sea, where they mature into adults and spend between one and six years. Finally, the adults return to spawn, after which they die within two weeks, and their eggs mark the start of a new cycle."]]},{"id":"W1-DG-03","task":1,"type":"Diagram","prompt":["The diagram illustrates how bees produce honey.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-03-1.jpg","w":768,"h":796}],"models":[["The diagram illustrates the process by which bees produce honey, from the moment they leave the hive to the point at which the finished honey is stored.","Overall, the process consists of seven stages, beginning with bees setting out from their hive and ending with the production of honey. It is notable that the bees carry out every step themselves, and that the key change, the removal of water from the nectar, takes place inside the hive rather than in the flowers.","To begin with, bees leave the hive and fly to nearby flowers, where they gather nectar from the centre of each bloom. Having collected the nectar, they carry it back to the hive and deposit it into the small hexagonal cells of the honeycomb.","The second half of the process takes place entirely within the hive. Once the cells have been filled, the bees beat their wings rapidly above them, creating a current of air that circulates over the surface of the nectar. This causes the water in the nectar to evaporate, and as a result the nectar gradually turns into honey. In the final stage, the finished honey is stored in the comb, from which it can be collected in jars."]]},{"id":"W1-DG-04","task":1,"type":"Diagram","prompt":["The diagram illustrates the life cycle of frogs in a pond.","Summarize the information by selecting and reporting the main features and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-04-1.jpg","w":1400,"h":986}],"models":[["The diagram depicts how a frog develops in a pond, from the laying of eggs to the emergence of a mature adult.","Overall, the frog passes through eleven distinct stages in a continuous cycle, starting as an egg and ending as an adult that produces eggs of its own. The most striking feature is the gradual transformation of a legless tadpole that breathes through gills into a four-legged frog whose tail has almost disappeared.","The cycle begins when an adult frog lays a cluster of eggs, each of which develops into an embryo. These embryos then hatch as tiny tadpoles, which cling to water plants. Soon afterwards, the tadpoles develop external gills for breathing, and their tails keep on growing.","In the second half of the cycle, the tadpole begins to take on the features of a frog. Hind legs appear first, and at this stage the animal lives on food stored in its tail. Front legs then emerge, after which the tail becomes progressively shorter. Finally, the animal becomes a young frog, which grows into an adult, at which point the cycle begins again."]]},{"id":"W1-DG-05","task":1,"type":"Diagram","prompt":["The diagram below shows the recycling process of plastics.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-05-1.jpg","w":577,"h":511}],"models":[["The diagram illustrates what happens to plastic items after they are bought from shops, showing how plastic bottles are recycled while other waste is sent to landfill.","Overall, the recycling process consists of six main stages, beginning with consumers buying products from shops and ending with recycled products being returned to those shops. What is notable is that only plastic bottles are recycled in this cycle, whereas bags and other rubbish leave it and end up in landfill.","The cycle starts when people buy plastic goods from a shop and use them. After use, the waste is divided into two streams, with bags and general rubbish being taken to landfill, where their journey ends, and bottles being collected separately for recycling. This division is the only point at which material leaves the cycle.","From the collection point, the bottles are sent to a sorting house, after which they are loaded onto trucks and driven to a processing plant. Here they are processed into new products, which are delivered back to shops. Once there, the products can be bought and used again, so the cycle begins once more."],["The diagram shows how plastics move from shops to consumers and how part of this plastic is recycled into new products.","Overall, the diagram presents a closed loop with a single branch, as plastics leave the shop, are used and are then either recycled or thrown away. The recycled bottles pass through six stages before returning to the shop as new products, whereas bags and rubbish follow a one-way route to landfill.","Plastics enter the cycle at the shop, where they are bought and used by consumers. Once they have been used, they are separated according to type. Bags and rubbish are disposed of in landfill, which marks the end of their journey, but bottles are collected so that they can be recycled.","The collected bottles first go to a sorting house and are then transported by truck to a processing facility. Having been processed, the plastic is turned into new products, which are sent back to the shop. These products can then be bought and used once more, at which point the cycle starts again."]]},{"id":"W1-DG-06","task":1,"type":"Diagram","prompt":["The diagram below shows the recycling process of aluminum cans.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-06-1.jpg","w":700,"h":800}],"models":[["The diagram illustrates how used aluminium drinks cans are recycled and turned into new cans.","Overall, the process forms a closed cycle of seven stages, beginning with consumers throwing away their used cans and ending with new cans being put back into use. The stages fall into two broad phases, with the used cans first being gathered and prepared and then converted back into usable aluminium.","The cycle begins when used cans are placed in special bins that accept aluminium cans only. These bins are emptied by a collection truck, and the cans are taken to a plant where they are cleaned and sorted before being shredded and compressed. By the end of this phase, the cans have been reduced to compact blocks of metal.","In the second phase, the compressed aluminium is heated until it melts, and the molten metal is then rolled into flat sheets between 2.5 and 6 millimetres thick. These sheets are used to make new cans, which go back into use, at which point the cycle starts again. According to the diagram, 74% of aluminium cans in the UK are recycled in this way."]]},{"id":"W1-DG-07","task":1,"type":"Diagram","prompt":["The diagram below shows how leather goods are produced.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-07-1.jpg","w":1024,"h":622}],"models":[["The diagram illustrates the stages through which animal skins are turned into leather goods.","Overall, the process involves nine stages, beginning with the drying of animal skins and ending with the production of items such as shoes, bags and balls. It is notable that most of the treatment takes place in a single factory, where the skins are washed, soaked twice, flattened and polished before being sent elsewhere to be made into finished products.","To begin with, animal skins are hung up to dry and then transported by truck to a factory. There, they are washed in a mixture of water and lime, after which they are soaked in lime alone. The skins are then passed through a machine that flattens them.","In the second half of the process, the flattened skins are soaked again, this time in tannin, which is a mixture of water and vegetable matter. Following this, they are polished by machine, and the resulting leather is loaded onto a truck and taken to a second factory. Finally, it is made into leather goods, including shoes, bags and balls."]]},{"id":"W1-DG-08","task":1,"type":"Diagram","prompt":["The diagram below shows the manufacturing process for making sugar from sugar cane.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-08-1.jpg","w":797,"h":1024}],"models":[["The diagram illustrates the stages involved in manufacturing sugar from sugar cane, from the growing of the crop to the drying and cooling of the finished sugar.","Overall, the process consists of seven stages, beginning with the cultivation of sugar cane and ending with sugar being dried and cooled. It is notable that only the first two stages take place in the field, whereas the remaining five turn the cane into juice, then syrup and finally sugar crystals.","The process begins with the growing of sugar canes, which takes between 12 and 18 months. Once they have finished growing, the canes are harvested, either by machine or by hand, and are then fed into a crusher, which squeezes out the juice.","In the second half of the process, the juice is purified by passing it through a limestone filter, and it is then heated in an evaporator, where it becomes syrup. Following this, the syrup is placed in a centrifuge, which separates the sugar crystals from the remaining syrup. Finally, the sugar is dried and cooled, at which point the process is complete."]]},{"id":"W1-DG-09","task":1,"type":"Diagram","prompt":["The diagram below shows how instant noodles are manufactured.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-09-1.jpg","w":1024,"h":765}],"models":[["The diagram illustrates the process by which instant noodles are manufactured, from the storage of flour to the labelling and sealing of the finished cups.","Overall, the process consists of eight stages, beginning with flour being stored in silos and ending with sealed and labelled cups of noodles. It is notable that the first half of the process changes the shape of the dough step by step, while the second half cooks the noodles and packs them into cups.","To begin with, flour is delivered by truck and kept in storage silos, from which it is fed into a mixer and combined with water and oil. The resulting dough is passed through rollers to form dough sheets, which are then cut into dough strips. These strips are subsequently shaped into noodle discs.","The second half of the process begins with cooking, in which the discs are cooked in oil and then dried. Once this is done, the noodles are placed in cups together with vegetables and spices. In the final stage, the cups are labelled and sealed, after which they leave the production line."]]},{"id":"W1-DG-10","task":1,"type":"Diagram","prompt":["The diagrams show the structure of a fluid heating device and its use.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-10-1.jpg","w":1400,"h":880}],"models":[["The diagrams illustrate the design of a simple solar heating device and the two ways in which it can be used, to heat either air or water.","Overall, the device is a basic box with a transparent top, fitted with an inlet and an outlet. It works on a straightforward principle, namely that sun rays pass through the transparent top and heat whatever flows through the box, so cool air or water enters at one end and leaves warm at the other.","Turning to the structure, the device consists of a rectangular box covered by a transparent top. A short pipe projects from one side of the box to act as an inlet, and a second pipe on the opposite side serves as an outlet.","When the device is used to heat air, cool air is drawn in through the inlet, and as sun rays enter through the transparent top, their heat energy warms the air inside the box, which then leaves through the outlet as warm air. The water-heating version works in much the same way, the only difference being that a water pipe is laid inside the box. Cool water flows into this pipe through the inlet, absorbs heat from the sun as it winds across the box, and comes out of the outlet as warm water."]]},{"id":"W1-DG-11","task":1,"type":"Diagram","prompt":["The diagram below shows a simple system that turns dirty water into clean water.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-11-1.jpg","w":1241,"h":1103}],"models":[["The diagram illustrates the structure of a simple water-filter assembly and the way in which it turns dirty water into clean drinking water.","Overall, the assembly consists of two containers, a plastic barrel filled with three filter layers and a storage drum, which are connected by a pipe. It works on a straightforward principle, namely that water is cleaned as it passes down through layers of sand, charcoal and gravel.","Turning to the structure, the plastic barrel is a cylindrical container with a removable plastic lid, and it stands on short legs, which the diagram notes place it above the storage drum. Inside, it is filled with three layers, with sand at the top, charcoal in the middle and gravel at the bottom. A pipe runs from the base of the barrel up its side and across into the storage drum, which also has a lid and is fitted with a tap near its base.","As for the way the system operates, the lid is first removed and dirty water is poured into the top of the barrel. The water then trickles down through the sand, charcoal and gravel in turn before collecting at the bottom. From there, it flows along the pipe into the storage drum, where it is kept until it is drawn off through the tap as drinking water."]]},{"id":"W1-DG-12","task":1,"type":"Diagram","prompt":["The diagram shows how to make jam from fruits.","Summarize the information by selecting and reporting the main features and making comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-12-1.jpg","w":1024,"h":765}],"models":[["The diagram illustrates how jam is made from fresh fruit, including the quantities, temperatures and timings required at each step.","Overall, the process consists of seven main stages, beginning with the washing of the raw fruit and ending with the finished jam being served at breakfast. What is notable is that the fruit is cooked twice at a high temperature, with the second boiling lasting three times as long as the first.","The first half of the process prepares the fruit and gives it a short initial cooking. Initially, 4 kilograms of fruit are rinsed under running water from a tap, before being crushed with a masher into a pulp. This is then heated in a pan at a high temperature for 10 minutes, during which two tablespoons of peanuts are stirred in along with a quarter of a cup of water and a further full cup.","The remaining stages complete the cooking and store the jam. Two more cups of sugar and four cups of water are added to the mixture, which is then boiled at a high temperature for half an hour. Once this is done, the jam is poured into four separate containers, which are sealed with lids and left to stand for one hour. Finally, it is ready to be served to the family at breakfast."]]},{"id":"W1-DG-13","task":1,"type":"Diagram","prompt":["The diagram below shows how a solar powered water pump works.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-13-1.jpg","w":1024,"h":998}],"models":[["The diagram illustrates how a solar-powered pump supplies water from underground to a village.","Overall, the system consists of three main components, a solar panel, a bore pump in an underground well and a water tank, which are linked by a cable and a pipe. It works on a simple principle, namely that energy from the sun powers a pump which raises water to the surface, where it is stored before being sent to the village.","Turning to the structure, a solar panel made up of photovoltaic cells is mounted on top of a tall pole above ground level. A cable runs down from the panel into an underground bore or well, where the bore pump sits below the water level. A pipe leads from the top of the well to a water tank standing on the ground nearby, and this tank has an outlet on one side.","As for the way the system operates, the photovoltaic cells take in energy from the sun and produce DC power, which is carried down the cable to the bore pump. Powered in this way, the pump draws water from the well and sends it up through the pipe into the water tank. The water is held in the tank until it flows out through the outlet to supply the village."],["The diagram explains how water is drawn from beneath the ground and supplied to a village using a pump that runs on solar power.","Overall, the process involves three stages, beginning with the generation of electricity by a solar panel and ending with water being stored in a tank and sent to a village. What is notable is that sunlight is the only source of energy shown, and it drives the whole system, from the panel down to the pump below the water level.","The process starts at a solar panel, which is fitted with photovoltaic cells and raised above the ground on a pole. When sunlight falls on these cells, they produce DC power, and this is carried down a cable into an underground bore or well.","Inside the well, just below the water level, sits a bore pump, which is driven by this power. The pump lifts water up out of the well and along a pipe into a water tank at ground level. From there, the water flows onwards to the village, which marks the end of the process."]]},{"id":"W1-DG-14","task":1,"type":"Diagram","prompt":["The diagram below shows how ethanol fuel is produced from plants and the cycle of carbon dioxide involved.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-14-1.jpg","w":965,"h":1024}],"models":[["The diagram illustrates how ethanol fuel is produced from plants and how carbon dioxide moves through the process.","Overall, the production of ethanol involves seven main stages, beginning with the growth of plants and trees and ending with the fuel being used by cars, trucks and planes. It is notable that the process forms a closed loop, since the carbon dioxide released by these vehicles returns to the atmosphere and is absorbed again by growing plants.","The cycle begins when plants and trees grow, using energy from sunlight and carbon dioxide. Once they have finished growing, the crops are harvested by tractor and taken for pre-processing, where they are broken down into small particles. These particles are then turned into cellulose, which is passed on to the next phase of production.","In the second half of the process, the cellulose is processed to produce sugars, to which microbes are subsequently added in order to create ethanol. This fuel is then used to power three types of vehicle, namely cars, trucks and planes. As these vehicles run on ethanol, each of them gives off carbon dioxide into the atmosphere, and this gas is taken up once again by growing plants, at which point the cycle begins again."]]},{"id":"W1-DG-15","task":1,"type":"Diagram","prompt":["The diagram below shows a possible future means of home energy production.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-15-1.jpg","w":667,"h":763}],"models":[["The diagram illustrates a possible future method by which households could produce their own electricity from compost.","Overall, the system involves six main stages, beginning with the fermentation of compost in a steel tank and ending with electricity being supplied for home use. It is notable that the energy changes form several times along the way, from methane gas to mechanical energy and then to electrical energy, before it is stored in a battery.","The first half of the process is concerned with producing gas. A steel tank is filled three-quarters full with compost, such as leaves and food scraps, together with water, and as the compost ferments, it gives off methane gas. This gas rises out of the tank through a set of pipes and is held in a methane gas storage unit, from which it is passed to a compressor.","In the second half, the gas is turned into electricity. The compressed gas is fed into a combustion engine, which produces mechanical energy, and this in turn drives a generator that converts it into electrical energy. Finally, the electricity is held in a battery, which serves as electrical energy storage, before being supplied to the house for domestic use."],["The diagram outlines how compost could be used in the future to generate electricity at home, so that households would no longer need to buy it.","Overall, the process consists of six stages and can be divided into two phases, the production and handling of methane gas and its conversion into electricity. The most striking feature is that the only inputs are compost and water, yet the system ends by supplying a house with electricity.","To begin with, a steel tank is three-quarters filled with a mixture of water and compost, which includes materials such as leaves and food scraps. As the compost ferments, it produces methane gas, which is drawn out through pipes and kept in a storage tank. On leaving storage, the gas is compressed in a compressor before travelling on to the next part of the system.","In the second phase, the compressed gas fuels a combustion engine, whose mechanical energy powers a generator. The electrical energy produced by the generator is then sent to a battery, where it is stored, and from there it is delivered to the home as electricity for everyday use."]]},{"id":"W1-DG-16","task":1,"type":"Diagram","prompt":["The diagram illustrates the process that is used to manufacture bricks for the building industry.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-16-1.jpg","w":1024,"h":776}],"models":[["The diagram illustrates the stages by which bricks are manufactured for the building industry.","Overall, the process consists of seven main stages, beginning with the digging of clay from the ground and ending with the delivery of packaged bricks. It is notable that heat plays a central role in the second half of the process, as the bricks are dried in an oven and then heated in a kiln at two different temperatures before being cooled.","To begin with, clay is dug out of the ground by a digger and placed on a metal grid, where it is broken up and passed onto a roller. Sand and water are then added to the clay, and the mixture is shaped into bricks in one of two ways, either by being cut with a wire cutter or by being pressed into moulds.","In the second half of the process, the bricks are dried in a drying oven for 24 to 48 hours. They are then heated in a kiln, first at a moderate temperature of 200 to 980°C and then at a high temperature of 870 to 1,300°C, after which they are moved to a cooling chamber for 48 to 72 hours. Finally, the bricks are packaged and loaded onto a truck for delivery."]]},{"id":"W1-DG-17","task":1,"type":"Diagram","prompt":["The diagram illustrates how steel rods are manufactured in the furniture industry.","Summarize the information by selecting and reporting the main features and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-17-1.jpg","w":1024,"h":564}],"models":[["The diagram illustrates the stages involved in manufacturing steel rods for the furniture industry.","Overall, the process consists of eleven stages, beginning with the melting of raw materials and ending with the inspection of the finished rods. It is notable that the first half of the process turns the raw materials into strands of metal, while the second half shapes, treats and checks these strands until they become usable rods.","To begin with, iron ore, yellow ore and carbon are placed in a melting slit and heated to between 1,300 and 1,500°C. The molten material is then refined in a smelting cabin, after which a pouring machine pours the candescent metal into ingots. These ingots are connected to a cooling reservoir at 60 to 100°C, and in the strand casting stage the metal passes through nozzles to form strands of cooled metal.","In the second half of the process, the strands are shaped by rollers and then given heat treatment in a heating machine. Once this is done, a measuring automaton checks the surface of the metal, and a cutter sizes the rods. Finally, each rod receives an ID stamp before undergoing a final inspection."]]},{"id":"W1-DG-18","task":1,"type":"Diagram","prompt":["The diagram below shows the process of producing smoked fish.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-18-1.jpg","w":734,"h":981}],"models":[["The diagram illustrates the stages involved in producing smoked fish, from the catching of the fish at sea to their sale in fish shops.","Overall, the process consists of eleven stages, beginning with fish being caught in nets and ending with the finished product being sold in a fish shop. It is notable that the fish are frozen twice, once on arrival at the port and again after smoking, and that they are kept in cold storage before being distributed.","The first half of the process prepares the fish for smoking. Fish are caught at sea in nets and transported by ship to a port, where they are frozen. Later, they are thawed in fresh water and cut open, after which they are placed in salt water to which yellow colouring has been added.","The smoking stage marks the turning point of the process, as the fish are then treated in a smoker. After this, they are frozen for a second time and kept in cold storage until they are distributed by truck. Finally, the smoked fish are delivered to fish shops, where they are sold to customers."]]},{"id":"W1-DG-19","task":1,"type":"Diagram","prompt":["The diagram gives information about the process of making carbonated drinks.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-19-1.jpg","w":1400,"h":1017}],"models":[["The diagram illustrates the stages involved in manufacturing carbonated drinks, from the cleaning of raw water to the delivery of bottles and cans to supermarkets.","Overall, the process is divided into five stages, with the first two preparing the water and the last three turning it into a finished, packaged drink. It is notable that the production line splits in two near the end, as the drink is filled into either bottles or cans, before the two lines come together again for packaging.","In the first stage, raw water is passed through a filter, after which a water softener and chemicals are added to clean it. The water is then pumped to a unit fitted with electric heaters and travels along a cooling pipe into a carbonation tank, where carbon dioxide is introduced to produce carbonated water.","This carbonated water is carried through a pipe to a mixing tank, where colouring, syrup and flavour are added and stirred in. The mixture is then filtered once more before being poured into either bottles or cans. In the final stage, the filled bottles and cans are packed into boxes and loaded onto a truck, which delivers them to supermarkets."],["The diagram outlines how soft drinks containing carbon dioxide are produced and packaged for sale.","Overall, there are five stages in the process, beginning with water cleaning and ending with packaging and delivery to supermarkets. The most notable feature is that the water is cleaned, heated and carbonated before any flavouring is added to it.","To begin with, raw water flows through a filter and then into a chamber where a water softener and chemicals are added. Once it has been cleaned in this way, it is pumped onwards to electric heaters, after which it runs through a cooling pipe into a carbonation unit. Here, carbon dioxide is added, turning the treated water into carbonated water.","The second half of the process begins in a mixing tank, which receives the carbonated water through a long pipe and adds colouring, syrup and flavour to it. Having been mixed, the drink passes through a second filter and is filled into bottles on one line and cans on another. The bottles and cans are then packed into boxes and transported by truck to supermarkets for sale."]]},{"id":"W1-DG-20","task":1,"type":"Diagram","prompt":["The diagram below shows the process of producing bottled and canned carbonate drinks.","Summarize the information by describing the main features of the charts and making comparisons where appropriate."],"imgs":[{"src":"wimg/W1-DG-20-1.jpg","w":1024,"h":802}],"models":[["The diagram illustrates the stages involved in producing carbonated soft drinks, which are sold in both bottles and cans.","Overall, the process consists of five clearly defined stages, beginning with the cleaning of raw water and culminating in the delivery of the finished drinks to supermarkets. It is notable that the two types of container are filled on separate lines, although they are then packaged and distributed together.","Initially, raw water is passed through a filter, after which a water softener and chemicals are added to it. The cleaned water is then pumped into a chamber where it is heated by electric heaters, before travelling along a cooling pipe into a carbonation unit. Here, carbon dioxide is introduced, turning the water into carbonated water.","The carbonated water is subsequently piped to a mixing tank, in which colouring, syrup and flavour are added and blended by a rotating paddle. Once this has been done, the liquid passes through a second filter, and the production line divides in two, with the drink being poured into either bottles or cans. In the final stage, the filled containers from both lines are packed into boxes and loaded onto a lorry, which transports them to supermarkets."]]},{"id":"W1-DG-21","task":1,"type":"Diagram","prompt":["The diagram shows how rainwater is collected for the use of drinking water in an Australian town.","Summarize the information by selecting and reporting the main features of the graph and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-21-1.jpg","w":1400,"h":901}],"models":[["The diagram illustrates how rainwater is collected and processed in an Australian town so that it can be supplied to households as drinking water.","Overall, the system involves six main stages, beginning with the collection of rain from the roofs of houses and ending with clean water being piped back into the same homes. What is notable is that the process forms a closed loop, with the water passing through both filtration and chemical treatment before it is fit to drink.","The process begins when rain falls on the roofs of houses and runs down into drains attached to the side of each building. From there, it is carried along a shared pipe beneath the houses and channelled into a water filter. Once filtered, the water flows into a large storage tank.","The second half of the process prepares the water for drinking. The water is held in the storage tank before being transported through a pipe to a treatment tank, where chemicals are added. The treated water is then piped back up through a separate network of pipes to the houses, where it comes out of the taps as drinking water."],["The diagram depicts a system used in an Australian town to collect rainwater and turn it into drinking water for local households.","Overall, the water passes through six stages, starting on the roofs of the houses and finishing at the taps inside them. The most notable feature is that the water is treated twice, first by a filter and later with chemicals, before it reaches the homes as drinking water.","To begin with, rainwater runs off the roof of each house into a drain on its side, and the drains from all the houses feed into a single pipe running beneath them. This pipe carries the water to a water filter, after which it flows down into a storage tank.","From storage, the water is sent along a pipe into a treatment tank, in which chemicals are added to it. Having been treated, it travels up a separate pipe, which runs back along the row of houses and delivers clean drinking water to their taps. The water therefore ends its journey in the same homes on whose roofs it first fell as rain."]]},{"id":"W1-DG-22","task":1,"type":"Diagram","prompt":["The diagram below shows how geothermal energy is used to produce electricity.","Summarize the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-22-1.jpg","w":1060,"h":978}],"models":[["The diagram illustrates how heat from beneath the ground is used to generate electricity at a geothermal power plant.","Overall, the process involves five stages, beginning with cold water being pumped underground and ending with electricity being produced by a generator. It is notable that the water is heated by hot rocks deep below the surface, which means that the key change in the process takes place underground rather than inside the plant.","The process begins when cold water is pumped down an injection well to a depth of 4.5 kilometres. At the bottom of the well, it flows through a geothermal zone made up of hot rocks, which heat it as it moves towards a second well, known as the production well.","From the production well, the hot water is pumped up to the surface and into a condenser, from which steam is released. This steam powers a turbine, which in turn drives a generator, and the electricity that results is carried away by a pylon. The last two stages are therefore closely linked, as the generator is powered by the turbine rather than directly by the steam."],["The diagram depicts the stages in which geothermal energy is converted into electricity.","Overall, the process consists of five numbered stages, starting with a supply of cold water at the surface and finishing with the generation of electricity. The most striking feature is the depth involved, with the water travelling 4.5 kilometres underground before it returns to the surface as hot water.","Initially, cold water is pumped down a vertical pipe called the injection well, which reaches 4.5 kilometres below the surface. Once at the bottom, the water moves sideways through a geothermal zone of hot rocks, and by the time it reaches the production well, it has become hot. It is therefore during this underground stage, as the water passes the hot rocks, that the key change in the process takes place.","The hot water is then pumped up the production well into a condenser, from which steam is released. Having entered the turbine, the steam makes it spin, and the turbine powers a generator, which produces electricity. Finally, this electricity is sent along cables via a pylon for distribution."]]},{"id":"W1-DG-23","task":1,"type":"Diagram","prompt":["The diagrams below show the stages and equipment used in the cement-making process, and how cement is used to produce concrete for building purposes.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-DG-2
