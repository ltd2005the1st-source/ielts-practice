<html lang="en">

<title>IELTS Writing Practice</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48"><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"><link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">

@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/bricolage-grotesque-vietnamese-opsz-normal.woff2) format("woff2");unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/bricolage-grotesque-latin-ext-opsz-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/bricolage-grotesque-latin-opsz-normal.woff2) format("woff2");unicode-range:U+0000-00A2,U+00A4-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/*
  Design read: exam-practice app for IELTS students, printed-test-booklet language,
  native CSS, Bricolage Grotesque only (weights 400-800, never italic), cobalt blue + sun yellow, motion-led.
  Dials: variance 4, motion 5, density 5.
  Shape rule: interactive controls 6px radius, panels and feedback blocks 2px, page structure square.
*/
:root{
  --bg:#f6f8ff; --surface:#ffffff; --sunk:#eaeefb; --ink:#0b1230; --ink-2:#39425f; --ink-3:#5f6786;
  --rule:#dde2f2; --rule-strong:#0b1230;
  --accent:#2447f5; --accent-ink:#ffffff; --accent-hover:#1a37c9; --accent-tint:#e6ebff;
  --sun:#ffd23f; --sun-ink:#1a1500; --sun-tint:#fff3bf;
  --ok:#17784a; --ok-tint:#e5f3ec; --ok-rule:#9fd0b6;
  --bad:#b3261e; --bad-tint:#fbeaea; --bad-rule:#eeb2ad;
  --skip:#7a5b00; --skip-tint:#f8f1dc; --skip-rule:#dfcb8f;
  --warn:#9a5b00;
  --r-ctl:12px; --r-panel:12px;
  --ease:cubic-bezier(.65,0,.35,1); --smooth:cubic-bezier(.65,0,.35,1); --spring:cubic-bezier(.65,0,.35,1);
  --fs:1rem; --pfs:1.08rem;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#080d24; --surface:#0f1736; --sunk:#172046; --ink:#eef1ff; --ink-2:#bcc4e6; --ink-3:#8c95bd;
  --rule:#232c57; --rule-strong:#eef1ff;
  --accent:#7f9bff; --accent-ink:#071035; --accent-hover:#a3b8ff; --accent-tint:#1a2656;
  --sun:#ffd84a; --sun-ink:#1a1500; --sun-tint:#2b2608;
  --ok:#5fcb92; --ok-tint:#14261d; --ok-rule:#2c5a41;
  --bad:#ff8a80; --bad-tint:#2c1615; --bad-rule:#6b2b27;
  --skip:#e2c46b; --skip-tint:#29230f; --skip-rule:#5c4d1e;
  --warn:#f0b35a;
  color-scheme:dark;
}
*{box-sizing:border-box;font-style:normal!important}
em,i,cite,var,dfn{font-weight:600}
body{font-optical-sizing:auto}
html,body{margin:0}
body{font-family:"Bricolage Grotesque",sans-serif;font-size:var(--fs);line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.screen{min-height:100dvh}
.screen.enter{animation:enter .45s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}

/* ---------- buttons ---------- */
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:.5em;height:44px;padding:0 1.25em;border-radius:var(--r-ctl);font-weight:700;white-space:nowrap;transition:transform .12s ease,color .25s,border-color .25s}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.btn:hover::before{transform:scaleX(1)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary::before{background:var(--accent-hover)}
.btn-line{border:1.5px solid var(--rule-strong);color:var(--ink)}
.btn-line::before{background:var(--ink)}
.btn-line:hover{color:var(--bg)}
.btn-quiet{color:var(--ink-2);height:36px;padding:0 .8em;border:1px solid var(--rule)}
.btn-quiet::before{background:var(--sunk)}
.btn-quiet:hover{color:var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
.textbtn{color:var(--accent);font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;transition:text-underline-offset .2s}
.textbtn:hover{text-underline-offset:5px}

/* ---------- shared header ---------- */
.bar{display:flex;align-items:center;gap:16px;height:60px;padding:0 clamp(16px,3vw,40px);border-bottom:1px solid var(--rule);background:var(--surface)}
.wordmark{font-weight:800;letter-spacing:-.01em;font-size:1.02rem;white-space:nowrap}
.wordmark span{color:var(--accent)}
.bar .spacer{flex:1}
.bar .who{color:var(--ink-3);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.theme-btn{height:36px;padding:0 .75em;border:1px solid var(--rule);border-radius:var(--r-ctl);font-size:.85rem;font-weight:600;color:var(--ink-2);transition:border-color .2s,color .2s}
.theme-btn:hover{border-color:var(--ink);color:var(--ink)}

/* ---------- welcome ---------- */
.welcome{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);min-height:calc(100dvh - 60px)}
.welcome-main{align-self:center;padding:clamp(32px,7vw,96px) clamp(20px,6vw,88px);max-width:680px}
.welcome-main h1{font-size:clamp(2.2rem,4.2vw,3.4rem);line-height:1.04;margin-bottom:.45em;max-width:12ch}
.welcome-main p{color:var(--ink-2);font-size:1.08rem;max-width:46ch;margin:0 0 2.2em}
.field{display:grid;gap:8px;max-width:420px}
.field label{font-weight:700;font-size:.95rem}
.field input{height:52px;padding:0 14px;border:1.5px solid var(--rule);border-radius:var(--r-ctl);background:var(--surface);font-size:1.05rem;transition:border-color .2s}
.field input:hover{border-color:var(--ink-3)}
.field input:focus{outline:none;border-color:var(--accent)}
.field .help{font-size:.86rem;color:var(--ink-3)}
.field .err{font-size:.88rem;color:var(--bad);min-height:1.3em}
.welcome-aside{border-left:1px solid var(--rule);background:var(--surface);padding:clamp(32px,6vw,80px) clamp(20px,4vw,56px);display:flex;flex-direction:column;justify-content:center;gap:22px}
.sample{max-width:520px}
.sample .src{font-family:"Bricolage Grotesque",sans-serif;font-size:1.12rem;line-height:1.65;color:var(--ink-2);margin:0 0 20px}
.sample .src mark{background:var(--accent-tint);color:var(--ink);padding:0 2px}
.sample .stmt{font-weight:600;margin:0 0 10px}
.sample-note{font-size:.9rem;color:var(--ink-3);max-width:44ch}

/* ---------- home ---------- */
.home{max-width:1100px;margin:0 auto;padding:clamp(28px,5vw,64px) clamp(16px,4vw,48px) 80px}
.home h1{font-size:clamp(2rem,4.4vw,3.1rem);line-height:1.05}
.home .lede{color:var(--ink-2);font-size:1.05rem;margin:.6em 0 0;max-width:62ch}
.trio{list-style:none;margin:36px 0 0;padding:0;border-top:2px solid var(--rule-strong)}
.trio li{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:20px;align-items:center;padding:22px 0;border-bottom:1px solid var(--rule)}
.trio .pn{font-size:2.6rem;font-weight:800;line-height:1;color:var(--accent)}
.trio h3{font-size:clamp(1.1rem,2vw,1.35rem);font-weight:700;letter-spacing:-.01em;line-height:1.25}
.trio .meta{color:var(--ink-3);font-size:.92rem;margin-top:4px}
.diff{display:inline-flex;align-items:center;gap:10px;font-size:.88rem;font-weight:600;color:var(--ink-2)}
.diff i{display:inline-flex;gap:3px}
.trio .diff{flex-direction:row-reverse;justify-self:end}
[hidden]{display:none!important}
.diff i b{width:6px;height:16px;background:var(--rule);border-radius:1px}
.diff[data-l="1"] i b:nth-child(-n+1),.diff[data-l="2"] i b:nth-child(-n+2),.diff[data-l="3"] i b:nth-child(-n+3){background:var(--accent)}
.trio.swap li{animation:swapIn .5s var(--ease) both}
.trio.swap li:nth-child(2){animation-delay:.06s}.trio.swap li:nth-child(3){animation-delay:.12s}
@keyframes swapIn{from{opacity:0;transform:translateX(-14px)}}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:26px}
.actions .hint{color:var(--ink-3);font-size:.9rem;margin-left:4px}
.resume{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:32px;padding:20px 22px;border:1.5px solid var(--accent);border-radius:var(--r-panel);background:var(--accent-tint)}
.resume b{display:block;font-size:1.05rem}
.resume span{color:var(--ink-2);font-size:.92rem}
.history{margin-top:64px}
.history h2{font-size:1.35rem;margin-bottom:14px}
.htable{width:100%;border-collapse:collapse;font-size:.94rem}
.htable th{text-align:left;font-weight:600;color:var(--ink-3);font-size:.85rem;padding:0 12px 10px 0;border-bottom:2px solid var(--rule-strong)}
.htable td{padding:13px 12px 13px 0;vertical-align:top}
.htable tbody tr+tr td{border-top:1px solid var(--rule)}
.htable .band{font-weight:800;font-size:1.05rem}
.htable .pas{color:var(--ink-3)}
.empty{color:var(--ink-3);padding:18px 0;border-top:1px solid var(--rule)}

/* ---------- test ---------- */
#screen-test{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.tbar{display:flex;align-items:stretch;gap:12px;height:60px;padding:0 clamp(10px,2vw,24px);border-bottom:1px solid var(--rule);background:var(--surface)}
.tabs{position:relative;display:flex;align-items:stretch;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tab{position:relative;display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:600;color:var(--ink-3);white-space:nowrap;transition:color .2s}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink)}
.tab small{font-weight:500;color:var(--ink-3);font-size:.82rem}
.tab-line{position:absolute;bottom:0;height:3px;background:var(--accent);transition:transform .4s var(--ease),width .4s var(--ease);left:0;width:0}
.tools{display:flex;align-items:center;gap:6px}
.sq{width:36px;height:36px;border:1px solid var(--rule);border-radius:var(--r-ctl);font-weight:700;font-size:.85rem;color:var(--ink-2);transition:border-color .2s,color .2s,transform .12s}
.sq:hover{border-color:var(--ink);color:var(--ink)}
.sq:active{transform:scale(.94)}
.timer{display:flex;align-items:center;gap:8px;padding:0 4px 0 10px;font-weight:800;font-size:1.25rem;letter-spacing:.01em}
.timer small{font-size:.75rem;font-weight:600;color:var(--ink-3)}
.timer.warn{color:var(--warn)}
.timer.danger{color:var(--bad)}
.timer.over{color:var(--bad)}
.timer.over small{color:var(--bad)}
.timer.bump{animation:bump .5s var(--ease)}
@keyframes bump{30%{transform:scale(1.12)}}
.tbar .btn{align-self:center}
.homebtn{flex:none}
.mswitch{display:none}
.split{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0}
.pane{overflow-y:auto;min-height:0;overscroll-behavior:contain}
.pane-in{max-width:740px;margin:0 auto;padding:clamp(22px,3.4vw,44px) clamp(18px,3.4vw,44px) 96px}
.ppane{background:var(--surface);border-right:1px solid var(--rule)}
.ppane .pane-in{font-size:var(--pfs);font-weight:400;line-height:1.72;color:var(--ink)}
.ptitle{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(1.5rem,2.6vw,2.1rem);line-height:1.1;margin:0 0 .3em}
.pmeta{font-family:"Bricolage Grotesque",sans-serif;font-size:.88rem;color:var(--ink-3);margin-bottom:1.6em;display:flex;gap:14px;align-items:center}
.passage p{margin:0 0 1em}
.passage h1:not(.ptitle),.passage h2:not(.ptitle),.passage h3,.passage h4{font-family:"Bricolage Grotesque",sans-serif;font-size:1.05rem;margin:1.4em 0 .5em}
.tbl{overflow-x:auto;margin:1em 0}
.passage table,.qb table{border-collapse:collapse;width:100%;font-family:"Bricolage Grotesque",sans-serif;font-size:.92rem}
.passage td,.passage th,.qb td,.qb th{border:1px solid var(--rule);padding:8px 10px;vertical-align:top;text-align:left}
.qb th{background:var(--sunk)}
.qb img,.passage img{max-width:100%;height:auto;display:block;margin:12px 0;border:1px solid var(--rule);background:#fff}
.swapin{animation:paneIn .4s var(--ease) both}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}}
.qsec{padding-top:22px;margin-top:30px;border-top:2px solid var(--rule-strong)}
.qsec:first-child{margin-top:0}
.qsec h3{font-size:1rem;font-weight:800;margin-bottom:10px}
.qb{font-size:.98rem;color:var(--ink)}
.qb p{margin:.55em 0}
.qb ul,.qb ol{padding-left:1.2em}
.qb blockquote{margin:0}
.qitem{scroll-margin:120px;transition:background-color .6s}
.qitem.flash{background:var(--accent-tint)}
/* segmented control */
.seg{display:inline-flex;flex-wrap:wrap;margin:8px 0 6px;border-radius:var(--r-ctl)}
.seg button{position:relative;overflow:hidden;isolation:isolate;min-width:44px;height:38px;padding:0 14px;margin-left:-1px;border:1px solid var(--rule);background:var(--surface);font-weight:600;font-size:.86rem;color:var(--ink-2);transition:color .2s,border-color .2s,transform .12s}
.seg button:first-child{margin-left:0;border-radius:var(--r-ctl) 0 0 var(--r-ctl)}
.seg button:last-child{border-radius:0 var(--r-ctl) var(--r-ctl) 0}
.seg button::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--sunk);transform:scaleY(0);transform-origin:bottom;transition:transform .3s var(--ease)}
.seg button:hover::before{transform:scaleY(1)}
.seg button:hover{color:var(--ink);z-index:1}
.seg button:active{transform:scale(.95)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);z-index:2}
.seg button.on::before{display:none}
.ctl-block{display:flex}
/* text gaps */
.gap{display:inline-flex;align-items:baseline;gap:6px;margin:0 3px;vertical-align:baseline}
.gap-n{font-size:.72rem;font-weight:800;color:var(--accent-ink);background:var(--ink);padding:1px 5px;border-radius:2px;transform:translateY(-2px)}
:root[data-theme="dark"] .gap-n{background:var(--ink-2)}
.ans{width:4.5em;min-width:4.5em;max-width:100%;height:26px;padding:0 6px;border:0;border-bottom:2px solid var(--ink-3);background:transparent;font-weight:600;color:var(--accent);transition:border-color .2s,background-color .2s}
.ans:hover{border-bottom-color:var(--ink)}
.ans:focus{outline:none;border-bottom-color:var(--accent);background:var(--accent-tint)}
.ans.filled{border-bottom-color:var(--accent)}
.ans-line{display:flex;align-items:center;gap:8px;margin:6px 0}
/* select */
.sel{position:relative;display:inline-block;max-width:100%;margin:8px 0 6px}
.sel select{appearance:none;-webkit-appearance:none;max-width:min(560px,100%);height:40px;padding:0 2.4em 0 .8em;border:1px solid var(--rule);border-radius:var(--r-ctl);background:var(--surface);font-weight:600;font-size:.9rem;cursor:pointer;transition:border-color .2s}
.sel::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel select:hover{border-color:var(--ink)}
.sel select:focus{outline:none;border-color:var(--accent)}
.sel select.filled{border-color:var(--accent);color:var(--accent)}
/* multiple choice */
.mcq{margin:14px 0 10px}
.mcq-stem{font-weight:600;margin-bottom:8px;display:flex;gap:10px}
.mcq-stem b{flex:none;min-width:1.7em;font-weight:800;color:var(--accent)}
.opt{position:relative;overflow:hidden;isolation:isolate;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border:1px solid var(--rule);border-radius:var(--r-ctl);background:var(--surface);transition:border-color .2s,transform .12s}
.opt::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--sunk);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.opt:hover::before{transform:scaleX(1)}
.opt:hover{border-color:var(--ink-3)}
.opt:active{transform:scale(.99)}
.opt .l{flex:none;display:grid;place-items:center;width:26px;height:26px;border:1.5px solid var(--ink-3);border-radius:12px;font-weight:800;font-size:.8rem;transition:background-color .2s,border-color .2s,color .2s}
.opt.on{border-color:var(--accent)}
.opt.on::before{transform:scaleX(1);background:var(--accent-tint)}
.opt.on .l{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.nope{animation:nope .35s}
@keyframes nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mhead{display:flex;justify-content:space-between;font-size:.88rem;color:var(--ink-3);font-weight:600;margin:6px 0 2px}
.mhead .cnt{color:var(--accent)}
.qgrid{display:grid;gap:6px;margin-top:10px}
/* navigator */
.nav{display:flex;align-items:center;gap:14px;min-height:60px;flex:none;padding:0 clamp(10px,2vw,24px);border-top:1px solid var(--rule);background:var(--surface)}
.qnums{display:flex;gap:4px;overflow-x:auto;flex:1;padding:2px;scrollbar-width:thin}
.qn{flex:none;width:32px;height:32px;border:1px solid var(--rule);border-radius:12px;font-size:.8rem;font-weight:700;color:var(--ink-3);transition:background-color .2s,color .2s,border-color .2s,transform .12s}
.qn:hover{border-color:var(--ink);color:var(--ink)}
.qn:active{transform:scale(.92)}
.qn.done{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.prog{font-size:.88rem;font-weight:600;color:var(--ink-2);white-space:nowrap}
/* dialog + toasts */
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(10,12,16,.55);animation:fade .2s ease both}
@keyframes fade{from{opacity:0}}
.dialog{width:min(460px,100%);background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-panel);padding:26px;animation:dlg .35s var(--ease) both}
@keyframes dlg{from{opacity:0;transform:translateY(12px)}}
.dialog h3{font-size:1.35rem;margin-bottom:.4em}
.dialog p{color:var(--ink-2);margin:0 0 1.4em}
.dialog .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toasts{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:50;display:grid;gap:8px;width:min(420px,calc(100% - 24px))}
.toast{padding:12px 16px;border-radius:var(--r-panel);background:var(--ink);color:var(--bg);font-weight:600;font-size:.92rem;animation:tin .35s var(--ease) both}
.toast.warn{background:var(--warn);color:#fff}
.toast.out{animation:tout .25s ease forwards}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
@keyframes tout{to{opacity:0;transform:translateY(6px)}}
.preview-note{position:fixed;left:12px;bottom:72px;z-index:60;max-width:calc(100% - 24px);background:var(--ink);color:var(--bg);font-size:.8rem;font-weight:600;padding:6px 10px;border-radius:var(--r-panel);animation:tin .35s var(--ease) both}

/* ---------- results ---------- */
.results{max-width:1100px;margin:0 auto;padding:clamp(28px,5vw,64px) clamp(16px,4vw,48px) 96px}
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:end;padding-bottom:32px;border-bottom:2px solid var(--rule-strong)}
.bigband{font-size:clamp(5.5rem,14vw,9.5rem);font-weight:800;line-height:.82;letter-spacing:-.05em;color:var(--accent)}
.bandlabel{font-weight:700;margin-top:14px}
.score h1{font-size:clamp(1.6rem,3.2vw,2.3rem);line-height:1.1;margin-bottom:.5em}
.score p{color:var(--ink-2);margin:0 0 .4em;max-width:58ch}
.facts{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:14px;font-size:.95rem}
.facts span{color:var(--ink-3)}
.facts b{color:var(--ink)}
.facts .over b{color:var(--bad)}
.mail{margin-top:16px;font-size:.92rem;font-weight:600}
.mail.ok{color:var(--ok)}.mail.bad{color:var(--bad)}.mail.wait{color:var(--ink-3)}
.save{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;padding:26px 0;border-bottom:1px solid var(--rule)}
.save .txt{font-size:.92rem;color:var(--ink-2);max-width:56ch;margin-bottom:14px}
.save .txt b{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px;word-break:break-all}
.thumbwrap{display:block;width:96px;height:130px;border:1px solid var(--rule);background:var(--sunk);overflow:hidden;pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.save .thumb{display:block;width:100%;opacity:0;transition:opacity .4s var(--ease),transform .25s var(--ease)}
.save.ready .thumb{opacity:1}
@media (max-width:560px){.save{grid-template-columns:auto minmax(0,1fr);gap:16px}.thumbwrap{width:72px;height:98px}.save .btn{width:100%}}
.maps{margin-top:34px;display:grid;gap:18px}
.map{display:grid;grid-template-columns:minmax(0,260px) 90px minmax(0,1fr);gap:16px;align-items:center}
.map .t{font-weight:700;line-height:1.3}
.map .t small{display:block;font-weight:500;color:var(--ink-3);font-size:.85rem}
.map .s{font-size:1.4rem;font-weight:800}
.map .s small{font-size:.9rem;color:var(--ink-3);font-weight:600}
.cells{display:flex;flex-wrap:wrap;gap:4px}
.cell{width:26px;height:26px;border-radius:12px;font-size:.7rem;font-weight:700;display:grid;place-items:center;transition:transform .15s;animation:cellIn .4s var(--ease) both}
.cell:hover{transform:scale(1.12)}
.cell.correct{background:var(--ok);color:var(--surface)}
.cell.wrong{background:var(--bad);color:var(--surface)}
.cell.blank{background:var(--skip-tint);color:var(--skip);border:1.5px dashed var(--skip)}
@keyframes cellIn{from{opacity:0;transform:scale(.6)}}
.filter{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:52px 0 6px}
.filter h2{font-size:1.5rem;margin-right:auto}
.key{display:flex;gap:14px;font-size:.84rem;color:var(--ink-3);font-weight:600}
.key span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.key .k1::before{background:var(--ok)}.key .k2::before{background:var(--bad)}.key .k3::before{border:1.5px dashed var(--skip)}
.ptext{margin:0 0 14px;border:1px solid var(--rule);border-radius:var(--r-panel);background:var(--surface)}
.ptext summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;font-weight:700;transition:background-color .2s}
.ptext summary::-webkit-details-marker{display:none}
.ptext summary:hover{background:var(--sunk)}
.ptext summary .chev{width:10px;height:10px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg) translateY(-3px);transition:transform .3s var(--ease)}
.ptext[open] summary .chev{transform:rotate(225deg) translateY(-3px)}
.ptext summary small{font-weight:500;color:var(--ink-3);font-size:.86rem;margin-left:8px}
.ptext .rp{padding:4px 22px 22px;font-size:1.02rem;line-height:1.75;max-height:70vh;overflow-y:auto;border-top:1px solid var(--rule)}
.ptext[open] .rp{animation:paneIn .35s var(--ease) both}
.rp p{margin:0 0 1em}
mark.clue{background:#ffe57a;color:#16181d;padding:1px 0;border-radius:1px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cn{display:inline-block;margin:0 3px 0 1px;padding:0 4px;font-size:.78em;font-weight:800;line-height:1.35;color:#16181d;background:#ffd23f;border-radius:2px;cursor:pointer;vertical-align:1px;transition:transform .15s}
.cn:hover{transform:translateY(-1px)}
.cn.flash,mark.clue.flash{outline:3px solid var(--accent);outline-offset:1px}
.findbtn{margin-top:10px;font-size:.88rem}
.rpart h3{font-size:1.15rem;margin:36px 0 12px;display:flex;gap:12px;align-items:baseline}
.rpart h3 small{font-size:.88rem;color:var(--ink-3);font-weight:600}
.ritem{padding:16px 18px;margin-bottom:8px;border:1px solid;border-radius:var(--r-panel);scroll-margin:24px;animation:paneIn .4s var(--ease) both}
.ritem.correct{background:var(--ok-tint);border-color:var(--ok-rule)}
.ritem.wrong{background:var(--bad-tint);border-color:var(--bad-rule)}
.ritem.blank{background:var(--skip-tint);border-color:var(--skip-rule)}
.ritem.flash{animation:flashItem 1.2s var(--ease)}
@keyframes flashItem{0%,40%{outline:3px solid var(--accent);outline-offset:2px}100%{outline:3px solid transparent;outline-offset:2px}}
.rh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.rh b{font-weight:800}
.rh .v{font-weight:700;font-size:.92rem}
.correct .v{color:var(--ok)}.wrong .v{color:var(--bad)}.blank .v{color:var(--skip)}
.rh .ty{color:var(--ink-3);font-size:.84rem}
.rq{font-weight:500;margin:2px 0 10px}
.ra{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:.94rem;margin-bottom:8px}
.ra span{color:var(--ink-2)}
.ra b{color:var(--ink)}
.rx{font-size:.93rem;color:var(--ink-2)}
.rx q{display:block;margin:8px 0 0;padding-left:16px;font-size:1rem;font-weight:500;color:var(--ink);quotes:"\201C" "\201D"}
.rx .note{display:block;margin-top:6px;font-size:.88rem;color:var(--ink-3)}
.end{display:flex;gap:12px;margin-top:40px}

.skills{display:flex;align-self:stretch;gap:2px;margin-left:6px}
.skills a{display:flex;align-items:center;padding:0 12px;font-weight:700;font-size:.95rem;color:var(--ink-3);text-decoration:none;border-bottom:3px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .25s}
.skills a:hover{color:var(--ink)}
.skills a.on{color:var(--ink);border-bottom-color:var(--accent)}
a.wordmark{color:var(--ink);text-decoration:none}
.newonly{margin-top:24px;display:grid;gap:6px}
.check{position:relative;display:inline-flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;width:fit-content;max-width:100%}
.check input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.check .box{width:20px;height:20px;border:1.5px solid var(--ink-2);border-radius:12px;display:grid;place-items:center;flex:none;transition:background-color .2s,border-color .2s}
.check .box::after{content:'';width:10px;height:5px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg);opacity:0;transition:opacity .15s}
.check input:checked+.box{background:var(--accent);border-color:var(--accent)}
.check input:checked+.box::after{opacity:1}
.check input:focus-visible+.box{outline:2px solid var(--accent);outline-offset:2px}
.check input:disabled~*{opacity:.45}
.check:has(input:disabled){cursor:not-allowed}
.newonly .note{color:var(--ink-3);font-size:.9rem;margin:0;max-width:62ch}
.hhead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:14px}
.history .hhead h2{margin:0}
.htable .rm{text-align:right;white-space:nowrap;padding-right:0;width:1%}
.rmbtn{font-size:.85rem;font-weight:600;color:var(--ink-3);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;transition:color .2s}
.rmbtn:hover{color:var(--bad)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:900px){
  .welcome{grid-template-columns:1fr}
  .welcome-aside{display:none}
  .split{grid-template-columns:1fr}
  .split .pane{grid-area:1/1}
  .split[data-view="passage"] .qpane,.split[data-view="questions"] .ppane{visibility:hidden;pointer-events:none}
  .ppane{border-right:0}
  .mswitch{display:flex;border-bottom:1px solid var(--rule);background:var(--surface)}
  .mswitch button{flex:1;height:44px;font-weight:700;color:var(--ink-3);border-bottom:3px solid transparent;transition:color .2s,border-color .3s var(--ease)}
  .mswitch button.on{color:var(--ink);border-bottom-color:var(--accent)}
  .tbar{flex-wrap:wrap;height:auto;padding-top:8px;gap:8px}
  .tabs{order:5;flex-basis:100%;height:46px}
  .tools{margin-right:auto}
  .tbl table{min-width:540px}
  .map{grid-template-columns:minmax(0,1fr) auto}
  .map .cells{grid-column:1/-1}
  .score{grid-template-columns:1fr;align-items:start}
  .trio li{grid-template-columns:48px minmax(0,1fr);gap:14px}
  .trio .pn{font-size:2rem}
  .trio .diff{grid-column:2}
}
@media (max-width:560px){
  .bar .who{display:none}
  .tools .fs{display:none}
  .timer{font-size:1.1rem}
  .timer small{display:none}
  .tab{padding:0 10px}
  .tab small{display:none}
  .htable .pas{display:none}
  .nav .prog{display:none}
  .actions .btn{flex:1}
  .actions .hint{flex-basis:100%;margin:0}
}
@media (max-width:560px){.wordmark span{display:none}.skills a{padding:0 9px}.skills{margin-left:0}}
@media (max-width:720px){.bar .skills{flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}.bar .skills::-webkit-scrollbar{display:none}.bar .skills a{flex:none}.bar .spacer{display:none}.bar .who{display:none}}
@media (max-width:440px){.bar a.wordmark{display:none}.skills a{padding:0 8px;font-size:.9rem}}
@media (max-width:400px){#screen-results .skills{display:none}}
@media (max-width:400px){
  .tbar{gap:6px;padding-left:8px;padding-right:8px}
  .tbar .btn-primary{height:38px;padding:0 .75em}
  .tbar .homebtn,.tbar .theme-btn{padding:0 .6em}
  .timer{padding:0 2px;font-size:1.05rem}
  .tools{gap:6px}
  .bar{gap:8px}
}
/* ---------- modern layer: blue + sun, minimal, motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes hl{to{background-size:100% var(--hl,.1em)}}
@keyframes grow{from{transform:scaleY(.15)}}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,24px)}}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(14px,-18px) rotate(12deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes sheen{from{background-position:-200% 0}to{background-position:200% 0}}
::selection{background:var(--sun);color:var(--sun-ink)}
*{scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
h1,h2,h3{letter-spacing:-.03em}
/* header */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.wordmark{display:inline-flex;align-items:center;gap:6px}
.wordmark span{background:var(--sun);color:var(--sun-ink);padding:2px 10px;border-radius:999px;transition:transform .4s var(--smooth)}
a.wordmark:hover span,.wordmark:hover span{transform:scale(1.04)}
.theme-btn{border-radius:999px;padding:0 1em}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
.skills{gap:4px;align-items:center;margin-left:10px}
.skills a{position:relative;height:36px;padding:0 14px;border:0;margin:0;border-radius:999px;transition:color .25s,background-color .25s,transform .4s var(--smooth)}
.skills a:hover{background:var(--sunk);transform:translateY(-1px)}
.skills a.on{background:var(--ink);color:var(--bg)}
.skills a.on::after{content:"";position:absolute;right:9px;top:7px;width:6px;height:6px;border-radius:50%;background:var(--sun);animation:pop .5s var(--smooth) both}
/* buttons */
.btn{border-radius:999px;height:46px;padding:0 1.5em;transition:transform .4s var(--smooth),color .25s,border-color .25s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn-primary{}
.btn-primary::before{background:var(--sun)}
.btn-primary:hover{color:var(--sun-ink)}
.btn-line{border:1.5px solid var(--ink-3)}
.btn-line::before{background:var(--sun)}
.btn-line:hover{color:var(--sun-ink);border-color:var(--sun)}
.btn-quiet{height:38px;border-color:var(--rule)}
.btn-quiet::before{background:var(--sun-tint)}
.btn-quiet:hover{border-color:var(--sun)}
.textbtn{text-decoration-color:var(--sun);text-decoration-thickness:2px}
/* forms */
.field input{border-radius:12px;height:54px;transition:border-color .2s}
.field input:focus{outline:3px solid var(--accent-tint)}
.ans{border-radius:12px 12px 0 0}
.ans:focus{background:var(--sun-tint)}
.sel select{border-radius:999px;padding-left:1.1em}
.sel select:focus{outline:3px solid var(--accent-tint)}
.check .box{border-radius:12px;transition:background-color .2s,border-color .2s,transform .4s var(--smooth)}
.check input:checked+.box{transform:scale(1.04)}
.check:hover .box{border-color:var(--accent)}
/* welcome */
.welcome-main h1{font-size:clamp(2.4rem,4.8vw,3.8rem);letter-spacing:-.04em}
.welcome-main h1,.hub h1,.home h1{background:linear-gradient(var(--sun),var(--sun)) no-repeat 0 100%/0 .1em;--hl:.1em;padding-bottom:.16em;animation:hl .9s .35s var(--ease) forwards;width:fit-content;max-width:100%}
.welcome-main>*{animation:rise .7s var(--ease) both}
.welcome-main>h1{animation:rise .7s var(--ease) both,hl .9s .35s var(--ease) forwards}
.welcome-main>p{animation-delay:.08s}.welcome-main>form{animation-delay:.16s}
.welcome-aside{position:relative;overflow:hidden;border-left:0;background:var(--surface)}
.welcome-aside::before{content:"";position:absolute;top:-70px;right:-70px;width:260px;height:260px;border-radius:50%;background:var(--sun);opacity:.9;animation:float 11s ease-in-out infinite}
.welcome-aside::after{content:"";position:absolute;bottom:-60px;left:-40px;width:200px;height:200px;border-radius:44% 56% 52% 48%;background:var(--accent-tint);animation:drift 13s ease-in-out infinite}
.welcome-aside>*{position:relative;z-index:1;animation:rise .8s .2s var(--ease) both}
.sample{background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:22px;border-radius:var(--r-panel);border:1px solid var(--rule)}
.sample .src mark,.rp mark{background:var(--sun);color:var(--sun-ink);border-radius:12px;padding:0 4px}
/* home lists */
.trio{border-top:0;margin-top:30px}
.trio li{padding:20px 18px;border-bottom:0;border-radius:var(--r-panel);transition:background-color .3s,transform .4s var(--smooth);animation:rise .7s var(--ease) both}
.trio li:nth-child(2){animation-delay:.07s}.trio li:nth-child(3){animation-delay:.14s}
.trio li+li{margin-top:6px}
.trio li:hover{background:var(--surface);transform:translateX(4px);}
.trio .pn{justify-self:start;background:linear-gradient(var(--sun),var(--sun)) no-repeat 0 100%/0 .12em;--hl:.12em;padding-bottom:.1em;animation:hl .8s .45s var(--ease) forwards;transition:transform .5s var(--smooth)}
.trio li:hover .pn{transform:scale(1.05)}
.diff i b{width:7px;border-radius:99px;transform-origin:bottom;animation:grow .6s var(--ease) both}
.diff i b:nth-child(2){animation-delay:.08s}.diff i b:nth-child(3){animation-delay:.16s}
.resume{border-color:var(--sun);background:var(--sun-tint);border-width:2px;border-radius:var(--r-panel);animation:rise .6s var(--ease) both}
.htable th{border-bottom:1px solid var(--rule)}
.htable tbody tr{transition:background-color .2s}
.htable tbody tr:hover td{background:var(--sunk)}
.htable tbody td:first-child{padding-left:10px;border-radius:12px 0 0 12px}.htable tbody td:last-child{border-radius:0 12px 12px 0}
.htable .band{color:var(--accent)}
.empty{border-top:0;border-radius:var(--r-panel);background:var(--surface);padding:22px;text-align:center}
/* hub + page-specific (prefixed to win over page css) */
html body .skill{position:relative;overflow:hidden;border:1px solid var(--rule);border-top:1px solid var(--rule);border-radius:12px;animation:rise .7s var(--ease) both;transition:transform .5s var(--smooth),border-color .3s}
html body .skill:nth-child(2){animation-delay:.07s}html body .skill:nth-child(3){animation-delay:.14s}html body .skill:nth-child(4){animation-delay:.21s}
html body .skill>*{position:relative;z-index:1}
html body .skill::before{content:"";position:absolute;right:-46px;top:-46px;width:130px;height:130px;border-radius:50%;background:var(--sun);transform:scale(.8);transition:transform .6s var(--smooth)}
html body .skill:nth-child(even)::before{background:var(--accent);opacity:.9}
html body .skill:hover{transform:translateY(-4px);border-color:var(--accent)}
html body .skill:hover::before{transform:scale(1.35)}
html body .skill h2{font-size:clamp(1.7rem,2.8vw,2.3rem);letter-spacing:-.035em}
html body .skill .status{color:var(--accent)}
html body .wprompt,html body .cue{position:relative;border:1px solid var(--rule);border-radius:var(--r-panel);background:var(--surface);padding:22px 24px 22px 32px}
html body .wprompt::before,html body .cue::before{content:"";position:absolute;left:13px;top:20px;bottom:20px;width:4px;border-radius:12px;background:var(--sun)}
html body .wfig{border-radius:var(--r-panel)}
html body .docicon{border-radius:12px}
html body .essay,html body .notes{border-radius:var(--r-panel)}
html body .essay:focus,html body .notes:focus{outline:3px solid var(--accent-tint)}
html body .recbar{border-radius:var(--r-panel)}
html body .meter{border-radius:99px}
html body .meter i{border-radius:99px}
html body .recbar.on{border-color:var(--bad);animation:pulse 1.6s infinite}
html body .steps span{border:0;border-radius:999px;margin:12px 2px;padding:0 14px}
html body .steps span.on{background:var(--ink);color:var(--bg)}
html body .stamps button{border-radius:12px}
html body .stamps button:hover{background:var(--sun-tint)}
html body .pbtn{border-radius:999px}
html body .pbtn.play{}
html body .pbtn.play:hover{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
html body .pjump button{border-radius:999px}
html body .seek input[type=range]::-webkit-slider-thumb{background:var(--sun);border:3px solid var(--accent);width:18px;height:18px;margin-top:-6px}
html body .seek input[type=range]::-moz-range-thumb{background:var(--sun);border:3px solid var(--accent)}
html body .endnote{background:var(--sun-tint);border-bottom-color:transparent}
html body .review-audio{border-radius:var(--r-panel)}
html body .parthead{letter-spacing:-.035em}
html body .parthead::before{content:"";display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--sun);margin-right:.45em;vertical-align:.08em}
/* test screen */
.tab{border-radius:12px 12px 0 0;transition:color .2s,background-color .25s}
.tab:hover{background:var(--sunk)}
.tab.active{font-weight:800}
.tab-line{height:4px;border-radius:12px 12px 0 0}
.sq{border-radius:50%;transition:border-color .2s,color .2s,transform .4s var(--smooth),background-color .2s}
.sq:hover{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);transform:scale(1.06)}
.timer{padding:0 14px;margin:9px 0;background:var(--sunk);border-radius:999px;transition:background-color .3s,color .3s}
.timer.warn{background:var(--sun-tint)}
.timer.danger{background:var(--bad-tint);animation:pulse 1.4s infinite}
.timer.over{background:var(--bad-tint)}
.qsec{border-top:1px solid var(--rule);padding-top:26px}
.qsec:first-child{border-top:0;padding-top:0}
.qsec h3{display:flex;align-items:center;gap:.6em}
.qsec h3::before{content:"";flex:none;width:.9em;height:.32em;border-radius:99px;background:var(--sun)}
.qitem.flash{background:var(--sun-tint);border-radius:12px}
.seg button{transition:color .2s,border-color .2s,background-color .25s,transform .4s var(--smooth)}
.seg button:first-child{border-radius:999px 0 0 999px;padding-left:18px}
.seg button:last-child{border-radius:0 999px 999px 0;padding-right:18px}
.seg button::before{background:var(--sun-tint)}

.tchip{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1.5px solid var(--rule);border-radius:var(--r-ctl);background:var(--surface);color:var(--ink-2);font-weight:600;font-size:.94rem;cursor:pointer;user-select:none;transition:background-color .2s,border-color .2s,color .2s}
.tchip input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.tchip .tick{width:16px;height:16px;border:1.5px solid var(--ink-3);border-radius:5px;display:grid;place-items:center;flex:none;transition:background-color .2s,border-color .2s}
.tchip .tick::after{content:'';width:8px;height:4px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg);opacity:0;transition:opacity .15s}
.tchip .n{color:var(--ink-3);font-weight:500;font-size:.85rem}
.tchip:hover{border-color:var(--ink-3);color:var(--ink)}
.tchip:has(input:checked){border-color:var(--accent);background:var(--accent-tint);color:var(--ink)}
.tchip input:checked+.tick{background:var(--accent);border-color:var(--accent)}
.tchip input:checked+.tick::after{opacity:1}
.tchip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.ptypes .tnote{margin:0;max-width:62ch;font-size:.9rem;color:var(--ink-3)}
.ptypes .tnote.bad{color:var(--bad);font-weight:600}
.trio li.empty-task h3{color:var(--ink-3)}
@media (max-width:599px){.tchip{min-height:44px}}

/* lift + solid drop shadow on hover: cards, buttons, checkboxes */
:root{--card-shadow:var(--ink)}
:root[data-theme="dark"]{--card-shadow:#000}
html body .skillgrid .skill{border-top:1px solid var(--rule)!important}
html body .skillgrid .skill,html body .btn,html body .theme-btn,html body .pbtn,html body .check,html body .check .box{box-shadow:0 0 0 0 var(--card-shadow);transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s cubic-bezier(.22,1,.36,1),color .25s ease-out,background-color .25s ease-out,border-color .25s ease-out!important}
@media (hover:hover){
html body .skillgrid .skill:hover,html body .btn:not(:disabled):hover,html body .theme-btn:hover,html body .pbtn:not(:disabled):hover{transform:translateY(-3.6px)!important}
html body .skillgrid .skill:hover,html body .btn:not(:disabled):hover,html body .theme-btn:hover,html body .pbtn:not(:disabled):hover{box-shadow:0 4px 0 0 var(--card-shadow)}
html body .skillgrid .skill:hover{border-color:var(--ink)!important}
}
@media (prefers-reduced-motion:reduce){html body .skillgrid .skill:hover,html body .btn:hover,html body .theme-btn:hover,html body .pbtn:hover,html body .check:hover{transform:none!important}}

/* hover fill fades in (no sweep); shortcut hints */
html body .btn::before,html body .opt::before,html body .seg button::before{transform:none!important;opacity:0;transition:opacity .25s ease-out!important}
html body .btn:hover::before,html body .opt:hover::before,html body .opt.on::before,html body .seg button:hover::before{opacity:1}
html body .btn .kbd{display:inline-flex;align-items:center;height:1.45em;padding:0 .4em;margin-left:.15em;border:1px solid currentColor;border-radius:4px;font-size:.68em;font-weight:600;letter-spacing:.02em;opacity:.6;line-height:1}
@media (hover:none){html body .btn .kbd{display:none}}

/* sound toggle */
@media (max-width:900px){html body .tbar .sound-btn{display:none}}
@media (hover:none),(pointer:coarse){html body .sound-btn{display:none}}

/* Task 2 instruction line: own line, highlighter sweep */
html body .trio .winstr{margin-top:6px}
html body .wprompt .winstr{margin-top:.7em}
.hl{background-image:linear-gradient(var(--sun),var(--sun));background-repeat:no-repeat;background-position:0 0;background-size:0% 100%;color:var(--sun-ink);padding:0 .12em;margin:0 -.12em;border-radius:2px;animation:hlsweep .75s cubic-bezier(.22,1,.36,1) .25s forwards}
@keyframes hlsweep{to{background-size:100% 100%}}
@media (prefers-reduced-motion:reduce){.hl{animation:none;background-size:100% 100%}}

<script>
(() => {
'use strict';
const DATA = [{"id":"W1-LG-01","task":1,"type":"Line graph","prompt":["The graph below shows the number of overseas visitors to three different areas in a European country between 1987 and 2007.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-LG-01-1.jpg","w":1024,"h":554}],"models":[["The line graph shows how many overseas visitors went to three different areas of a European country, the coast, the mountains and the lakes, between 1987 and 2007.","Overall, the number of overseas visitors to all three areas was higher at the end of the period than at the start. The coast was the most popular destination in most years, while the lakes saw the most dramatic changes, rising from last place to first before falling back sharply.","The coast attracted the most visitors at the beginning of the period, at around 40,000 in 1987. After a slight fall to 35,000 in 1992, the number of visitors rose steadily, reaching about 50,000 in 1997 and 62,000 in 2002, and it peaked at around 75,000 in 2007, by which time the coast had regained first place. The mountains, by contrast, saw slow but steady growth throughout, from 20,000 visitors in 1987 to about 30,000 in 1997 and 35,000 in 2007.","The lakes followed a very different path. They were the least visited area in 1987, with only about 10,000 overseas visitors, but this figure rose rapidly, overtaking the mountains in 1992 and reaching 40,000 in 1997. Growth then accelerated further, and the lakes overtook the coast shortly after 1997 to become the most popular area, with a peak of about 75,000 visitors in 2002. Over the final five years, however, the number of visitors to the lakes fell to around 50,000, although this was still five times the 1987 figure."]]},{"id":"W1-LG-02","task":1,"type":"Line graph","prompt":["The graph below shows the number of enquiries received by the Tourist Information Office in one city over a six-month period in 2011.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-LG-02-1.jpg","w":1024,"h":572}],"models":[["The line graph shows the number of enquiries that a Tourist Information Office in one city received in person, by telephone and by letter or email in each month from January to June 2011.","Overall, enquiries made in person and by telephone both increased considerably over the six months, whereas those sent by letter or email declined. It is also clear that in-person enquiries grew the fastest, changing from the least common method in January to the most common by June.","At the start of the period, telephone was the most popular way of contacting the office, with around 900 enquiries in January, compared with 750 by letter or email and only about 400 in person. Telephone enquiries dipped slightly to 800 in February, but then rose to 1,000 in March and remained at this level in April. They increased sharply over the final two months, reaching approximately 1,600 in June.","In-person enquiries rose steadily at first, to 600 in February and 800 in March, overtaking letters and emails. They then jumped to about 1,300 in April, surpassing the telephone figure, and continued to climb to roughly 1,900 in June, almost five times the January figure. Enquiries by letter or email, by contrast, changed little in the first three months, staying at just over 700, before falling to about 550 in April and 350 in May. This figure remained unchanged in June, by which time it was less than a fifth of the number of enquiries made in person."]]},{"id":"W1-LG-03","task":1,"type":"Line graph","prompt":["The line chart below shows the results of a survey giving the reasons why people moved to the capital city of a particular country.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-LG-03-1.jpg","w":1050,"h":980}],"models":[["The line graph shows the results of a survey into why people moved to the capital city of a particular country, giving the number of people who moved for each of four reasons between 2000 and 2015.","Overall, the number of people moving to the capital increased for all four reasons, with employment and study being far more common motivations than family or friends and adventure. It is also clear that study grew most dramatically, drawing level with employment by the end of the period.","Employment was the leading reason for moving throughout the period. Around 61,000 people moved to the capital for work in 2000, and this figure rose sharply to about 85,000 in 2005 and peaked at roughly 92,000 in 2010, before falling slightly to 87,000 in 2015. The number of people moving to study started at only 25,000 but almost doubled to 47,000 over the next five years. After slower growth to about 54,000 in 2010, it then surged to 87,000 in 2015, matching the figure for employment.","The other two reasons accounted for far fewer migrants. In 2000, about 12,000 people moved to be near family or friends and 11,000 for adventure. The number moving for family or friends rose only slightly to 14,000 in 2005, before increasing more noticeably to around 22,000 in 2010 and 23,000 in 2015. Adventure, by contrast, grew very slowly and steadily throughout, reaching just 15,000 by the end of the period, the lowest figure of the four."]]},{"id":"W1-LG-04","task":1,"type":"Line graph","prompt":["The graph below shows average coffee consumption per person, in kilograms per year, in three countries between 1990 and 2020.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-LG-04-1.jpg","w":1400,"h":776}],"models":[["The line graph compares average annual coffee consumption per person, in kilograms, in three countries between 1990 and 2020.","Overall, coffee consumption rose considerably in all three countries, with Countries A and B ending the period level as the highest consumers. However, while consumption in Country A grew steadily throughout, Country B’s figures fluctuated dramatically, and Country C’s growth levelled off after 2004.","Countries A and C both saw continuous growth for most of the period. In 1990, the average person in Country A consumed about 3 kilograms of coffee, slightly more than in Country C, at 2 kilograms. Consumption then rose faster in Country C, reaching about 6 kilograms in 1997 and 9 kilograms in 2004, compared with 5 and 7.5 kilograms in Country A. After 2004, however, Country C’s figure remained almost unchanged at around 9.5 kilograms, whereas Country A’s continued to climb, drawing level with Country C in 2011 and reaching 11 kilograms in 2020.","Country B followed a very different pattern. It began as the largest consumer, at 8 kilograms per person, four times the figure for Country C. Consumption then halved to 4 kilograms in 1997, the lowest of the three countries, before rebounding to a peak of 10 kilograms in 2004. This pattern was repeated in the following years, as the figure fell back to 5 kilograms in 2011 and then more than doubled to 11 kilograms in 2020, matching Country A."]]},{"id":"W1-LG-05","task":1,"type":"Line graph","prompt":["The line graph shows the number of immigrants to 3 different countries (USA,Canada, Australia) from 1991 to 2001.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-LG-05-1.jpg","w":1024,"h":765}],"models":[["The line graph illustrates how many immigrants arrived in three countries, the USA, Canada and Australia, between 1991 and 2001.","Overall, the USA saw a steady rise in immigration and became the leading destination by the end of the period, whereas Australia went from first to last after a sharp fall in the early 1990s. Canada, by contrast, fluctuated considerably, with a dramatic but short-lived peak in 1995.","In 1991, Australia received by far the most immigrants, at around 2,700, more than twice the figure for the USA. However, its numbers then plummeted, dropping below both other countries by 1994 and reaching approximately 500 in 1995, where they remained unchanged for the rest of the decade. The USA followed the opposite path, climbing steadily from about 1,100 to roughly 2,500 by 2000, before levelling off in the final year.","Canada showed the most erratic pattern of the three. Starting from just 500 in 1991, its figure rose sharply to a peak of around 2,300 in 1995, briefly overtaking the USA to become the most popular destination. This was followed by an equally steep drop to about 1,100 the next year, a level it held until 1999. Immigration to Canada then picked up again, finishing at approximately 1,600 in 2001, still well below the USA but over three times the figure for Australia."]]},{"id":"W1-LG-06","task":1,"type":"Line graph","prompt":["The graph gives information about male and female gym membership between 1980 and 2010.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-LG-06-1.jpg","w":1284,"h":1400}],"models":[["The line graph illustrates the number of men and women who held gym memberships between 1980 and 2010.","Overall, membership numbers for both sexes fluctuated considerably, but the changes were far more dramatic for men, whose figure reached two peaks before collapsing at the end of the period. Women’s membership, by contrast, followed a gentler pattern and finished at almost twice its 1980 level, well above that of men.","In 1980, around 2,100 men had gym memberships, double the figure for women, at about 1,050. Both figures rose over the next few years, with male membership peaking at roughly 4,000 in 1985 and female membership reaching about 1,900. However, the number of male members then fell sharply, dropping below that of women in the early 1990s and bottoming out at about 1,700 between 1995 and 1997. Over the same period, female membership continued to rise, to a peak of almost 2,900 in 1995.","The final fifteen years brought even greater changes for men. Their membership surged after 1997, overtaking women’s again in about 2000 and reaching a high of 5,000 in 2005, the highest figure on the graph. It then plummeted, falling below the figure for women in around 2008 and ending at just over 600. Female membership, meanwhile, dipped to about 2,200 in 2000 before climbing back to around 2,900 in 2006 and then easing to roughly 1,900 by the end of the period."],["The line graph compares how many men and women were members of gyms over a thirty-year period from 1980 to 2010.","Overall, men’s gym membership was considerably more volatile than women’s, with two pronounced peaks and a steep final decline. Although men outnumbered women for most of the period, the positions were reversed at the end, as male membership dropped to its lowest point.","The figure for men was marked by two cycles of rapid growth and decline. From approximately 2,100 in 1980, it nearly doubled to 4,000 by 1985, before more than halving to about 1,700 in the mid-1990s. A second, larger rise followed, taking male membership to a peak of 5,000 in 2005. This was immediately followed by the most dramatic fall on the graph, as the number of male members dropped to only around 600 by 2010, less than a third of the 1980 figure.","Women’s membership, on the other hand, changed far more gradually. It rose from just over 1,000 in 1980 to about 1,900 in the late 1980s and then to a peak of roughly 2,900 in 1995, when it was considerably higher than men’s. After a dip to around 2,200 in 2000, the figure recovered to a similar peak in 2006 and finished at about 1,900. As a result, women’s membership ended the period roughly three times higher than men’s."]]},{"id":"W1-LG-07","task":1,"type":"Line graph","prompt":["The graph below shows consumers’ average annual expenditure on cell phone, national and international fixed-line and services in America between 2001 and 2010.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-LG-07-1.jpg","w":1037,"h":687}],"models":[["The line graph illustrates how much consumers in the USA spent on average each year on cell phone services and on national and international fixed-line services between 2001 and 2010.","Overall, spending on cell phone services rose dramatically, while spending on national fixed-line services fell steadily, with the two lines crossing in 2006. Expenditure on international fixed-line services, by contrast, changed very little and was the lowest of the three for most of the period.","In 2001, national fixed-line services accounted for the highest average expenditure, at about $700 a year. This figure declined in every year that followed, to roughly $600 in 2003 and $505 in 2006, before falling to $400 in 2010. Spending on cell phone services moved in the opposite direction. It started at only $200, the lowest figure on the graph, but increased every year, overtaking international fixed-line spending in 2003 and drawing level with national fixed-line spending at just over $500 in 2006. It then continued to climb, reaching about $740 by 2010, almost four times its original level.","Average spending on international fixed-line services remained relatively stable throughout. It rose slightly from around $260 in 2001 to a peak of about $330 in 2003, before settling at $300 for the next five years. It then edged up again to just over $310 by the end of the period, still well below the other two services."],["The line graph compares average annual consumer spending in the USA on three types of telephone service, cell phones, national fixed lines and international fixed lines, from 2001 to 2010.","Overall, cell phone services replaced national fixed-line services as the area of greatest expenditure over the decade. Meanwhile, spending on international fixed-line services remained almost unchanged at around $300, and by the end of the period it was the lowest of the three.","At the start of the period, national fixed-line services clearly dominated consumer spending, with an average of $700 a year, compared with about $260 for international fixed-line services and $200 for cell phone services. Over the next two years, cell phone spending rose sharply to around $310, while national fixed-line spending fell to $600. International fixed-line spending also increased briefly, peaking at about $330 in 2003, slightly above the figure for cell phones.","From 2003 onwards, the gap between the two leading services closed rapidly. Cell phone expenditure rose at an accelerating pace, reaching about $505 in 2006, the same level as national fixed-line spending, and continuing to grow to roughly $740 in 2010. National fixed-line spending, on the other hand, declined steadily to $400 by the end of the period. International fixed-line spending stayed at exactly $300 between 2004 and 2008 and rose only marginally to just over $310 in 2010."]]},{"id":"W1-LG-08","task":1,"type":"Line graph","prompt":["The graph below shows the carbon dioxide emission of the average person from 1967 to 2007.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-LG-08-1.jpg","w":1400,"h":863}],"models":[["The line graph compares average carbon dioxide emissions per person, in metric tonnes, in the United Kingdom, Sweden, Italy and Portugal at ten-year intervals between 1967 and 2007.","Overall, emissions per person fell in the United Kingdom and Sweden but rose in Italy and Portugal, so the gap between the four countries narrowed considerably. The United Kingdom had the highest emissions throughout, while Portugal had the lowest until it drew level with Sweden in 2007.","In 1967, the average person in the United Kingdom produced about 10.8 tonnes of carbon dioxide. This figure remained almost unchanged for ten years and then declined gradually, to 10 tonnes in 1987 and around 8.7 tonnes in 2007. Sweden’s emissions followed a more dramatic path. They rose from approximately 8.6 tonnes to a peak of about 10.3 tonnes in 1977, almost matching the UK, but then fell sharply to roughly 7.1 tonnes in 1987 and continued to decline to around 5.4 tonnes by 2007.","Italy and Portugal, by contrast, started with much lower emissions. Italy’s figure grew from about 4.3 tonnes per person in 1967 to 6.3 tonnes in 1977, and it overtook Sweden’s shortly after 1987, reaching about 7.6 tonnes in 1997, where it remained in 2007. Portugal had the lowest emissions in every year until 2007, beginning at only about 1.2 tonnes. However, its figure rose at every interval, more than quadrupling to around 5.4 tonnes by the end of the period, the same level as Sweden."]]},{"id":"W1-LG-09","task":1,"type":"Line graph","prompt":["The graph below shows different sources of air pollutants in the UK from 1990 to 2005.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-LG-09-1.jpg","w":1024,"h":768}],"models":[["The line graph shows the amount of air pollutants, in million tonnes, produced by transport, industry and households in the UK between 1990 and 2005, together with the total.","Overall, the total amount of air pollution fell by more than half over the period, largely because of a sharp decline in industrial emissions. Industry was by far the largest source throughout, while pollution from households fell to almost nothing and that from transport remained virtually unchanged.","The total volume of air pollutants stood at 7 million tonnes in 1990 and fell by around 1 million tonnes every three years until 1999, when it reached 4 million tonnes. After levelling off briefly, it dropped again to about 3.1 million tonnes in 2005. This trend was driven mainly by industry, whose emissions decreased from 5.5 million tonnes to 5 million tonnes in 1993 and then plunged to 3 million tonnes in 1996. Industrial pollution continued to decline more gradually after this, finishing at 2 million tonnes, still about two thirds of the total.","The two remaining sources were much smaller. Transport and households each produced about 0.9 million tonnes of pollutants in 1990. Emissions from transport hardly changed over the next fifteen years, fluctuating between roughly 0.9 and 1 million tonnes. Household pollution, by contrast, fell to around 0.5 million tonnes in 1996 and, after a slight rise in 1999, declined to only about 0.1 million tonnes by 2005, the lowest figure on the graph."]]},{"id":"W1-LG-10","task":1,"type":"Line graph","prompt":["The graph shows data about the annual earnings of three bakeries in Calgary, 2000-2010.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-LG-10-1.jpg","w":1100,"h":750}],"models":[["The line graph compares the annual income of three bakeries in Calgary, Amandine Bakery, Mari Bakeshop and Bolo Cakery, between 2000 and 2010.","Overall, Amandine Bakery and Bolo Cakery both saw their income grow considerably, whereas Mari Bakeshop’s earnings fell by more than half. As a result, Mari Bakeshop went from being the highest earner to the lowest, while Amandine Bakery finished the period well ahead of the other two.","Mari Bakeshop was the most successful of the three in the first half of the period. Its income stood at around $82,000 in 2000 and fluctuated between about $80,000 and $93,000 until 2004. In 2005, however, it dropped sharply to roughly $63,000, and after a brief recovery to $59,000 in 2007, it fell again to about $42,000 in 2008, remaining at around $40,000 until 2010.","Amandine Bakery, by contrast, earned a constant $55,000 a year from 2000 to 2005. It overtook Mari Bakeshop in 2006, when its income reached $60,000, and then rose dramatically to about $96,000 in 2008 and $105,000 in 2010. Bolo Cakery started with the lowest income, at only $20,000, but its earnings almost doubled to around $38,000 in 2003 and stayed at that level for four years. A second surge then took its income to about $61,000 in 2008, overtaking Mari Bakeshop, and to $65,000 by 2010."],["The line graph illustrates how much three bakeries in Calgary earned each year from 2000 to 2010.","Overall, the period can be divided into two clear phases, with Mari Bakeshop leading until 2005 and Amandine Bakery dominating afterwards. While the incomes of Amandine Bakery and Bolo Cakery ended much higher than they started, Mari Bakeshop’s income roughly halved.","From 2000 to 2005, Mari Bakeshop earned considerably more than its competitors. Its annual income varied between approximately $80,000 and $93,000 until 2004, compared with a flat $55,000 for Amandine Bakery. Bolo Cakery earned the least, although its income rose from $20,000 in 2000 to around $38,000 in 2003. In 2005, however, Mari Bakeshop’s income fell to about $63,000, narrowing the gap with Amandine Bakery to less than $10,000.","The rankings changed considerably in the second half of the decade. Amandine Bakery overtook Mari Bakeshop in 2006 and its income then accelerated, rising to about $96,000 in 2008 and peaking at $105,000 in 2010. Bolo Cakery also grew strongly after 2006, climbing from around $37,000 to $65,000 by the end of the period. Mari Bakeshop, meanwhile, continued to decline, and it was overtaken by Bolo Cakery in 2008, finishing with the lowest income of the three at about $40,000, less than two fifths of Amandine Bakery’s figure."]]},{"id":"W1-LG-11","task":1,"type":"Line graph","prompt":["The line graph shows the percentage of travels by 4 different modes of transport in one country between 1985 and 2015.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-LG-11-1.jpg","w":1024,"h":635}],"models":[["The line graph illustrates how the share of journeys made by car, bus, rail and other forms of transport changed in one country between 1985 and 2015.","Overall, the car replaced the bus as the most common means of travel early in the period, while bus use declined almost continuously. Rail and other modes accounted for only a small proportion of journeys throughout.","Car and bus travel followed opposite paths. In 1985, buses carried more than half of all journeys, over twice the figure for cars at roughly 20%. The two lines crossed at about 40% in 1990. After that, car use climbed steeply to over 70% by the late 1990s and peaked at nearly 80% around 2007, before easing to about 70% in 2015. Bus travel, meanwhile, plummeted to just over 10% by the early 2000s and slipped below 10% by 2015, less than a fifth of its original level.","The two remaining categories were far smaller. Rail fell gradually from just under 20% to below 10% by the mid-1990s and stayed there until the early 2000s, when it overtook the bus. It then fluctuated, reaching about 20% in both 2007 and 2015, slightly above its starting point. Other forms of transport remained at or below 10% throughout, dipping to around 5% in 1990 before recovering to roughly 10%, marginally ahead of the bus."]]},{"id":"W1-LG-12","task":1,"type":"Line graph","prompt":["The graph shows the number of visitors to four international museums between 1980 and 2015.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-LG-12-1.jpg","w":960,"h":845}],"models":[["The line graph compares the number of people who visited four international museums, the Louvre, the Vatican Museums, the London Science Museum and the Shenzhen Museum, between 1980 and 2015.","Overall, the Louvre was the most visited museum throughout the period, although the Vatican Museums grew much faster and almost caught up with it by 2015. The two smaller museums received far fewer visitors, with numbers at the London Science Museum falling steadily while those at the Shenzhen Museum dipped and then recovered.","The Louvre attracted about 7.8 million visitors in 1980, and its figure rose to a peak of around 9 million in 1995. After a fall to roughly 8.4 million in 2000, visitor numbers recovered steadily to reach about 9.5 million in 2015, the highest figure on the graph. The Vatican Museums saw continuous growth over the whole period, almost doubling from about 4.8 million visitors to just over 9.2 million and finishing only slightly behind the Louvre.","The London Science Museum and the Shenzhen Museum began with similar figures, at roughly 4.1 million and 3.8 million respectively. Visitor numbers at the London Science Museum remained stable until 1985 but then declined at every interval, falling to just 2.2 million by 2015. The Shenzhen Museum also lost visitors at first, slipping to about 3 million in 2000, but it then recovered gradually to roughly 3.75 million, almost its original level, making it the third most visited museum by the end of the period."],["The line graph shows how many people visited four international museums at five-year intervals from 1980 to 2015.","Overall, visitor numbers increased at the Louvre and the Vatican Museums, which were consistently the two most popular museums, and the gap between them narrowed considerably. By contrast, the London Science Museum lost almost half of its visitors, while the Shenzhen Museum ended the period close to where it started.","The two most visited museums followed different patterns. The Louvre welcomed between about 7.8 and 9 million visitors a year until 1995, when its figure peaked before dropping to roughly 8.4 million in 2000. It then rose steadily again to around 9.5 million in 2015. The Vatican Museums, meanwhile, started with about 3 million fewer visitors than the Louvre, at roughly 4.8 million, but their numbers rose at every interval, particularly between 1985 and 1995, reaching about 9.25 million by the end of the period.","The two less popular museums each attracted fewer than 4.5 million visitors in every year. In 1980, the London Science Museum received about 4.1 million visitors, slightly more than the Shenzhen Museum, at around 3.8 million. However, the London museum’s figure fell to about 3.2 million in 1990, below Shenzhen’s, and continued to decline to roughly 2.2 million in 2015. The Shenzhen Museum’s visitor numbers fell more gently to around 3 million in 2000, before climbing back to about 3.75 million by 2015."]]},{"id":"W1-LG-13","task":1,"type":"Line graph","prompt":["The graph below compares changes in the birth rates of China and the USA (in percentage) between 1920 and 2000.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-LG-13-1.jpg","w":801,"h":327}],"models":[["The line graph compares the birth rates of China and the USA, as percentages, at five-year intervals between 1920 and 2000.","Overall, the birth rates in both countries fluctuated considerably until 1950, after which they declined, with the fall being much steeper in China. As a result, although China briefly had the higher rate at two points before 1950, its rate was well below that of the USA for the rest of the period.","Between 1920 and 1950, the two countries followed broadly similar but volatile paths. Both birth rates stood at around 10% to 11% in 1920. China’s rate then climbed to 15% in 1935, overtaking the USA’s figure of 13%, but it plunged to 5% in 1940 and remained there in 1945. The USA’s rate fell more gradually, reaching its lowest point of about 4.5% in 1945. Both rates then surged in 1950, to 15% in the USA and 20% in China, the highest figure on the graph.","From 1950 onwards, both countries saw a long-term decline. China’s birth rate more than halved to 9% in 1955 and continued to fall to only 2% in 1980, staying between 2% and 3% for the remaining twenty years. The decline in the USA was considerably slower, with the rate easing from 15% to 12% in the 1960s and then to 7% in 1985. It ended the period at 7%, more than three times China’s final figure."]]},{"id":"W1-LG-14","task":1,"type":"Line graph","prompt":["The chart below shows the percentage of households owning four types of electronic devices between 1995 and 2015.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-LG-14-1.jpg","w":1242,"h":909}],"models":[["The line graph shows the percentage of households that owned four types of electronic device, MP3 players, mobile phones, computers and tablets, between 1995 and 2015.","Overall, ownership of all four devices increased over the period. Mobile phones were the most widely owned device from the late 1990s onwards, while MP3 players, which had initially been the most common, grew the most slowly and ended up as the least owned device.","In 1995, MP3 players were found in about 15% of households, roughly twice the proportion that owned a mobile phone or a computer, at around 7% each. Mobile phone ownership then soared to 70% by 2000, after which it continued to rise more gradually, reaching 85% in 2010 and 95% in 2015. Computer ownership grew more steadily but just as substantially, increasing to about 25% in 2000 and 58% in 2005, and then accelerating in the final years to match the figure for mobile phones in 2015.","MP3 players and tablets followed contrasting paths. The proportion of households with an MP3 player rose slowly but consistently throughout, from 15% to 25% in 2000 and only about 42% by 2015. Tablets, on the other hand, did not appear until the early 2000s, and only 17% of households owned one by about 2007. Ownership then increased dramatically to around 63% in 2010, overtaking MP3 players, and continued to grow to about 82% in 2015, almost twice the figure for MP3 players."]]},{"id":"W1-LG-15","task":1,"type":"Line graph","prompt":["The graph below shows the number of available housing units of four different types in Riverside County between 2000 and 2007.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-LG-15-1.jpg","w":1400,"h":921}],"models":[["The line graph shows the number of available housing units of four different types, apartments, duplexes, detached houses and townhouses, in Riverside County between 2000 and 2007.","Overall, detached houses declined continuously throughout the period to become one of the two least available types, while apartments ended the period as the most common type despite a mixed pattern of movement. It is also noticeable that duplexes and townhouses each experienced a single pronounced peak, though at different points in time.","Detached houses were the most available type in 2000, at around 510 units, but fell steadily and sharply for the entire period, ending at roughly 30 units in 2007, level with townhouses as the lowest figure. Apartments, by contrast, started at about 260 units and dipped only slightly before rising steadily to a peak of approximately 380 units in 2005. Although the figure eased back afterwards, apartments still finished the period in first place, at around 300 units.","Duplexes and townhouses each rose to a peak before declining, but at different times. Duplexes began at about 95 units, climbed rapidly to a peak of roughly 280 around 2002, then fell steadily to finish at approximately 90 units, close to their starting level. Townhouses followed a similar shape several years later, rising almost continuously from around 30 units to a peak of about 270 in 2004 to 2005, before collapsing sharply to end at roughly 30 units, the same level at which they began."]]},{"id":"W1-LG-16","task":1,"type":"Line graph","prompt":["The graph shows the percentage of tourists to Scotland who visited four different specific attractions from 1980 to 2010.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-LG-16-1.jpg","w":1082,"h":798}],"models":[["The line graph illustrates changes in the proportion of tourists visiting four types of attraction in Scotland at five-year intervals between 1980 and 2010.","Overall, castles and zoos were the only attractions to draw a larger share of visitors at the end of the period than at the start, with castles becoming by far the most popular. Festivals and aquariums both lost ground, the latter finishing as the least visited of the four.","Castles saw the most pronounced growth. Having been visited by 23% of tourists in 1980, the figure climbed steeply to a peak of 45% in 1995 before falling back to 35% in 2000 and then levelling off at around 33% for the remainder of the period. Zoos followed a far more modest path, fluctuating between 9% and 15% until 2000, after which they rose consistently to reach 20% by 2010, double their 1980 level.","Festivals, by contrast, declined without interruption. From the leading position of 30% in 1980 they fell gradually throughout, having been overtaken by castles around 1985, and finished at 18%, marginally behind zoos. The aquarium figure was the most erratic of the four: after a sharp rise from 20% to 35% in 1985, which briefly made it the most visited attraction, it fell back just as steeply to 20% in 1990 and, apart from a slight recovery in 1995, declined steadily thereafter to only 9% in 2010."]]},{"id":"W1-LG-17","task":1,"type":"Line graph","prompt":["The graph below gives information about the percentage of the population in four Asian countries living in cities from 1970 to 2020, with predictions for 2030 and 2040.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-LG-17-1.jpg","w":1024,"h":765}],"models":[["The line graph shows the proportion of people living in cities in four Asian countries between 1970 and 2020, along with projections for 2030 and 2040.","Overall, urbanisation increased in all four countries over the period and is expected to continue rising. Malaysia has had the most urbanised population in every year since 2000 and is predicted to remain well ahead, while Indonesia has seen the fastest growth, rising from last place to second.","In 1970, the Philippines and Malaysia had similar urban populations, at roughly a third of the total. While the figure for Malaysia then rose steadily to about 76 percent by 2020, the Philippines followed a less consistent path, peaking at nearly half in 1990 before dipping slightly to around 42 percent in 2010. Malaysia’s urban share is projected to exceed 80 percent by 2040, compared with about 55 percent in the Philippines.","Indonesia and Thailand started from much lower bases, at roughly 14 and 18 percent respectively. Both grew at a similar pace until 2000, when they stood level at about 30 percent. Indonesia’s figure then accelerated, overtaking the Philippines around 2010 and reaching just over half in 2020, and it is expected to climb to almost two thirds by 2040. Thailand, by contrast, grew only slowly between 2000 and 2020, but it is forecast to rise more quickly to around 49 percent, though it will still remain the least urbanised of the four."]]},{"id":"W1-LG-18","task":1,"type":"Line graph","prompt":["The chart shows the average daily viewing figures for the news programme Channel One News over a 12-month period.","Summarise the information by selecting and reporting the main features, and make comparisons where relevant."],"imgs":[{"src":"wimg/W1-LG-18-1.jpg","w":1024,"h":572}],"models":[["The line graph shows the average daily audience for Channel One News at four different times over a twelve-month period.","Overall, t
