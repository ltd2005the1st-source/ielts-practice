    buttons.forEach(b => { const el = document.createElement('button'); el.className = 'btn ' + (b.cls || 'btn-line'); el.textContent = b.label; el.onclick = () => { o.remove(); res(b.value); }; row.appendChild(el); });
    o.addEventListener('click', e => { if(e.target === o){ o.remove(); res(null); } });
    o.addEventListener('keydown', e => { if(e.key === 'Escape'){ o.remove(); res(null); } });
    document.body.appendChild(o);
    setTimeout(() => { const p = row.querySelector('.btn-primary') || row.lastChild; p && p.focus(); }, 30);
  });
}

/* ---------- choosing tasks ---------- */
function isDone(id){ const e = EX[id]; return hist.done.includes(id) || !!(e && e.sibling && hist.done.includes(e.sibling)); }
const fullTasks = () => [TASK1, TASK2].map((L, i) => L.some(e => !isDone(e.id)) ? null : 'Task ' + (i + 1)).filter(Boolean);
const canNewOnly = () => !fullTasks().length;
const newOnly = () => LS.get(K.newOnly(), true) !== false && canNewOnly();
/* question types: students choose which kinds of Task 1 and Task 2 prompts can come up */
const TYPE_LABEL = {'Diagram': 'Process diagram'};
const TYPES = [TASK1, TASK2].map(L => [...new Set(L.map(e => e.type))]);
const typeLabel = t => TYPE_LABEL[t] || t;
const offTypes = () => { const o = LS.get(K.types(), null); return [1, 2].map(i => (o && Array.isArray(o[i - 1]) ? o[i - 1] : []).filter(t => TYPES[i - 1].includes(t))); };
const typeOk = e => !!e && !offTypes()[e.task - 1].includes(e.type);
const typePool = i => [TASK1, TASK2][i].filter(typeOk);
const typesReady = () => typePool(0).length > 0 && typePool(1).length > 0;
function pickOne(list, avoid){
  const lastDone = {}; hist.attempts.forEach(a => (a.ex || []).forEach(id => lastDone[id] = a.date || ''));
  list = list.filter(typeOk);
  if(!list.length) return null;
  let pool = list.filter(e => !newOnly() || !isDone(e.id)).map(e => e.id);
  if(!pool.length){
    pool = list.slice().sort((a, b) => (lastDone[a.id] || '').localeCompare(lastDone[b.id] || '')).map(e => e.id);
    pool = pool.slice(0, Math.max(3, Math.ceil(pool.length / 3)));
  }
  const fresh = pool.filter(id => id !== avoid);
  const from = fresh.length ? fresh : pool;
  return from[Math.floor(Math.random() * from.length)];
}
const pickPair = avoid => [pickOne(TASK1, avoid && avoid[0]), pickOne(TASK2, avoid && avoid[1])];
function nextPair(){
  const saved = LS.get(K.next(), null), only = newOnly();
  if(saved && saved.length === 2 && saved.every((id, i) => EX[id] && EX[id].task === i + 1 && typeOk(EX[id]) && (!only || !isDone(id)))) return saved;
  const t = pickPair(); LS.set(K.next(), t); LS.set(K.shuf(), 0); return t;
}

/* ---------- home ---------- */
function enterHome(){
  stopTick();
  loadHist(); renderHome(); show('screen-home');
  flushClears().then(() => gas('getHistory', profile.name, 'writing')).then(h => {
    if(!h) return;
    const before = hist.done.length + hist.attempts.length;
    (h.done || []).forEach(id => { if(!hist.done.includes(id)) hist.done.push(id); });
    const have = new Set(hist.attempts.map(a => a.id));
    (h.attempts || []).forEach(a => { if(!have.has(a.id)) hist.attempts.push(a); });
    hist.attempts.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    saveHist();
    if(hist.done.length + hist.attempts.length !== before && !$('#screen-home').classList.contains('hidden')) renderHome();
  }).catch(() => {});
  flushOutbox();
}
function pairHtml(ids){
  return ids.map((id, i) => { const e = EX[id];
    if(!e) return `<li class="empty-task"><span class="pn num">${i + 1}</span><div><h3>No Task ${i + 1} question types chosen</h3><div class="wtype">Choose at least one Task ${i + 1} type below to build your test.</div></div></li>`;
    const sp = e.task === 2 ? splitT2(promptLines(e)) : {body: promptLines(e), instr: ''};
    return `<li><span class="pn num">${i + 1}</span><div>${(([h, ...rest]) => `<h3>${esc(h)}</h3>` + rest.map(l => `<p class="wmore">${esc(l)}</p>`).join(''))(sp.body)}${sp.instr ? `<h3 class="winstr">${hlHtml(sp.instr)}</h3>` : ''}<div class="wtype">Task ${e.task}, ${esc(typeLabel(e.type).toLowerCase())}. At least ${MIN_WORDS[e.task]} words, about ${SUGGEST[e.task]} minutes.</div></div></li>`; }).join('');
}
function renderHome(){
  const first = profile.name.split(' ').slice(-1)[0];
  $('#homeWho').textContent = profile.name;
  const n = hist.attempts.length;
  const left1 = TASK1.filter(e => !isDone(e.id)).length, left2 = TASK2.filter(e => !isDone(e.id)).length;
  $('#homeHello').textContent = n ? `Welcome back, ${first}` : `Hello, ${first}`;
  $('#homeLede').textContent = n
    ? `You have finished ${plural(n, 'writing test')}. ${left1} of ${TASK1.length} Task 1 and ${left2} of ${TASK2.length} Task 2 questions are still new to you.`
    : `Here is your first writing test: one Task 1 and one Task 2 in 60 minutes. Spend about 20 minutes on Task 1 and 40 on Task 2.`;
  let c = LS.get(K.cur(), null);
  if(c && !(c.ids || []).every(id => EX[id])){ LS.del(K.cur()); c = null; }
  if(c && c.status === 'active'){
    cur = c;
    const rem = TEST_SECONDS - c.elapsed;
    $('#resumeBox').innerHTML = `<div class="resume"><div><b>You have a test in progress</b><span>${rem > 0 ? fmt(rem) + ' left on the clock' : 'Time is up, ' + fmt(-rem) + ' over'}. Task 1: ${plural(words(c.answers[0]), 'word')}, Task 2: ${plural(words(c.answers[1]), 'word')}.</span></div><button class="btn btn-primary" id="resumeBtn">Resume test</button></div>`;

    h.setUint16(26, name.length, true); h.setUint16(28, 0, true);

      {k:'ruler',w:420,pos:{left:'-250px',bottom:'22vh'},r:22,from:[-480,140]},
      {k:'clip',w:230,pos:{right:'-90px',top:'30vh'},r:9,from:[380,60]},
      {k:'pen',w:300,pos:{right:'-120px',bottom:'7vh'},r:14,from:[440,100]}
    ],
    welcome:[
      {k:'paper',w:200,pos:{left:'-128px',top:'-20px'},r:-10,from:[-360,-60]},
      {k:'pencil',w:280,pos:{left:'-70px',bottom:'12vh'},r:-28,from:[-420,160]},
      {k:'ruler',w:420,pos:{left:'8vw',bottom:'-24px'},r:-3,from:[-200,220]}
    ]
  };
  var EASE='cubic-bezier(.65,0,.35,1)', still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var layer=document.createElement('div');layer.className='deco';layer.setAttribute('aria-hidden','true');
  var scene=null;
  function build(name){
    layer.innerHTML='';
    (SCENES[name]||[]).forEach(function(it,i){
      var el=document.createElement('i');el.className='d d-'+it.k;el.innerHTML=SV[it.k];el.style.width=it.w+'px';
      for(var k in it.pos)el.style[k]=it.pos[k];
      layer.appendChild(el);
      var end='translate(0,0) rotate('+it.r+'deg)';
      if(still){el.style.opacity=1;el.style.transform=end;return}
      el.animate([{opacity:0,transform:'translate('+it.from[0]+'px,'+it.from[1]+'px) rotate('+(it.r+(it.from[0]<0?-14:14))+'deg)'},{opacity:1,transform:end}],
        {duration:1500,delay:250+i*160,easing:EASE,fill:'both'});
    });
  }
  function leave(){
    [].forEach.call(layer.children,function(el,i){
      if(still){el.style.opacity=0;return}
      var tr=getComputedStyle(el).transform;
      el.animate([{opacity:1,transform:tr==='none'?'none':tr},{opacity:0,transform:(tr==='none'?'':tr+' ')+'translateY(40px)'}],{duration:500,delay:i*40,easing:EASE,fill:'both'});
    });
  }
  function current(){
    var v=[].filter.call(document.querySelectorAll('.screen'),function(s){return !s.classList.contains('hidden')&&!s.hidden})[0];
    if(!v)return null;var id=v.id.replace('screen-','');
    return id==='test'?'test':(id==='results'?'results':(id==='welcome'?'welcome':'home'));
  }
  function sync(){
    var n=current();if(!n||n===scene)return;
    var prev=scene;scene=n;
    if(n==='test'){leave();return}
    build(n);
  }
  function init(){
    document.body.insertBefore(layer,document.body.firstChild);
    boldAll();sync();
    new MutationObserver(function(ms){
      var screens=false;
      ms.forEach(function(m){
        if(m.type==='attributes'){if(m.target.classList&&m.target.classList.contains('screen'))screens=true;return}
        m.addedNodes.forEach(function(n){if(n!==layer&&!(n.closest&&n.closest('.deco')))boldIn(n.nodeType===3?n:n)});
      });
      if(screens)sync();
    }).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','hidden']});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();</script>
<script>/* ui sounds: soft key blip on hover, thock on press (Web Audio, no files) */
(function(){
var KEY='ielts_sound',SEL='.btn,.theme-btn,.pbtn,.check,.tchip,.skillgrid .skill',ctx=null,master=null,noise=null,lastHover=0,lastEl=null;
function on(){try{return localStorage.getItem(KEY)!=='0';}catch(e){return true;}}
function setOn(v){try{localStorage.setItem(KEY,v?'1':'0');}catch(e){}paint();}
var fine=window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches;
function ac(){
  if(!ctx){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ctx=new C();master=ctx.createGain();master.gain.value=.55;
    var comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
    var n=ctx.sampleRate*.05|0;noise=ctx.createBuffer(1,n,ctx.sampleRate);var d=noise.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);}
  if(ctx.state==='suspended')ctx.resume();
  return ctx;
}
function jit(x,p){return x*(1+(Math.random()*2-1)*p);}
function env(g,t,peak,a,dcy){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dcy);}
function hover(){
  var c=ctx;if(!c||c.state!=='running')return;var t=c.currentTime;
  var o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();
  o.type='triangle';o.frequency.setValueAtTime(jit(1650,.04),t);o.frequency.exponentialRampToValueAtTime(jit(1250,.04),t+.05);
  f.type='lowpass';f.frequency.value=3200;env(g,t,.03,.004,.05);
  o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+.08);
}
function burst(c,t,fType,freq,q,peak,dcy,rate){
  var s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=noise;s.playbackRate.value=rate||1;
  f.type=fType;f.frequency.value=freq;f.Q.value=q;env(g,t,peak,.0008,dcy);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dcy+.02);
}
function tone(c,t,type,f0,f1,peak,dcy){
  var o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dcy);
  env(g,t,peak,.001,dcy);o.connect(g);g.connect(master);o.start(t);o.stop(t+dcy+.02);
}
/* clicky switch + PBT keycap: click-jacket snap, then a dry, matte bottom-out clack */
function press(k){
  var c=ac();if(!c)return;var t=c.currentTime+.004;k=k||1;
  burst(c,t,'bandpass',jit(4600*k,.06),2.2,.24,.012,jit(1.1,.05));
  tone(c,t,'triangle',jit(3900*k,.04),jit(3300*k,.04),.035,.018);
  var t2=t+jit(.009,.15);
  burst(c,t2,'bandpass',jit(1450*k,.06),1.3,.3,.034,jit(.9,.05));
  tone(c,t2,'sine',jit(170*k,.05),jit(110*k,.05),.12,.045);
}
/* key coming back up: a smaller, higher click */
function release(k){
  var c=ctx;if(!c||c.state!=='running')return;var t=c.currentTime+.002;k=k||1;
  burst(c,t,'bandpass',jit(3800*k,.08),2,.07,.01,1.15);
  burst(c,t+.006,'bandpass',jit(1900*k,.08),1.4,.06,.018,1);
}
var downEl=null;
function target(e){var el=e.target&&e.target.closest?e.target.closest(SEL):null;if(!el)return null;
  if(el.disabled||el.getAttribute('aria-disabled')==='true')return null;var i=el.tagName==='LABEL'?el.querySelector('input'):null;if(i&&i.disabled)return null;return el;}
function isBox(el){return el&&el.tagName==='LABEL'&&!!el.querySelector('input[type=checkbox],input[type=radio]');}
document.addEventListener('pointerover',function(e){
  if(!fine||e.pointerType!=='mouse'||!on())return;var el=target(e);if(!el||el===lastEl)return;
  if(e.relatedTarget&&el.contains(e.relatedTarget))return;lastEl=el;
  var n=performance.now();if(n-lastHover<70)return;lastHover=n;hover();
},true);
document.addEventListener('pointerout',function(e){if(lastEl&&!(e.relatedTarget&&lastEl.contains(e.relatedTarget)))lastEl=null;},true);
document.addEventListener('pointerdown',function(e){if(e.pointerType==='touch'){return;}if(!fine)return;ac();var el=target(e);if(on()&&el&&!isBox(el)){press();downEl=el;}},true);
document.addEventListener('pointerup',function(){if(downEl){downEl=null;if(on())release();}},true);
document.addEventListener('pointercancel',function(){downEl=null;},true);
document.addEventListener('keydown',function(e){if(fine)ac();},true);
document.addEventListener('click',function(e){if(e.detail!==0||!fine||!on())return;var el=target(e);if(el&&!isBox(el)){press();setTimeout(release,75);}},true);
/* tick higher, untick lower */
document.addEventListener('change',function(e){var i=e.target;if(!fine||!on()||!i||i.type!=='checkbox'&&i.type!=='radio')return;var k=i.checked?1.12:.88;press(k);setTimeout(function(){release(k);},70);},true);
/* toggle next to Dark/Light */
function paint(){document.querySelectorAll('.sound-btn').forEach(function(b){var v=on();b.textContent=v?'Sound on':'Sound off';b.setAttribute('aria-pressed',v?'true':'false');});}
document.querySelectorAll('[data-theme-toggle]').forEach(function(t){var b=document.createElement('button');b.type='button';b.className='theme-btn sound-btn';b.title='Turn button sounds on or off';
  b.addEventListener('click',function(){setOn(!on());});t.parentNode.insertBefore(b,t);});
paint();
})();
</script>
