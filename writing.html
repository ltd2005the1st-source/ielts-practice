ss languages with very little delay, removing much of the difficulty that once came with travelling or doing business abroad. For example, a tourist can photograph a menu or speak into a phone and receive an immediate translation. Secondly, these tools spare users the considerable time and effort that fluency demands. Reaching an advanced level can take years of study, and many busy adults would understandably prefer to devote that time to skills with a more immediate return. On this reasoning, it is hardly surprising that some people regard language learning as no longer essential.","Nevertheless, the value of learning a foreign language extends well beyond the ability to translate. In the first place, the process itself brings cognitive and personal benefits. Mastering an unfamiliar grammatical system and building a new vocabulary exercises memory and reasoning in ways that consulting an application does not, and it also gives learners insight into how other cultures think. Equally important is the fact that genuine communication depends on more than literal accuracy. Machine translation frequently fails to capture humour, tone and the cultural assumptions behind what a speaker means, and its output can be awkward or simply wrong in sensitive situations. To illustrate, a business negotiator who speaks a partner’s language can notice hesitation, respond to a joke and build personal trust, whereas one relying on an app may miss these signals entirely. For these reasons, fluency offers advantages that no machine currently provides.","In conclusion, while translation tools are convenient and save a great deal of effort, learning foreign languages will not become unnecessary, as it develops the mind and enables the kind of understanding on which lasting relationships are built. Schools should therefore continue to teach foreign languages, while showing students how to use translation tools as a support rather than a substitute."]]},{"id":"W2-OP-13","task":2,"type":"Opinion","prompt":["In many countries today, the eating habits and lifestyle of children are different from those of previous generations. Some people say this has had a negative effect on their health.","To what extent do you agree or disagree with this opinion?"],"imgs":[],"models":[["Compared with their parents and grandparents, children today eat different foods and spend their free time in very different ways. I agree only in part that these changes have harmed their health. The growth of processed food and screen-based entertainment has certainly contributed to obesity and inactivity, but rising incomes and greater nutritional awareness have also improved children’s diets in important ways.","There is considerable evidence that some modern habits are damaging children’s health. Firstly, children now consume far more fast food, sugary drinks and processed snacks than previous generations. These products are cheap, heavily advertised and high in fat, salt and sugar, so a diet based on them increases the risk of obesity, tooth decay and, later in life, conditions such as type 2 diabetes. Secondly, children’s lifestyles have become increasingly sedentary. Smartphones, video games and streaming services now occupy much of the time that was once spent playing outdoors, and many children are driven to school rather than walking or cycling. For example, a child who spends most evenings and weekends in front of a screen may rarely engage in the vigorous activity needed for healthy growth. For these reasons, the concern about children’s health is well founded.","However, not all changes in children’s eating habits and lifestyles have been negative. To begin with, rising living standards have given many children access to a more varied and nutritious diet. In many developing countries, families can now afford meat, dairy products and fresh fruit regularly, and this has helped reduce malnutrition and stunted growth. A case in point is Vietnam, where child malnutrition has fallen considerably over recent decades as incomes have risen. In addition, awareness of healthy eating has increased among parents and schools. Food labels, public health campaigns and stricter standards for school meals help families make better choices, while sports clubs and swimming lessons give many children structured opportunities to exercise. Therefore, modern lifestyles have also brought significant improvements in children’s health.","In conclusion, the rise of processed food and screen time has harmed many children’s health, but better access to nutritious food and greater health awareness have produced real benefits. Governments and parents should therefore limit children’s exposure to junk food advertising and encourage regular physical activity, so that the positive changes are not outweighed by the negative ones."]]},{"id":"W2-OP-14","task":2,"type":"Opinion","prompt":["Young people should be encouraged to take a gap year to work or travel between finishing high school and starting university studies. To what extent do you agree or disagree?"],"imgs":[],"models":[["In many Western countries, it has long been common for school leavers to spend a year working or travelling before university, and the idea is now gaining attention elsewhere. I agree to a certain extent that young people should be encouraged to take a gap year, as it promotes personal growth and helps them choose a suitable course of study. However, it is not right for everyone, since it can disrupt academic momentum and is unaffordable for many families.","A well-planned gap year offers valuable opportunities for development. Firstly, working, volunteering or travelling teaches life skills that schools rarely cover. Managing money, living away from home and adapting to unfamiliar environments build independence, confidence and communication skills, which help students cope with the demands of university life. For example, a school leaver who volunteers in a rural community abroad may return far more mature, self-reliant and aware of other cultures. Secondly, a gap year allows young people to explore possible careers before committing to a degree. By gaining experience in different workplaces, they can discover what they enjoy and avoid enrolling in a course that does not suit them, which saves time and money in the long run. In short, a gap year can help students make better decisions about their futures.","On the other hand, a gap year has drawbacks that make it unsuitable for some students. To begin with, a year away from study can weaken academic habits. Students may forget important knowledge, lose the routine of regular study or become so attached to earning money that they find it difficult to return to education at all. In addition, the costs involved can make gap years a privilege of the wealthy. Travelling abroad or taking unpaid volunteer placements requires substantial funds, and students from low-income families may be unable to participate, which could widen inequality between them and their wealthier peers. To illustrate, a student who must help support younger siblings may have no choice but to begin university or full-time work immediately. Therefore, encouraging gap years for everyone without considering these factors would be unwise.","In conclusion, a gap year can foster independence and clearer career choices, but the risk of losing academic momentum and the financial barriers involved mean that it should not be universally recommended. Schools should therefore present it as one option among several and help interested students plan a purposeful, affordable year."]]},{"id":"W2-OP-15","task":2,"type":"Opinion","prompt":["Although the number of people with a university degree is on the rise, some people believe that university education is redundant and attending university is a waste of time and money. What is your opinion?"],"imgs":[],"models":[["University enrolment has expanded rapidly in recent decades, with students from increasingly diverse backgrounds now pursuing degrees. Some argue that higher education has become a waste of time and money, but I disagree. Although university is not the best path for every learner, it remains valuable for most, as it promotes social mobility and drives the innovation on which modern economies depend.","The arguments against universal university attendance focus on cost and suitability, and they deserve to be taken seriously. Firstly, higher education is expensive. In many countries, rising tuition fees and living costs fall directly on students and their families, so those from less affluent backgrounds may graduate with heavy debts that limit their choices for years. Graduates may then feel pressure to take any available job simply to repay what they owe. Secondly, a degree may not match every student’s interests or ambitions. Students who enrol simply because it is expected of them may lose motivation and gain little from their studies. For example, a teenager who loves working with machines might thrive in an apprenticeship as an electrician but struggle through a theoretical business degree. From this perspective, vocational training can sometimes be a faster and more affordable route to a stable career.","Despite these concerns, a university education brings substantial benefits to both individuals and society. To begin with, it remains one of the most effective routes to social mobility. A degree allows students from modest backgrounds to enter professions such as medicine, engineering and law, which offer higher incomes and greater security than many jobs available without qualifications. For many families, a child’s degree represents the first step out of generations of low-paid work. In addition, universities drive the research and innovation that fuel economic growth. They train scientists and engineers and produce discoveries that lead to new industries, medicines and technologies. A case in point is the mRNA technology used in COVID-19 vaccines, which built on decades of university-based research. Therefore, the value of higher education extends far beyond the individual graduate.","In conclusion, while the cost of university and its unsuitability for some learners are valid concerns, higher education is far from a waste, as it opens doors for individuals and fuels national progress. Governments should therefore make university more affordable through grants and loans, while expanding high-quality vocational alternatives for those better suited to them."],["As the global economy becomes more competitive and knowledge-based, the number of people holding a university degree continues to rise. Some argue that this makes higher education redundant, but I strongly disagree. In my view, university remains a worthwhile investment, as it provides specialised knowledge and transferable skills and significantly improves graduates’ career prospects.","Universities equip students with knowledge and skills that are difficult to obtain elsewhere. Firstly, they offer in-depth, systematic training in complex fields such as medicine, law, science and technology. Many of the most important professions require years of rigorous study under qualified experts, with access to laboratories, libraries and clinical placements that informal online courses cannot replicate. For example, no hospital would allow a person to perform surgery on the strength of video tutorials, however many they had watched. Secondly, university life develops transferable skills such as critical thinking, teamwork and communication. Seminars, group projects, presentations and student societies require students to analyse arguments, collaborate and express their ideas clearly, abilities that are valuable in almost any career. Graduates who have practised these skills for several years usually adapt more quickly to the demands of professional life. For these reasons, the claim that university education is redundant is ill-founded.","In addition, a degree opens up better and more varied career opportunities. To begin with, graduates generally enjoy greater job security and higher lifetime earnings than those without degrees. Many employers use a degree as a minimum requirement for professional positions, so applicants without one may be excluded before their abilities are even considered. Over a working life of forty years or more, this advantage can add up to a considerable difference in income and stability. Furthermore, a university qualification can open the door to international opportunities. Postgraduate study, positions with multinational companies and visas for skilled workers abroad often require a recognised degree. To illustrate, a graduate in computer science may be able to apply for a master’s programme in Europe or a job with a global technology firm, options largely closed to someone without a degree. Therefore, a university education remains a powerful advantage in a competitive job market.","In conclusion, university is far from a waste of time and money, as it delivers specialised knowledge, transferable skills and wider career opportunities. Young people should therefore consider higher education seriously, while choosing courses that match their interests and career goals."]]},{"id":"W2-OP-16","task":2,"type":"Opinion","prompt":["Zoos are no longer necessary in the modern world. To what extent do you agree or disagree?"],"imgs":[],"models":[["Zoos have existed for centuries, but in an age of wildlife documentaries and growing concern for animal welfare, their purpose is increasingly being questioned. However, I disagree that zoos are no longer necessary. Although poorly run zoos can cause animals real suffering, well-managed modern zoos play a vital role in protecting endangered species and educating the public.","Critics of zoos raise legitimate concerns about animal welfare and entertainment value. Firstly, keeping wild animals in captivity can cause considerable distress. Species that roam vast territories in the wild, such as elephants and big cats, may develop abnormal behaviour when confined to small enclosures. For example, captive elephants are sometimes seen swaying or pacing repeatedly, behaviour widely regarded as a sign of stress. Secondly, people no longer need to visit zoos to see exotic animals. High-quality documentaries, virtual reality and online wildlife cameras allow audiences to observe animals in their natural habitats without removing any from the wild. These alternatives can show animals hunting, migrating and raising their young, behaviour that is rarely visible in an enclosure. From this perspective, zoos that exist mainly to entertain visitors are difficult to justify.","However, zoos that focus on conservation and education remain essential in the modern world. To begin with, they protect species that are on the brink of extinction. Habitat destruction, poaching and climate change threaten countless animals, and captive breeding programmes can maintain healthy populations until it is safe to return them to the wild. A case in point is the Arabian oryx, which became extinct in the wild in the 1970s but was later reintroduced to the Middle East from animals bred in zoos. In addition, zoos provide research and educational opportunities that screens cannot match. Scientists can study animal health and behaviour in ways that are difficult or dangerous in the wild, and their findings often help protect wild populations, while seeing a living animal up close can inspire children to care about conservation far more effectively than a documentary. Therefore, modern zoos serve conservation and educational purposes that remain necessary today.","In conclusion, while zoos can harm animal welfare and are no longer needed for entertainment alone, those devoted to conservation and education continue to play an indispensable role. Governments should therefore close zoos that fail to meet strict welfare standards and support those that contribute to breeding programmes and research."]]},{"id":"W2-OP-17","task":2,"type":"Opinion","prompt":["Governments should ban children under 16 from using social media. To what extent do you agree or disagree?"],"imgs":[],"models":[["Social media platforms have become part of everyday life for many children, often long before they are mature enough to handle their pressures. I agree to a large extent that governments should ban children under sixteen from using social media, because these platforms can harm young people’s mental health and expose them to serious online risks. Although such a ban would be difficult to enforce, this is a reason to implement it carefully rather than to abandon it.","The main argument for a ban is that social media poses significant dangers to children. Firstly, many platforms are designed to maximise the time users spend on them. Endless feeds, notifications and the pursuit of likes encourage compulsive use, while constant comparison with edited images can undermine young people’s self-esteem and contribute to anxiety and poor sleep. Secondly, children on social media may be exposed to cyberbullying, inappropriate content and contact with strangers who intend to exploit them. Younger users often lack the judgement to recognise these threats or the confidence to seek help. Concerns of this kind have already prompted action. For example, Australia passed legislation in 2024 making sixteen the minimum age for holding accounts on major social media platforms. Taken together, these risks justify stronger legal protection for children.","Admittedly, critics raise reasonable objections, but these can largely be addressed. To begin with, a ban may be difficult to enforce, since children can lie about their age or use their parents’ accounts. However, the law can require platforms to adopt reliable age-verification methods and fine them heavily for failing to do so, shifting responsibility from families to the companies that profit from young users. In addition, opponents argue that social media helps children stay in touch with friends and find information. Yet children under sixteen can still communicate through messaging services with parental controls and access educational resources without joining platforms built around public profiles and algorithms. To illustrate, a thirteen-year-old can arrange to meet friends through a family-approved messaging app rather than a public video-sharing platform. Therefore, the drawbacks of a ban are manageable rather than decisive.","In conclusion, social media can damage children’s mental health and expose them to online dangers, and the practical difficulties of a ban can be reduced through age verification and safer alternatives. Governments should therefore set a minimum age of sixteen while requiring platforms to enforce it effectively."]]},{"id":"W2-OP-18","task":2,"type":"Opinion","prompt":["Spending billions on space exploration is unjustifiable while poverty still exists on Earth. To what extent do you agree or disagree?"],"imgs":[],"models":[["Since the first satellite was launched in 1957, governments have spent vast sums exploring space, and private companies have recently joined the race. Some argue that such spending is unjustifiable while millions of people still live in poverty, but I disagree. Although the moral concern is understandable, space programmes consume only a small share of public budgets and produce technologies that directly help the world’s poorest people.","The view that space exploration is an unaffordable luxury rests on a powerful moral argument. Firstly, the sums involved are enormous. A single rocket launch or planetary mission can cost hundreds of millions of dollars, and critics argue that these funds could instead provide food, clean water, housing or healthcare for people in desperate need. Secondly, the benefits of space exploration often seem distant and abstract. Discovering water on Mars or photographing distant galaxies does little to help a family that cannot afford its next meal, so it is natural to question such priorities. For example, images from a new space telescope may appear in the news on the same day as reports of hunger in parts of East Africa, making the contrast seem stark. From this perspective, frustration with space budgets is easy to understand.","However, a closer look shows that space spending and poverty reduction are not in direct competition. To begin with, space programmes account for a very small proportion of government spending. NASA’s budget, for instance, is less than one per cent of the United States federal budget, so cancelling it would barely change the resources available for welfare, which depends far more on political will and effective distribution. In addition, space technology brings practical benefits to developing countries. Satellites provide weather forecasts, monitor crops and droughts and support communication in remote areas. To illustrate, satellite tracking of Cyclone Phailin in 2013 allowed Indian authorities to evacuate large numbers of coastal residents in advance, saving many lives. Therefore, space exploration often helps rather than hinders efforts to reduce hardship.","In conclusion, although spending billions on space may seem difficult to justify while poverty persists, such programmes cost relatively little and produce technologies that protect vulnerable communities. Governments should therefore continue to fund space research, while ensuring that its applications, such as weather and agricultural satellites, are shared with the countries that need them most."]]},{"id":"W2-OP-19","task":2,"type":"Opinion","prompt":["Some believe that younger family members should be legally responsible for supporting older family members when they become physically, mentally and financially unable to look after themselves.","To what extent do you agree or disagree?"],"imgs":[],"models":[["As life expectancy rises, a growing number of older people depend on others for physical, mental and financial support in their final years. Some believe younger family members should be legally required to provide this care, but I largely disagree. Although caring for elderly relatives is an important moral duty, enforcing it through law could place unfair pressure on younger generations, and governments should share this responsibility.","Supporters of a legal obligation put forward some reasonable arguments. Firstly, many cultures regard caring for ageing parents as a fundamental moral duty, and a law could prevent cases of neglect. Without legal consequences, some adult children might abandon parents who can no longer look after themselves, leaving them lonely, unwell or destitute. For example, Singapore’s Maintenance of Parents Act allows elderly parents who cannot support themselves to claim financial support from their children through a tribunal. Secondly, family care can reduce the burden on public welfare systems. If relatives provide housing, money and daily assistance, governments can spend less on pensions and care homes, leaving more funds for other public needs. From this perspective, a legal requirement may appear both fair and economical.","Nevertheless, I would contend that such laws could cause more harm than good. To begin with, family circumstances vary enormously. Many young adults already struggle with low wages, high housing costs and responsibilities towards their own children, so being legally forced to support parents as well could push them into serious financial hardship. In addition, care that is compelled by law is not necessarily good care. An exhausted or resentful relative may provide far less attentive support than trained professionals, and the obligation may damage relationships within the family. Instead, governments should provide adequate pensions, affordable nursing homes and community care services. A case in point is Japan, which introduced a long-term care insurance scheme in 2000 to fund professional care for older citizens rather than leaving the burden entirely to families. Therefore, state support offers a fairer and more reliable solution.","In conclusion, although a legal duty might prevent neglect and reduce public spending, it ignores the varied circumstances of families and may result in poor-quality care. Governments should therefore encourage family involvement while guaranteeing that every older person can access professional support, regardless of their relatives’ means."]]},{"id":"W2-OP-20","task":2,"type":"Opinion","prompt":["In today’s digital age, anyone with a smartphone can capture and share photographs. This accessibility to photography diminishes the value of professional photographers.","To what extent do you agree or disagree?"],"imgs":[],"models":[["Modern smartphones contain cameras powerful enough to produce sharp, colourful images, and vast numbers of photographs are now shared online every day. I agree only to a limited extent that this has reduced the value of professional photographers. While amateurs can now meet many everyday needs that once required paid experts, professionals remain highly valued for their technical expertise and their reliability on important occasions.","It is true that smartphone photography has reduced demand for some types of professional work. Firstly, many simple tasks no longer require a specialist. Individuals can photograph family gatherings, holidays and pets themselves, and editing apps can correct lighting and colour in seconds, so fewer people pay for routine portraits. Secondly, small businesses increasingly produce their own visual content. For example, many online sellers now photograph their products on a kitchen table with a phone and natural light, rather than hiring a studio. With a few free editing apps, the results can look professional enough for a small online shop. As a result, competition has increased and fees for basic photography have fallen in many markets. In this sense, the accessibility of photography has undoubtedly made certain professional services less valuable.","However, professional photographers continue to offer skills and assurance that amateurs cannot easily match. To begin with, professional photography depends on expertise, not merely equipment. Understanding light, composition and timing, and knowing how to direct people and edit images to a consistent standard, takes years of practice, which is why advertising agencies, fashion magazines and architectural firms still hire specialists. In addition, professionals provide reliability on occasions that cannot be repeated. A wedding, a graduation ceremony or a major news event happens only once, and clients pay for the certainty that the moment will be captured well whatever the conditions. To illustrate, couples who rely on guests’ phones at their wedding may later find that the photographs are blurred, poorly lit or missing key moments altogether. Therefore, the value of professionals has shifted towards high-quality, high-stakes work rather than disappeared.","In conclusion, smartphones have allowed ordinary people and small businesses to handle many simple photographic tasks, but professionals remain essential for their expertise and reliability on important occasions. Photographers should therefore focus on specialised services and creative skills that distinguish their work from what anyone can achieve with a phone."]]},{"id":"W2-OP-21","task":2,"type":"Opinion","prompt":["Some people believe that employees should be rewarded mainly according to how many years they have worked for a company, rather than their individual performance. What is your opinion?"],"imgs":[],"models":[["How employees are rewarded shapes not only their income but also their motivation and loyalty to an organisation. Some believe that pay and promotion should depend mainly on length of service, but in my view, while loyalty deserves recognition, individual performance should be the main criterion, as it motivates employees more effectively and treats talented staff more fairly.","Advocates of rewarding employees according to their years of service put forward some reasonable arguments. Firstly, a seniority-based system recognises loyalty and accumulated experience. Long-serving staff usually understand a company’s operations and culture in depth, and rewarding this dedication encourages people to stay, reducing the costs of constant recruitment and training. Secondly, such a system offers security and predictability. Because pay rises follow a clear timetable rather than a manager’s judgement, employees can plan their futures confidently, and accusations of favouritism are avoided. For example, Japan’s traditional seniority-based pay system was long credited with creating stable, loyal workforces in large corporations. However, this predictability comes at a cost, since it rewards people simply for remaining in their posts rather than for the quality of their contribution.","Nevertheless, I believe that performance ought to be the dominant factor, for two compelling reasons. Firstly, rewarding results is far more motivating for employees. When employees know that effort and achievement lead directly to recognition, they are encouraged to work harder, develop their skills and contribute new ideas, whereas a system based purely on tenure can breed complacency, since promotion arrives automatically with time. Secondly, a performance-based approach is fairer to talented individuals. It would be unjust for a highly capable newcomer who consistently delivers excellent work to be paid less than a long-serving colleague who does the bare minimum. Such inequality can quickly demoralise the most productive members of a team. To illustrate, a young salesperson who wins several major clients in her first year may leave for a competitor if she sees that rewards depend only on how long colleagues have stayed. For these reasons, performance offers a more equitable and dynamic basis for reward.","In conclusion, although rewarding years of service acknowledges loyalty and provides stability, individual performance should be the main consideration, as it drives motivation and rewards genuine ability. Employers should therefore base pay mainly on clear performance targets, while offering smaller long-service benefits to recognise loyalty."]]},{"id":"W2-OP-22","task":2,"type":"Opinion","prompt":["Some argue that history should no longer be a compulsory subject, since it has little relevance to modern working life. To what extent do you agree or disagree?"],"imgs":[],"models":[["As schools prepare students for an economy shaped by technology, subjects that do not lead directly to employment are increasingly being questioned. Some argue that history should no longer be compulsory because it has little relevance to modern working life, but I disagree. Although the curriculum must make room for new skills, history develops the critical thinking that employers value and helps young people become informed citizens.","The argument against compulsory history is understandable in a crowded curriculum. Firstly, schools face growing pressure to teach skills with obvious practical value. Subjects such as computer programming, financial literacy and foreign languages appear to prepare students more directly for the jobs of the future, and the time spent memorising dates and battles could be redirected towards them. Secondly, many students see little connection between past events and their future careers. Compulsory lessons in a subject they consider irrelevant can reduce their motivation and engagement at school. For example, a student who hopes to become a software developer may reasonably ask why lessons on ancient empires should take priority over extra programming practice. From this perspective, making history optional may seem a sensible way to modernise education.","However, history offers benefits that extend far beyond knowledge of the past. To begin with, studying history trains students to analyse evidence and evaluate sources. Students of history learn to compare conflicting accounts, identify bias and construct reasoned arguments, and these skills are directly relevant in workplaces where people must assess reports, data and competing claims, as well as in an age of online misinformation. In addition, history helps people understand the present and avoid repeating past mistakes. Knowing how economic crises, conflicts and social movements developed allows citizens and leaders to make better-informed decisions. A case in point is the 2008 financial crisis, when Ben Bernanke, then chairman of the US Federal Reserve and a scholar of the Great Depression, drew on lessons from the 1930s in shaping his response. Therefore, history is highly relevant to both modern working life and active citizenship.","In conclusion, while there is pressure to prioritise subjects with obvious career value, history should remain compulsory because it develops critical thinking and helps people learn from the past. Schools should therefore modernise how history is taught, focusing on analysis and source evaluation rather than memorisation."]]},{"id":"W2-OP-23","task":2,"type":"Opinion","prompt":["It is often claimed that children today are given access to smartphones at far too young an age. To what extent do you agree or disagree?"],"imgs":[],"models":[["Smartphones have become such an ordinary part of life that many children now receive their own device before they reach secondary school. I agree to a large extent that children are given smartphones at far too young an age, as early access can harm their development and expose them to online dangers. The main reasons parents give, such as safety and staying in contact, can be met in other ways.","Giving smartphones to young children carries serious risks. Firstly, excessive screen time can interfere with healthy development. Hours spent on games and videos often replace outdoor play, reading and face-to-face conversation, which are essential for physical health, language development and social skills, and late-night use can disturb children’s sleep. Secondly, a smartphone with Internet access exposes children to content and contacts they are not ready to handle. Violent material, cyberbullying and messages from strangers can reach a child within seconds, often without parents being aware. For example, a ten-year-old who joins an online group chat may be targeted by older users or pressured to share personal photographs. For these reasons, early ownership of smartphones poses real threats to children’s well-being.","Admittedly, many parents provide smartphones for understandable reasons, but these needs can be satisfied without a full smartphone. To begin with, parents want to contact their children and know where they are, particularly when they travel to school alone. However, a basic phone that only makes calls and sends text messages, or a simple GPS watch, achieves this without opening the door to social media and the wider Internet. In addition, some parents worry that children without smartphones will feel excluded by their peers. This pressure is real, but it can be reduced if schools and families agree to delay smartphone use together. To illustrate, France banned mobile phone use in primary and lower secondary schools in 2018, which reduced the pressure on individual families to give in. Therefore, the benefits of early smartphone ownership can be achieved through safer alternatives.","In conclusion, giving children smartphones too early risks harming their development and exposing them to online dangers, while the need for contact and inclusion can be met in other ways. Parents should therefore provide basic phones to young children and delay smartphone ownership until their children are mature enough to use one responsibly."]]},{"id":"W2-OP-24","task":2,"type":"Opinion","prompt":["Some argue that as artificial intelligence can now write essays and reports, teaching writing skills in schools is no longer necessary. Do you agree or disagree?"],"imgs":[],"models":[["Artificial intelligence tools can now produce essays, emails and reports within seconds, raising questions about what schools should teach. Some argue that writing instruction has therefore become unnecessary, but I disagree. Although students should learn to use AI effectively, writing remains essential because it develops clear thinking and gives people the ability to judge and improve machine-generated text.","The argument that writing skills are becoming obsolete has some basis. Firstly, AI tools are remarkably fast and fluent. They can draft a formal letter, summarise a report or produce a persuasive article in seconds, often with fewer grammatical errors than many human writers, so the time spent teaching these skills might appear wasteful. Secondly, the workplace is changing rapidly. Employees increasingly use AI to prepare first drafts, which suggests that students may need to learn how to instruct and edit these tools rather than write everything themselves. Knowing how to give precise instructions to AI may therefore seem more useful than practising essays. For example, a marketing assistant might ask an AI program to generate several versions of an advertisement and then simply choose the best one. From this perspective, schools might seem better off teaching students how to use AI.","However, writing remains a fundamental skill that AI cannot replace. To begin with, learning to write is inseparable from learning to think. Organising an argument, choosing evidence and expressing ideas precisely train students to reason clearly, and people who never practise these steps may struggle to form their own opinions or explain them in meetings and negotiations. In addition, only skilled writers can judge whether AI output is accurate and appropriate. AI tools can produce confident but false statements, and users who lack strong reading and writing skills may not notice the errors. A case in point is a 2023 court case in New York, in which lawyers were fined after submitting a legal document that cited fictitious cases invented by ChatGPT. Therefore, writing skills are more important than ever in an age of AI.","In conclusion, although AI can produce text quickly and is changing how people work, writing should still be taught because it develops thinking and allows people to evaluate machine-generated content. Schools should therefore continue to teach writing while showing students how to use AI responsibly as a tool for drafting and revision."]]},{"id":"W2-OP-25","task":2,"type":"Discussion","prompt":["Some people argue that governments should spend money on public transport rather than building new roads. Others believe that roads deserve more investment. Discuss both views and give your own opinion."],"imgs":[],"models":[["How governments divide their transport budgets has a profound effect on economic growth, the environment and daily life. Some argue that money should go to public transport, which moves people efficiently and reduces pollution, while others believe that new roads are needed to support trade and connect rural areas. In my opinion, public transport should be the priority in cities, while road investment should focus on rural and freight connections.","Those who favour road building emphasise its importance for the economy and for rural communities. Firstly, roads remain the backbone of trade. Most goods, from fresh produce to construction materials, travel at least part of their journey by lorry, so well-maintained highways reduce delivery times and costs for businesses and consumers. Secondly, in rural areas, roads are often the only practical form of transport. Villages with small, scattered populations cannot support frequent bus or rail services, and residents depend on roads to reach markets, schools and hospitals. For example, a paved road connecting a mountain village to the nearest town can allow farmers to sell their crops before they spoil and enable ambulances to reach patients quickly. From this perspective, road investment is essential for economic development and access to services.","Supporters of public transport, however, argue that it offers a more efficient and sustainable way to move people, particularly in cities. To begin with, buses and trains carry far more passengers per unit of road space than private cars. In densely populated cities where there is little room to build new roads, investing in mass transit is the most effective way to reduce congestion. Building more roads in such areas often encourages more people to drive, so traffic soon returns to its previous level. A case in point is Bogotá, whose TransMilenio bus rapid transit system uses dedicated lanes to carry large numbers of commuters every day. In addition, public transport significantly reduces pollution in urban areas. When fewer people drive, emissions of carbon dioxide and harmful particles fall, which improves air quality and public health. Therefore, public transport offers clear advantages for urban areas.","In conclusion, roads are vital for trade and rural access, while public transport moves city residents more efficiently and cleanly. Governments should therefore direct most urban transport spending towards buses and trains, while reserving road investment for rural connections and key freight routes."]]},{"id":"W2-OP-26","task":2,"type":"Opinion","prompt":["Some argue that the rising cost of healthcare means people who make unhealthy lifestyle choices, such as smoking or eating fast food, should pay more for medical treatment. To what extent do you agree or disagree?"],"imgs":[],"models":[["As populations age and medical technology becomes more sophisticated, the cost of healthcare is rising in almost every country. Some argue that people who smoke or eat unhealthily should therefore pay more for treatment, but I largely disagree. Although personal responsibility matters, such a policy would be unfair and difficult to apply, and taxing unhealthy products is a more effective way to control costs.","Supporters of this proposal make two reasonable points. Firstly, they argue that individuals should take responsibility for the consequences of their choices. If someone knowingly smokes for decades despite clear health warnings, it seems unfair that taxpayers who live healthily should share the full cost of treating the resulting lung disease. Many people feel that those who take deliberate health risks should contribute more to the costs they create. Secondly, higher charges might discourage unhealthy behaviour. The prospect of paying more for future treatment could persuade some people to quit smoking or improve their diets, reducing the burden on health services over time. For example, health insurers in the United States are permitted to charge smokers higher premiums than non-smokers. From this perspective, linking costs to lifestyle may appear fair and economical.","Nevertheless, I believe charging certain patients more for treatment would create serious problems. To begin with, unhealthy lifestyles are rarely a matter of free choice alone. Poverty, stress, limited access to fresh food, addiction and genetic factors all influence health, so higher charges would fall most heavily on disadvantaged groups who already suffer the worst health outcomes. Moreover, it is often impossible to prove what caused an illness, and patients who fear large bills might delay treatment until their condition becomes more serious and more expensive. Instead, governments can target the products themselves. Taxes on tobacco, alcohol and sugary drinks raise revenue for healthcare while encouraging healthier choices before illness occurs. To illustrate, after the United Kingdom introduced a levy on sugary soft drinks in 2018, many manufacturers reduced the sugar content of their products. Therefore, taxing unhealthy products is fairer and more effective than penalising patients.","In conclusion, although making people pay for unhealthy choices appeals to a sense of personal responsibility, it would punish disadvantaged groups and discourage timely treatment. Governments should therefore keep healthcare accessible to all, while using taxes on harmful products and public education to promote healthier lifestyles."]]},{"id":"W2-OP-27","task":2,"type":"Opinion","prompt":["Rich countries should accept more responsibility for reducing climate change than poorer countries, since they have historically caused most of the pollution. To what extent do you agree or disagree?"],"imgs":[],"models":[["Climate change is a global problem, but the countries that did most to cause it are often not the ones that suffer from it most. I agree to a large extent that wealthy nations should accept greater responsibility for reducing climate change, since they produced most historical emissions and have the resources to act. However, poorer countries cannot be exempt entirely, as some of them are now among the largest polluters.","There are strong reasons why rich countries should bear the greater burden. Firstly, they are responsible for most of the carbon dioxide that has accumulated in the atmosphere. Industrialised nations in Europe and North America burned coal, oil and gas for more than a century to build their economies, while many developing countries are only now industrialising. It would therefore be unjust to expect poorer nations to pay equally for a problem they did little to create. Secondly, wealthy countries have the financial and technological capacity to cut emissions quickly. They can afford to invest in renewable energy, electric transport and efficient buildings, and to help poorer nations do the same. This principle has long been recognised internationally. For example, the 1992 United Nations Framework Convention on Climate Change refers to the \"common but differentiated responsibilities\" of developed and developing countries. For these reasons, rich nations should lead the global response.","Nevertheless, responsibility cannot rest with rich countries alone. To begin with, emissions from some developing economies have grown rapidly in recent decades. As their industries and cities expand, these countries now contribute a large and rising share of global greenhouse gases. A case in point is China, which has become the world’s largest annual emitter of carbon dioxide. In addition, poorer countries also benefit from acting early, since climate change will hit them hardest. Investing in clean energy can reduce air pollution, create new industries and protect vulnerable communities from floods and droughts. Therefore, while the main burden should fall on wealthy nations, all countries must contribute according to their capacity.","In conclusion, rich countries should accept greater responsibility because they caused most historical pollution and can afford to act, but rapidly growing economies must also reduce their emissions. Wealthy nations should therefore cut their own emissions faster and provide finance and technology to help developing countries grow sustainably."]]},{"id":"W2-AD-01","task":2,"type":"Advantages and disadvantages","prompt":["In many countries, teenagers are encouraged to do part-time jobs. What do you think are the advantages and disadvantages of teenagers doing part-time jobs?"],"imgs":[],"models":[["In many countries, teenagers are increasingly encouraged to take part-time jobs alongside their studies, both to earn money and to gain experience of the working world. Such work can teach young people financial responsibility and practical skills, but it can also interfere with their schoolwork and place them under considerable stress.","The main advantages of part-time work lie in the financial lessons and practical skills it provides. Firstly, earning their own money teaches teenagers its value. When young people have to work for several hours to afford a new phone or a concert ticket, they learn to budget, save and think carefully before spending, habits that will serve them throughout adult life. Secondly, a part-time job develops skills that schools rarely teach directly. Serving customers, working in a team and arriving on time for every shift build communication skills, punctuality and a sense of responsibility. For example, a teenager working weekends in a café quickly learns to stay polite with demanding customers and to coordinate with colleagues during busy periods. Such experience can also strengthen future job applications. For these reasons, part-time work can make an important contribution to a young person’s maturity.","However, part-time jobs also carry significant disadvantages, particularly for teenagers’ education and well-being. To begin with, working too many hours can damage academic performance. Students who come home tired after an evening shift have less time and energy for homework and revision, and their grades may suffer at a crucial stage of their education. In addition, juggling school, work and family responsibilities can cause considerable stress. Teenagers with jobs often have less time for rest, sport and friends, which are important for their physical and mental health, and some feel constant pressure to perform well in every area of their lives. To illustrate, a student who works late shifts at a supermarket during exam season may struggle to sleep enough and arrive at school exhausted. Consequently, part-time work can harm the very education that should be a teenager’s main priority.","In conclusion, part-time jobs can help teenagers manage money and develop valuable workplace skills, but they may also lower academic performance and increase stress. Parents and employers should therefore ensure that teenagers work only a limited number of hours, particularly during examination periods, so that the benefits of employment do not come at the expense of their studies."]]},{"id":"W2-AD-02","task":2,"type":"Advantages and disadvantages","prompt":["In many cities, problems related to overpopulation are becoming more common. Some governments are now encouraging businesses and individuals to move out of cities to rural areas.","Do the advantages of this policy outweigh the disadvantages?"],"imgs":[],"models":[["As cities in many countries become increasingly crowded, problems such as traffic congestion, pollution and housing shortages are growing more severe. In response, some governments are encouraging businesses and residents to move to rural areas. Although this policy may cause difficulties for those who relocate and put pressure on rural resources, I believe its advantages, namely relief for overcrowded cities and new growth in the countryside, are greater.","Admittedly, moving businesses and people to rural areas has some drawbacks. Firstly, rural areas often lack the services and facilities that city dwellers and companies rely on. Hospitals, universities, shopping centres and fast transport links are usually less available in the countryside, so businesses may struggle to recruit skilled staff and reach customers, while families may feel isolated. Secondly, a sudden influx of newcomers can strain local resources. Increased demand for housing, water and electricity may exceed what rural infrastructure can supply, and rapid development may disrupt traditional ways of life, creating tension between new arrivals and long-term residents. For example, a quiet village that suddenly becomes home to a large factory and its workers may face rising rents and overcrowded local schools. From this perspective, relocation is not without its costs.","Nevertheless, I would contend that the benefits of this policy are more significant. To begin with, it can reduce the burden on overcrowded cities. When some companies and residents move elsewhere, traffic, pollution and pressure on housing and public services in urban centres decrease, improving the quality of life for those who remain. In addition, the policy can drive economic growth in rural areas. New businesses create jobs and attract investment, which allows young people to find work near their home towns rather than migrating to cities, while residents enjoy a healthier, less stressful lifestyle. To illustrate, South Korea relocated many government ministries and public agencies to the new administrative city of Sejong, partly to ease congestion in Seoul and spread development more evenly. Therefore, the advantages of encouraging relocation outweigh its drawbacks.","In conclusion, although moving businesses and people to rural areas may limit access to services and strain local resources, it eases urban overcrowding and revitalises the countryside. Governments should therefore support this policy with investment in rural infrastructure, such as transport, healthcare and broadband, so that relocation benefits both cities and rural communities."]]},{"id":"W2-AD-03","task":2,"type":"Advantages and disadvantages","prompt":["With the development of the Internet, e-books have become more common than ever and it is believed that digital books will completely replace traditional libraries soon.","What do you think are the advantages and disadvantages of using digital books?"],"imgs":[],"models":[["The spread of the Internet and portable devices has made digital books more popular than ever, leading some to predict that traditional libraries will soon disappear. E-books offer readers convenience and lower costs, but they also raise concerns about readers’ health and the reliability of the content available online.","The main advantages of digital books are their convenience and affordability. Firstly, e-books can be obtained and read almost anywhere. Instead of travelling to a library and searching the shelves, readers can download a title within seconds, and a single tablet can hold thousands of books without adding any weight to a bag. For example, a student travelling abroad can carry an entire reading list on one device rather than packing a suitcase full of textbooks. Secondly, digital books are usually cheaper than printed ones. Because they require no paper, printing or physical distribution, publishers can sell them at lower prices, and many classic works are available free of charge. This makes reading more affordable, particularly for students and people on low incomes. Libraries, by contrast, may have only a few copies of popular titles, forcing readers to wait weeks to borrow them. For these reasons, e-books have clear appeal for modern readers.","However, digital books also have notable drawbacks. To begin with, reading on screens for long periods can harm people’s health, especially their eyesight. Staring at a bright display may cause eye strain, headaches and disturbed sleep, especially when people read on their phones late at night. Over time, heavy screen use may also contribute to short-sightedness, particularly among children and teenagers. In addition, the quality of content available online is less controlled than that of printed books. Anyone can publish a digital book on the Internet without editing or fact-checking, so readers, particularly children, may come across books containing inaccurate information or harmful ideas. To illustrate, online bookstores have been criticised for selling large numbers of low-quality, machine-generated e-books that imitate the work of real authors. Consequently, many readers still prefer printed books from trusted publishers and well-stocked libraries.","In conclusion, e-books offer convenience and lower costs, but they can strain readers’ eyes and expose them to unreliable content. Digital books and traditional libraries are therefore likely to coexist, and readers should make use of both while taking regular breaks from their screens."],["Advances in technology have made digital books increasingly common, prompting debate about whether traditional libraries will eventually become obsolete. E-books make reading more accessible and are better for the environment, yet they offer a less immersive reading experience and leave readers entirely dependent on technology.","Digital books bring important benefits in terms of accessibility and environmental impact. Firstly, they make a vast range of titles available to readers wherever they are. New releases can be downloaded instantly without waiting for a library copy, and features such as adjustable text size, built-in dictionaries, highlighting and note-taking make reading easier, especially for people with poor eyesight. For example, an elderly reader who struggles with small print can simply enlarge the text on an e-reader. Readers in remote areas without a nearby library also gain access to the same books as those in large cities. Secondly, e-books can reduce the environmental impact of publishing. Since they require no paper, ink or delivery trucks, a wider shift towards digital reading could help reduce deforestation and transport emissions. In this sense, e-books benefit both individual readers and the wider environment in important ways.","Despite these positive aspects, digital books also have certain drawbacks. To begin with, many readers find the experience less satisfying and less focused than reading a printed book. Physical books offer the feel of paper and the pleasure of turning pages, while reading on a tablet or phone exposes people to notifications and advertisements that interrupt their concentration. Many people also find it harder to remember what they have read on a screen than on paper. In addition, e-books depend entirely on devices and digital platforms. Readers need a charged device and sometimes an Internet connection, and they often buy only a licence to read a book rather than owning it permanently. To illustrate, in 2009 Amazon remotely deleted copies of two George Orwell novels from customers’ Kindle devices because of a rights dispute, showing that digital purchases can disappear. Therefore, printed books and libraries still have an important role to play in modern society.","To sum up, e-books make reading more accessible and environmentally friendly, but they can be less immersive and leave readers dependent on technology. Libraries should therefore offer both digital and printed collections, allowing readers to choose the format that best suits their needs."]]},{"id":"W2-AD-04","task":2,"type":"Advantages and disadvantages","prompt":["Children today spend more time watching television than they did in the past. Describe some of the advantages and disadvantages of the increase in TV time for children."],"imgs":[],"models":[["Children today have access to more television channels and streaming services than ever before, and many spend several hours a day in front of a screen. Increased television viewing can support children’s learning and encourage better programmes for young audiences, but it also reduces physical activity and social interaction and may expose them to inappropriate content.","There are some genuine advantages to children watching more television. Firstly, well-chosen programmes can support learning. Educational shows introduce children to subjects such as science, history, wildlife and languages in a lively, visual way, which can spark curiosity and help them understand ideas that seem dull in textbooks. For example, nature documentaries allow children to observe animals and ecosystems from around the world that they could never visit in person. Secondly, a larger young audience encourages broadcasters to produce better children’s content. As competition for children’s attention increases, media companies invest more in creative, high-quality programmes designed for different age groups, which ultimately benefits young viewers. Some programmes also help children learn a foreign language by exposing them to native speakers from an early age. In short, increased television viewing can have educational value when programmes are carefully selected.","However, the disadvantages of this trend are serious. To begin with, time spent watching television often replaces more valuable activities. Children who sit in front of a screen for hours spend less time playing outdoors, reading and talking with family and friends, which can harm both their physical fitness and their communication skills. Over time, a sedentary lifestyle increases the risk of problems such as obesity and poor eyesight. In addition, unrestricted viewing may expose children to violent or otherwise inappropriate content. Young children often imitate what they see, so frequent exposure to aggressive behaviour on screen can make them more irritable or more likely to copy it. To illustrate, a young child who regularly watches action cartoons full of fighting may begin to act out these scenes with siblings or classmates. Therefore, the drawbacks of increased screen time should not be overlooked.","In conclusion, increased television viewing can help children learn and encourage better programming, but it also reduces physical activity and social interaction and can expose them to harmful content. Parents should therefore limit their children’s screen time and choose age-appropriate, educational programmes for them to watch."]]},{"id":"W2-AD-05","task":2,"type":"Advantages and disadvantages","prompt":["Technology has allowed monetary transactions to take place in virtual form, so the use of cash is on the trend of becoming less common.","What are the advantages and disadvantages of digital transactions (credit cards, bank transfers, virtual wallets, etc.)?"],"imgs":[],"models":[["In recent decades, technology has transformed the way people pay for goods and services, and cash is gradually being replaced by cards, bank transfers and mobile wallets. Digital transactions are fast, convenient and in many ways secure, but they also raise concerns about privacy and leave users heavily dependent on technology.","Digital payments offer clear advantages in convenience and security. Firstly, they allow people to pay almost instantly, wherever they are. With a few taps on a smartphone, users can buy goods online, split a restaurant bill or send money to relatives in another city, without visiting a bank or carrying cash. For example, in China, mobile payment apps such as Alipay and WeChat Pay are used for everything from paying rent to buying street food. Secondly, modern digital payment systems include strong security features. Fingerprint and facial recognition, one-time passwords and automatic fraud detection make it difficult for thieves to use a stolen card or phone, whereas lost cash is usually gone for good. Digital payments also leave a record, so disputed or fraudulent charges can often be traced and refunded. Therefore, digital transactions are both convenient and, in many respects, safer than cash.","On the other hand, digital transactions bring certain risks and limitations. To begin with, they raise serious concerns about privacy. Every digital payment creates a record of where, when and on what a person spends money, and this data can be collected by companies or stolen by hackers, exposing users to fraud and identity theft. Many users are also unaware of how much of their personal information is being shared with third parties. In addition, cashless payments depend entirely on working technology. When networks fail or devices run out of battery, people may be unable to pay for even basic necessities, and this problem is worse in areas with unreliable Internet access. To illustrate, a global IT failure in July 2024 temporarily disrupted card payments and banking services in several countries, leaving some shoppers unable to pay. Consequently, relying solely on digital payments can leave people vulnerable.","In conclusion, digital transactions offer speed, convenience and strong security features, but they also threaten privacy and create dependence on technology. Governments and banks should therefore strengthen data protection and ensure that cash remains available as a backup, so that everyone can pay safely and reliably."],["As technology advances, cards, bank transfers and digital wallets are steadily replacing cash in many countries, raising the question of whether physical money will eventually disappear. Digital transactions bring considerable benefits in efficiency and financial management, but they can also encourage overspending and exclude people who lack digital skills.","There are a number of merits associated with digital transactions. Firstly, they make payments faster and more efficient. Transfers can be made at any time of day, without visiting a bank or counting out notes, which is particularly useful for large sums or payments to people in other countries. For example, a small business owner can pay suppliers and receive payments from customers online within minutes, rather than handling large amounts of cash. This also reduces the risk of theft and the time spent travelling to banks. Secondly, digital payments make it easier to manage money. Every transaction is recorded automatically, so users can check their spending history, set budgets and identify unnecessary expenses through banking apps, while businesses can track their income and costs more accurately. Indeed, electronic payments bring advantages in terms of both convenience and financial control.","Despite these positive aspects, digital transactions also have drawbacks. To begin with, they can encourage people to spend more than they intend. Paying with a card or phone feels less real than handing over cash, so consumers may lose track of how much they are spending, and easy access to credit can lead to debt. Features such as one-click shopping and buy-now-pay-later schemes make impulsive purchases even easier. In addition, a move towards cashless payments can exclude certain groups. Elderly people, those on low incomes and people living in remote areas may lack smartphones, bank accounts or the digital skills needed to use these services. To illustrate, in Sweden, where cash has largely disappeared from everyday use, concerns about older people struggling to pay for goods and services led the government to require major banks to continue providing cash services. Therefore, digital transactions can create new financial risks and inequalities.","To sum up, digital transactions offer speed and better financial management, but they may encourage overspending and leave vulnerable groups behind. Governments should therefore ensure that cash remains widely accepted, while banks provide clear spending tools and digital training for those who need it."]]},{"id":"W2-AD-06","task":2,"type":"Advantages and disadvantages","prompt":["Exams have been the most widely used form of student assessment for a very long time. However, it is believed that although exams are useful for evaluating student progress, it is not the optimal method.","What advantages and disadvantages may exams have in academic assessment?"],"imgs":[],"models":[["Exams have been the main way of assessing students for generations, and they remain central to education systems worldwide. They offer a standardised and efficient way to measure knowledge, but they tend to encourage memorisation rather than understanding and can cause considerable stress.","Exams bring two important benefits to academic assessment. Firstly, they provide a standardised and fair way of evaluating students. Every candidate answers the same questions under the same conditions and is marked against the same criteria, which reduces the influence of personal bias and allows results to be compared across schools and regions. For example, China’s national college entrance examination, the gaokao, allows universities to compare millions of applicants from very different backgrounds on the same scale. Secondly, exams are efficient. They can assess a broad range of knowledge in a few hours and can be given to large numbers of students at once, which makes them practical for schools and education systems with limited time and resources. Results are also returned quickly, allowing schools to make decisions about grades, placements and university admissions efficiently. Therefore, exams remain a useful tool for evaluating students.","On the other hand, exams have significant limitations as a method of assessment. To begin with, they mainly reward the ability to recall information under time pressure. Students may therefore focus on memorising facts and practising past papers rather than developing deep understanding, creativity or problem-solving skills, which are vital in the real world. Teachers, too, may feel pressure to teach to the test, narrowing the curriculum to what is likely to be examined. In addition, high-stakes exams can cause intense stress and anxiety. When a single test determines access to a university or a scholarship, many students suffer from sleepless nights and exhaustion, and anxiety can prevent them from performing to the best of their ability. To illustrate, a capable student who panics in the examination room may receive a grade that does not reflect years of hard work. These points considered, exams alone cannot provide a complete picture of students’ abilities.","In conclusion, exams offer a fair, standardised and efficient way of assessing large numbers of students, but they encourage rote learning and place students under heavy pressure. Schools should therefore combine exams with ongoing assessment methods such as projects, presentations and coursework, to give a fuller picture of each student’s progress."],["Teachers evaluate students in two main ways, through summative assessment such as final exams and through formative assessment, which takes place continuously during a course. Exams provide a clear, objective record of achievement and motivate students to review their learning, but they offer little feedback and may not reflect students’ true abilities.","Summative exams bring several benefits to students and schools. Firstly, they produce clear and objective results. Because all students take the same test, marks can be compared fairly, and the scores collected over several years create a record of each student’s achievement that universities and employers can easily understand. Teachers can also use these results to judge how effective their teaching has been and adjust their methods accordingly. Secondly, exams motivate students to consolidate what they have learned. The need to prepare for a final test encourages them to review an entire course, connect different topics and organise their knowledge. A clear deadline also encourages students to plan their study time carefully. For example, students revising for an end-of-year history exam must revisit topics from the beginning of the year that they might otherwise have forgotten. Indeed, exams can benefit both learners and teachers in several important ways.","Despite these positive aspects, exams also have certain drawbacks. To begin with, they provide limited feedback. A final mark shows how well a student performed overall, but it rarely explains which skills need improvement, and it often arrives after the course has ended, when it is too late to make changes. Formative assessment, by contrast, offers regular feedback that students can act on immediately. In addition, a single exam captures performance in only one day, which may not reflect a student’s real ability. Illness, personal problems or exam anxiety can lower a result, while luck with the questions can raise it. To illustrate, a student who falls ill on the morning of a final exam may receive a low grade despite having understood the course thoroughly. Therefore, exams alone are not the most accurate measure of learning.","In conclusion, exams provide objective records and encourage students to review their learning, but they offer little useful feedback and can misrepresent students’ abilities. Schools should therefore combine final exams with regular formative assessment, so that students receive both a reliable record of achievement and ongoing guidance."]]},{"id":"W2-AD-07","task":2,"type":"Advantages and disadvantages","prompt":["It is becoming increasingly common in developing countries for people to move from the countryside or rural regions to growing cities and urban centers.","Do the advantages of this trend outweigh its disadvantages?"],"imgs":[],"models":[["Rapid industrialisation in many developing nations has turned their cities into magnets for people seeking a better life. As a result, growing numbers of rural residents are leaving their villages for urban centres, drawn by wider job opportunities and greater scope for personal development. In my view, however, the long-term strain this trend places on cities, particularly on public services and housing, outweighs these benefits.","Admittedly, moving to a city offers migrants better employment prospects and chances for personal growth. To begin with, urban areas host a wider variety of businesses and occupations than the countryside, where work is largely limited to farming. This variety enables newcomers to secure stable employment and earn higher salaries, part of which they often send home to support their families. For example, a young person from a farming village may find work in the technology or finance sector, where wages are considerably higher than those in agriculture. In addition, city life exposes individuals to diverse cultures, lifestyles and ideas, which helps to broaden their horizons. By working in large companies, they interact with colleagues from different backgrounds and take part in training programmes, gradually becoming more independent and adaptable. For these reasons, urban migration can significantly improve the incomes and personal growth of those who make the move.","Nevertheless, a rapid inflow of rural migrants places a heavy burden on urban infrastructure and housing, which ultimately lowers residents’ quality of life. Firstly, when cities expand faster than their infrastructure, hospitals, schools and public transport become overcrowded and less efficient. Roads also become congested as more people commute by private vehicle, lengthening journeys and worsening air pollution. To illustrate, chronic congestion and overcrowding in Jakarta were among the main reasons the Indonesian government decided to build a new capital, Nusantara. Secondly, the growing demand for accommodation often leads to housing shortages, causing rents to rise dramatically. Low-income residents, including many migrants themselves, may then be forced into cramped rooms or informal settlements with poor sanitation. Consequently, the financial gains of urban employment are often undermined by the declining living conditions that accompany them.","To conclude, although moving to cities offers rural people better jobs and opportunities for personal growth, the resulting pressure on public services, transport and housing is the more serious consequence. Governments should therefore manage the flow of rural migrants more carefully and invest more in urban infrastructure and public services, so that cities can absorb newcomers without a decline in living standards."]]},{"id":"W2-AD-08","task":2,"type":"Advantages and disadvantages","prompt":["Young people are often influenced in their behaviors by others in the same age group. Some argue that peer pressure is important while others feel it has distinct disadvantages.","Do the disadvantages of peer pressure outweigh the advantages?"],"imgs":[],"models":[["Adolescence is a period when the opinions of friends often matter more than those of parents or teachers. While some argue that this influence gives young people a sense of belonging and encourages healthy habits, others contend that it draws them into harmful behaviour and suppresses their individuality. Personally, I believe that despite its undeniable merits, the disadvantages of peer pressure outweigh its advantages.","Admittedly, positive peer pressure can strengthen young people’s social bonds and encourage healthier lifestyles. Firstly, the desire to be accepted by peers can foster a sense of belonging and loyalty within a group. Since acceptance from friends contributes to their emotional well-being and self-esteem, young people are motivated to improve their social skills and become more cooperative with others. For example, a shy student who joins a school football team may learn to communicate and cooperate in order to fit in. In addition, groups of friends can encourage one another to adopt healthy habits. When a group values exercise or a smoke-free lifestyle, individual members are likely to follow these norms rather than risk standing out. Therefore, in the right circumstances, peer pressure can play a constructive role in adolescent development.","However, the drawbacks of peer pressure are more serious, as it can lead young people into harmful behaviour and stifle their individuality. The most pressing concern is that impressionable teenagers who lack proper guidance may be drawn to irresponsible peer groups. To gain acceptance, they could succumb to pressure to engage in substance abuse, petty crime or fighting, all of which can have long-lasting consequences and jeopardise their future. To illustrate, a student who begins skipping classes to spend time with older friends may fall so far behind that they fail their final examinations. Moreover, constant pressure to conform can erode individuality and creativity. Young people may abandon their own interests and aspirations to match the norms of their group, which limits their personal growth and independent thinking. Consequently, the damage caused by negative peer pressure is often lasting, whereas its benefits can usually be gained through safer means such as family support and school clubs.","In conclusion, although peer pressure can foster a sense of belonging and promote healthy habits, its tendency to lead young people astray and suppress their individuality makes its disadvantages greater. Parents and educators should therefore teach teenagers to make informed decisions and resist harmful influences, while encouraging them to join positive groups such as sports teams."]]},{"id":"W2-AD-09","task":2,"type":"Advantages and disadvantages","prompt":["Nowadays, a lot of offices employ open-space designs instead of giving employees separate rooms to work privately.","Do the advantages of this outweigh the disadvantages?"],"imgs":[],"models":[["Over the past few decades, many companies have replaced private offices with open-plan layouts in the hope of creating a more efficient workplace. While this design encourages collaboration and lowers costs, I believe its drawbacks for concentration, privacy and employee well-being outweigh these benefits.","Admittedly, open offices benefit both staff and employers by encouraging collaboration and reducing costs. Firstly, the absence of walls makes communication easier. Colleagues can exchange ideas and solve problems on the spot rather than waiting for scheduled meetings, which can speed up projects, and junior employees may feel more included when they sit alongside managers and see how decisions are made. Secondly, open layouts are cheaper to build and run. A company can fit more workers into a smaller floor area and spend less on construction, heating and lighting. Furniture can also be rearranged easily as teams grow or projects change. For example, a start-up with limited capital can house its entire team in one modest room, saving money that can be invested in developing its products. In short, open-plan designs have genuine value for both teamwork and company budgets.","However, these benefits often come at a high price for employees’ concentration, privacy and
