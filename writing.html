tudios have resources that most local firms cannot match. With enormous budgets, they can hire leading talent and invest in special effects, sophisticated game design and worldwide marketing, so their products often appear more polished and exciting than domestic alternatives. Another factor is the reach of global distribution platforms. Services such as Netflix, Spotify and Steam recommend international titles to users every day, and young people who follow online trends naturally consume whatever their peers abroad are discussing. For example, a Hollywood blockbuster or a popular Japanese animated series can become a topic of conversation among Vietnamese teenagers within days of its release. For these reasons, foreign products have a clear advantage in both quality and visibility.","Given this imbalance, I would contend that public funding for local entertainment firms is justified. Firstly, a strong domestic industry helps preserve a nation’s cultural identity. Films, songs and games that draw on local history, language and values allow young people to see their own culture represented in an attractive, modern form, which counters the gradual dominance of foreign norms. Secondly, such investment can deliver significant economic returns. A thriving creative sector creates jobs, earns export revenue and enhances a country’s international image, which in turn benefits tourism and related industries. A case in point is South Korea, where sustained government support for its content industries contributed to the global success of K-pop and Korean dramas. Admittedly, subsidies can be wasted if they are poorly targeted, but this is an argument for careful management rather than for withholding support. Therefore, well-designed funding can make local productions more competitive and culturally valuable.","In conclusion, young people favour foreign entertainment because of its superior production quality and easy availability, but government support for local firms can protect cultural identity while generating economic benefits. Authorities should therefore fund promising projects and training schemes, while requiring recipients to meet clear quality targets."]]},{"id":"W2-TQ-03","task":2,"type":"Two-part question","prompt":["With increasing populations and ever growing urban centres, many countries are losing their natural beauty spots and green areas.","What benefits are there in protecting places of natural beauty? How can this issue be solved?"],"imgs":[],"models":[["As urban areas spread outwards to accommodate growing populations, forests, wetlands and coastlines are increasingly being cleared for housing and infrastructure. Protecting these places of natural beauty brings important environmental benefits and improves people’s health and quality of life, and the problem can be addressed through stricter planning controls and greener urban design.","Preserving natural areas benefits both the environment and the people who live near them. To begin with, untouched landscapes support ecosystems that cities cannot replace. Forests and wetlands provide habitats for countless species, absorb carbon dioxide and act as natural barriers against floods, so their destruction leaves surrounding communities more exposed to extreme weather. For example, mangrove forests along tropical coastlines reduce the impact of storm surges, protecting nearby villages from serious damage. In addition, natural spaces offer considerable benefits for physical and mental well-being. Access to parks, lakes or hills encourages people to exercise outdoors and gives them a place to escape the noise and pressure of city life, which helps reduce stress. Many of these areas also attract visitors, generating income from tourism without the need to build on them. Taken together, these ecological and social advantages show that natural beauty spots are far more than decoration.","Tackling the loss of such places requires action from governments and urban planners. Firstly, authorities should introduce stronger legal protection for valuable natural sites. Designating them as national parks or conservation zones, and requiring a thorough environmental impact assessment before any large construction project, would prevent developers from building on irreplaceable land for short-term profit. Secondly, cities can be designed to grow upwards rather than outwards, with nature integrated into the urban environment. Compact, high-density housing near public transport reduces the pressure to clear the surrounding countryside, while green roofs, parks and tree-lined streets bring nature back into built-up areas. To illustrate, Singapore has combined high-rise living with extensive parks and planted buildings, preserving considerable green cover despite its limited land. Therefore, a combination of firm regulation and intelligent planning can allow cities to expand without sacrificing their natural surroundings.","In summary, protecting places of natural beauty safeguards biodiversity, shields communities from environmental hazards and supports public well-being. If governments enforce strict conservation laws and adopt compact, green urban design, they can meet the needs of growing populations while preserving these landscapes for future generations."]]},{"id":"W2-TQ-04","task":2,"type":"Two-part question","prompt":["The Internet is a valuable source of news and information. Due to this, some people are afraid that information found online can be unreliable, and sometimes dangerous.","How true do you think this is?","How can the quality of information online be controlled?"],"imgs":[],"models":[["Over the past two decades, the Internet has replaced newspapers and television as the first source of news for many people. I believe the concern that online information can be unreliable and even dangerous is largely justified, since content can be published without verification and can easily reach vulnerable users. Nevertheless, its quality can be improved through firmer regulation of online platforms and better education for users.","There is considerable truth in the claim that online information is often untrustworthy and occasionally harmful. Firstly, the Internet lacks the editorial checks that traditional media rely on. Whereas a newspaper article normally passes through editors and fact-checkers before publication, anyone can post a blog, video or social media update instantly, so errors, rumours and deliberate falsehoods circulate freely alongside accurate reporting. Secondly, harmful material can reach the people who are least able to judge it. Children and emotionally vulnerable users may come across violent videos or misleading advice and accept them without question. For example, dangerous viral challenges have encouraged some teenagers to copy risky stunts they saw online, occasionally with serious consequences. Admittedly, the Internet also hosts highly reliable sources, such as official government websites and established news outlets, but users cannot always distinguish them from the rest. For these reasons, the fears surrounding online information are well founded.","The quality of online information can nevertheless be controlled through action by authorities and by users themselves. To begin with, governments can hold large platforms legally responsible for the content they host. If companies face fines for failing to remove clearly false or harmful material promptly, they will have a strong incentive to invest in moderation teams and automated detection systems. In addition, education can equip people to protect themselves. When schools teach students how to check the source of a claim, compare several reports and recognise manipulated images, young people become far less likely to be misled. A case in point is Finland, where media literacy has been taught in schools for years and is widely credited with making the public more resistant to false news. Consequently, regulation and education together can significantly reduce the spread and impact of unreliable content.","In conclusion, the concern about online information is largely valid, as content is published without verification and can harm vulnerable groups, yet stricter platform accountability and media literacy education can raise its quality. Governments should therefore pursue both measures at once, since neither is sufficient on its own."],["The speed at which news now travels online means that a single post can reach millions of people before anyone has checked whether it is true. In my view, the belief that online information can be unreliable and dangerous is accurate to a great extent, particularly because algorithms reward sensational content and false advice can directly harm people’s health. However, this risk can be reduced if platforms label misleading posts and give greater prominence to trustworthy sources.","The concern about online information is justified mainly because of the way platforms spread content and the real damage that falsehoods can cause. To begin with, social media algorithms tend to promote posts that attract strong reactions rather than those that are accurate. Shocking or emotional claims are shared more widely than careful corrections, so misinformation often reaches a far larger audience than the facts that disprove it. Moreover, inaccurate information can have dangerous consequences when it concerns health or safety. People who follow unproven remedies may delay seeking proper medical treatment or take substances that harm them. For instance, during the COVID-19 pandemic, false claims about miracle cures and vaccine risks circulated widely and led some people to make harmful decisions. While reliable information is also available online, it frequently competes on unequal terms with these more attention-grabbing falsehoods. Therefore, the danger posed by unreliable online content is very real.","Controlling the quality of information online depends largely on how platforms present content to users. Firstly, platforms can attach warnings or additional context to posts that have been identified as misleading. A label linking to a verified correction does not remove the post, which respects freedom of expression, yet it alerts readers before they accept or share a claim. Secondly, search engines and social networks can give higher priority to authoritative sources on sensitive topics. When users search for medical or emergency information, results from health authorities and recognised experts should appear first. To illustrate, during the pandemic, YouTube and Google displayed panels directing users to official public health guidance. Taken together, these measures guide users towards accurate information without resorting to heavy-handed censorship.","To sum up, online information is often unreliable because algorithms amplify sensational claims, and it can be dangerous when it concerns health. Technology companies should therefore expand warning labels and promote verified sources, while governments monitor whether these measures are applied consistently."]]},{"id":"W2-TQ-05","task":2,"type":"Two-part question","prompt":["Some parents buy their children whatever they ask for, and allow their children to do whatever they want.","Why do parents choose to raise their children this way? What effects could this style of parenting have for children as they get older?"],"imgs":[],"models":[["As incomes have risen and families have shrunk in many countries, children today often enjoy more material comfort and freedom than any previous generation. Some parents grant their children almost every wish, often to compensate for the limited time they spend together or because they want to give them the childhood they never had. This style of parenting, however, may leave children poorly prepared for adult life, as they can struggle to cope with disappointment and lack self-discipline.","Parents adopt this permissive approach mainly out of guilt and a desire to provide what they themselves lacked. Firstly, many working parents spend long hours away from home and feel guilty about their absence. Buying toys or allowing extra screen time becomes a quick way to show affection and avoid arguments in the little time they share, though it replaces attention with material rewards. Secondly, parents who grew up in poverty or under strict discipline often want their own children to enjoy a very different experience. Having been denied simple pleasures, they may see refusing a request as unkind and equate generosity with good parenting. For example, a father who never owned a bicycle as a boy might buy his son the latest games console simply because he cannot bear to say no. For these reasons, indulgent parenting usually stems from love rather than carelessness.","Nevertheless, this style of upbringing can have harmful long-term effects on children as they mature. To begin with, children who always obtain what they want rarely learn to tolerate frustration. Once they leave the family home, they may react badly to rejection from employers, teachers or partners, having seldom experienced refusal. In addition, the absence of rules can prevent them from developing self-control and responsibility. Young adults who were never made to finish homework or save pocket money may find it difficult to manage deadlines, budgets or long-term commitments. To illustrate, a university student accustomed to having every expense covered might quickly fall into debt once required to live on a fixed allowance. Consequently, excessive indulgence in childhood can undermine both emotional resilience and practical competence later in life.","In conclusion, parents often indulge their children because of guilt over busy work schedules or a wish to make up for their own deprived childhoods, but this approach risks producing adults who cannot handle disappointment or manage their responsibilities. Parents should therefore combine warmth with clear limits, expressing affection through time and guidance rather than unlimited gifts."]]},{"id":"W2-TQ-06","task":2,"type":"Two-part question","prompt":["Car and private vehicle ownership has increased so rapidly over the past decades that in many cities around the world, there are constant traffic jams.","How true do you think this statement is?","What measures can governments take to discourage people from owning private cars?"],"imgs":[],"models":[["Rising incomes have turned the private car from a luxury into an everyday possession for millions of families. I agree only in part that this surge in car ownership is responsible for constant traffic jams, since poor urban planning and inadequate public transport also play a major role. To discourage car ownership, governments can raise the cost of buying and keeping a vehicle and offer attractive public transport as an alternative.","The link between car ownership and congestion is real, but it does not tell the whole story. On the one hand, the sheer number of vehicles has clearly placed enormous pressure on urban roads. When the number of registered cars grows far faster than the road network can expand, gridlock during rush hours becomes almost inevitable. On the other hand, the way a city is planned and served by public transport largely determines whether high car ownership turns into congestion. Cities with narrow roads and few rail lines force residents to drive for almost every journey, whereas well-planned cities offer alternatives. For example, Tokyo is one of the most populous cities in the world, yet its dense rail network carries most commuters, so its traffic is far lighter than its size would suggest. Therefore, car ownership is an important cause of traffic jams, but planning failures largely decide how severe they become.","Governments can discourage private car ownership through financial measures and better alternatives. Firstly, authorities can make owning a car considerably more expensive. High registration taxes, annual road charges and a requirement to prove access to a parking space all make people think carefully before buying a vehicle. A case in point is Singapore, where buyers must bid for a limited number of certificates that entitle them to own a car, which keeps the vehicle population under strict control. Secondly, such restrictions are only acceptable if residents have a convenient way to travel without a car. Frequent, affordable and reliable buses and trains allow households to reach work and school easily, making life without a car a practical choice rather than a sacrifice. Taken together, higher ownership costs and quality public transport can steadily reduce the number of private vehicles.","In conclusion, the growth in car ownership contributes significantly to congestion, though inadequate planning and public transport are equally to blame. Governments should therefore combine higher costs of ownership with substantial investment in mass transit, so that fewer residents feel the need to own a car."]],"sibling":"W2-TQ-07"},{"id":"W2-TQ-07","task":2,"type":"Two-part question","prompt":["Car and private vehicle ownership has increased so rapidly over the past decades that in many cities around the world, there are constant traffic jams.","How true do you think this statement is?","What measures can governments take to resolve this issue?"],"imgs":[],"models":[["Traffic congestion has become one of the defining frustrations of modern city life, costing commuters hours each week. Although the rapid rise in private vehicle ownership has certainly contributed to this problem, I believe it is only part of the explanation, as rapid urbanisation and outdated urban planning are equally significant. Governments can ease congestion by moving key services out of city centres and managing traffic more intelligently through technology.","While more cars inevitably mean busier roads, the deeper causes of congestion lie in population movements and planning decisions. To begin with, rapid urbanisation has concentrated huge numbers of people in a small number of major cities. As rural residents migrate in search of better jobs and services, the number of daily commuters rises sharply, so roads become overcrowded even if the proportion of people who own cars stays the same. In addition, many cities developed long before mass car ownership and were never designed to accommodate heavy traffic. Their narrow, poorly connected streets cannot easily be widened, so every additional vehicle adds to the pressure. For instance, the historic centres of cities such as Rome and Hanoi consist of tightly packed streets where even a modest volume of traffic causes lengthy delays. For these reasons, car ownership acts as a trigger for congestion rather than its sole cause.","Governments can address this issue by reducing the need to travel into city centres and by using roads more efficiently. Firstly, authorities should relocate offices, universities and hospitals to suburban areas or satellite towns. When people can work, study and receive medical care closer to where they live, fewer of them need to make long daily journeys into the congested core. Secondly, technology can help existing roads carry traffic more smoothly. Smart traffic signals that adjust to real-time conditions reduce unnecessary waiting at junctions, while road pricing charges drivers for entering busy zones at peak times, encouraging them to travel at other times or by other means. To illustrate, after London introduced its congestion charge in 2003, traffic in the charging zone fell noticeably in the first years of the scheme. Therefore, combining decentralisation with smarter traffic management can relieve congestion without requiring vast new road projects.","In conclusion, while growing car ownership contributes to urban gridlock, rapid urbanisation and outdated city layouts are equally responsible. Governments should therefore spread essential services more evenly across metropolitan regions and invest in intelligent traffic management to make city travel faster."]],"sibling":"W2-TQ-06"},{"id":"W2-TQ-08","task":2,"type":"Two-part question","prompt":["Advanced technology has brought many beneficial changes to the world. However, some old people today struggle with the use of technologies such as mobile phones and the Internet.","How can the elderly benefit from using advanced technologies?","How can the elderly be encouraged to use consumer electronics more often?"],"imgs":[],"models":[["Digital technology now shapes almost every aspect of daily life, from banking and shopping to communicating with relatives. Older people stand to gain a great deal from it, as devices can keep them socially connected and help them manage their health, yet many still find modern gadgets intimidating. They can be encouraged to use consumer electronics more often through patient, tailored training and through products designed with their needs in mind.","Advanced technology can improve the lives of the elderly mainly by reducing isolation and supporting their health. Firstly, digital communication allows older people to remain part of their families’ lives even when relatives live far away. Video calls and messaging apps let grandparents see their grandchildren regularly, which eases the loneliness that often accompanies retirement or the loss of a partner. For example, a widowed grandmother whose children have moved abroad can still take part in birthday celebrations through a simple video call. Secondly, technology can make it easier for older people to monitor their health and obtain help quickly. Wearable devices can track heart rate and detect falls, automatically alerting family members or emergency services, while online consultations spare elderly patients tiring journeys to hospital for routine check-ups. Taken together, these benefits allow older people to live more connected, safer and more independent lives.","Encouraging the elderly to use electronic devices requires both better support and better design. To begin with, older people need training that matches their pace and concerns. Short, hands-on classes in community centres, where volunteers explain each step patiently, can build confidence far more effectively than complicated manuals. A case in point is Singapore, whose Seniors Go Digital programme has offered older residents one-to-one help with basic skills such as video calls and digital payments. In addition, manufacturers and app developers should design products specifically for older users. Larger text, simple menus, voice commands and clearly labelled buttons reduce the fear of making mistakes, which often discourages elderly people from trying new devices at all. Therefore, accessible training and user-friendly design can turn technology from a source of anxiety into a valuable everyday tool.","In conclusion, advanced technology can help older people stay in touch with loved ones and take better care of their health, and patient training and senior-friendly devices can encourage them to embrace it. Governments and technology companies should therefore work together so that the elderly are not left behind in an increasingly digital society."]]},{"id":"W2-TQ-09","task":2,"type":"Two-part question","prompt":["Research into medical treatments is essential to improve public health and fight diseases.","Who do you think should fund this research: individuals, private companies or governments?"],"imgs":[],"models":[["Breakthroughs in medicine, from antibiotics to modern vaccines, have transformed life expectancy over the past century, yet such progress depends on sustained and costly research. Although individuals and private companies can make valuable contributions, I believe governments should bear the main responsibility for funding medical research, because they are best placed to serve the public interest and to provide long-term financial stability.","Governments should lead this funding because of their duty to the whole population and their capacity for long-term investment. Firstly, public funding can be directed towards health priorities that markets tend to neglect. Pharmaceutical companies naturally focus on treatments that promise high profits, so diseases affecting poorer populations or very small numbers of patients often receive little attention unless the state intervenes. For example, research into tropical diseases and rare childhood disorders relies heavily on public and charitable money because the potential commercial returns are limited. Secondly, much important research takes decades and may produce no immediate product. Basic studies of how cells, viruses or genes function are expensive and uncertain, but they lay the foundations for future cures, and only governments can commit funds over such long periods without demanding quick returns. For these reasons, the state is the most suitable primary sponsor of medical research.","Private companies and individuals nevertheless have an important supporting role to play. To begin with, pharmaceutical firms possess the expertise and facilities needed to turn scientific discoveries into usable treatments. Clinical trials, large-scale manufacturing and global distribution require enormous investment, and companies are motivated to carry out these stages efficiently because successful products bring commercial rewards. In addition, wealthy individuals and charitable foundations can fund causes that governments overlook. A case in point is the Gates Foundation, which has spent heavily on research into malaria and other diseases of poverty. However, the priorities of companies and donors depend on profit or personal interest, so they cannot guarantee that every pressing health need will be addressed. Therefore, their contributions complement public funding rather than replace it.","In conclusion, governments should take the lead in financing medical research because they can target neglected diseases and sustain long-term projects, while companies and individuals usefully develop treatments and support specific causes. Policymakers should therefore protect health research budgets and create partnerships that allow private expertise to build on publicly funded discoveries."],["Public health has attracted unprecedented attention in recent years, and with it the question of who should pay for the research that produces new treatments. In my view, governments and private companies should share the main responsibility, combining public accountability with commercial expertise, while individuals can make a smaller but still meaningful contribution.","Governments and private companies are most effective when they fund medical research together. Firstly, private firms in the pharmaceutical and biotechnology sectors have the scientific expertise, laboratories and motivation needed to develop new treatments rapidly. Because their revenue depends on bringing successful products to market, they work efficiently and invest heavily in promising discoveries. Secondly, government involvement is essential to ensure that the results benefit everyone rather than only those who can afford them. When public money helps pay for research, authorities can negotiate fair prices and make sure that urgent public health needs are prioritised over the most profitable ventures. For instance, during the COVID-19 pandemic, the United States government invested billions of dollars in vaccine development through partnerships with companies such as Moderna, which helped vaccines reach the public in record time. Taken together, the speed of private enterprise and the oversight of the state produce faster and fairer outcomes than either could achieve alone.","Although individuals have far fewer resources, their contribution to medical research should not be underestimated. To begin with, small donations from large numbers of people can raise significant sums for specific diseases. Patient groups and families affected by a particular illness are often highly motivated to fund research into it, especially when the condition is rare and attracts little commercial interest. To illustrate, the Ice Bucket Challenge that spread across social media in 2014 raised substantial funds for research into amyotrophic lateral sclerosis, also known as ALS. In addition, individuals support research indirectly by volunteering for clinical trials, without which no new treatment could be approved. These contributions, however, are too irregular to sustain large research programmes. Therefore, individuals play a valuable but secondary role alongside governments and companies.","To sum up, governments and private companies should be the main funders of medical research, as their partnership combines innovation with fair access, while individuals can add support through donations and participation in trials. Authorities should therefore encourage such partnerships and make it easier for citizens to support research into the conditions that matter to them."]]},{"id":"W2-TQ-10","task":2,"type":"Two-part question","prompt":["In many countries, young people are choosing to live with their parents for much longer than in the past. What are the causes of this trend, and is this a positive or negative development?"],"imgs":[],"models":[["In many parts of the world, the age at which young adults leave the family home has risen steadily. This trend is driven mainly by soaring housing costs and the longer time young people now spend in education and insecure early jobs. In my view, it is a largely positive development, as it helps them build financial security and strengthens family ties, provided they still learn to live independently.","The tendency to remain at home for longer is largely a response to economic pressures and changing life paths. The primary reason is that housing has become unaffordable for many young people. In major cities, rents have risen far faster than graduate salaries, so moving out would consume most of a young worker’s income. Another factor is that the transition to adulthood now takes longer. More young people pursue degrees and postgraduate study, and many then start with internships or short-term contracts, which makes committing to a lease risky. For example, in Italy and Spain, where youth unemployment has long been high, many adults live with their parents until around thirty. For these reasons, staying at home is often rational rather than a sign of immaturity.","I believe this trend brings more benefits than drawbacks. To begin with, living with parents enables young adults to build a stronger financial foundation. Without paying rent, they can repay loans, save or invest in further training, which may give them greater long-term stability than peers who move out early. For instance, a graduate who stays at home for a few years could save enough for a deposit on a flat, whereas a friend renting on the same salary might have almost no savings. In addition, sharing a home can strengthen family bonds and provide mutual support. Adult children can share household costs and help care for ageing parents, while parents offer advice during a demanding stage of life. Admittedly, young adults who never cook or pay bills may be slow to become independent, but this risk shrinks if they take on real responsibilities at home. Therefore, living with parents for longer is generally an advantage rather than a handicap.","In conclusion, young people are staying at home longer because of high housing costs and longer paths into stable work, and this trend is largely positive, as it supports financial security and family closeness. Families should nevertheless ensure that adult children share household duties, so that they gain the skills needed for independent life."]]},{"id":"W2-TQ-11","task":2,"type":"Two-part question","prompt":["Many people think that museums will be replaced by virtual reserves of historical information as almost all knowledge can already be accessed for free online. Others disagree because museums are still important.","Is it likely that museums will no longer be needed in the future?","Is this a positive development?"],"imgs":[],"models":[["The digitisation of archives, artworks and artefacts has made an extraordinary amount of historical knowledge available to anyone with an Internet connection. Some people therefore predict that museums will become obsolete, but I believe this is unlikely, because seeing genuine objects offers an experience that no screen can reproduce and because museums perform essential work behind the scenes. Moreover, if museums did disappear, it would be a negative development for education and cultural life.","It is improbable that virtual collections will make museums unnecessary. Firstly, people value the experience of standing in front of an authentic object. A digital image conveys information, but it cannot capture the scale, texture or presence of a real sculpture, manuscript or dinosaur skeleton, nor the sense of connection to the past that comes from seeing it in person. For example, images of the Mona Lisa are freely available online, yet crowds of visitors still queue at the Louvre every day to see the original. Secondly, virtual archives depend on the physical collections that museums maintain. Curators and conservators preserve, study and authenticate artefacts, and much of the information found online is produced by this very work. For these reasons, digital resources are far more likely to extend the reach of museums than to replace them.","Even so, if museums were eventually replaced by online archives, this would be a harmful change. To begin with, society would lose a uniquely effective form of education. School visits allow children to explore history actively, by handling replicas, joining guided tours and asking experts questions, which tends to inspire curiosity far more than reading the same facts on a laptop. In addition, museums serve as cultural landmarks and shared public spaces. They host exhibitions, talks and events that bring together people of different ages and backgrounds, and they help define the identity of the cities in which they stand. To illustrate, institutions such as the British Museum are not only places of learning but also major attractions that draw visitors from around the world. Consequently, the disappearance of museums would impoverish both learning and community life.","In conclusion, museums are unlikely to be replaced, as authentic objects remain irreplaceable and online archives rely on museum expertise, and their loss would damage education and public cultural life. Museums should therefore embrace digital tools to reach wider audiences while continuing to offer the physical experiences that make them valuable."],["Advances in digital technology have allowed millions of historical documents, paintings and artefacts to be photographed, scanned and shared online. While some believe that these virtual collections will eventually make museums redundant, I would argue that this is unlikely, since museums are adapting to the digital age and remain valued as places to visit. In fact, the growth of online historical resources is a positive development, because it widens access to heritage and attracts new audiences to museums themselves.","Museums are unlikely to disappear, because they are evolving rather than being displaced. To begin with, most major museums have already made digital technology part of what they offer. Interactive screens, virtual reality reconstructions and online catalogues now complement their physical galleries, which means that the choice is no longer between museums and the Internet. In addition, visiting a museum is a social and leisure activity as much as a way of acquiring information. Families, tourists and groups of friends spend a day in a museum to enjoy the atmosphere, attend special exhibitions or simply share an experience, which a website cannot provide. For instance, many cities now host late-night museum openings with music and food that attract large crowds of young adults. For these reasons, physical museums are likely to remain relevant for the foreseeable future.","Rather than being a threat, the expansion of virtual collections brings clear benefits. Firstly, it makes cultural heritage accessible to people who could never visit in person. Students in remote regions, people on low incomes and those with disabilities can examine high-resolution images of artefacts held thousands of kilometres away without paying for travel or tickets. To illustrate, the British Museum and the Louvre have each published large parts of their collections online, free for anyone to browse. Secondly, online exposure can stimulate interest in visiting museums. A teenager who discovers an ancient civilization through a virtual tour or a social media post may later want to see the artefacts in person, so digital content acts as an advertisement rather than a substitute. Therefore, virtual reserves strengthen the role of museums instead of undermining it.","In conclusion, museums are unlikely to become obsolete because they are integrating technology and offer a social experience that online resources cannot match, and the spread of virtual collections is a positive trend that broadens access and builds interest. Museums should therefore continue investing in digital content as a gateway to their physical collections."]]},{"id":"W2-TQ-12","task":2,"type":"Two-part question","prompt":["An ever-increasing population of young people are choosing to engage and socialise on social media instead of in person.","What are the reasons for this?","Is this a negative or a positive development?"],"imgs":[],"models":[["Smartphones have transformed the way young people form friendships, with much of their social life now taking place on messaging apps. This shift is driven mainly by the convenience of online communication and the comfort that many young people feel when interacting from behind a screen. In my view, however, it is a largely negative development, as it weakens their face-to-face social skills and tends to produce shallower relationships.","The popularity of online socialising can be explained by its convenience and the sense of security it offers. Firstly, social media allows young people to stay in contact with large numbers of friends instantly and at almost no cost. Instead of arranging a meeting and travelling, they can share photos or join a group chat from anywhere, which suits busy schedules filled with study and part-time work. Secondly, many young people find it easier to express themselves online than in person. Communicating through text gives them time to think before responding and spares them the awkwardness of eye contact or silence, which particularly appeals to shy or anxious individuals. For example, a teenager who rarely speaks up in class may happily share opinions in an online forum about a favourite game. Taken together, convenience and comfort explain why digital interaction is replacing real-life meetings.","Although online platforms help young people keep in touch over long distances, I believe the overall effect of this trend is harmful. To begin with, constant reliance on digital communication deprives them of practice in essential interpersonal skills. Reading body language, sustaining a conversation and resolving disagreements calmly are abilities developed mainly through face-to-face contact, and young adults who lack them may struggle in job interviews, teamwork and personal relationships. In addition, online friendships are often less supportive than those formed in person. A person may have hundreds of followers yet no one to turn to during a crisis, because brief comments and reactions rarely build deep trust. To illustrate, students who move to a new city for university sometimes feel lonely despite being constantly connected online. Therefore, the growing preference for online socialising risks leaving young people less skilled and more isolated.","In conclusion, young people favour socialising online because it is convenient and less intimidating than meeting in person, but this trend is largely negative, as it erodes social skills and encourages superficial friendships. Schools and parents should therefore promote clubs and sports that give young people regular opportunities to meet face to face."],["Over the past decade, platforms such as Instagram and TikTok have become the main meeting places for many teenagers and young adults. This preference for online interaction stems largely from the constant availability of smartphones and from platforms deliberately designed to hold users’ attention. I believe this is mostly a negative development, since it can damage young people’s mental health and draw them away from healthier offline activities, although it does offer certain benefits.","Two main factors explain why young people increasingly socialise online. The first is that almost every young person now carries a smartphone with constant Internet access. Since their friends are always reachable, chatting online has become the default way to arrange plans, share news and stay involved in group conversations, and those who do not participate risk feeling excluded. The second factor lies in the design of social media itself. Features such as endless scrolling, notifications and personalised recommendations are developed to keep users engaged for as long as possible, which encourages them to return to the screen repeatedly. For instance, a teenager who opens an app to reply to one message may find that an hour has passed while watching short videos suggested by the algorithm. For these reasons, online socialising has become a habit that is difficult to resist.","While social media can help young people find communities of like-minded peers, its drawbacks are considerably more serious. Firstly, constant exposure to carefully edited images encourages unhealthy comparison. Young users see friends and celebrities presenting idealised versions of their appearance and lifestyles, and measuring themselves against these images can lead to feelings of inadequacy, low self-esteem and anxiety. Secondly, time spent online often replaces activities that are vital for well-being. Hours of scrolling can displace sleep, exercise and hobbies, and late-night phone use is widely linked to poor rest and reduced concentration at school. To illustrate, a student who stays up chatting until the early hours is likely to arrive at class exhausted and less able to learn. Consequently, the move towards online interaction poses real risks to the health and development of young people.","In conclusion, young people socialise online mainly because smartphones keep them permanently connected and platforms are designed to be habit-forming, and this is a largely negative trend, as it can harm their mental health and displace healthy activities. Technology companies should therefore offer stronger time-management tools, while families set reasonable limits on screen use."]]},{"id":"W2-TQ-13","task":2,"type":"Two-part question","prompt":["The arts, including art, music and theatre are considered to be important in society.","Do you think the arts still have a place amongst our modern lifestyles?","Should the arts be included in the school curriculum?"],"imgs":[],"models":[["In an era dominated by technology and economic competition, it is sometimes assumed that painting, music and theatre are luxuries that modern societies can do without. I strongly disagree, as the arts continue to enrich people’s lives and preserve cultural identity, and they should remain part of the school curriculum because they build students’ confidence and open up valuable career paths.","The arts still hold an important place in modern lifestyles, offering both personal enjoyment and cultural continuity. Firstly, they provide a valuable means of relaxation and emotional expression in increasingly demanding lives. Listening to music on the way to work, visiting a gallery at the weekend or watching a play allows people to unwind and experience emotions that their daily routines rarely allow, which helps them cope with stress. Secondly, the arts preserve a nation’s heritage and help communities understand one another. Traditional music, architecture and performance reflect a country’s history and values, and they allow both citizens and visitors to appreciate its culture. For example, the historic buildings and theatres of the United Kingdom attract large numbers of foreign tourists every year, giving them insight into British history while also supporting the economy. Therefore, far from being outdated, the arts remain central to both individual well-being and cultural life.","Given their importance, arts subjects deserve a secure place in the school curriculum. To begin with, they help students develop confidence and self-discipline. Learning a musical instrument requires regular practice and performing in front of others, while drama encourages children to speak clearly and express ideas in public, skills that benefit them in every area of study. For instance, a shy pupil who takes a role in the school play may gradually become more willing to contribute to class discussions. In addition, arts education prepares students for careers in thriving creative industries. Fields such as architecture, graphic design, filmmaking and advertising require artistic training alongside technical knowledge, and these sectors employ a growing number of people in many economies. Consequently, arts subjects make a genuine contribution to students’ personal growth and future employability.","In conclusion, the arts continue to play a vital role in modern life by offering emotional relief and preserving cultural heritage, and their place in schools is justified because they build confidence and prepare students for creative careers. Education authorities should therefore protect arts subjects from budget cuts rather than treating them as optional extras."],["As schools and governments place growing emphasis on science, technology and business, the value of painting, music and theatre is increasingly being questioned. From my perspective, the arts remain highly relevant in modern society, as they shape the products and media people use every day and help them reflect on the world around them. They should also be included in the curriculum, since they develop students’ creativity and teamwork skills.","Far from losing their place in modern life, the arts are arguably more present than ever, both in what people consume and in how they understand society. Firstly, artistic skills shape much of what people use and enjoy daily. The films, songs and games they stream, the advertisements they see and even the design of the phones they carry all depend on the work of artists, designers and musicians. For example, the success of a smartphone is determined not only by its technology but also by the visual design of its body and interface. Secondly, the arts help people reflect on social issues and understand experiences different from their own. A novel, documentary or play can draw attention to problems such as poverty or discrimination in a way that statistics cannot, encouraging empathy and public debate. Taken together, these roles show that the arts remain an essential part of modern lifestyles.","Because of this significance, the arts should also be taught in schools, as they develop abilities that other subjects often neglect. To begin with, creative subjects train students to think flexibly and generate original ideas. Unlike tests with a single correct answer, a painting or musical composition requires students to experiment, take risks and solve problems in their own way, an ability that employers increasingly value in a fast-changing economy. In addition, many artistic activities depend on cooperation. To illustrate, staging a school play requires actors, set designers, musicians and stage managers to coordinate their efforts towards a shared deadline, which teaches communication and responsibility. These soft skills are highly transferable to further study and future careers. Therefore, arts education equips students with creative and social abilities that complement academic knowledge.","In conclusion, the arts remain an integral part of modern life because they shape everyday media and products and encourage reflection on society, and they deserve a place in schools because they foster creativity and teamwork. Schools should therefore balance academic subjects with regular opportunities for artistic expression."]]},{"id":"W2-TQ-14","task":2,"type":"Two-part question","prompt":["In many countries, people are choosing to marry later in life or not at all. What are the reasons for this, and is it a positive or negative development?"],"imgs":[],"models":[["Marriage was once regarded as an almost inevitable stage of adult life, but attitudes towards it have changed in many societies. People are now marrying later or remaining single, mainly because they prioritise education and careers and because the financial demands of family life have grown. I believe this is a largely positive development, as it reflects greater personal freedom and tends to produce more stable relationships.","The decision to delay or avoid marriage is driven mainly by changing priorities and economic pressures. To begin with, both men and women now spend longer in education and focus on establishing their careers before settling down. In particular, women now have far greater access to well-paid employment, so marriage is no longer necessary for financial security and is often postponed until career goals are reached. Another factor is the rising cost of starting a family. Expensive housing, weddings and childcare mean that many young couples feel they cannot afford to marry until they have saved for years. For instance, in South Korea and Japan, high living costs and long working hours are often cited as reasons for young people’s reluctance to marry. Taken together, ambition and financial caution explain much of this trend.","In my view, this shift is generally beneficial, despite its demographic drawbacks. Firstly, it shows that people have greater freedom to choose the life that suits them. Individuals who once faced pressure to marry by a certain age can now decide whether and when to commit to a partner, pursuing personal goals without stigma. Secondly, marriages formed later in life are often more stable. People who marry after gaining maturity and financial independence tend to know their own needs better and choose more compatible partners. For example, a couple who meet in their early thirties, once both have settled careers, may handle shared finances and household duties more calmly than partners who married straight after leaving school. Admittedly, fewer and later marriages contribute to declining birth rates in some countries, but this is better addressed through family-friendly policies than by encouraging hasty marriages. Therefore, the trend is mostly positive for individuals and families.","In conclusion, people are marrying later or not at all because of career priorities and the high cost of family life, and this is largely a positive development, as it expands personal choice and supports more stable relationships. Governments concerned about low birth rates should therefore focus on affordable housing and childcare rather than social pressure."]]},{"id":"W2-TQ-15","task":2,"type":"Two-part question","prompt":["More and more people are working in jobs that require them to sit down all day. Why is this happening, and is it a positive or negative trend?"],"imgs":[],"models":[["The nature of work has changed profoundly over the past century, with fields and factory floors giving way to offices and computer screens. More people now spend their working day seated, largely because economies have shifted towards services and because digital technology has taken over many physical tasks. Although this change has made work safer, I believe it is a largely negative trend, as prolonged sitting harms both physical and mental health.","The rise of desk-based work is mainly a result of economic restructuring and technological progress. The primary reason is the transformation of economies from agriculture and manufacturing towards services. As countries develop, a growing share of jobs are found in sectors such as finance, education, administration and information technology, where most tasks involve processing information rather than handling physical materials. Another factor is the spread of computers and automation. Machines now perform many manual tasks that workers once carried out, while filing, meetings and ordering increasingly take place online. For example, a bank employee who once walked between departments and met customers in person may now spend the entire day answering emails and attending video calls. For these reasons, sedentary work has become the norm for a large proportion of the workforce.","While office jobs are generally safer and less physically exhausting than manual labour, their effects on health are a serious concern. Firstly, sitting for long periods is linked to a range of physical problems. Without regular movement, workers are more likely to develop back and neck pain, gain weight and face a higher risk of conditions such as heart disease and diabetes, particularly when long hours leave little time for exercise. Secondly, screen-based work can take a toll on mental well-being. Spending the day in front of a monitor, often with limited social contact, can increase stress and fatigue, and the lack of physical activity removes one of the most effective natural ways of relieving tension. To illustrate, employees who eat lunch at their desks and then drive home may go an entire day with almost no exercise. Consequently, the trend towards sedentary jobs poses significant risks to public health.","In conclusion, more people work seated because economies have moved towards services and technology has replaced much manual labour, and despite improving safety, this trend is largely negative for workers’ health. Employers should therefore encourage regular breaks, provide adjustable desks and support exercise programmes, while individuals make physical activity part of their daily routine."]]},{"id":"W2-TQ-16","task":2,"type":"Two-part question","prompt":["Many traditional skills and crafts are disappearing in modern societies. Why is this happening, and should governments take responsibility for preserving them?"],"imgs":[],"models":[["Across much of the world, skills such as hand-weaving, pottery, woodcarving and blacksmithing, once passed from generation to generation, are being lost. This decline stems mainly from competition with cheap mass-produced goods and the reluctance of young people to take up such demanding, poorly paid work. I believe governments should take responsibility for preserving these crafts, since they are a vital part of cultural heritage and can bring real economic benefits.","Traditional crafts are disappearing largely because of economic competition and changing career preferences. Firstly, factory production has made handmade goods difficult to sell. Machines can produce clothing, furniture and kitchenware in vast quantities at a fraction of the cost, so most consumers choose cheaper industrial products over items that take skilled artisan days to create. Secondly, young people are increasingly unwilling to inherit these occupations. Mastering a craft often requires years of apprenticeship with low earnings, whereas office jobs in cities offer higher salaries, greater security and more social prestige. For example, in many craft villages, elderly artisans struggle to find apprentices because their children and grandchildren have moved to urban areas in search of better-paid work. Taken together, falling demand and a shrinking pool of successors explain why so many traditional skills are fading.","Governments, in my view, should play a leading role in safeguarding these skills. To begin with, traditional crafts are an irreplaceable part of a nation’s cultural identity. They embody local history, aesthetic values and knowledge accumulated over centuries, and once the last practitioners die, this knowledge may be lost permanently. Since market forces alone will not protect it, public support is necessary. A case in point is Japan, which officially recognises master craftspeople as Living National Treasures and supports them in training successors. In addition, well-supported crafts can generate income and employment. Handmade products marketed as authentic and high quality can command premium prices, and craft villages can attract tourists who want to watch artisans at work or try the skills themselves. Grants, training and marketing support would help artisans reach these customers. Therefore, government intervention can preserve heritage while making traditional crafts economically viable.","In conclusion, traditional skills are declining because mass production undercuts handmade goods and young people prefer better-paid modern careers, and governments should take responsibility for preserving them because of their cultural and economic value. Authorities should therefore fund apprenticeships and promote craft products, so that these skills remain a living tradition rather than a museum exhibit."]]},{"id":"W2-TQ-17","task":2,"type":"Two-part question","prompt":["Young people are increasingly drawn to careers as online influencers rather than traditional professions. What are the reasons for this, and is it a problem for society?"],"imgs":[],"models":[["Social media has created new forms of work, and for many young people the role of online influencer now seems more glamorous than becoming a doctor, engineer or teacher. This appeal stems largely from the freedom and wealth the job seems to offer and from how easy it appears to enter. In my view, however, the trend is not a serious problem for society, as content creation has become a legitimate industry and essential professions continue to attract recruits.","Young people are drawn to influencing mainly because of its apparent rewards and its low barrier to entry. Firstly, the profession promises a degree of independence and income that conventional jobs rarely match. Successful creators seem to work on their own terms, without a manager or fixed schedule, and the most famous earn far more than most salaried professionals. For example, a teenager following a travel vlogger who films in a new country every month may compare this lifestyle favourably with years of study and an office job. Secondly, becoming an influencer appears achievable for almost anyone. Unlike careers that demand formal qualifications, it requires little more than a smartphone and an Internet connection, and stories of creators who started with nothing reinforce the belief that success is within reach. Taken together, autonomy and apparent accessibility explain much of its attraction.","Although these aspirations can end in disappointment, I believe the concern about this trend is overstated. Admittedly, most aspiring influencers never earn a stable income, and those who neglect their studies may lack practical skills. Yet content creation now belongs to a large digital economy with genuine jobs. Brands employ creators, video editors and social media managers, and skills such as communication, editing and audience analysis transfer well to other careers. For instance, a student who builds a modest following while at university may later find work in marketing on the strength of that experience. Moreover, the fear that traditional professions will be abandoned is unfounded, as medical and engineering schools continue to attract large numbers of applicants. Consequently, the trend reflects an adaptation to a changing economy rather than a threat to it.","In conclusion, the pull towards influencing stems chiefly from its promise of freedom and wealth and its low barrier to entry, but it is not a problem for society, as the field offers real opportunities and essential careers remain popular. Schools should nevertheless ensure that students chasing online fame also gain qualifications to fall back on."]]},{"id":"W2-TQ-18","task":2,"type":"Two-part question","prompt":["It is often said that people today feel more stressed than ever before, despite living in greater comfort. How true do you think this is, and what can be done to reduce stress in modern life?"],"imgs":[],"models":[["Compared with previous generations, most people today enjoy longer lives, more comfortable homes and an abundance of labour-saving devices. Even so, I believe it is largely true that people feel more stressed than ever, mainly because of intense economic pressures and the constant connectivity of digital technology. This stress can be reduced if individuals adopt healthier habits and if employers and governments provide greater structural support.","There is considerable truth in the claim that modern life is unusually stressful despite its comforts. Firstly, economic pressures weigh heavily on people today. Job security has declined in many sectors, the cost of housing and education continues to rise, and workers are expected to remain productive and adaptable in highly competitive markets, which creates persistent anxiety about the future. Secondly, and somewhat paradoxically, the technology that makes life more comfortable is itself a major source of strain. Smartphones keep people permanently connected to work emails, alarming news and the carefully presented lives of others, leaving little time for genuine rest. For example, an employee who answers messages from a manager late at night may never feel fully off duty, even at home. In this sense, material comfort has not eliminated stress so much as replaced physical hardship with psychological pressure.","Fortunately, a number of measures could ease this burden at both the individual and the societal level. To begin with, individuals can protect their well-being by setting boundaries around technology and making time for restorative activities. Switching off devices during meals or before sleep, exercising regularly and spending time with friends and family face to face all help people recover from daily pressures. However, stress is not merely a personal failing, so employers and governments must also play their part. Companies can offer flexible working arrangements and reasonable workloads, while authorities can invest in accessible mental health services and legislate to protect employees’ free time. A case in point is France, which in 2017 introduced a legal right for many employees to disconnect from work emails outside working hours. Therefore, only a combination of personal effort and structural support is likely to make a meaningful difference.","In conclusion, the belief that people today are more stressed than ever is largely justified, as economic insecurity and constant digital connectivity create new pressures despite greater comfort. By encouraging healthier personal habits alongside supportive workplace policies and legislation, societies can significantly reduce the stress that characterises modern life."]]},{"id":"W2-TQ-19","task":2,"type":"Two-part question","prompt":["Tourism to remote and previously untouched places is growing rapidly. What are the benefits of this trend, and what problems might it cause for those destinations?"],"imgs":[],"models":[["As air travel has become cheaper and travellers seek experiences away from crowded cities, tourism has spread to isolated islands, mountain villages and wilderness areas that few outsiders visited before. This trend can bring vital income to remote communities and encourage the protection of their landscapes and traditions, but it also risks damaging fragile ecosystems and disrupting local cultures.","The growth of tourism in such places offers considerable advantages, particularly for the communities that live there. Firstly, it provides an economic boost to regions that often have few other sources of income. Visitors spend money on accommodation, food, guiding and local crafts, creating jobs and raising living standards in areas that previously depended on subsistence farming or fishing. For instance, a remote fishing village may find that hosting travellers in family homestays earns far more than its traditional livelihood. Secondly, this form of tourism can encourage conservation and cultural preservation. When a community realises that its natural scenery or traditional way of life attracts paying visitors, it gains a strong incentive to protect them rather than exploit them, and governments become more willing to fund the upkeep of these areas. In this way, tourism can turn preservation into a source of income rather than a cost.","Nevertheless, this trend can also inflict serious harm on the very destinations that attract it. The most pressing concern is environmental damage, since remote regions frequently contain delicate ecosystems that were never equipped to absorb large numbers of people. The construction of hotels and roads disturbs habitats, while litter, waste and boat traffic can degrade pristine landscapes within a few years. A case in point is Maya Bay in Thailand, which was closed to visitors in 2018 to allow its coral reefs and beaches to recover from overcrowding. Equally troubling is the disruption of local communities. As outside money flows in, traditional customs may be reduced to staged performances, property prices can rise beyond the reach of residents, and younger generations may abandon long-standing ways of life for tourism-related work. Consequently, uncontrolled tourism risks destroying the authenticity and natural beauty that gave these places their appeal.","In conclusion, tourism to remote destinations brings valuable economic opportunities and can strengthen the case for conservation, yet it also threatens fragile environments and vulnerable communities. Local authorities should therefore limit visitor numbers and reinvest tourism revenue in protecting these places, so that the benefits are not outweighed by lasting damage."]]},{"id":"W2-TQ-20","task":2,"type":"Two-part question","prompt":["In many households, grandparents play a large role in raising children. Why is this becoming more common, and what effects does it have on families?"],"imgs":[],"models":[["As family life adapts to the demands of modern economies, the responsibility for raising children is increasingly shared across generations. In many homes, grandparents now provide much of the daily care that parents once handled alone, largely because young couples face financial pressure and older people remain active for longer. This arrangement strengthens bonds between generations, although it can also create friction over parenting decisions and place a heavy burden on grandparents.","The growing role of grandparents stems mainly from economic necessity and from longer, healthier lives in retirement. To begin with, most young families now depend on two incomes, yet professional childcare has become prohibitively expensive in many cities. Grandparents offer care that is free, flexible and based on trust, which allows both parents to keep working without sacrificing a large share of their earnings. For instance, a couple working long shifts in Hanoi may find that a grandmother who collects the children from school and minds them until evening is their only practical option. In addition, improvements in healthcare mean that many people reach retirement with the energy and time to look after young children. Rather than feeling idle, these retirees often welcome a renewed sense of purpose. Taken together, financial strain and greater longevity explain why this pattern is spreading.","The effects of this arrangement on families, however, are mixed. On the positive side, children raised partly by their grandparents tend to develop close relationships with an older generation and absorb family traditions. Grandparents can pass on a regional dialect, traditional recipes or stories about the family’s past, giving children a stronger sense of identity. On the negative side, two generations sharing authority over a child can easily come into conflict. To illustrate, parents who limit sweets and screen time may discover that these rules are relaxed whenever the grandparents are in charge, which confuses the child and creates resentment between adults. Daily care can also exhaust grandparents in their sixties or seventies, whose own health may suffer as a result. Consequently, although the practice enriches family life, it also introduces real tensions.","To conclude, grandparents are increasingly involved in child-rearing because young families face high living costs and older people stay fit for longer, and while this deepens family bonds, it also risks disagreement and fatigue. Families relying on this support should therefore agree on shared rules from the outset and ensure that grandparents have regular time to rest."]]},{"id":"W2-PS-01","task":2,"type":"Problems and solutions","prompt":["Childhood obesity is becoming a serious problem in many countries. Explain the main causes of this problem, and suggest some possible solutions."],"imgs":[],"models":[["Over recent decades, the number of overweight children has risen sharply in many countries, raising serious concerns about their long-term health. The problem stems mainly from sedentary lifestyles and unhealthy diets, and it can be tackled through better health education in schools and closer guidance from parents at home.","The two main causes of childhood obesity are a lack of physical activity and poor eating habits. Firstly, children today spend far more time indoors than previous generations did. Smartphones, game consoles and streaming services offer endless entertainment at home, so many children rarely play outside or take part in sport, and they burn off far less energy than they consume. Secondly, children’s diets have become less healthy. Fast food, sugary drinks and snacks high in fat and sugar are cheap, widely available and heavily advertised to young people, and they often replace balanced home-cooked meals. For example, a child who spends the afternoon playing video games while eating crisps and drinking soft drinks may consume a large number of calories without any physical exertion. In short, children are taking in more energy than ever while using less of it, which leads directly to weight gain.","Addressing the problem requires action from both schools and parents. To begin with, schools should give physical education and nutrition a more prominent place in the curriculum. Daily sports sessions would ensure that every child exercises regularly, while lessons on reading food labels and planning balanced meals would help pupils make healthier choices for the rest of their lives. Schools could also replace sugary snacks and drinks in canteens with fruit, water and nutritious meals. In addition, parents play an equally important role at home. Setting limits on screen time, organising active family outings and cooking healthy meals together can gradually change children’s habits. To illustrate, a family that replaces an evening of television with a weekly bike ride or swimming session gives children both exercise and a positive example. If schools provide the knowledge and parents reinforce it through daily habits, children will be far better equipped to maintain a healthy weight.","In conclusion, childhood obesity is largely the product of inactive lifestyles and unhealthy diets. Schools and parents should therefore work together, combining health education and regular exercise at school with healthy routines at home, to reverse this worrying trend."]]},{"id":"W2-PS-02","task":2,"type":"Problems and solutions","prompt":["In the developed world, the average life expectancy is on the rise. What are the reasons for this trend, and what problems may it cause for families and society?"],"imgs":[],"models":[["Over the past century, people in developed countries have come to live considerably longer than their grandparents did. This trend results mainly from better living conditions and healthier attitudes towards lifestyle, but it may cause labour shortages and place a heavy financial burden on governments.","There are two main reasons why life expectancy has risen in the developed world. Firstly, living conditions have improved dramatically. Clean drinking water, effective sanitation, safer housing and a reliable food supply have greatly reduced deaths from infectious diseases and malnutrition, which once claimed many lives at a young age, while vaccines and antibiotics have made many formerly fatal illnesses treatable. Secondly, people have become more aware of how to look after their health. Public health campaigns have taught citizens about the dangers of smoking, the importance of exercise and the value of a balanced diet, and many people now attend regular check-ups that allow diseases to be detected early. For example, smoking rates in many Western countries have fallen sharply since the health risks of tobacco became widely known. For these reasons, people in developed countries are now living longer than ever.","However, a longer-living population can create serious problems for society. To begin with, it may lead to labour shortages. As the proportion of older people rises and birth rates remain low, there are fewer working-age adults to fill jobs, which can slow economic growth and leave industries such as healthcare and construction short of staff. To illustrate, Japan, which has one of the oldest populations in the world, introduced a new visa scheme in 2019 to attract foreign workers into sectors facing severe shortages. In addition, governments face rising costs for pensions and healthcare. More retirees means more people receiving pensions for longer periods, while older citizens generally need more medical care, so a shrinking workforce must pay higher taxes to support them. This places a growing burden on younger generations and can create tension between age groups. Therefore, increasing longevity, although welcome, poses real economic and social challenges.","In conclusion, life expectancy is rising mainly because of improved living conditions and greater health awareness, but this trend may reduce the workforce and strain public finances. Governments should therefore consider raising the retirement age gradually and encouraging older people who wish to work to remain in employment."],["Many developed countries have recorded substantial increases in life expectancy over recent decades. This trend can be explained mainly by advances in medical technology and effective public health policies, but it also places a heavy caregiving burden on families and rising costs on society.","The rise in life expectancy can largely be attributed to medical progress and public health measures. Firstly, advances in medicine allow diseases to be diagnosed and treated far more effectively than before. Modern scanning equipment helps doctors detect conditions such as cancer and heart disease at an early stage, while new drugs and surgical techniques allow patients to survive illnesses that would once have been fatal. Procedures such as organ transplants and heart bypass surgery, once extremely risky, are now routine in many hospitals. Secondly, governments have introduced policies that prevent disease on a large scale. Vaccination programmes, restrictions on smoking in public places and food safety regulations protect entire populations from avoidable illnesses. For example, vaccination campaigns have made diseases such as polio and measles rare in many developed countries. Taken together, better treatment and better prevention explain why people are living longer.","Nevertheless, longer lifespans can create problems for families and society. To begin with, many families face growing caregiving responsibilities. Adult children often have to look after elderly parents while also raising their own children and working full-time, which can damage their careers, finances and mental health. To illustrate, a woman in her fifties may have to reduce her working hours to care for a parent with dementia, losing income and pension contributions as a result. In addition, an ageing population increases public spending. Older people are more likely to suffer from chronic conditions that require long-term treatment and care, so governments must devote a larger share of their budgets to healthcare and social services, leaving less money for education or infrastructure. Hospitals may also become overcrowded, leading to longer waiting times for patients of all ages. Consequently, the benefits of longer lives come with significant costs for both households and governments.","In conclusion, life expectancy is rising because of medical advances and effective public health policies, but this trend increases the burden on family caregivers and public budgets. Governments should therefore expand affordable care services for the elderly and support working carers through flexible employment arrangements."]]},{"id":"W2-PS-03","task":2,"type":"Problems and solutions","prompt":["Reading for pleasure as well as knowledge is becoming less common among teenagers. Why is this the case, and should schools do more to encourage the habit?"],"imgs":[],"models":[["Teenagers today have more ways to spend their free time than any previous generation, and reading for pleasure or knowledge has become far less common among them. This decline is caused mainly by the appeal of digital entertainment and the way reading is presented at school, and I firmly believe that schools should take a more active role in reviving the habit.","The waning of reading among young people can be traced to two main causes. Firstly, the abundance of digital entertainment has drawn teenagers away from books. Streaming platforms, video games and social media offer instant, fast-paced stimulation that requires little patience, so the slower rewards of a novel struggle to compete for a teenager’s limited attention. For example, a teenager who has grown used to watching videos lasting a few seconds may find it difficult to concentrate on a chapter for half an hour. Secondly, reading is increasingly associated with obligation rather than pleasure. At school, books are often presented as assignments to be analysed and examined, so many young people come to see reading as a chore linked to grades and deadlines rather than a source of enjoyment. Taken together, the lure of effortless digital content and the perception of reading as work explain much of the decline.","Given these causes, I believe schools should do more to rekindle a love of reading. To begin with, schools could set aside regular time for free, unassessed reading. If students choose their own books and are not tested on them, they can rediscover reading as a pleasure rather than a pressure, especially if libraries stock graphic novels, contemporary fiction and titles that reflect teenagers’ own interests. In addition, teachers can create a culture in which reading is shared and celebrated. Book clubs, author visits and informal discussions allow students to talk about what they enjoy and recommend books to one another. To illustrate, many schools in the United Kingdom take part in World Book Day, when students dress up as favourite characters and exchange book recommendations. Since schools reach
